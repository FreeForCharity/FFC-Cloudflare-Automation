name: '704. Website - Analytics Wire [GH]'
run-name:
  'Analytics Wire: ${{ inputs.domain }} (GTM ${{ inputs.gtm_id }}, dry_run=${{ inputs.dry_run }})'

# Wire provisioned GA4 / GTM ids into one FFC-EX-<domain> website repo by opening a PR
# (never pushing the default branch). Detects the site type and delegates the file edits to
# scripts/analytics-wire.ps1: template sites get src/lib/analytics.config.ts + a rewired GTM
# component; static WordPress exports get the GTM snippet injected across every *.html.
# Idempotent: an already-wired repo yields no PR. Gated write: github-prod (uses CBM_TOKEN).
# See docs (analytics-provisioning skill) and issue #629 (fleet rollout).

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Charity domain -> FreeForCharity/FFC-EX-<domain>, e.g. clarasbridge.org'
        required: true
        type: string
      gtm_id:
        description: 'GTM container id (GTM-XXXXXXX) from workflow 503'
        required: true
        type: string
      measurement_id:
        description: 'GA4 measurement id (G-XXXXXXXXXX) from workflow 505 (optional)'
        required: false
        type: string
      dry_run:
        description: 'Preview only: build the branch + print the diff, do not open the PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  # Required for the OIDC exchange that fetches the PAT from Key Vault (#844).
  id-token: write

# Serialize per-domain so re-dispatches for the same site queue instead of racing.
concurrency:
  group: 704-website-analytics-wire-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      - uses: actions/checkout@v7.0.1

      # Untrusted/user-supplied values are passed via env (never interpolated directly
      # into the script body) so they cannot break out of the string and inject shell
      # (#1080). This step is where that mattered most in this file: it is the only one
      # that interpolated, and it is the one whose JOB is to reject a malformed id — it
      # used to perform that check by pasting the value into the program doing the
      # checking. Measured against the shipped body, `gtm_id` =
      # `GTM-ABCDE$(printf ran > f)` ran the substitution, left a legal-looking id
      # behind, and the step exited **0**: no error, no annotation, arbitrary code
      # executed on `github-prod` after the approver spent the credential, and one step
      # before `wr-all-cbm-github-pat` is loaded into the job for the wiring step to use.
      - name: Validate inputs
        shell: bash
        env:
          GTM_ID: ${{ inputs.gtm_id }}
          MEASUREMENT_ID: ${{ inputs.measurement_id }}
        run: |
          set -euo pipefail
          # Escape a dispatcher-controlled value before it goes into a workflow
          # command. `::error::…` is parsed per LINE, so a newline in the value ends
          # the message and every following line starting with `::` is a command the
          # runner obeys. Measured against the un-escaped version of this step:
          # `gtm_id` = "nope\n::add-mask::SOMETHING\n::notice::spoofed" emitted THREE
          # workflow-command lines, two of them entirely the dispatcher's. The value
          # stays in the message — an operator needs to see what was rejected — so the
          # remedy is escaping, not omission. `%` is substituted first, because the
          # replacements after it introduce `%0D` / `%0A` that must not be re-escaped.
          esc() {
            local s=${1//'%'/'%25'}
            s=${s//$'\r'/'%0D'}
            s=${s//$'\n'/'%0A'}
            printf '%s' "$s"
          }
          # Fail closed on a missing mapping. The interpolated body could not have an
          # absent source — substitution always produced *something* — but an `env:`
          # mapping can be deleted or misspelled, and the checker that enforces #1080
          # is honestly green when it is (ledger L202): nothing is interpolated either
          # way. Both branches below name the mapping, because the alternative reading
          # of an empty id sends the next reader to the dispatch form.
          if [ -z "${GTM_ID:-}" ]; then
            echo "::error::GTM_ID is empty: gtm_id never reached this step. Either the step-level env: mapping is missing or misnamed, or the dispatch supplied an empty value. Refusing to continue either way."
            exit 1
          fi
          # `declare -p` distinguishes UNSET from SET-BUT-EMPTY, and only that
          # distinction is useful here: measurement_id is optional, so GitHub maps an
          # omitted value to an empty string and the check below is meant to be skipped.
          # A deleted mapping produces the same empty string at the `-n` test, silently
          # skipping the format check — while 'Wire analytics + open PR' keeps its own
          # mapping and still hands the unvalidated id to scripts/analytics-wire.ps1.
          if ! declare -p MEASUREMENT_ID >/dev/null 2>&1; then
            echo "::error::MEASUREMENT_ID is unset: the step-level env: mapping is missing or misnamed. An omitted measurement_id arrives as an empty string, so this is not that — the format check below would be skipped while the wiring step still passes the unvalidated id to scripts/analytics-wire.ps1."
            exit 1
          fi
          if [[ ! "$GTM_ID" =~ ^GTM-[A-Z0-9]{5,9}$ ]]; then
            echo "::error::gtm_id '$(esc "$GTM_ID")' is not a valid GTM-XXXXXXX id."
            exit 1
          fi
          if [ -n "$MEASUREMENT_ID" ] && [[ ! "$MEASUREMENT_ID" =~ ^G-[A-Z0-9]{6,12}$ ]]; then
            echo "::error::measurement_id '$(esc "$MEASUREMENT_ID")' is not a valid G-XXXXXXXXXX id."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.

      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name wr-all-cbm-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Wire analytics + open PR
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          GTM_ID: ${{ inputs.gtm_id }}
          MEASUREMENT_ID: ${{ inputs.measurement_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REPO="FreeForCharity/FFC-EX-${DOMAIN}"

          if ! gh repo view "$REPO" --json nameWithOwner >/dev/null 2>&1; then
            echo "::error::Target repo $REPO not found or not accessible."
            exit 1
          fi
          DEFBRANCH="$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)"

          gh auth setup-git
          git clone --depth 1 "https://github.com/${REPO}.git" target

          args=(-NoProfile -File scripts/analytics-wire.ps1 -RepoDir "$PWD/target" -Domain "$DOMAIN" -GtmId "$GTM_ID")
          if [ -n "${MEASUREMENT_ID}" ]; then
            args+=(-MeasurementId "$MEASUREMENT_ID")
          fi
          pwsh "${args[@]}" | tee wire-summary.json
          {
            echo "## 704 Analytics Wire — ${DOMAIN}"
            echo ''
            echo '```json'
            cat wire-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cd target
          # Stage everything (including brand-new files like a first-time
          # analytics.config.ts) BEFORE checking for changes. `git diff --quiet`
          # alone ignores UNtracked files, so a template site whose only change is
          # a newly-created config file gets mis-reported as "already wired" and
          # silently skipped (no PR). Compare the staged index instead.
          git add -A
          if git diff --cached --quiet; then
            echo "Already wired for ${GTM_ID} — no changes, no PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git --no-pager diff --cached --stat

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true — diff shown below, no PR opened."
            # Write the full diff to a file first, then head the FILE. Piping
            # `git diff | head` makes head close the pipe after 300 lines, which
            # sends git SIGPIPE (exit 141) and trips `set -o pipefail` on large
            # static-export diffs. Reading from a file avoids the broken pipe.
            git --no-pager diff --cached > full.diff
            head -300 full.diff
            lines="$(wc -l < full.diff)"
            if [ "$lines" -gt 300 ]; then
              echo "… (diff truncated at 300 of ${lines} lines)"
            fi
            exit 0
          fi

          BRANCH="chore/analytics-wire-${GTM_ID}"
          git config user.name "ffc-automation[bot]"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: wire analytics (GTM ${GTM_ID})"
          git push -u origin "$BRANCH" --force-with-lease

          # Idempotent redispatch: if a PR for this head branch already exists, the push above
          # updated it — don't hard-fail on `gh pr create`.
          if gh pr view "$BRANCH" --repo "$REPO" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH on $REPO — updated its branch, skipping create." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PR_BODY=$(cat <<EOF
          Wires analytics ids into this site (public client-side ids, not secrets).

          - GTM container: \`${GTM_ID}\` (FFC-owned, via workflow 503)
          - GA4 measurement id: \`${MEASUREMENT_ID:-n/a}\` (via workflow 505; GA4 fires inside the GTM container)

          Generated by FFC workflow **704. Website - Analytics Wire**. Part of the fleet analytics
          rollout (FreeForCharity/FFC-Cloudflare-Automation#629).
          EOF
          )
          gh pr create --repo "$REPO" --base "$DEFBRANCH" --head "$BRANCH" \
            --title "chore: wire analytics (GTM ${GTM_ID})" \
            --body "$PR_BODY" --draft
          echo "Opened draft PR on ${REPO}." | tee -a "$GITHUB_STEP_SUMMARY"
