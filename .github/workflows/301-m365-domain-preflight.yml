name: '301. M365 (FFC Tenant) - Domain Preflight (Read-only) [M365+CF]'

# INTERNAL (FFC Microsoft tenant): reads domain status from the FFC M365 tenant via Graph.
# For charities running their OWN Microsoft tenant this preflight does not apply - their
# tenant, their admin center. See docs/m365-domain-and-dkim.md (internal vs external).

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to validate (e.g., example.org)
        required: true
        type: string

jobs:
  graph:
    runs-on: ubuntu-latest
    environment: m365-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The runner writes a `run:` body to a script FILE in the workspace before
      # executing it, so an interpolated secret is a credential on disk - in the
      # same workspace an injected `domain` payload would be running in. Mapped
      # and looped instead, the pattern 304 uses.
      - name: Validate required secrets
        shell: bash
        env:
          FFC_AZURE_CLIENT_ID: ${{ secrets.FFC_AZURE_CLIENT_ID }}
          FFC_AZURE_TENANT_ID: ${{ secrets.FFC_AZURE_TENANT_ID }}
        run: |
          for name in FFC_AZURE_CLIENT_ID FFC_AZURE_TENANT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not set (environment: m365-prod)";
              exit 1;
            fi
          done

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.FFC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire Graph token
        id: graph
        shell: bash
        run: |
          token=$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          if [ -z "$token" ]; then
            echo "::error::Failed to acquire Microsoft Graph token";
            exit 1;
          fi
          # Runtime-derived, so the runner does not mask it the way it masks a
          # value from the secrets store - this one never passed through it. Mask
          # it before it becomes a step output, or anything that echoes the
          # variable downstream prints a live Graph bearer token into the log.
          # (Deliberately not naming the expression form in words here. This
          # body - comments included, since a YAML block scalar is one string -
          # is swept by test_no_step_interpolates_a_secret_into_its_body in
          # tests/workflow-logic/test_301_preflight_wiring.py, which matches a
          # substring and so reads a mention inside a comment as a reference.
          # Measured: an earlier draft of this comment failed that test. See
          # #1019 for the general case.)
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      # `domain` is a free-text dispatch input, so it reaches the body through
      # step-level `env:`, never interpolated into it (#1080). What sits beside it
      # here is a live Microsoft Graph bearer token, mapped from a step OUTPUT
      # rather than from the secrets store - so a sweep of this file for `secrets.`
      # in a `run:` body finds nothing, and ledger L213's "read the step's env:"
      # ranks this site by a mapping whose right-hand side names no secret at all.
      - name: Run domain preflight
        shell: pwsh
        env:
          GRAPH_ACCESS_TOKEN: ${{ steps.graph.outputs.access_token }}
          IN_DOMAIN: ${{ inputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed on a missing mapping (ledger L202/L214). Interpolation had
          # no absent source - substitution always produced something - but an
          # `env:` var that is unmapped or misnamed is silently empty, and pwsh
          # renders an empty variable as NO ARGUMENT AT ALL, so `-AccessToken`
          # would bind to `-Domain` and the diagnosis would arrive as a
          # call-signature error one parameter to the left of the cause.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call m365-domain-preflight.ps1 with an empty -Domain.'
            exit 1
          }
          pwsh -NoProfile -File scripts/m365-domain-preflight.ps1 -Domain $env:IN_DOMAIN -AccessToken $env:GRAPH_ACCESS_TOKEN -SkipCloudflare

  cloudflare:
    runs-on: ubuntu-latest
    environment: cloudflare-prod-read
    needs: [graph]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC. Workflow is
      # read-only (audit + preflight), so scope: read loads READ_ALL tokens.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}

      # Second `domain` call site, in a second job under a second environment. The
      # composite action above has already put the Key Vault Cloudflare tokens in
      # this process environment, so an injected body here needs no lateral
      # movement either - and this job `needs: [graph]`, so one dispatch runs the
      # payload in both jobs.
      - name: Run Cloudflare audit portion
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed on a missing mapping - see the preflight step in `graph`.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call m365-domain-preflight.ps1 with an empty -Domain.'
            exit 1
          }
          # The composite action populates BOTH CLOUDFLARE_API_TOKEN_FFC and
          # CLOUDFLARE_API_TOKEN_CM. scripts/m365-domain-preflight.ps1's
          # Get-CfToken returns null when it finds multiple distinct candidates,
          # which would silently skip the audit. Pass -CloudflareToken
          # explicitly (prefer FFC, fall back to CM) to bypass that.
          $cfToken = if (-not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN_FFC)) {
            $env:CLOUDFLARE_API_TOKEN_FFC
          } else {
            $env:CLOUDFLARE_API_TOKEN_CM
          }
          pwsh -NoProfile -File scripts/m365-domain-preflight.ps1 -Domain $env:IN_DOMAIN -SkipGraph -CloudflareToken $cfToken
