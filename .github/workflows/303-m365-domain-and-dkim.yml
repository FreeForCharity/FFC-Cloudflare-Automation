name: '303. M365 (FFC Tenant) - Domain Status + DKIM (Toolbox) [M365]'
run-name: 'M365: ${{ inputs.domain }}'

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name (e.g., example.org)'
        required: true
        type: string
      action:
        description: 'What to run'
        required: true
        type: choice
        options:
          - status
          - dkim-check
          - dkim-enable
        default: status
      create_if_missing:
        description: 'If DKIM config is missing, create it (disabled by default)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  m365:
    runs-on: windows-latest
    environment: m365-prod

    env:
      EXO_CERT_PFX_BASE64: ${{ secrets.EXO_CERT_PFX_BASE64 }}
      EXO_CERT_PFX_PASSWORD: ${{ secrets.EXO_CERT_PFX_PASSWORD }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.FFC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Acquire Microsoft Graph token
        id: graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          if (-not $token) { throw 'Failed to acquire Graph access token via Azure CLI.' }
          "GRAPH_ACCESS_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `domain` is a free-text dispatch input, so it reaches the body through
      # step-level `env:`, never interpolated into it (#1080). The job-level `env:`
      # above puts the Exchange Online certificate AND its password in this step's
      # process environment, so an interpolated payload here needed no lateral
      # movement to reach a credential (ledger L213).
      - name: Domain status (Graph)
        if: ${{ inputs.action == 'status' }}
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed on a missing mapping (ledger L202/L207). Interpolation had no
          # absent source — substitution always produced something — but an `env:` var
          # that is unmapped or misnamed is silently empty, and `-Domain` is Mandatory,
          # so the failure would arrive as a PowerShell parameter prompt hanging the
          # runner rather than as a stated cause.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call m365-domain-status.ps1 with an empty -Domain.'
            exit 1
          }
          pwsh -File scripts/m365-domain-status.ps1 -Domain $env:IN_DOMAIN -ShowDnsRecords

      - name: Import certificate for Exchange Online (optional)
        if: ${{ inputs.action != 'status' && env.EXO_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxBytes = [Convert]::FromBase64String($env:EXO_CERT_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'exo-auth.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePw = $null
          if ($env:EXO_CERT_PFX_PASSWORD) {
            $securePw = ConvertTo-SecureString -String $env:EXO_CERT_PFX_PASSWORD -AsPlainText -Force
          }

          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePw
          if (-not $cert) { throw 'Failed to import PFX certificate.' }

          "EXO_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: DKIM check / enable (Exchange Online)
        if: ${{ inputs.action != 'status' }}
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
          EXO_APP_ID: ${{ secrets.FFC_AZURE_CLIENT_ID }}
          EXO_TENANT: ${{ secrets.EXO_TENANT }}
          EXO_ORGANIZATION: ${{ secrets.EXO_ORGANIZATION }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Fail closed on a missing mapping (ledger L202/L207) — see the status step.
          # This step holds the Exchange Online app id, tenant and organization in its
          # OWN `env:`, on top of the certificate the job supplies, which is what made
          # this the call site worth taking (ledger L213).
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call m365-dkim.ps1 with an empty -Domain.'
            exit 1
          }

          $domain = $env:IN_DOMAIN
          $create = [System.Convert]::ToBoolean("${{ inputs.create_if_missing }}")

          if ("${{ inputs.action }}" -eq 'dkim-enable') {
            if ($create) {
              pwsh -File scripts/m365-dkim.ps1 -Domain $domain -CreateIfMissing -Enable -Confirm:$false
            } else {
              pwsh -File scripts/m365-dkim.ps1 -Domain $domain -Enable -Confirm:$false
            }
          } else {
            if ($create) {
              pwsh -File scripts/m365-dkim.ps1 -Domain $domain -CreateIfMissing
            } else {
              pwsh -File scripts/m365-dkim.ps1 -Domain $domain
            }
          }
