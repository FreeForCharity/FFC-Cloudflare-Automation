name: '106. DNS - Enforce Standard (DNS-only) [CF]'
run-name: 'Enforce Standard: ${{ inputs.domain }} (dry_run=${{ inputs.dry_run }})'

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain Name (e.g., example.org)'
        required: true
        type: string
      dry_run:
        description: 'Dry Run (Check before Fix)'
        type: boolean
        default: true
      pages_only:
        description:
          'Only enforce GitHub Pages (apex A/AAAA + www CNAME). Does NOT touch MX/TXT/SRV/etc.'
        type: boolean
        default: false
      proxy_on:
        description:
          'Enable Cloudflare proxy (orange cloud) for GitHub Pages records. Default is OFF (DNS
          only) so GitHub can validate and issue SSL.'
        type: boolean
        default: false
      mail_provider:
        description:
          "Which mail provider this domain is on. 'from-registry' (default) reads
          data/mail-providers.json; a domain NOT LISTED there has its mail left completely alone. A
          listed domain is on EXACTLY ONE provider, so enforcing REMOVES the other provider's
          MX/CNAME/SRV. Picking a value here overrides the registry for this run only. MOVING a
          domain between providers also needs confirm_mail_change. Ignored when pages_only is true."
        type: choice
        options:
          - from-registry
          - unchanged
          - microsoft365
          - google
        default: from-registry
      confirm_mail_change:
        description:
          "Type the domain name here ONLY to authorise MOVING its mail between providers. Required
          whenever the zone's live provider differs from the one it resolves to. Leave blank
          otherwise - a blank value cannot move any domain's mail."
        type: string
        default: ''
      dmarc_mgmt_debug:
        description: 'Debug: run DMARC Management API probe/attempts (noisy)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 106-enforce-standard
  cancel-in-progress: false

jobs:
  enforce_standard:
    runs-on: windows-latest
    environment: cloudflare-prod-write
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: Cloudflare tokens now sourced from Key Vault at runtime via OIDC.
      # The composite action sets CLOUDFLARE_API_TOKEN_{FFC,CM} for subsequent steps.
      # Local copy of CBMadmin's canonical action (cross-repo private access is blocked
      # because this repo is public but CBMadmin is private). Sync changes from
      # CBMadmin's .github/actions/cloudflare-tokens-from-kv/ via the workflows-library
      # copy convention.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Enforce FFC Standard Configuration
        shell: pwsh
        # User-supplied values by env, never interpolated into the script body,
        # so they cannot break out of the string and inject PowerShell (same
        # rule 105 documents on its "Manage DNS Record" step).
        env:
          FFC_CF_DMARCMGMT_DEBUG: ${{ inputs.dmarc_mgmt_debug && '1' || '0' }}
          REC_DOMAIN: ${{ inputs.domain }}
          REC_DRY_RUN: ${{ inputs.dry_run }}
          REC_PAGES_ONLY: ${{ inputs.pages_only }}
          REC_PROXY_ON: ${{ inputs.proxy_on }}
          REC_MAIL_PROVIDER: ${{ inputs.mail_provider }}
          REC_CONFIRM_MAIL_CHANGE: ${{ inputs.confirm_mail_change }}
        run: |
          $Domain = [string]$env:REC_DOMAIN
          $DryRun = [string]$env:REC_DRY_RUN
          $PagesOnly = [string]$env:REC_PAGES_ONLY
          $ProxyOn = [string]$env:REC_PROXY_ON

          # Workflow inputs are lowercase for a readable dropdown; the script's
          # ValidateSet is PascalCase. Map explicitly and fail loudly on anything
          # unrecognised rather than silently defaulting to a provider.
          #
          # 'from-registry' maps to EMPTY, and an empty value means -MailProvider
          # is not passed, so the script resolves each domain from
          # data/mail-providers.json. That is the normal path: the registry is
          # what lets a Google domain stay Google across routine runs. The two
          # explicit values are a per-run override for moving a domain.
          switch ([string]$env:REC_MAIL_PROVIDER) {
            'google' { $MailProvider = 'Google' }
            'microsoft365' { $MailProvider = 'Microsoft365' }
            'unchanged' { $MailProvider = 'Unchanged' }
            'from-registry' { $MailProvider = '' }
            '' { $MailProvider = '' }
            default { throw "Unsupported mail_provider '$($env:REC_MAIL_PROVIDER)'" }
          }

          # Built as a parameter HASHTABLE rather than nested if/else: with
          # dry-run, pages-only, proxy and provider that would be 16
          # near-identical branches, and the M365/Google split is exactly where a
          # copy-paste slip would send a live cutover down the wrong one.
          #
          # It MUST be a hashtable, not an array. Splatting an ARRAY into an
          # in-process script call passes the elements POSITIONALLY, so '-Zone'
          # arrives as a value rather than a parameter name and binding dies with
          # "A positional parameter cannot be found that accepts argument
          # '-Zone'". That is exactly what the first real dry run of this step
          # hit. (103 splats an array and gets away with it only because it
          # shells out via `pwsh -File`, where a separate process re-parses argv.)
          $params = @{
            Zone            = $Domain
            EnforceStandard = $true
          }

          if ($PagesOnly -eq 'true') {
            # GitHubPagesOnly returns before any mail record is touched, so the
            # provider is inert here. Left out to keep that explicit.
            $params['GitHubPagesOnly'] = $true
            Write-Host "Pages-only: mail records (and mail_provider) are not touched."
          } elseif ($MailProvider) {
            Write-Host "Mail provider OVERRIDE: $MailProvider (the other provider's records will be removed)"
            $params['MailProvider'] = $MailProvider
          } else {
            Write-Host "mail_provider=from-registry: provider resolved per-domain from data/mail-providers.json."
          }

          if ($ProxyOn -eq 'true') { $params['ProxyGitHubPages'] = $true }

          # Passed through verbatim; the script compares it to the zone name and
          # ignores anything that does not match, so a blank or stale value can
          # never authorise a move.
          $ConfirmChange = [string]$env:REC_CONFIRM_MAIL_CHANGE
          if (-not [string]::IsNullOrWhiteSpace($ConfirmChange)) {
            Write-Host "confirm_mail_change supplied: '$ConfirmChange'"
            $params['ConfirmMailProviderChange'] = $ConfirmChange
          }

          if ($DryRun -eq 'true') {
            Write-Host "--- DRY RUN MODE: PREVIEWING CHANGES ---"
            $params['DryRun'] = $true
          } else {
            Write-Host "--- LIVE MODE: APPLYING FIXES ---"
          }

          Write-Host ("Update-CloudflareDns.ps1 " + (($params.Keys | Sort-Object | ForEach-Object { "-$_ $($params[$_])" }) -join ' '))
          & .\Update-CloudflareDns.ps1 @params

      - name: Post-Enforce Compliance Audit
        shell: pwsh
        # CLOUDFLARE_API_TOKEN_{FFC,CM} already in env from the composite action above.
        # User-supplied values by env — see the enforce step above.
        env:
          REC_DOMAIN: ${{ inputs.domain }}
          REC_PROXY_ON: ${{ inputs.proxy_on }}
          REC_PAGES_ONLY: ${{ inputs.pages_only }}
          REC_MAIL_PROVIDER: ${{ inputs.mail_provider }}
        run: |
          $Domain = [string]$env:REC_DOMAIN
          $ProxyOn = [string]$env:REC_PROXY_ON
          $PagesOnly = [string]$env:REC_PAGES_ONLY

          # Hashtable, not an array — see the enforce step above.
          $params = @{
            Zone  = $Domain
            Audit = $true
          }

          # When a cutover was requested, audit against the provider we just
          # enforced rather than whatever the zone resolves to. If the cutover
          # half-failed, auto-detection would read the OLD provider off the
          # surviving MX and report a clean bill of health for it — the one
          # outcome this step exists to catch.
          #
          # With 'from-registry' we pass nothing and let the script resolve the
          # domain from the registry — the same resolution the enforce step just
          # used, so the audit checks the same provider it enforced.
          if ($PagesOnly -ne 'true') {
            switch ([string]$env:REC_MAIL_PROVIDER) {
              'google' { $params['MailProvider'] = 'Google' }
              'microsoft365' { $params['MailProvider'] = 'Microsoft365' }
              'unchanged' { $params['MailProvider'] = 'Unchanged' }
              'from-registry' { }
              '' { }
              default { throw "Unsupported mail_provider '$($env:REC_MAIL_PROVIDER)'" }
            }
          }

          if ($ProxyOn -eq 'true') { $params['ProxyGitHubPages'] = $true }

          & .\Update-CloudflareDns.ps1 @params -ErrorAction Continue
