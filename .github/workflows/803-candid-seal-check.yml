name: '803. Candid - Seal Widget Check [CANDID]'
run-name: 'Candid Seal Check'

# Read-only: checks each charity's Candid footer badge the way a signed-out visitor meets it. The
# seal widget must be a real, visible seal, the badge must render in a page, and the shareable
# profile link must show the full profile. Blank input = self-test against known live answers.
# No credentials. Runs on a GitHub runner because cloud agent containers cannot reach Candid.

on:
  workflow_dispatch:
    inputs:
      profile_urls:
        description:
          'Shareable app.candid.org profile links, one per line or comma-separated (blank = the
          known set)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/candid-seal-check.ps1'
      - 'scripts/candid-render.js'
      - '.github/workflows/803-candid-seal-check.yml'

permissions:
  contents: read

concurrency:
  group: 803-candid-seal-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Choose the links to check
        shell: pwsh
        env:
          PROFILE_URLS: ${{ inputs.profile_urls }}
        run: |
          # Self-test against live Candid: each link with the answer it must get.
          $known = [ordered]@{
            # freeforcharity.org's own footer badge (known good, Platinum)
            'https://app.candid.org/profile/9326392/free-for-charity/?pkId=7232730a-03b5-467f-a82c-443dcd2122ed&isActive=true' = $true
            # order 883, shareable link
            'https://app.candid.org/profile/15935725/restorative-expressive-arts-corp-99-1579845/?pkId=e115d60f-1499-4a15-9aea-56fe7d8b413d' = $true
            # order 886, shareable link
            'https://app.candid.org/profile/16766185/ritual-azteca-inc/?pkId=e0adf022-4e46-48f4-baa3-8488ece7c3f4&isActive=true' = $true
            # order 886, plain link: signed out it shows only a short summary, so it must FAIL
            'https://app.candid.org/profile/16766185/ritual-azteca-inc/' = $false
          }
          $urls = @("$env:PROFILE_URLS" -split '[,\r\n]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($urls.Count -eq 0) {
            $urls = @($known.Keys)
            $known | ConvertTo-Json | Set-Content -Path candid-expect.json -Encoding utf8
          }
          $urls -join "`n" | Set-Content -Path candid-urls.txt -Encoding utf8

      - name: Render profile links and footer badges in Chromium
        run: |
          mapfile -t urls < candid-urls.txt
          node scripts/candid-render.js "${urls[@]}" > candid-render.jsonl

      - name: Judge each badge
        shell: pwsh
        run: |
          $expect = if (Test-Path candid-expect.json) { Get-Content -Raw candid-expect.json } else { '' }
          ./scripts/candid-seal-check.ps1 -RenderJsonl candid-render.jsonl -ExpectJson $expect -JsonOut candid-seal-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candid-seal-report
          path: |
            candid-seal-report.json
            candid-render.jsonl
          if-no-files-found: ignore
