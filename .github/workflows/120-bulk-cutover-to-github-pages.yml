name: '120. DNS + GH Pages - Bulk Cutover staging -> Apex (FFC-EX) [CF+GH]'
run-name:
  'Bulk cutover staging->apex (dry_run=${{ inputs.dry_run }}, skip_dns=${{ inputs.skip_dns }},
  skip_cname=${{ inputs.skip_cname }})'

on:
  workflow_dispatch:
    inputs:
      domains:
        description: >-
          Comma-separated root domains to cut over. Leave blank to use the fleet default list from
          config/ffc-ex-cutover-domains.json (excluding amargraves.org placeholder).
        required: false
        type: string
        default: ''
      dry_run:
        description: >-
          Dry-run (discover only — no commits, no DNS changes). Default: true. Set to false only
          when you are ready to perform the live cutover.
        required: false
        type: boolean
        default: true
      skip_dns:
        description: >-
          Skip the Cloudflare DNS flip entirely. Only flip public/CNAME in the FFC-EX repo. Useful
          for testing the GitHub side alone.
        required: false
        type: boolean
        default: false
      skip_cname:
        description: >-
          Skip the GitHub public/CNAME flip entirely. Only flip Cloudflare DNS. Useful if you
          already updated CNAME via another path.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Serialize cutover runs: parallel dispatches would race on the same FFC-EX CNAMEs / Cloudflare DNS.
concurrency:
  group: bulk-cutover-github-pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Flip public/CNAME in each FFC-EX repo (uses github-prod env's CBM_TOKEN).
  # Skipped entirely if skip_cname=true.
  # ---------------------------------------------------------------------------
  cname-flip:
    if: ${{ inputs.skip_cname != true }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: github-prod
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"
      - name: Flip public/CNAME (skip DNS in this job)
        shell: pwsh
        # `domains` is free text, and an interpolated expression is substituted into
        # the script TEXT before pwsh parses it -- so the value is source code, not
        # data (#1080). Single quotes do not contain it: one apostrophe in the input
        # closes the literal and the rest is pwsh, running AFTER the github-prod approval
        # with a credential the dispatcher never held. `$env:` is a runtime lookup and is
        # never re-parsed. `dry_run` stays interpolated on purpose: GitHub generates a
        # `boolean` value from the declared options, so it cannot carry a payload.
        env:
          IN_DOMAINS: ${{ inputs.domains }}
        run: |
          # Fleet default list — single source of truth shared with workflow 121.
          $defaultDomains = (
            Get-Content -Raw config/ffc-ex-cutover-domains.json | ConvertFrom-Json
          ).domains -join ','
          $domainsInput = [string]$env:IN_DOMAINS
          if ([string]::IsNullOrWhiteSpace($domainsInput)) { $domainsInput = $defaultDomains }

          $params = @{
            Domains = $domainsInput
            SkipDns = $true   # this job only flips CNAME
          }
          if ('${{ inputs.dry_run }}' -eq 'true') { $params.DryRun = $true }

          ./scripts/bulk-cutover-to-github-pages.ps1 @params

  # ---------------------------------------------------------------------------
  # JOB 2: Flip Cloudflare apex DNS (uses cloudflare-prod env's CF tokens).
  # Depends on cname-flip success (unless skipped). Skipped entirely if skip_dns=true.
  # ---------------------------------------------------------------------------
  dns-flip:
    needs: [cname-flip]
    if:
      ${{ always() && inputs.skip_dns != true && (needs.cname-flip.result == 'success' ||
      needs.cname-flip.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: cloudflare-prod-write
    env:
      # GH_TOKEN set to a dummy so the script doesn't error on missing var;
      # the script uses SkipCname switch below to avoid GitHub API calls.
      GH_TOKEN: 'skipped-cname-phase'
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Flip Cloudflare apex DNS (skip CNAME in this job)
        shell: pwsh
        # `domains` via env, not interpolation -- see the cname-flip job above. This job
        # holds cloudflare-prod-write, so the injected code would run with the token that
        # rewrites apex DNS for the whole FFC-EX fleet.
        env:
          IN_DOMAINS: ${{ inputs.domains }}
        run: |
          # Fleet default list — single source of truth shared with workflow 121.
          $defaultDomains = (
            Get-Content -Raw config/ffc-ex-cutover-domains.json | ConvertFrom-Json
          ).domains -join ','
          $domainsInput = [string]$env:IN_DOMAINS
          if ([string]::IsNullOrWhiteSpace($domainsInput)) { $domainsInput = $defaultDomains }

          $params = @{
            Domains   = $domainsInput
            SkipCname = $true   # this job only does DNS
          }
          if ('${{ inputs.dry_run }}' -eq 'true') { $params.DryRun = $true }

          ./scripts/bulk-cutover-to-github-pages.ps1 @params

  # ---------------------------------------------------------------------------
  # JOB 3: Trigger Post-Deploy Smoke Test in each FFC-EX repo after DNS flip,
  # then wait for each to complete. Surfaces apex/DNS regressions that the
  # in-repo smoke would otherwise miss because smoke triggers only on Deploy
  # workflow events (and a DNS flip does not produce a Deploy event).
  #
  # Skipped on dry-run (no DNS actually flipped) and on dns-flip failure.
  # ---------------------------------------------------------------------------
  post-cutover-smoke:
    needs: [cname-flip, dns-flip]
    if: ${{ always() && inputs.dry_run != true && needs.dns-flip.result == 'success' }}
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      # Needed to read config/ffc-ex-cutover-domains.json (the fleet default list).
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"
      - name: Bind Pages custom domain + cert kick (post-DNS)
        shell: bash
        # `domains` via env, not interpolation -- see the cname-flip job above. In a bash
        # body a double-quoted `$( )` supplied by the dispatcher runs without needing to
        # break out of the quotes at all. Read bare under `set -u` (no `:-` default) so a
        # deleted `env:` block aborts the step instead of silently falling through to the
        # fleet-wide default list below.
        env:
          IN_DOMAINS: ${{ inputs.domains }}
        run: |
          set -uo pipefail
          # `gh` writes its error body to STDOUT, so `gh … 2>/dev/null || echo <default>`
          # never produces <default> — it produces the error text with the default
          # appended, and every downstream comparison then takes the wrong branch
          # (ledger L02 / #854 / #889). gh_get keeps stdout to successful responses
          # only: on failure it returns non-zero and puts the error on stderr, so a
          # caller can never mistake "could not read" for data.
          gh_get() {
            local out rc
            out=$(gh "$@" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }
          # #774: the Pages custom-domain binding is set AFTER the DNS flip.
          # Binding while stale records still resolve stalls Let's Encrypt in
          # state 'none' (seen live on the first cutover). Idempotent: a
          # same-value PUT is safe, and legacy branch-built repos already
          # bound via their committed CNAME simply no-op. If the cert is
          # stalled, re-bind (null -> domain) to restart issuance — the
          # proven remedy from the technologymonastery cutover.
          default_domains=$(jq -r '.domains | join(" ")' config/ffc-ex-cutover-domains.json)
          domains_input="$IN_DOMAINS"
          if [ -z "$domains_input" ]; then
            domains="$default_domains"
          else
            domains=$(echo "$domains_input" | tr ',' ' ')
          fi
          for d in $domains; do
            repo="FreeForCharity/FFC-EX-${d}"
            echo "::group::Bind + cert kick: $d"
            if ! gh api -X PUT "repos/$repo/pages" -f cname="$d" >/dev/null 2>&1; then
              echo "::warning::Could not set Pages binding for $repo (Pages disabled, or domain not verified?)"
              echo "::endgroup::"
              continue
            fi
            sleep 10
            # 'unknown' must mean "could not read", never "read an error". A cert that
            # is genuinely stalled reports none/errored and gets re-bound below; an
            # unreadable API must not trigger a re-bind on a guess.
            if ! state=$(gh_get api "repos/$repo/pages" --jq '.https_certificate.state // "none"'); then
              state=unknown
              echo "::warning::Could not read the Pages cert state for $repo — no re-bind attempted."
            fi
            echo "cert state after bind: $state"
            case "$state" in
              none|errored)
                echo "cert stalled ($state) — re-binding to restart issuance"
                echo '{"cname":null}' | gh api -X PUT "repos/$repo/pages" --input - >/dev/null
                sleep 5
                gh api -X PUT "repos/$repo/pages" -f cname="$d" >/dev/null
                sleep 10
                if ! state=$(gh_get api "repos/$repo/pages" --jq '.https_certificate.state // "none"'); then
                  state=unknown
                  echo "::warning::Could not read the Pages cert state for $repo after re-bind."
                fi
                echo "cert state after re-bind: $state"
                ;;
            esac
            echo "::endgroup::"
          done

      - name: Wait for DNS propagation
        shell: bash
        run: |
          # Apex DNS just flipped; give resolvers ~2 min before kicking the
          # smokes. The smokes themselves do a cert-aware retry (~20 min)
          # for the Let'\''s Encrypt provisioning window, so we don'\''t need
          # to wait for cert here.
          sleep 120

      - name: Dispatch Post-Deploy Smoke Test in each FFC-EX repo
        id: dispatch
        shell: bash
        # `domains` via env, not interpolation -- see the cname-flip job above.
        env:
          IN_DOMAINS: ${{ inputs.domains }}
        run: |
          set -uo pipefail

          # See the bind step above: `gh` puts its error body on stdout, so an
          # error must be detected by exit code, never by a `||` default (L02/#889).
          gh_get() {
            local out rc
            out=$(gh "$@" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          # Same default list as the cname-flip and dns-flip jobs above —
          # single source of truth shared with workflow 121.
          default_domains=$(jq -r '.domains | join(" ")' config/ffc-ex-cutover-domains.json)

          domains_input="$IN_DOMAINS"
          if [ -z "$domains_input" ]; then
            domains="$default_domains"
          else
            domains=$(echo "$domains_input" | tr ',' ' ')
          fi

          # Dispatch ALL smokes upfront so they run in parallel on GHA.
          # We collect (domain, run_id) pairs then poll sequentially in the
          # next step — the actual wait converges to the slowest single
          # smoke (~20 min worst case for cert provisioning), not N * 20 min.
          : > /tmp/smoke-dispatched.tsv
          for d in $domains; do
            repo="FreeForCharity/FFC-EX-${d}"
            echo "Dispatching smoke for $repo ..."
            if ! gh workflow run "Post-Deploy Smoke Test" --repo "$repo" --ref main 2>&1; then
              echo "::warning::Could not dispatch smoke for $repo (workflow may not exist on this repo)"
              printf '%s\tDISPATCH_FAILED\n' "$d" >> /tmp/smoke-dispatched.tsv
              continue
            fi
            # Settle a few seconds so the run is registered before we grab its id.
            sleep 5
            # An unreadable run list must land in the NO_RUN_ID branch below. The old
            # form captured the error body instead, which is non-empty and not "null",
            # so it was carried forward as if it were a run id — the poll step then
            # failed on every request and reported a smoke FAILURE for a run that was
            # very likely fine.
            if ! run_id=$(gh_get run list --repo "$repo" --workflow "Post-Deploy Smoke Test" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId'); then
              run_id=""
            fi
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::warning::Could not locate dispatched smoke run for $repo"
              printf '%s\tNO_RUN_ID\n' "$d" >> /tmp/smoke-dispatched.tsv
              continue
            fi
            echo "  -> run $run_id (https://github.com/${repo}/actions/runs/${run_id})"
            printf '%s\t%s\n' "$d" "$run_id" >> /tmp/smoke-dispatched.tsv
          done

          echo ""
          echo "Dispatched:"
          cat /tmp/smoke-dispatched.tsv

      - name: Poll each smoke to completion
        shell: bash
        run: |
          set -uo pipefail

          # See the bind step above: `gh` puts its error body on stdout, so an
          # error must be detected by exit code, never by a `||` default (L02/#889).
          gh_get() {
            local out rc
            out=$(gh "$@" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          # Per-repo deadline matches the smoke'\''s internal cert-retry budget
          # (20 min) plus Playwright install + screenshot (~3 min) plus slack.
          per_repo_deadline_seconds=1500   # 25 min

          fails=0
          dispatched=0
          while IFS=$'\t' read -r d run_id; do
            dispatched=$(( dispatched + 1 ))
            repo="FreeForCharity/FFC-EX-${d}"
            echo "::group::Smoke wait: $d"

            if [ "$run_id" = "DISPATCH_FAILED" ] || [ "$run_id" = "NO_RUN_ID" ]; then
              echo "::error::$d smoke could not be dispatched ($run_id) — treating as failure"
              fails=$(( fails + 1 ))
              echo "::endgroup::"
              continue
            fi

            deadline=$(( $(date +%s) + per_repo_deadline_seconds ))
            status="unknown"
            while [ "$(date +%s)" -lt "$deadline" ]; do
              # "error:null" has to be reached by exit code: the swallowed form
              # captured the error body, which matches none of the in-flight patterns
              # below, so it broke the loop and was printed verbatim as the "final
              # state" — the same outcome, reported unintelligibly.
              if ! status=$(gh_get run view "$run_id" --repo "$repo" --json status,conclusion --jq '.status + ":" + (.conclusion // "null")'); then
                status="error:null"
              fi
              case "$status" in
                in_progress:*|queued:*|waiting:*) ;;
                *) break ;;
              esac
              sleep 20
            done

            if [[ "$status" == *":success" ]]; then
              echo "✓ $d smoke passed (https://github.com/${repo}/actions/runs/${run_id})"
            else
              echo "::error::$d smoke FAILED — final state: $status"
              echo "::error::See https://github.com/${repo}/actions/runs/${run_id}"
              echo "::error::Download the smoke-visual-* artifact from that run for screenshots."
              fails=$(( fails + 1 ))
            fi
            echo "::endgroup::"
          done < /tmp/smoke-dispatched.tsv

          echo ""
          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails of $dispatched smoke tests failed after DNS cutover."
            echo "::error::Each failed smoke uploaded screenshots as 'smoke-visual-<run>' artifacts — inspect those."
            exit 1
          fi
          echo "All $dispatched smoke tests passed post-cutover."
