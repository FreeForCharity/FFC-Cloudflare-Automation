name: '112. DNS - Bulk Replace A-record IP (All Zones) [CF]'
run-name:
  'Bulk Replace A IP: ${{ inputs.old_ip }} -> ${{ inputs.new_ip }} (dry_run=${{ inputs.dry_run }})'

on:
  workflow_dispatch:
    inputs:
      old_ip:
        description: 'Old IP address (e.g. 204.44.192.77)'
        required: true
        type: string
      new_ip:
        description: 'New IP address (e.g. 216.222.200.253)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run (discover only, no changes). Default: true.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Serialize: this rewrites A records across many zones; parallel dispatches must not race.
concurrency:
  group: dns-bulk-replace-a-ip
  cancel-in-progress: false

jobs:
  bulk-replace:
    runs-on: windows-latest
    environment: cloudflare-prod-write
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Run bulk A-record replacement
        shell: pwsh
        # `old_ip` / `new_ip` are free-text dispatch inputs. Interpolated into this
        # body they are not arguments — they are source text pasted into the program
        # GitHub then runs, holding the cloudflare-prod-write token the APPROVER
        # spent, against A records in every zone of both accounts (#1080).
        #
        # The callee's own `[ValidatePattern('^\d{1,3}\....$')]` on both parameters
        # does not make that safe, and reads as though it does: the injected
        # expression runs while this hashtable is being BUILT, so the payload has
        # already executed by the time the script is invoked and its rejection
        # message describes an argument that was never the point.
        #
        # `$env:` is a runtime lookup on a value handed to the process as data; no
        # quoting inside it can change the program. `dry_run` stays interpolated on
        # purpose — GitHub generates a `boolean` from the declared options, so it
        # cannot carry a payload.
        env:
          IN_OLD_IP: ${{ inputs.old_ip }}
          IN_NEW_IP: ${{ inputs.new_ip }}
        run: |
          $oldIp = [string]$env:IN_OLD_IP
          $newIp = [string]$env:IN_NEW_IP

          # Both inputs are `required: true`, so empty here does not mean "the
          # dispatcher left it blank" — it means the `env:` mapping above was
          # deleted or misspelled. Say so, rather than letting the callee's
          # ValidatePattern report it as a malformed IP address and send the next
          # reader looking at the dispatch form.
          if ([string]::IsNullOrWhiteSpace($oldIp) -or [string]::IsNullOrWhiteSpace($newIp)) {
            # The detail goes out as an annotation rather than as the throw's text.
            # A thrown message reaches the log only through pwsh's error RENDERER,
            # which echoes the offending source line truncated with an ellipsis and
            # does not render identically on every host: measured here, the source
            # line is cut at 79 characters and the full message follows on a separate
            # line, while on the CI runner the assertion for that message did not
            # match at all. An annotation is plain stdout and passes through
            # unmodified, so the operator-facing text does not depend on any of that.
            Write-Output '::error::IN_OLD_IP / IN_NEW_IP is empty: the step-level env: mapping is missing or misnamed (#1080 burn-down), not a bad dispatch input.'
            throw 'Bulk replace aborted: input env mapping is empty.'
          }

          $params = @{
            OldIp = $oldIp
            NewIp = $newIp
          }
          if ('${{ inputs.dry_run }}' -eq 'true') { $params.DryRun = $true }
          ./scripts/bulk-replace-a-record-ip.ps1 @params
