name: '213. WHMCS -> Zeffy Payments Import (Draft) [WHMCS]'
run-name: 'WHMCS -> Zeffy Import Draft'

on:
  workflow_dispatch:
    inputs:
      api_url:
        description:
          'WHMCS API endpoint (e.g., https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php)'
        required: false
        type: string
        default: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
      clients_output:
        description: 'WHMCS clients CSV output path'
        required: false
        type: string
        default: 'artifacts/whmcs/whmcs_clients.csv'
      transactions_output:
        description: 'WHMCS transactions CSV output path'
        required: false
        type: string
        default: 'artifacts/whmcs/whmcs_transactions.csv'
      invoices_output:
        description: 'WHMCS invoices CSV output path (used to include $0 invoices)'
        required: false
        type: string
        default: 'artifacts/whmcs/whmcs_invoices.csv'
      zeffy_output:
        description: 'Zeffy draft CSV output path'
        required: false
        type: string
        default: 'artifacts/zeffy/zeffy_payments_import_draft.csv'

      zeffy_output_xlsx:
        description: 'Zeffy draft XLSX output path (for Zeffy import)'
        required: false
        type: string
        default: 'artifacts/zeffy/zeffy_payments_import_draft.xlsx'

      start_date:
        description: 'Optional start date filter for WHMCS transactions (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

      end_date:
        description: 'Optional end date filter for WHMCS transactions (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

      max_rows:
        description: 'Maximum number of WHMCS transactions to export (safety cap)'
        required: false
        type: string
        default: '200000'

      max_rows_per_file:
        description: 'Maximum Zeffy rows per CSV file (Zeffy import limit is 10,000)'
        required: false
        type: string
        default: '10000'

      include_zero_invoices:
        description: "Include $0 invoices as 'free' payments (to capture contacts)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Serialize runs so two dispatches can't race on the artifacts/zeffy/* outputs.
concurrency:
  group: whmcs-zeffy-payments-import
  cancel-in-progress: false

jobs:
  whmcs_to_zeffy_draft:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: whmcs-prod-read

    steps:
      - uses: actions/checkout@v7.0.1

      # #1422. All five output-path inputs are consumed TWICE: once by an export
      # or generator body below (through `env:`, as of #1080 lane 21) and once,
      # RAW, by an `actions/upload-artifact` step's `path:`. A `path:` is an
      # `@actions/glob` SELECTOR, not a filename, so the second consumer has a
      # different grammar from the first (ledger L298) and the move to `env:`
      # closed only one of the two. 201/202/203/208 ship six guard conditions on
      # such a value; this workflow shipped one of six -- the blank check, in
      # each consuming step -- while the burn-down scored it finished.
      #
      # WHY THIS IS ONE STEP RATHER THAN A COPY IN EACH CONSUMING BODY
      #   The five values are first read by FOUR different steps, and
      #   `invoices_output` only behind `include_zero_invoices`. Five copies of
      #   six checks is how one value silently keeps a check another gains --
      #   exactly what 202's loop was introduced to prevent, with five times the
      #   surface. One loop over all five makes coverage structural: a sixth
      #   artifact-consumed input that is not added to the spec list is a failing
      #   test, not an unguarded path in production.
      #
      # WHY IT RUNS BEFORE `whmcs-secrets-from-kv` RATHER THAN INSIDE AN EXPORT
      #   A refused dispatch then never fetches the WHMCS credential and never
      #   leaves an `az` session on disk (#1188/#1208). The per-step blank guards
      #   below are NOT removed: they also catch a missing or misnamed
      #   step-level `env:` mapping, which is a different failure from a bad
      #   dispatch value and is the attribution they were added for (#1213).
      - name: Validate artifact-consumed output paths
        shell: pwsh
        env:
          IN_CLIENTS_OUTPUT: ${{ inputs.clients_output }}
          IN_TRANSACTIONS_OUTPUT: ${{ inputs.transactions_output }}
          IN_INVOICES_OUTPUT: ${{ inputs.invoices_output }}
          IN_ZEFFY_OUTPUT: ${{ inputs.zeffy_output }}
          IN_ZEFFY_OUTPUT_XLSX: ${{ inputs.zeffy_output_xlsx }}
        run: |
          $ErrorActionPreference = 'Stop'

          # One guard body over ALL FIVE values. The input NAME travels with the
          # value so each `throw` names the input the dispatcher actually typed,
          # and the UPLOAD STEP travels with it too: the artifact step differs
          # per value here, unlike the single-upload lanes, and a message naming
          # the wrong one would send a reader to the wrong `path:`.
          foreach ($spec in @(
            @{ Input = 'clients_output';      Upload = 'Upload WHMCS clients';      Value = $env:IN_CLIENTS_OUTPUT },
            @{ Input = 'transactions_output'; Upload = 'Upload WHMCS transactions'; Value = $env:IN_TRANSACTIONS_OUTPUT },
            @{ Input = 'invoices_output';     Upload = 'Upload WHMCS invoices';     Value = $env:IN_INVOICES_OUTPUT },
            @{ Input = 'zeffy_output';        Upload = 'Upload Zeffy draft';        Value = $env:IN_ZEFFY_OUTPUT },
            @{ Input = 'zeffy_output_xlsx';   Upload = 'Upload Zeffy draft';        Value = $env:IN_ZEFFY_OUTPUT_XLSX }
          )) {
            $name   = $spec.Input
            $upload = $spec.Upload
            $value  = $spec.Value

            # Fail closed, not default-fill (ledger L254): the upload step reads
            # each input directly, so a default supplied only in a body would
            # write to the substituted path while the upload still looked at the
            # blank one.
            #
            # `-not IsNullOrWhiteSpace` rather than `-ne ''`, and the spelling is
            # what makes this do anything: the move to `env:` widens the domain
            # from string to string-or-null, so an omitted input arrives as
            # `$null` and an all-whitespace one as `'   '`. `IsNullOrWhiteSpace`
            # is true for both; `-ne ''` is true for `$null` (#1213).
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "$name is blank. It is consumed BOTH by this job's export/generator bodies and by the '$upload' step's path:, so nothing substitutes a default here — re-dispatch with a path, or omit the input to get its declared default."
            }

            # FIRST, and the four checks below depend on it.
            #
            # `actions/upload-artifact` reads `path:` as a NEWLINE-DELIMITED
            # LIST of patterns — and the 'Upload Zeffy draft' step's `path:` is
            # literally spelled as such a list — so one input carrying a newline
            # is several patterns to that consumer while still being one string
            # here.
            #
            # It also breaks the checks below, which is why it cannot come last.
            # `^` anchors at the start of the STRING, not of each line, so
            # `^([A-Za-z]+:|[\\/])` and `^~` see only the first line of a
            # multi-line value and a payload on the second walks past both.
            # Forbidding the newline is the remedy rather than `(?m)`: multiline
            # mode would make each check see every line but would still leave
            # the value meaning ONE path here and SEVERAL there.
            if ($value -match '[\r\n]') {
              throw "$name contains a carriage return or newline. The '$upload' step reads its path: as a newline-delimited list of patterns, so a newline here smuggles extra patterns past the checks below — which anchor on the start of the value and therefore only ever see its first line."
            }

            # `path:` is glob-capable (`@actions/glob`), so the junior consumer
            # can be pointed at files this job never wrote. Not every payload
            # self-blocks first: `*` and `?` are illegal in a Windows filename,
            # but `[` and `]` are legal filename characters AND character-class
            # metacharacters — the export writes a literal `[m]sal…json` and
            # exits 0, and the upload's glob then matches a different, real file.
            #
            # WHY THE SET STOPS AT `* ? [ ]`, and why it is deliberately NOT widened to
            # `{ } ( ) !`. The reason is a fact about a THIRD-PARTY package, which is why
            # it is written here instead of left to be re-derived by every reviewer
            # (#1380 — raised as a High on #1361 on the theory that `{a,b}` and `!(x)`
            # smuggle extra paths in, and it does not reproduce).
            #
            # `@actions/glob@0.7.0` builds its minimatch with brace expansion and
            # extglobs DISABLED — `lib/internal-pattern.js`, `nobrace: true` (:58) and
            # `noext: true` (:61) — so `{a,b}` and `!(x)` reach the globber as LITERAL
            # TEXT, not as alternations. Re-measured against a fixture tree holding a
            # legitimate CSV and a planted `.azure/msal_token_cache.json`, with
            # `implicitDescendants: false`:
            #
            #   `{<csv>,<secret>}`               0 hits    `!(nope).csv`        0 hits
            #   `{whmcs_clients,nope}.csv`       0 hits    `@(a|whmcs_clients)` 0 hits
            #   `(x).csv`                        0 hits — literal, not a group
            #   `!<csv>` alone                   0 hits — an exclude can only REMOVE
            #   `.azure/[m]sal_token_cache.json` 1 hit  — the REAL file, via the class
            #   `<csv>` and `<dir>/*.csv`        1 hit each — the controls, so no 0
            #                                               above is read as evidence
            #
            # So the set is not widened. `{ } ( ) !` are legal filename characters that
            # expand to nothing at this consumer, so a guard rejecting them would refuse
            # legitimate paths while STATING a hazard that does not exist — which is its
            # own failure mode, and the one #1380 asks not to introduce. What would
            # change this is the dependency, not the character list: if `@actions/glob`
            # ever ships `nobrace: false` or `noext: false`, this set must widen with it.
            # Re-measure that, rather than adding characters defensively.
            #
            # The one multi-path vector that DOES work is the newline, refused above.
            # That is why the newline guard cannot be reordered below this one.
            if ($value -match '[*?\[\]]') {
              throw "$name contains a glob metacharacter (one of * ? [ ]). It is passed unchanged to the '$upload' step, whose path: is a glob selector, so a pattern can match files this job never wrote. Pass a plain relative path."
            }

            # `[A-Za-z]+:`, not `[A-Za-z]:` — a PSDrive qualifier is not limited
            # to a single-letter filesystem drive, so `Temp:/x.csv` and `env:/x`
            # pass the narrow spelling and are still resolved by the provider.
            #
            # An explicit regex rather than [System.IO.Path]::IsPathRooted,
            # which is platform-DEPENDENT: `C:\x` and `\x` are rooted on Windows
            # and neither is on Linux, so a test running on ubuntu CI would
            # assert something the `windows-latest` runner does not do.
            if ($value -match '^([A-Za-z]+:|[\\/])') {
              throw "$name must be a workspace-relative path; got an absolute, UNC, drive- or PSDrive-qualified path. The '$upload' step uploads whatever its path: resolves to, so a path outside the workspace can put runner files into a downloadable artifact."
            }

            # `~` begins with neither a separator nor a qualifier, so the test
            # above does not catch it. This is the sharpest instance of the
            # two-consumer point rather than a repeat of it: PowerShell expands
            # `~` and `@actions/glob` does not, so the consumers disagree about
            # WHICH FILE IS MEANT — and `~/.azure` is where the `az` session
            # this job's OIDC login leaves behind actually lives (#1188/#1208).
            if ($value -match '^~') {
              throw "$name must not begin with '~': PowerShell expands it to the user profile, so this job would write outside the workspace, while the '$upload' step's globber does not expand it — the two consumers would not even agree which file is meant."
            }

            if (($value -split '[\\/]') -contains '..') {
              throw "$name must not contain a '..' segment: it escapes the workspace, and the '$upload' step uploads whatever its path: resolves to."
            }
          }

          "All five artifact-consumed output paths passed the #1422 guard set." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # WHMCS credential from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          scope: read
          azure-client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Export clients (read-only)
        shell: pwsh
        env:
          WHMCS_API_URL: ${{ inputs.api_url }}
          # #1080 lane 21. Every free-text dispatch input this job consumes now
          # arrives through a step-level `env:` mapping instead of being pasted
          # into the body by `${{ }}`, which GitHub substitutes as raw text
          # BEFORE pwsh parses the line — so the value was parsed as code.
          #
          # These sites sat in DOUBLE quotes, where `$( )` expands, so no quote
          # breakout was needed. Measured on pwsh 7.4.6 against the body as it
          # shipped, with `clients_output` =
          # `artifacts/whmcs/whmcs_clients.csv$($null = Set-Content -Path <sentinel> -Value $env:WHMCS_API_SECRET)`:
          # the WHMCS API secret was written to the sentinel, the exporter was
          # still handed a legal `OutputFile=[artifacts/whmcs/whmcs_clients.csv]`,
          # and the step exited **0**. `$null =` swallows the subexpression's
          # output, so the variable keeps its legal value and the run reads as
          # entirely ordinary in the log. The benign control leaked nothing.
          #
          # The credential is not visible in this step's own `env:` (ledger L213)
          # and a `secrets.` grep of the file (#1141) scores it as holding
          # nothing: it arrives through GITHUB_ENV from `whmcs-secrets-from-kv`,
          # which is the arrival path #1188 exists to surface.
          IN_CLIENTS_OUTPUT: ${{ inputs.clients_output }}
        run: |
          $ErrorActionPreference = 'Stop'

          # `api_url` is `required: false`, so a dispatch that omits or blanks it leaves
          # this empty; default to the APIM gateway so the call stays on the static-IP
          # path (not the IP-restricted origin), matching 209/210/219/221/225/226/228.
          # That default is also what keeps the bare `$env:WHMCS_API_URL` below from
          # vanishing as an ARGUMENT and shifting every later parameter one position
          # left (ledger L214) — an empty value is no argument at all, so `-ApiUrl`
          # would bind the next `-Switch` and the failure would read as a call-signature
          # problem for what is really a missing value.
          if ([string]::IsNullOrWhiteSpace($env:WHMCS_API_URL)) {
            $env:WHMCS_API_URL = 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          }

          # Fail closed (#1213, ledger L214). A blank is NOT legitimate for an
          # output path — the input documents a default and the body treats the
          # value as a file it will later assert exists.
          #
          # What this guard buys here is NOT what it bought on 601, and the
          # difference was measured on this body rather than carried across
          # (ledger L260). pwsh 7.4.6, guard stripped, all three blank forms:
          #
          #   EMPTY  ('')    dies at `Split-Path -Parent $out` — "Cannot bind
          #                  argument to parameter 'Path' because it is an empty
          #                  string". rc=1, exporter never called. LOUD.
          #   UNSET  ($null) same line, "…because it is null". rc=1. LOUD.
          #   SPACES ('   ') `Split-Path` ACCEPTS it, `$dir` comes back empty so
          #                  no directory is made, and the exporter IS invoked
          #                  with `OutputFile=[   ]` — a credentialed call the
          #                  step should never have made.
          #
          # So for the first two the guard buys ATTRIBUTION (it names the missing
          # mapping instead of a binder error pointing at `Split-Path`), and only
          # the third is a hole it actually closes. That third case is exactly the
          # one a `-ne ''` gate passes straight through, which is why the test is
          # `IsNullOrWhiteSpace` (#1213). The blank reaches a cmdlet binder here
          # before it ever reaches the native `pwsh -File` call, which is why
          # L214's argument-drop never gets a chance to fire.
          if ([string]::IsNullOrWhiteSpace($env:IN_CLIENTS_OUTPUT)) {
            Write-Output '::error::IN_CLIENTS_OUTPUT is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank clients_output. Refusing to call whmcs-clients-export.ps1 with an empty -OutputFile.'
            exit 1
          }

          $out = $env:IN_CLIENTS_OUTPUT
          $dir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($dir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          & pwsh -NoProfile -File .\scripts\whmcs-clients-export.ps1 -ApiUrl $env:WHMCS_API_URL -OutputFile $out

          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS clients export failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $out)) {
            throw "Expected output file not found: $out"
          }

      - name: Export transactions (read-only)
        shell: pwsh
        env:
          WHMCS_API_URL: ${{ inputs.api_url }}
          # #1080 lane 21 — see the "Export clients" step for the measurement.
          # `max_rows` / `start_date` / `end_date` are the three inputs in this
          # job whose blank IS legitimate and documented (`start_date` and
          # `end_date` default to `''`), so they keep the gated-append remedy
          # rather than failing closed: the flag is omitted and the callee's own
          # default applies. That is the L254 distinction — a fail-closed `exit 1`
          # is the wrong remedy wherever a blank is a routine dispatch.
          IN_TRANSACTIONS_OUTPUT: ${{ inputs.transactions_output }}
          IN_MAX_ROWS: ${{ inputs.max_rows }}
          IN_START_DATE: ${{ inputs.start_date }}
          IN_END_DATE: ${{ inputs.end_date }}
        run: |
          $ErrorActionPreference = 'Stop'

          # `api_url` is `required: false`, so a dispatch that omits or blanks it leaves
          # this empty; default to the APIM gateway so the call stays on the static-IP
          # path (not the IP-restricted origin), matching 209/210/219/221/225/226/228.
          # That default is also what keeps the bare `$env:WHMCS_API_URL` below from
          # vanishing as an ARGUMENT and shifting every later parameter one position
          # left (ledger L214) — an empty value is no argument at all, so `-ApiUrl`
          # would bind the next `-Switch` and the failure would read as a call-signature
          # problem for what is really a missing value.
          if ([string]::IsNullOrWhiteSpace($env:WHMCS_API_URL)) {
            $env:WHMCS_API_URL = 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          }

          # Fail closed (#1213, ledger L214) — see the "Export clients" step.
          if ([string]::IsNullOrWhiteSpace($env:IN_TRANSACTIONS_OUTPUT)) {
            Write-Output '::error::IN_TRANSACTIONS_OUTPUT is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank transactions_output. Refusing to call whmcs-transactions-export.ps1 with an empty -OutputFile.'
            exit 1
          }

          $out = $env:IN_TRANSACTIONS_OUTPUT
          $dir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($dir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          $args = @(
            '-ApiUrl', $env:WHMCS_API_URL,
            '-OutputFile', $out
          )

          # `[string]` cast before `.Trim()`. Measured on pwsh 7.4.6 (Linux — this
          # job runs on windows-latest, and that half is documented behaviour
          # rather than something a Linux sandbox can measure, so it is stated as
          # the weaker claim):
          #
          #   $env:X where X=''      -> ''      (.Trim() is fine)
          #   $env:X where X is UNSET -> $null  (.Trim() is a TERMINATING
          #                                      RuntimeException under 'Stop')
          #   ([string]$null).Trim()  -> ''     (what this line does)
          #
          # So the cast is not decoration: a deleted or misspelled `env:` mapping
          # turns a legitimately blank filter into a failed export, and the error
          # names `.Trim()` on a null rather than the mapping that is missing.
          # On Windows an empty value is additionally indistinguishable from an
          # unset one, so the same reference is expected to hit the $null branch
          # for a blank dispatch there — the cast covers both without depending on
          # which platform is right.
          $maxRows = ([string]$env:IN_MAX_ROWS).Trim()
          if (-not [string]::IsNullOrWhiteSpace($maxRows)) {
            $args += @('-MaxRows', $maxRows)
          }

          $startDate = ([string]$env:IN_START_DATE).Trim()
          if (-not [string]::IsNullOrWhiteSpace($startDate)) {
            $args += @('-StartDate', $startDate)
          }

          $endDate = ([string]$env:IN_END_DATE).Trim()
          if (-not [string]::IsNullOrWhiteSpace($endDate)) {
            $args += @('-EndDate', $endDate)
          }

          & pwsh -NoProfile -File .\scripts\whmcs-transactions-export.ps1 @args

          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS transactions export failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $out)) {
            throw "Expected output file not found: $out"
          }

      - name: Export invoices (read-only)
        if: ${{ inputs.include_zero_invoices }}
        shell: pwsh
        env:
          WHMCS_API_URL: ${{ inputs.api_url }}
          # #1080 lane 21 — see the "Export clients" step for the measurement.
          IN_INVOICES_OUTPUT: ${{ inputs.invoices_output }}
          IN_START_DATE: ${{ inputs.start_date }}
          IN_END_DATE: ${{ inputs.end_date }}
        run: |
          $ErrorActionPreference = 'Stop'

          # `api_url` is `required: false`, so a dispatch that omits or blanks it leaves
          # this empty; default to the APIM gateway so the call stays on the static-IP
          # path (not the IP-restricted origin), matching 209/210/219/221/225/226/228.
          # That default is also what keeps the bare `$env:WHMCS_API_URL` below from
          # vanishing as an ARGUMENT and shifting every later parameter one position
          # left (ledger L214) — an empty value is no argument at all, so `-ApiUrl`
          # would bind the next `-Switch` and the failure would read as a call-signature
          # problem for what is really a missing value.
          if ([string]::IsNullOrWhiteSpace($env:WHMCS_API_URL)) {
            $env:WHMCS_API_URL = 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          }

          # Fail closed (#1213, ledger L214) — see the "Export clients" step.
          if ([string]::IsNullOrWhiteSpace($env:IN_INVOICES_OUTPUT)) {
            Write-Output '::error::IN_INVOICES_OUTPUT is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank invoices_output. Refusing to call whmcs-invoices-export.ps1 with an empty -OutputFile.'
            exit 1
          }

          $out = $env:IN_INVOICES_OUTPUT
          $dir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($dir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          $args = @(
            '-ApiUrl', $env:WHMCS_API_URL,
            '-OutputFile', $out
          )

          # `[string]` cast before `.Trim()` — see the "Export transactions" step.
          $startDate = ([string]$env:IN_START_DATE).Trim()
          if (-not [string]::IsNullOrWhiteSpace($startDate)) {
            $args += @('-StartDate', $startDate)
          }

          $endDate = ([string]$env:IN_END_DATE).Trim()
          if (-not [string]::IsNullOrWhiteSpace($endDate)) {
            $args += @('-EndDate', $endDate)
          }

          & pwsh -NoProfile -File .\scripts\whmcs-invoices-export.ps1 @args
          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS invoices export failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $out)) {
            throw "Expected output file not found: $out"
          }

      - name: Lookup invoices for deleted clients (userid=0)
        shell: pwsh
        env:
          WHMCS_API_URL: ${{ inputs.api_url }}
          # #1080 lane 21 — see the "Export clients" step for the measurement.
          IN_TRANSACTIONS_OUTPUT: ${{ inputs.transactions_output }}
        run: |
          $ErrorActionPreference = 'Stop'

          # `api_url` is `required: false`, so a dispatch that omits or blanks it leaves
          # this empty; default to the APIM gateway so the call stays on the static-IP
          # path (not the IP-restricted origin), matching 209/210/219/221/225/226/228.
          # That default is also what keeps the bare `$env:WHMCS_API_URL` below from
          # vanishing as an ARGUMENT and shifting every later parameter one position
          # left (ledger L214) — an empty value is no argument at all, so `-ApiUrl`
          # would bind the next `-Switch` and the failure would read as a call-signature
          # problem for what is really a missing value.
          if ([string]::IsNullOrWhiteSpace($env:WHMCS_API_URL)) {
            $env:WHMCS_API_URL = 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          }

          # Fail closed (#1213, ledger L214) — see the "Export clients" step. A
          # blank here would make `Test-Path` throw a parameter-binding error
          # naming the callee rather than the missing mapping that caused it.
          if ([string]::IsNullOrWhiteSpace($env:IN_TRANSACTIONS_OUTPUT)) {
            Write-Output '::error::IN_TRANSACTIONS_OUTPUT is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank transactions_output. Refusing to look up deleted-client invoices without the transactions CSV.'
            exit 1
          }

          $txPath = $env:IN_TRANSACTIONS_OUTPUT
          if (-not (Test-Path $txPath)) {
            throw "Transactions CSV not found: $txPath"
          }

          $out = 'artifacts/whmcs/whmcs_invoices_deleted_clients.csv'
          $outDir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }

          $invoiceIds = @(Import-Csv -LiteralPath $txPath |
            Where-Object { $_.userid -eq '0' -and -not [string]::IsNullOrWhiteSpace($_.invoiceid) } |
            Select-Object -ExpandProperty invoiceid -Unique |
            ForEach-Object { $_.ToString().Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

          if ($invoiceIds.Count -eq 0) {
            Write-Host 'No userid=0 invoices found; skipping invoice lookup.'
            # Create an empty CSV with headers so the artifact upload is predictable.
            @([pscustomobject]@{ invoiceid=''; userid=''; status=''; date=''; duedate=''; total=''; paymentmethod=''; firstname=''; lastname=''; companyname=''; email=''; address1=''; address2=''; city=''; state=''; postcode=''; country='' }) |
              Export-Csv -NoTypeInformation -Encoding utf8 -Path $out
            exit 0
          }

          $tmpIds = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'deleted_client_invoice_ids.txt'
          $invoiceIds | Sort-Object -Unique | Set-Content -LiteralPath $tmpIds -Encoding utf8

          & pwsh -NoProfile -File .\scripts\whmcs-invoices-lookup.ps1 -ApiUrl $env:WHMCS_API_URL -InvoiceIdFile $tmpIds -OutputFile $out
          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS invoice lookup failed with exit code $LASTEXITCODE."
          }

          $count = (Import-Csv -LiteralPath $out | Where-Object { $_.invoiceid -and $_.status -ne 'ERROR' }).Count
          "- Deleted-client invoices looked up: $count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Install ImportExcel (for .xlsx output)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ImportExcel -Scope CurrentUser -Force

      - name: Generate Zeffy payments import draft
        shell: pwsh
        env:
          # #1080 lane 21 — see the "Export clients" step for the measurement.
          # This is the widest body in the job: five path inputs feed the
          # generator's argument list, so one dispatched payload executed here
          # five times over.
          IN_CLIENTS_OUTPUT: ${{ inputs.clients_output }}
          IN_TRANSACTIONS_OUTPUT: ${{ inputs.transactions_output }}
          IN_INVOICES_OUTPUT: ${{ inputs.invoices_output }}
          IN_ZEFFY_OUTPUT: ${{ inputs.zeffy_output }}
          IN_ZEFFY_OUTPUT_XLSX: ${{ inputs.zeffy_output_xlsx }}
          IN_MAX_ROWS_PER_FILE: ${{ inputs.max_rows_per_file }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Fail closed (#1213, ledger L214) — see the "Export clients" step. All
          # FIVE are file paths and a blank is not legitimate for any of them, but
          # they are not all the same KIND of path: the generator READS three
          # (`-ClientsCsv`, `-TransactionsCsv`, `-InvoicesCsv`) and WRITES two
          # (`-OutputFile`, `-XlsxOutputFile`). Both directions are guarded here
          # because both are equally blank-able — a blank read path fails at
          # `Test-Path`/`Import-Csv` and a blank write path at the export, and
          # neither should get as far as spending the credential.
          # `invoices_output` is consumed only behind the `include_zero_invoices`
          # boolean and is still checked, because the check runs before the branch.
          foreach ($name in @('IN_CLIENTS_OUTPUT', 'IN_TRANSACTIONS_OUTPUT', 'IN_INVOICES_OUTPUT', 'IN_ZEFFY_OUTPUT', 'IN_ZEFFY_OUTPUT_XLSX')) {
            if ([string]::IsNullOrWhiteSpace([System.Environment]::GetEnvironmentVariable($name))) {
              Write-Output "::error::$name is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank value. Refusing to call zeffy-payments-import-draft.ps1 with an empty path."
              exit 1
            }
          }

          $clients = $env:IN_CLIENTS_OUTPUT
          $tx = $env:IN_TRANSACTIONS_OUTPUT
          $invoices = $env:IN_INVOICES_OUTPUT
          $out = $env:IN_ZEFFY_OUTPUT
          $outXlsx = $env:IN_ZEFFY_OUTPUT_XLSX

          function Get-ZeffyOutputFiles {
            param([string]$BaseOutputFile)

            $dir = Split-Path -Parent $BaseOutputFile
            if ([string]::IsNullOrWhiteSpace($dir)) { $dir = '.' }

            $baseName = [System.IO.Path]::GetFileNameWithoutExtension($BaseOutputFile)

            $single = @()
            if (Test-Path -LiteralPath $BaseOutputFile) {
              $single = @($BaseOutputFile)
            }

            $parts = @(Get-ChildItem -Path $dir -Filter "$baseName-part*.csv" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)

            if ($single.Count -gt 0 -and $parts.Count -eq 0) {
              return $single
            }

            if ($parts.Count -gt 0) {
              return ($parts | Sort-Object)
            }

            return @()
          }

          $dir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($dir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          # Gated append, not fail-closed: a blank cap is legitimate and the
          # generator's own default applies. `[string]` cast — see "Export
          # transactions".
          $maxRowsPerFile = ([string]$env:IN_MAX_ROWS_PER_FILE).Trim()
          $genArgs = @(
            '-ClientsCsv', $clients,
            '-TransactionsCsv', $tx,
            '-OutputFile', $out,
            '-FailOnValidationErrors',
            '-WriteXlsx',
            '-XlsxOutputFile', $outXlsx
          )

          $includeZeroInvoices = "${{ inputs.include_zero_invoices }}".Trim().ToLowerInvariant() -eq 'true'
          if ($includeZeroInvoices -and (Test-Path -LiteralPath $invoices)) {
            $genArgs += @('-InvoicesCsv', $invoices, '-IncludeZeroInvoices')
          }
          if (-not [string]::IsNullOrWhiteSpace($maxRowsPerFile)) {
            $genArgs += @('-MaxRowsPerFile', $maxRowsPerFile)
          }

          & pwsh -NoProfile -File .\scripts\zeffy-payments-import-draft.ps1 @genArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Zeffy draft generation failed with exit code $LASTEXITCODE."
          }

          $files = Get-ZeffyOutputFiles -BaseOutputFile $out
          if (-not $files -or $files.Count -eq 0) {
            throw "Expected Zeffy output file(s) not found. Base: $out"
          }

          # Optional: summarize invoice-derived rows (e.g., $0 invoices) so it's obvious what was added.
          if ($includeZeroInvoices -and (Test-Path -LiteralPath $invoices)) {
            function Get-FirstNumber {
              param([string]$Text)
              if ([string]::IsNullOrWhiteSpace($Text)) { return $null }
              $m = [regex]::Match($Text, '-?\d+(?:\.\d+)?')
              if (-not $m.Success) { return $null }
              return $m.Value
            }

            $txInvoiceIds = @{}
            foreach ($r in (Import-Csv -LiteralPath $tx)) {
              if ($r.invoiceid -and -not [string]::IsNullOrWhiteSpace($r.invoiceid)) {
                $txInvoiceIds[$r.invoiceid.ToString().Trim()] = $true
              }
            }

            $zeroTotal = 0
            $zeroWithTx = 0
            $zeroEligible = 0
            foreach ($inv in (Import-Csv -LiteralPath $invoices)) {
              if (-not $inv.invoiceid) { continue }
              $n = Get-FirstNumber -Text $inv.total
              if ($null -eq $n) { continue }
              $v = $null
              try { $v = [decimal]::Parse($n, [System.Globalization.NumberStyles]::Any, [System.Globalization.CultureInfo]::InvariantCulture) } catch { $v = $null }
              if ($v -ne 0) { continue }
              $zeroTotal++
              $id = $inv.invoiceid.ToString().Trim()
              if ($txInvoiceIds.ContainsKey($id)) {
                $zeroWithTx++
              }
              else {
                $zeroEligible++
              }
            }

            "- include_zero_invoices: true" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- $0 invoices found: $zeroTotal" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- $0 invoices skipped (already had transaction): $zeroWithTx" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- $0 invoices appended (invoice-only): $zeroEligible" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          elseif ($includeZeroInvoices) {
            "- include_zero_invoices: true (invoices file missing; none added)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          else {
            "- include_zero_invoices: false" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          $envBlock = @()
          $envBlock += 'ZEFFY_OUTPUT_FILES<<EOF'
          $envBlock += ($files -join "`n")
          $envBlock += 'EOF'
          $envBlock -join "`n" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Zeffy CSV headers
        shell: pwsh
        env:
          # #1080 lane 21 — see the "Export clients" step for the measurement.
          # This site is the one that would survive a careless lane: it is 150
          # lines below the generator, in a step whose other inputs all arrive
          # through GITHUB_ENV, so a reader fixing "the generator" misses it.
          IN_ZEFFY_OUTPUT_XLSX: ${{ inputs.zeffy_output_xlsx }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:ZEFFY_OUTPUT_FILES)) {
            throw 'Missing ZEFFY_OUTPUT_FILES from previous step.'
          }

          $files = @($env:ZEFFY_OUTPUT_FILES -split "`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($files.Count -eq 0) {
            throw 'ZEFFY_OUTPUT_FILES was empty.'
          }

          $expected = 'firstName,lastName,amount,address,city,postalCode,country,type,formTitle,rateTitle,email,language,date (MM/DD/YYYY),state/province,paymentMethod,receiptUrl,ticketUrl,receiptNumber,companyName,note,annotation'

          $totalRows = 0
          foreach ($f in $files) {
            $actual = (Get-Content -LiteralPath $f -TotalCount 1) -replace '^\uFEFF',''
            $actual = $actual.Trim() -replace '^"','' -replace '"$',''
            $actual = $actual -replace '","',','

            if ($actual -ne $expected) {
              throw "Zeffy CSV header mismatch in file '$f'. Expected: $expected  Actual: $actual"
            }

            try {
              $count = (Import-Csv -LiteralPath $f).Count
              $totalRows += $count
            }
            catch {
              throw "Failed to count rows in '$f': $($_.Exception.Message)"
            }
          }

          "## WHMCS -> Zeffy import draft" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Zeffy output files: $($files.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Total Zeffy rows: $totalRows" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($f in $files) {
            "  - $f" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # Fail closed (#1213, ledger L214) — see the "Export clients" step.
          if ([string]::IsNullOrWhiteSpace($env:IN_ZEFFY_OUTPUT_XLSX)) {
            Write-Output '::error::IN_ZEFFY_OUTPUT_XLSX is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank zeffy_output_xlsx. Refusing to enumerate .xlsx outputs from an empty base path.'
            exit 1
          }

          $xlsxBase = $env:IN_ZEFFY_OUTPUT_XLSX
          $xlsxDir = Split-Path -Parent $xlsxBase
          if ([string]::IsNullOrWhiteSpace($xlsxDir)) { $xlsxDir = '.' }
          $xlsxBaseName = [System.IO.Path]::GetFileNameWithoutExtension($xlsxBase)
          $xlsxSingle = @()
          if (Test-Path -LiteralPath $xlsxBase) {
            $xlsxSingle = @($xlsxBase)
          }
          $xlsxParts = @(Get-ChildItem -Path $xlsxDir -Filter "$xlsxBaseName-part*.xlsx" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $xlsxFiles = @($xlsxSingle + $xlsxParts)

          if ($xlsxFiles.Count -gt 0) {
            "- Zeffy .xlsx files: $($xlsxFiles.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            foreach ($x in ($xlsxFiles | Sort-Object)) {
              "  - $x" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

          "- Sanitization: companyName strips double-quotes; person names strip digits/unsupported chars" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path -LiteralPath 'artifacts/zeffy/zeffy_payments_import_draft.transforms_companyName.md') {
            "- Transforms report: artifacts/zeffy/zeffy_payments_import_draft.transforms_companyName.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if (Test-Path -LiteralPath 'artifacts/zeffy/zeffy_payments_import_draft.transforms_personName.md') {
            "- Transforms report: artifacts/zeffy/zeffy_payments_import_draft.transforms_personName.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "- Download: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Artifacts: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)/artifacts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload WHMCS clients
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: whmcs_clients
          path: ${{ inputs.clients_output }}
          if-no-files-found: warn

      - name: Upload WHMCS transactions
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: whmcs_transactions
          path: ${{ inputs.transactions_output }}
          if-no-files-found: warn

      - name: Upload WHMCS invoices
        if: ${{ always() && inputs.include_zero_invoices }}
        uses: actions/upload-artifact@v7
        with:
          name: whmcs_invoices
          path: ${{ inputs.invoices_output }}
          if-no-files-found: warn

      - name: Upload WHMCS deleted-client invoices
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: whmcs_invoices_deleted_clients
          path: artifacts/whmcs/whmcs_invoices_deleted_clients.csv
          if-no-files-found: warn

      - name: Upload Zeffy draft
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: zeffy_payments_import_draft
          path: |
            ${{ inputs.zeffy_output }}
            ${{ inputs.zeffy_output_xlsx }}
            artifacts/zeffy/*-part*.csv
            artifacts/zeffy/*-part*.xlsx
          if-no-files-found: warn

      - name: Upload Zeffy validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: zeffy_validation_report
          path: |
            artifacts/zeffy/zeffy_payments_import_draft.validation_errors.csv
            artifacts/zeffy/zeffy_payments_import_draft.validation_errors.md
          if-no-files-found: warn

      - name: Upload Zeffy transforms report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: zeffy_transforms_report
          path: |
            artifacts/zeffy/zeffy_payments_import_draft.transforms_companyName.csv
            artifacts/zeffy/zeffy_payments_import_draft.transforms_companyName.md
            artifacts/zeffy/zeffy_payments_import_draft.transforms_personName.csv
            artifacts/zeffy/zeffy_payments_import_draft.transforms_personName.md
          if-no-files-found: warn
