name: '502. Google - Analytics Report (GA4 -> JSON) [GOOGLE]'
run-name: 'Google Analytics Report'

# Read-only GA4 reporting for the FFC primary sites. Generates aggregate JSON per site and delivers
# it to FreeForCharity/FFC-IN-ffcadmin.org as a reviewable PR (never a direct push). PII-safe:
# aggregate metrics only. Requires the google-prod-read environment (report) and the ungated
# github-prod-read environment (delivery, #834) + the Wave 0 foundation. Opening the PR is reporting
# plumbing, not a Write — the data this workflow consumes is a Read. The delivery PAT comes from Key
# Vault (`read-all-cbm-github-pat`) over OIDC on the READER identity, never a GitHub secret — #844.

on:
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '28'
        type: string

# cancel-in-progress: false (#834). Its entire justification (#722) was that these
# daily runs parked at an approval gate and piled up ~12-deep until janitor 734
# reaped them at 7 days. Ungated on github-prod-read, nothing ever waits, so the
# only run it could still cancel is an EXECUTING one — the trade-off #722 accepted
# as the lesser evil becomes pure downside. Ref-scoped so a dispatch from a PR
# branch can never collide with main's scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-supersede
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Fail-closed connectivity gate: prove OIDC -> KV -> GA4 before generating any report.
  smoke:
    uses: ./.github/workflows/501-google-api-smoke.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  report:
    needs: smoke
    runs-on: windows-latest
    environment: google-prod-read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate required Azure secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_KV_CLIENT_ID is not set (environment: google-prod-read)"; exit 1;
          fi
          if [ -z "${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_TENANT_ID is not set (environment: google-prod-read)"; exit 1;
          fi

      - uses: ./.github/actions/google-secrets-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Seed time-series history from ffcadmin (public repo, no auth)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'ga-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($site in @('freeforcharity.org', 'ffcadmin.org')) {
            $url = "https://raw.githubusercontent.com/FreeForCharity/FFC-IN-ffcadmin.org/main/public/data/google-analytics/$site.timeseries.json"
            try {
              Invoke-WebRequest -Uri $url -OutFile (Join-Path $out "$site.timeseries.json") -ErrorAction Stop
              Write-Host "Seeded history for $site"
            } catch {
              Write-Host "No existing history for $site (first run) - starting fresh"
            }
          }

      - name: Generate GA reports (both primary sites)
        shell: pwsh
        env:
          DAYS: ${{ inputs.days != '' && inputs.days || '28' }}
          FFC_PROP: ${{ vars.GA_PROPERTY_ID_PRIMARY }}
          ADMIN_PROP: ${{ vars.GA_PROPERTY_ID_FFCADMIN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'ga-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $days = [int]$env:DAYS
          if (-not $env:FFC_PROP) { throw 'vars.GA_PROPERTY_ID_PRIMARY is not set.' }
          & pwsh -NoProfile -File scripts/google-analytics-report.ps1 -SiteLabel 'freeforcharity.org' -PropertyId $env:FFC_PROP -Days $days -Hostname 'freeforcharity.org' -OutPath (Join-Path $out 'freeforcharity.org.json')
          if ($env:ADMIN_PROP) {
            & pwsh -NoProfile -File scripts/google-analytics-report.ps1 -SiteLabel 'ffcadmin.org' -PropertyId $env:ADMIN_PROP -Days $days -Hostname 'ffcadmin.org' -OutPath (Join-Path $out 'ffcadmin.org.json')
          } else {
            Write-Host '::warning::vars.GA_PROPERTY_ID_FFCADMIN not set; skipping ffcadmin.org'
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ga-reports
          path: ga-out/*.json
          if-no-files-found: error

  deliver:
    needs: report
    runs-on: ubuntu-latest
    environment: github-prod-read
    steps:
      # Checkout gives the deliver job the current workflow catalog so the public
      # copies on ffcadmin (src/data render + /data stable URL) refresh in the
      # same daily PR as the GA data — one reviewable sync pipe (backlog #554).
      - uses: actions/checkout@v7.0.1

      # Same preflight the `report` job runs for google-prod-read, now that
      # `deliver` authenticates too (#834). Without it a missing identifier
      # surfaces inside azure/login as a blank client-id, after the whole GA
      # pipeline has already run.
      - name: Validate required Azure OIDC identifiers
        shell: bash
        run: |
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_KV_CLIENT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_TENANT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name read-all-cbm-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::read-all-cbm-github-pat came back empty from Key Vault — check the reader identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::read-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::read-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::read-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          name: ga-reports
          path: ga-out

      # Generate the Agentic OS status feed (backlog #723) so it rides the same
      # daily sync PR as the GA data + workflow catalog — one reviewable pipe,
      # no new gate. REST-only, PII-safe aggregates; the PAT just reads here.
      - name: Generate Agentic OS status feed
        run: |
          set -euo pipefail
          python3 scripts/generate-agentic-os-status.py --output agentic-os-status.json

      - name: Open/update daily data-sync PR into FFC-IN-ffcadmin.org
        run: |
          set -euo pipefail
          git config --global user.name 'ffc-automation[bot]'
          git config --global user.email 'automation@freeforcharity.org'
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/FreeForCharity/FFC-IN-ffcadmin.org.git" target
          cd target
          # True idempotency: base on the existing sync branch when it exists, so a re-run
          # with identical content produces no new commit and no PR churn.
          if git fetch origin chore/ga-data-sync --depth 1 2>/dev/null; then
            # Shallow single-branch clone: the fetch lands only in FETCH_HEAD —
            # no origin/chore/ga-data-sync tracking ref is created.
            git checkout -B chore/ga-data-sync FETCH_HEAD
          else
            git checkout -B chore/ga-data-sync
          fi
          mkdir -p public/data/google-analytics src/data public/data
          cp ../ga-out/*.json public/data/google-analytics/
          cp ../docs/workflow-catalog.json src/data/workflow-catalog.json
          cp ../docs/workflow-catalog.json public/data/workflow-catalog.json
          # Agentic OS status feed for the /agentic-os page. ONE copy: the page
          # fetches assetPath('/data/agentic-os-status.json'), i.e. public/.
          # The src/ copy this used to write was dead and was deleted by
          # FFC-IN-ffcadmin.org#904; writing it here would resurrect it on the
          # first run after #848 is fixed, months after anyone remembered why.
          cp ../agentic-os-status.json public/data/agentic-os-status.json
          git add public/data src/data/workflow-catalog.json
          if git diff --cached --quiet; then echo 'No data changes vs the sync branch; skipping.'; exit 0; fi
          git commit -m "chore(data): daily sync — GA metrics + time-series + workflow catalog + agentic-os status ($(date -u +%F))"
          git push origin chore/ga-data-sync
          # Only skip creation when an OPEN PR already exists for the branch.
          # `gh pr view <branch>` resolves the most recent PR in ANY state, so
          # after the first sync PR merges (branch left undeleted) it matches the
          # merged PR and the daily PR is never opened again (#737). List by
          # head + open-state instead, which returns nothing once the prior PR
          # has merged.
          if [ -z "$(gh pr list --repo FreeForCharity/FFC-IN-ffcadmin.org --head chore/ga-data-sync --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo FreeForCharity/FFC-IN-ffcadmin.org --base main --head chore/ga-data-sync \
              --title 'chore(data): daily data sync (GA + workflow catalog + agentic-os status)' \
              --body 'Automated daily sync from FFC-Cloudflare-Automation (502): GA4 aggregate metrics + time-series for the primary sites, the generated workflow catalog for /automation + the stable /data URL, and the Agentic OS status feed for /agentic-os. PII-safe aggregates only.'
          fi
          # Best-effort auto-merge so the daily PR lands once ffcadmin checks pass
          # (no-op when auto-merge is unavailable on the repo).
          gh pr merge chore/ga-data-sync --repo FreeForCharity/FFC-IN-ffcadmin.org --merge --auto \
            || echo 'auto-merge unavailable; PR awaits manual merge'
