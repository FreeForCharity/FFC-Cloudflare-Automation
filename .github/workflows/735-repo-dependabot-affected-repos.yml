name: '735. Repo - Dependabot Affected Repos [Org]'
run-name: 'Dependabot Affected Repos'

# Regenerates data/dependabot-affected-repos.json (the org repo inventory that
# feeds the smoke-protected Dependabot waves) and delivers it as an auto-merging
# PR. Migrated from FFC-IN-ClarkeMoyerAdmin. Runs on the UNGATED github-prod-read
# lane (#834): the org inventory it consumes is a Read, and a weekly gated run
# fires at 06:15 UTC with nobody watching. It still needs a real PAT — a PR opened
# by GITHUB_TOKEN does not trigger the pull_request checks / Copilot review this
# repo requires, so it would never satisfy branch protection. Two PATs come from
# Key Vault over OIDC on the READER identity, never GitHub secrets (#844), split
# by what they do (#848): `read-all-cbm-ffc-copilot-mcp-github-pat` for the org
# inventory READ, and `wr-all-cbm-datasync-github-pat` (fine-grained, this repo +
# FFC-IN-ffcadmin.org only, Contents + Pull requests RW) for the PR. A writer PAT
# on the ungated lane is a Clarke ruling (2026-09-28, #848): it cannot reach main
# (merge queue) and can only open PRs that still pass CI. Read-only against the org.

on:
  schedule:
    # Weekly, Monday 06:15 UTC
    - cron: '15 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # Required for the OIDC exchange that fetches the PAT from Key Vault (#844).
  id-token: write

# Serialize: a manual dispatch overlapping the weekly run (or two dispatches)
# would otherwise both force-push the fixed data/dependabot-affected-repos
# branch and clobber each other's PR.
concurrency:
  group: dependabot-affected-repos
  cancel-in-progress: false

jobs:
  update:
    name: Update repo inventory
    runs-on: ubuntu-latest
    environment: github-prod-read
    steps:
      # Fail fast on a half-provisioned lane — see the same note in 726.
      # Especially valuable here: this is a WEEKLY run, so a silent
      # mis-provisioning would otherwise be rediscovered next Monday.
      - name: Validate required Azure OIDC identifiers
        shell: bash
        run: |
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_KV_CLIENT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_TENANT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      # READ PAT first: it exports GH_TOKEN, which the inventory script's `gh` uses.
      - name: Load the read PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name read-all-cbm-ffc-copilot-mcp-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault — check the reader identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      # WRITE PAT (#848): only the PR steps below use it (GH_WRITE_TOKEN).
      - name: Load the write PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name wr-all-cbm-datasync-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-datasync-github-pat came back empty from Key Vault — check the reader identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Same liveness probe as the read step above (#1102); see the rationale there.
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-datasync-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-datasync-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-datasync-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHWRITE_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_WRITE_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Regenerate dependabot-affected-repos.json
        shell: pwsh
        env:
          NO_COLOR: '1'
        run: |
          ./scripts/Update-DependabotAffectedRepos.ps1 -Org FreeForCharity

      - name: Create pull request (if changed)
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # The WRITE PAT, from the "Load the write PAT" step above (#848).
          token: ${{ env.GH_WRITE_TOKEN }}
          commit-message: 'chore(data): refresh dependabot affected repos'
          title: 'chore(data): refresh dependabot affected repos'
          body: |
            Automated weekly refresh of `data/dependabot-affected-repos.json`.

            Generated by `scripts/Update-DependabotAffectedRepos.ps1`.
          branch: 'data/dependabot-affected-repos'
          delete-branch: true
          add-paths: |
            data/dependabot-affected-repos.json

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        # No explicit merge method: main has a merge-queue ruleset, which
        # rejects `--merge`/`--squash`/`--rebase` ("the merge strategy for
        # main is set by the merge queue"). Let the queue pick the method.
        #
        # GraphQL directly, not `gh pr merge --auto` (#848): gh only omits the
        # method when it can SEE the merge queue, and the narrow 2-repo writer
        # PAT cannot read the repo's queue settings, so gh demanded
        # "--merge, --rebase, or --squash required when not running
        # interactively" (run 36441804009) -- the one flag the queue refuses.
        # enablePullRequestAutoMerge with no mergeMethod is what gh sends when
        # it does see the queue; the queue picks the method server-side.
        #
        # Auto-merge can only be ARMED on a PR that is still waiting on
        # something. A PR that is already mergeable is refused with "Pull
        # request is in clean status" (run 36442814848) and must be enqueued
        # directly instead -- gh's `--auto` makes the same switch internally.
        env:
          GH_TOKEN: ${{ env.GH_WRITE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          pr_id="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .node_id)"
          if out="$(gh api graphql \
            -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id}) { pullRequest { number } } }' \
            -f id="$pr_id" 2>&1)"; then
            echo "Auto-merge armed on #${PR_NUMBER}; the queue takes it once checks pass."
            exit 0
          fi
          if ! grep -q 'clean status' <<<"$out"; then
            echo "$out"
            echo "::error::Could not arm auto-merge on #${PR_NUMBER} (see the GraphQL error above)."
            exit 1
          fi
          gh api graphql \
            -f query='mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
            -f id="$pr_id"
          echo "#${PR_NUMBER} was already mergeable, so it was enqueued directly."
