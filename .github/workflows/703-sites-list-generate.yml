name: '703. Sites List - Generate (CSV + JSON) [GH]'
run-name: 'Generate Sites List'

# Generates the merged FFC sites list from the WHMCS / Cloudflare / WPMUDEV
# exports plus the curated base list, runs per-domain health checks, and
# commits both sites-list/sites_list.csv and sites-list/sites_list.json.
#
# This repo owns the export environments (whmcs-prod, cloudflare-prod-read,
# wpmudev-prod) and the GitHub PAT (CBM_TOKEN in github-prod) needed to
# dispatch the sibling export workflows, so generation lives here. Downstream
# consumers (e.g. ffcadmin.org) pull the published files from this repo.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Mondays at 08:00 UTC

permissions:
  contents: write
  pull-requests: write
  # Required for the Key Vault OIDC exchange (#844).
  id-token: write

# Prevent a manual run and the scheduled run from regenerating / pushing to main
# at the same time.
concurrency:
  group: sites-list-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      # A scheduled run's default checkout is pinned to the SHA the run was
      # CREATED at, not the SHA it eventually runs at. This job waits on the
      # `github-prod` approval gate, which a cron cannot answer itself, so that
      # SHA is as old as the wait -- and `peter-evans/create-pull-request` below
      # branches from whatever is checked out.
      #
      # Measured 2026-09-07: run 11 was created 08-31 and approved seven days
      # later. Its checkout was `2ceb54d`, so the data PR (#1249) opened 133
      # commits behind `main` and Phantom Revert Guard failed it at a threshold
      # of 5 -- a green generation that could not be merged without a manual
      # update-branch. Every week this gate is answered late, this recurs.
      #
      # `ref: main` resolves at checkout time, so the branch is cut from `main`
      # as it stands when the data is actually generated. It also means the
      # generator script that runs is the current one rather than a week-old
      # copy, which is the same freshness argument.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        id: load_pat
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"
      - name: Collect export artifacts (dispatch the ungated, reuse the gated)
        env:
          REPO: ${{ github.repository }}
          # Age past which a reused export is called out rather than used quietly.
          # Two missed weekly cycles: one skipped approval is routine, three weeks
          # of stale WPMUDEV membership flags is something to know about.
          STALE_EXPORT_DAYS: '14'
        run: |
          set -euo pipefail

          # 201 and 108 are ungated read lanes (`whmcs-prod-read`,
          # `cloudflare-prod-read`), so dispatching them and waiting costs
          # nothing but the minute they take.
          #
          # 601 is NOT dispatched HERE. It sits on `wpmudev-prod`, which has a
          # required reviewer, so dispatching it from inside this already-gated
          # job produced a SECOND approval prompt ~10 minutes after this job's
          # own was granted — and `gh run watch` below then blocked on a human
          # who had already walked away, until the step timed out and wasted the
          # approval spent on this run. This job now reuses 601's most recent
          # SUCCESSFUL export and dispatches the next one from the LAST step of
          # the job, so nothing here waits on that second approval.
          #
          # NOTE: both display names AND file names get renumbered periodically,
          # so keep these in sync with .github/workflows/ (last synced 2026-09-08).
          for wf in 201-whmcs-export-domains.yml 108-export-summary.yml; do
            echo "Dispatching $wf on main ..."
            gh workflow run "$wf" --repo "$REPO" --ref main
          done

          # Give the dispatched runs time to register before querying them.
          sleep 30

          # Wait for each run and download its artifact. A failed export is a
          # warning, not a hard failure: the generator preserves existing
          # membership flags when a source artifact is absent.
          download_latest () {
            local wf="$1" artifact="$2" dir="$3" run_id
            # Narrow to workflow_dispatch runs on `main`, which is where the loop
            # above dispatches. `--event` alone excludes a concurrent scheduled
            # run but NOT a dispatch from someone's feature branch, so without
            # `--branch main` this lane had the same defect as the reuse lane
            # below: feature-branch export data published in the sites list
            # through a run that looks entirely normal (raised in review, #1255).
            #
            # This narrows the window rather than closing it -- `--limit 1` still
            # takes the newest matching run, which a manual dispatch on `main`
            # racing this one could win. Both candidates are then main's own
            # export, so the cost is staleness, not unreviewed data.
            run_id=$(gh run list --workflow "$wf" --repo "$REPO" --event workflow_dispatch --branch main \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "::warning::No workflow_dispatch run found for $wf; continuing without its data."
              return 0
            fi
            echo "Waiting for $wf run $run_id ..."
            if ! gh run watch "$run_id" --repo "$REPO" --exit-status; then
              echo "::warning::$wf run $run_id did not succeed; continuing without its data."
              return 0
            fi
            gh run download "$run_id" --repo "$REPO" --name "$artifact" --dir "$dir" \
              || echo "::warning::Could not download artifact '$artifact' from $wf."
          }

          # Reuse the newest SUCCESSFUL run of a workflow this step does not
          # dispatch, whatever event produced it. Unlike download_latest above,
          # "no run" and "an old run" are different outcomes and both are
          # reported: a silently-absent export would leave the sites list
          # carrying last week's membership flags with nothing saying so, which
          # is the failure shape this repo keeps rediscovering.
          #
          # `--branch main` is load-bearing, not tidiness (raised in review on
          # #1255). Without it the lookup spans every branch, so a successful
          # `workflow_dispatch` of 601 from someone's feature branch becomes the
          # newest success and its membership data lands in the published sites
          # list — unreviewed data reaching a public artifact through a run that
          # looks entirely normal. The dispatch at the end of this job targets
          # the default branch, so `main` is also where the runs it creates land.
          download_latest_success () {
            local wf="$1" artifact="$2" dir="$3" run_id created age_days
            run_id=$(gh run list --workflow "$wf" --repo "$REPO" --status success --branch main \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "::warning::$wf has no successful run to reuse; continuing without its data. If its approval gate has gone unanswered, approve it and re-run this workflow."
              return 0
            fi
            created=$(gh run view "$run_id" --repo "$REPO" --json createdAt --jq '.createdAt')
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
            echo "Reusing $wf run $run_id from $created (${age_days}d old)."
            if [ "$age_days" -ge "$STALE_EXPORT_DAYS" ]; then
              echo "::warning::$wf's newest successful run is ${age_days} days old (threshold ${STALE_EXPORT_DAYS}). Its approval gate is likely going unanswered; the sites list is carrying stale data from it."
            fi
            gh run download "$run_id" --repo "$REPO" --name "$artifact" --dir "$dir" \
              || echo "::warning::Could not download artifact '$artifact' from $wf run $run_id."
          }

          download_latest         201-whmcs-export-domains.yml  whmcs_domains            tmp_data/whmcs_domains
          download_latest         108-export-summary.yml        domain_summary           tmp_data/domain_summary
          download_latest_success 601-wpmudev-export-sites.yml  wpmudev-domain-inventory tmp_data/wpmudev-domain-inventory

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        # Pin major versions to avoid surprise breakage from new majors.
        run: npm install csv-parse@^6 csv-stringify@^6

      - name: Generate sites list (CSV + JSON)
        run: node scripts/update-sites-data.mjs

      # main is protected (changes via PR + merge queue only), so publish the
      # regenerated data as a pull request rather than pushing directly. Using
      # CBM_TOKEN (a PAT) so the PR can trigger required checks.
      - name: Open data update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Set from Key Vault by the "Load the GitHub PAT" step above.
          token: ${{ env.GH_TOKEN }}
          add-paths: |
            sites-list/sites_list.csv
            sites-list/sites_list.json
          commit-message: 'chore(sites-list): automated regeneration (CSV + JSON)'
          branch: data/sites-list-auto
          delete-branch: true
          title: 'chore(sites-list): automated sites list regeneration'
          body: |
            Automated regeneration of `sites-list/sites_list.csv` and
            `sites-list/sites_list.json` from the WHMCS / Cloudflare / WPMUDEV
            exports plus the curated base list, with refreshed health checks.

            Generated by `.github/workflows/sites-list-generate.yml`.

      # Prime next week's WPMUDEV export. Deliberately the LAST step, and
      # deliberately fire-and-forget.
      #
      # 601 is gated on `wpmudev-prod` (a required reviewer this org keeps).
      # Dispatching it in step 5 and waiting, as this workflow used to, asked an
      # operator for a second approval while the run was blocked on their
      # answer; when they had walked away the step timed out and burned the
      # approval already spent on this run. Dispatching it LAST asks for that
      # approval at the one moment an operator is provably present — they
      # approved this job's own gate minutes ago and are still on the Actions
      # page — while nothing here depends on the answer.
      #
      # A cron on 601 would put the two prompts up simultaneously, which is
      # nicer still, and `test_gated_env_hygiene.py` forbids it: a Reads-level
      # job on a schedule AND a reviewer gate parks at `waiting` with nobody
      # watching and is cancelled by its successor or reaped by janitor 734.
      # That guard has no allowlist for the scheduled case on purpose, and this
      # arrangement gets the same outcome without weakening it.
      #
      # The consequence is that the export this job consumed above is the one
      # dispatched a week ago. That is the intended trade: WPMUDEV site
      # membership moves slowly, STALE_EXPORT_DAYS (14) tolerates one missed
      # cycle and warns on two, and a week-old artifact beats a blocked run.
      #
      # `|| true`: a failed dispatch must not fail a run whose data PR is
      # already open. The warning is the signal, and next week's run re-tries.
      - name: Dispatch the gated WPMUDEV export for next week's run
        # `always()` so a failed generation still primes next week's export --
        # but qualified on the PAT step, because a bare `always()` would run
        # this after the Key Vault load failed and report "no credential" as
        # "the dispatch failed" (#899, test_always_steps_are_guarded).
        if: always() && steps.load_pat.conclusion == 'success'
        env:
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          gh workflow run 601-wpmudev-export-sites.yml --repo "$REPO" --ref main \
            || echo "::warning::Could not dispatch 601-wpmudev-export-sites.yml; next week's run will reuse an older export and report its age."
