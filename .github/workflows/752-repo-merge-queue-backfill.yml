name: '752. Repo - Merge Queue Backfill (FFC-EX) [GH]'
run-name: 'Merge Queue Backfill (dry_run=${{ inputs.dry_run }}, repos=${{ inputs.target_repos }})'

# Adds the repo-level "Merge Queue + Branch Up-to-Date" ruleset to named FFC-EX
# repos whose default branch has no merge queue. Never changes a repo that
# already has one, and never touches any other ruleset or setting.
#
# Why this exists (epic #1618, 2026-10-12): GitHub cannot put a merge queue in
# an organization ruleset, so the queue exists per repo. 44 of 116 FFC-EX repos
# carried it and 72 did not: 701 never created it, and nothing backfilled it.
# With a queue on every site, `gh pr merge --auto` always means "enqueue", and
# 707 lands content PRs through the queue (#1654, #1655).
#
# The ruleset body is config/merge-queue-ruleset.json, copied field for field
# from the one the 44 repos carry (merge method MERGE, ALLGREEN, 5-minute wait,
# repository-admin bypass).
#
# Two jobs, the 742/751 shape:
#   - plan  - ungated, job token, read-only. Per repo: public, not archived,
#             merge commits allowed (merge_method MERGE needs them), and no
#             merge_queue rule on the default branch yet. Prints one
#             `752-plan: <repo> <status> - <reason>` line each to the log.
#   - apply - only when dry_run=false, on `github-prod` (Clarke approves the
#             plan). Creates the ruleset on each ready repo, then re-reads the
#             branch rules to confirm the queue is in force. Prints one
#             `752-apply: <repo> <result>` line each. A 403 here means the PAT
#             lacks Administration write on the repo; it is reported per repo.

on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Comma-separated FFC-EX repo names (at most 10), e.g. FFC-EX-example.org'
        required: true
        type: string
      dry_run:
        description: 'Plan only: check each repo, change nothing (no approval needed)'
        required: false
        default: true
        type: boolean

# Workflow scope is read-only; only the apply job can mint an OIDC token.
permissions:
  contents: read

# One run at a time: two runs could race to create the same ruleset.
concurrency:
  group: 752-merge-queue-backfill
  cancel-in-progress: false

env:
  ORG: FreeForCharity

jobs:
  plan:
    name: Plan (read-only)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - name: Plan each repo
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOS: ${{ inputs.target_repos }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          repos="$(printf '%s' "$TARGET_REPOS" | tr -d '[:space:]' | tr ',' '\n' | awk 'NF' | sort -u)"
          count="$(printf '%s\n' "$repos" | awk 'NF' | wc -l)"
          if [ "$count" -lt 1 ] || [ "$count" -gt 10 ]; then
            echo "::error::target_repos must name 1 to 10 repos, got $count"
            exit 1
          fi
          {
            echo '## 752 Merge Queue Backfill - plan'
            echo ''
            echo '| Repo | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          result() {
            # repo status reason: one summary row, and the same line in the log
            # (GitHub has no API for step summaries; conductors read logs).
            echo "| $1 | $2${3:+ - $3} |" >> "$GITHUB_STEP_SUMMARY"
            echo "752-plan: $1 $2${3:+ - $3}"
          }
          ready='[]'
          while read -r r; do
            if ! [[ "$r" =~ ^FFC-EX-[A-Za-z0-9.-]{3,100}$ ]]; then
              echo "::error::'$r' is not an FFC-EX repo name"
              exit 1
            fi
            if ! info="$(gh api "repos/${ORG}/${r}" --jq '[.visibility, .archived, .allow_merge_commit, .default_branch] | @tsv')"; then
              result "$r" blocked 'repo not found or not readable'
              continue
            fi
            IFS=$'\t' read -r visibility archived merge_commit branch <<< "$info"
            if [ "$archived" = "true" ]; then result "$r" blocked 'archived'; continue; fi
            if [ "$visibility" != "public" ]; then
              result "$r" blocked "visibility is ${visibility}: the merge queue is available on public repos only on this plan"
              continue
            fi
            if [ "$merge_commit" != "true" ]; then
              result "$r" blocked 'merge commits are disabled, and the ruleset merges with merge_method MERGE'
              continue
            fi
            if ! has="$(gh api "repos/${ORG}/${r}/rules/branches/${branch}?per_page=100" --jq '[.[] | select(.type == "merge_queue")] | length')"; then
              result "$r" blocked "could not read the rules on ${branch}"
              continue
            fi
            if [ "$has" -gt 0 ]; then result "$r" current "${branch} already has a merge queue"; continue; fi
            result "$r" ready "no merge queue on ${branch}"
            ready="$(jq -c --arg r "$r" --arg b "$branch" '. + [{repo: $r, branch: $b}]' <<< "$ready")"
          done <<< "$repos"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "::notice::ready=$(jq length <<< "$ready") of $count"
          if [ "$DRY_RUN" = "true" ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'dry_run=true - plan above, nothing changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  apply:
    name: Apply (create the ruleset on each ready repo)
    needs: plan
    if: ${{ inputs.dry_run == false && needs.plan.outputs.ready != '[]' }}
    runs-on: ubuntu-latest
    environment: github-prod
    permissions:
      contents: read
      # Required for the Key Vault OIDC exchange (#844).
      id-token: write
    steps:
      - name: Checkout (for the ruleset body)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). This step
      # is 742's, verbatim: tests/workflow-logic/test_pat_liveness_probe.py pins it.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"
      - name: Create the merge queue ruleset
        shell: bash
        env:
          READY_JSON: ${{ needs.plan.outputs.ready }}
        run: |
          set -uo pipefail
          jq '.ruleset' config/merge-queue-ruleset.json > ruleset.json
          failures=0
          {
            echo '## 752 Merge Queue Backfill - results'
            echo ''
            echo '| Repo | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          row() {
            echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"
            echo "752-apply: $1 $2"
          }
          total="$(jq 'length' <<< "$READY_JSON")"
          for i in $(seq 0 $((total - 1))); do
            r="$(jq -r ".[$i].repo" <<< "$READY_JSON")"
            branch="$(jq -r ".[$i].branch" <<< "$READY_JSON")"
            if ! [[ "$r" =~ ^FFC-EX-[A-Za-z0-9.-]{3,100}$ ]]; then
              row "$r" "error: not an FFC-EX repo name"
              failures=$((failures + 1)); continue
            fi
            # Re-check right before writing: the plan may be minutes old.
            if ! has="$(gh api "repos/${ORG}/${r}/rules/branches/${branch}?per_page=100" --jq '[.[] | select(.type == "merge_queue")] | length')"; then
              row "$r" "error: could not re-read the rules on ${branch}"
              failures=$((failures + 1)); continue
            fi
            if [ "$has" -gt 0 ]; then row "$r" "current: ${branch} gained a merge queue since the plan"; continue; fi
            if ! out="$(gh api -X POST "repos/${ORG}/${r}/rulesets" --input ruleset.json --jq '.id' 2>&1)"; then
              row "$r" "error: GitHub refused the ruleset ($(printf '%s' "$out" | tr '\n' ' ' | head -c 200))"
              failures=$((failures + 1)); continue
            fi
            if ! has="$(gh api "repos/${ORG}/${r}/rules/branches/${branch}?per_page=100" --jq '[.[] | select(.type == "merge_queue")] | length')" || [ "$has" -lt 1 ]; then
              row "$r" "error: ruleset ${out} created but no merge queue reads back on ${branch}"
              failures=$((failures + 1)); continue
            fi
            row "$r" "added: ruleset ${out}, merge queue in force on ${branch}"
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures repo(s) failed - see the summary"
            exit 1
          fi
