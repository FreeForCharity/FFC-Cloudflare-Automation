version: 2
updates:
  # Enable version updates for GitHub Actions.
  # '/' only scans .github/workflows. The composite actions under .github/actions/ carry their own
  # pins, and every Key Vault credential fetch goes through one of them, so they must be listed too
  # or they are silently left behind on each bump (tests/workflow-logic/test_action_pin_consistency.py).
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
