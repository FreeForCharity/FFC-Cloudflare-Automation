name: '703. Sites List - Generate (CSV + JSON) [GH]'
run-name: 'Generate Sites List'

# Generates the merged FFC sites list from the WHMCS / Cloudflare / WPMUDEV
# exports plus the curated base list, runs per-domain health checks, and
# commits both sites-list/sites_list.csv and sites-list/sites_list.json.
#
# This repo owns the export environments (whmcs-prod, cloudflare-prod-read,
# wpmudev-prod) and the GitHub PAT (CBM_TOKEN in github-prod) needed to
# dispatch the sibling export workflows, so generation lives here. Downstream
# consumers (e.g. ffcadmin.org) pull the published files from this repo.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1' # Weekly on Mondays at 08:00 UTC

permissions:
  contents: write
  pull-requests: write
  # Required for the Key Vault OIDC exchange (#844).
  id-token: write

# Prevent a manual run and the scheduled run from regenerating / pushing to main
# at the same time.
concurrency:
  group: sites-list-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"
      - name: Trigger export workflows and download artifacts
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Dispatch the three read-only export workflows by file name.
          # NOTE: both display names AND file names get renumbered periodically,
          # so keep these in sync with .github/workflows/ (last synced 2026-07-07).
          for wf in 201-whmcs-export-domains.yml 108-export-summary.yml 601-wpmudev-export-sites.yml; do
            echo "Dispatching $wf ..."
            gh workflow run "$wf" --repo "$REPO"
          done

          # Give the dispatched runs time to register before querying them.
          sleep 30

          # Wait for each run and download its artifact. A failed export is a
          # warning, not a hard failure: the generator preserves existing
          # membership flags when a source artifact is absent.
          download_latest () {
            local wf="$1" artifact="$2" dir="$3" run_id
            # Only consider workflow_dispatch runs (the ones we just triggered),
            # to avoid picking up a concurrent scheduled or older run.
            run_id=$(gh run list --workflow "$wf" --repo "$REPO" --event workflow_dispatch \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "::warning::No workflow_dispatch run found for $wf; continuing without its data."
              return 0
            fi
            echo "Waiting for $wf run $run_id ..."
            if ! gh run watch "$run_id" --repo "$REPO" --exit-status; then
              echo "::warning::$wf run $run_id did not succeed; continuing without its data."
              return 0
            fi
            gh run download "$run_id" --repo "$REPO" --name "$artifact" --dir "$dir" \
              || echo "::warning::Could not download artifact '$artifact' from $wf."
          }

          download_latest 201-whmcs-export-domains.yml  whmcs_domains            tmp_data/whmcs_domains
          download_latest 108-export-summary.yml        domain_summary           tmp_data/domain_summary
          download_latest 601-wpmudev-export-sites.yml  wpmudev-domain-inventory tmp_data/wpmudev-domain-inventory

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        # Pin major versions to avoid surprise breakage from new majors.
        run: npm install csv-parse@^6 csv-stringify@^6

      - name: Generate sites list (CSV + JSON)
        run: node scripts/update-sites-data.mjs

      # main is protected (changes via PR + merge queue only), so publish the
      # regenerated data as a pull request rather than pushing directly. Using
      # CBM_TOKEN (a PAT) so the PR can trigger required checks.
      - name: Open data update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Set from Key Vault by the "Load the GitHub PAT" step above.
          token: ${{ env.GH_TOKEN }}
          add-paths: |
            sites-list/sites_list.csv
            sites-list/sites_list.json
          commit-message: 'chore(sites-list): automated regeneration (CSV + JSON)'
          branch: data/sites-list-auto
          delete-branch: true
          title: 'chore(sites-list): automated sites list regeneration'
          body: |
            Automated regeneration of `sites-list/sites_list.csv` and
            `sites-list/sites_list.json` from the WHMCS / Cloudflare / WPMUDEV
            exports plus the curated base list, with refreshed health checks.

            Generated by `.github/workflows/sites-list-generate.yml`.
