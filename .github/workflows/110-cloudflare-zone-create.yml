name: '110. DNS - Create Zone (Admin) [CF]'
run-name: 'Create Zone: ${{ inputs.domain }} (${{ inputs.account }})'

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name to add as a Cloudflare zone (e.g., example.org)'
        required: true
        type: string
      account:
        description:
          'Which Cloudflare account should own this zone? (required to prevent duplicates)'
        required: true
        type: choice
        options:
          - FFC
          - CM
      zone_type:
        description: 'Zone type'
        required: true
        type: choice
        options:
          - full
          - partial
        default: full
      jump_start:
        description: 'Attempt to auto-import DNS records from existing nameservers'
        required: false
        type: boolean
        default: false
      ai_crawlers:
        description:
          "AI crawlers on the new zone. Cloudflare BLOCKS AI bots on every new zone by default;
          FFC's default is the opposite, because a charity's public site exists to be found. 'allow'
          (default) turns Block AI Bots and the AI Labyrinth OFF right after the create; 'block'
          keeps Cloudflare's default; 'skip' leaves the setting untouched."
        required: false
        type: choice
        options:
          - allow
          - block
          - skip
        default: allow
      custom_nameservers:
        description:
          "Delegate the new zone to FFC's ACCOUNT custom nameservers (ns1/ns2.freeforcharity.org),
          the pair every FFC zone uses and the pair 102 and the onboarding docs hand to charities.
          Cloudflare assigns each zone its own pair instead and nothing enabled the account pair per
          zone until this step. 'enable' (default) switches it on; 'skip' leaves the zone on its
          assigned pair."
        required: false
        type: choice
        options:
          - enable
          - skip
        default: enable

permissions:
  contents: read
  id-token: write

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 110-cloudflare-zone-create
  cancel-in-progress: false

jobs:
  create-zone:
    runs-on: ubuntu-latest
    environment: cloudflare-prod-write

    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      # `domain` is a free-text dispatch input, so it reaches the body through
      # step-level `env:`, never interpolated into it (#1080). What sits beside
      # it here is the pair of WRITE-scoped Cloudflare API tokens: the composite
      # action above resolved the `wr-all-*` Key Vault secrets and exported them
      # through GITHUB_ENV, so they are in this step's process environment
      # without appearing in any `env:` block a reviewer can read - and an
      # injected body would hold DNS write across both Cloudflare accounts.
      #
      # `account` and `zone_type` stay interpolated on purpose: both are
      # `type: choice`, so GitHub constrains the value to the declared options
      # and it cannot carry a payload. That is the only thing making them safe,
      # which is why test_110_zone_create_wiring.py pins their declared types
      # rather than leaving it as a reading of this comment.
      - name: Create zone
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed on a missing mapping (ledger L202/L214/L220). Interpolation
          # had no absent source - substitution always produced something - but an
          # `env:` var that is unmapped or misnamed arrives UNSET, and pwsh renders
          # an unset variable as NO ARGUMENT AT ALL, so `-Account` would bind to
          # `-Domain` and the diagnosis would arrive as a call-signature error one
          # parameter to the left of the cause. A mapping that is present but EMPTY
          # does not collapse: it binds, and the zone create would run against an
          # empty -Domain. IsNullOrWhiteSpace is the check because it is the only
          # one that catches both.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call cloudflare-zone-create.ps1 with an empty -Domain.'
            exit 1
          }
          if ('${{ inputs.jump_start }}' -eq 'true') {
            pwsh -NoProfile -File scripts/cloudflare-zone-create.ps1 `
              -Domain $env:IN_DOMAIN `
              -Account "${{ inputs.account }}" `
              -ZoneType "${{ inputs.zone_type }}" `
              -JumpStart
          }
          else {
            pwsh -NoProfile -File scripts/cloudflare-zone-create.ps1 `
              -Domain $env:IN_DOMAIN `
              -Account "${{ inputs.account }}" `
              -ZoneType "${{ inputs.zone_type }}"
          }

      # Every FFC zone delegates to the ACCOUNT custom nameservers
      # (ns1/ns2.freeforcharity.org): 102 hands those names to the registrar
      # and the onboarding docs hand them to charities. The Cloudflare side is
      # a per-zone toggle that nothing in this repo set, so a zone this
      # workflow created came up on its assigned pair (measured 2026-10-02,
      # newheightseducation.org: dane/zainab.ns.cloudflare.com) and the names
      # the charity was given would not have been authoritative for it.
      # Runs on an existing zone too (the create step exits 0 on "already
      # exists"), so re-dispatching 110 converges an older zone.
      # `custom_nameservers` is a `type: choice` and travels by env with a
      # `default` arm that fails; `skip` never reaches the body.
      - name: Enable FFC custom nameservers (account pair)
        if: ${{ inputs.custom_nameservers != 'skip' }}
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
          IN_CUSTOM_NS: ${{ inputs.custom_nameservers }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Same fail-closed guard as the create step above (L214).
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call cloudflare-custom-nameservers.ps1 with an empty -Zone.'
            exit 1
          }
          switch ([string]$env:IN_CUSTOM_NS) {
            'enable' { $mode = '-Enable' }
            default {
              Write-Output "::error::Unsupported custom_nameservers value '$($env:IN_CUSTOM_NS)' (expected enable; skip never reaches this step)."
              exit 1
            }
          }
          pwsh -NoProfile -File scripts/cloudflare-custom-nameservers.ps1 -Zone $env:IN_DOMAIN $mode

      # Cloudflare blocks AI crawlers on every NEW zone by default (Block AI Bots
      # on, plus the AI Labyrinth where the plan carries it). FFC's default is
      # the opposite: the sites it hosts are charities' public information, and
      # being readable by assistants and search engines is the point of
      # publishing them. So the posture is set HERE, in the same approved run
      # that created the zone, rather than left to a later dispatch nobody
      # remembers. 106 re-applies it on every enforce run, so a zone that
      # predates this step converges too.
      #
      # `ai_crawlers` is a `type: choice`, so GitHub constrains its value - and
      # it still travels by `env:` with a `default` arm that fails, never
      # interpolated into the body. `skip` never reaches the body at all.
      # scripts/cloudflare-ai-crawlers.ps1 re-reads the zone after the write
      # and fails closed on a bot_management shape it does not recognise;
      # tests/workflow-logic/test_cloudflare_ai_crawlers_wiring.py pins this
      # step's wiring and the input's `allow` default.
      - name: Set AI-crawler posture (FFC default allow)
        if: ${{ inputs.ai_crawlers != 'skip' }}
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
          IN_AI_CRAWLERS: ${{ inputs.ai_crawlers }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Same fail-closed guard as the create step above (L214): an unmapped
          # env: var renders as NO ARGUMENT to a native command, so -Zone would
          # bind to the posture switch and the error would name the wrong thing.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to call cloudflare-ai-crawlers.ps1 with an empty -Zone.'
            exit 1
          }
          switch ([string]$env:IN_AI_CRAWLERS) {
            'allow' { $posture = '-Allow' }
            'block' { $posture = '-Block' }
            default {
              Write-Output "::error::Unsupported ai_crawlers value '$($env:IN_AI_CRAWLERS)' (expected allow or block; skip never reaches this step)."
              exit 1
            }
          }
          pwsh -NoProfile -File scripts/cloudflare-ai-crawlers.ps1 -Zone $env:IN_DOMAIN $posture
