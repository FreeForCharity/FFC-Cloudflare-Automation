name: 999. Research - EIN provider probe (temporary, do not merge)

# One-off research run for the "Find alternatives to Candid verification" thread.
# Read-only. Job 1 clones the public FFC-EX repos and lists the EIN each site
# shows. Job 2 reads every WHMCS onboarding application (read lane, same identity
# and environment as 232) and checks its EIN against the IRS lists, ProPublica and
# the site's EIN. Output carries no EIN and no personal data.
on:
  push:
    branches:
      - claude/project-thread-37d1o2
    paths:
      - .github/workflows/999-probe-ein-providers.yml

permissions:
  contents: read

jobs:
  site_eins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Clone FFC charity repos
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p work/repos
          {
            gh api --paginate 'orgs/FreeForCharity/repos?per_page=100&type=all' --jq '.[].name' || true
            python3 -c "import csv;[print(r['Repo URL'].rstrip('/').split('/')[-1]) for r in csv.DictReader(open('sites-list/sites_list.csv')) if r['Repo URL'].strip()]"
          } | grep -E '^FFC-EX-' | sort -u > work/repo-names.txt
          while read -r name <&3; do
            git clone -q --depth 1 --filter=blob:limit=2m "https://github.com/FreeForCharity/${name}.git" "work/repos/${name}" </dev/null 2>/dev/null || echo "clone failed: $name"
          done 3< work/repo-names.txt
          python3 scripts/collect_site_eins.py work/repos site-eins.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-eins
          path: site-eins.json
          retention-days: 1

  application_eins:
    needs: site_eins
    runs-on: windows-latest
    timeout-minutes: 40
    environment: whmcs-prod-read
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: site-eins
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          scope: read
          azure-client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}
      - name: Check application EINs (read-only)
        shell: pwsh
        run: |
          & .\scripts\whmcs-application-ein-check.ps1 -ApiUrl 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php' -SiteEinFile site-eins.json
          if ($LASTEXITCODE -ne 0) { throw "EIN check failed (exit $LASTEXITCODE)." }
      - uses: actions/upload-artifact@v4
        with:
          name: application-ein-check
          path: artifacts/whmcs/application-ein-check.*
