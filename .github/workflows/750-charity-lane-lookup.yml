name: '750. Repo - Charity-Lane Duplicate Lookup (read-only) [GH]'
run-name: '750: charity-lane lookup'

# Where does this charity already exist? Run by the Onboarding Conductor before it
# queues a [CHARITY-LANE] item or provisions a repo (epic #1618), so the pipeline
# never builds a second site for a charity already in flight or live. A cloud
# session cannot search the whole org (its GitHub proxy serves only attached
# repos), so the search runs here.
#
# SAFETY. No environment and no credential beyond the job token: it reads public
# data only (FreeForCharity repo names, org-wide issue/PR search, ffcadmin's
# docs/sites_list.csv, ProPublica for an EIN). The only write is the optional
# comment on a hub issue. Free-text inputs reach the script through env, never
# through ${{ }} in a run body.

on:
  workflow_dispatch:
    inputs:
      org_name:
        description: 'Organization name as the application gives it'
        required: false
        type: string
        default: ''
      domain:
        description: 'Desired or existing domain, if any'
        required: false
        type: string
        default: ''
      ein:
        description: 'EIN from the application (adds the IRS name, city and state from ProPublica)'
        required: false
        type: string
        default: ''
      issue_number:
        description: 'Optional hub issue to post the result on (e.g. the [CHARITY-LANE] item)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Look up the charity across repos, issues, sites list and IRS
        env:
          GH_TOKEN: ${{ github.token }}
          IN_ORG: ${{ inputs.org_name }}
          IN_DOMAIN: ${{ inputs.domain }}
          IN_EIN: ${{ inputs.ein }}
          IN_ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IN_ORG// /}" ] && [ -z "${IN_DOMAIN// /}" ]; then
            echo "::error::Give org_name and/or domain."
            exit 1
          fi
          if [ -n "$IN_ISSUE" ] && ! [[ "$IN_ISSUE" =~ ^[0-9]{1,6}$ ]]; then
            echo "::error::issue_number must be digits."
            exit 1
          fi
          args=(--sources repos,sites,issues --markdown)
          [ -n "${IN_ORG// /}" ] && args+=(--org "$IN_ORG")
          [ -n "${IN_DOMAIN// /}" ] && args+=(--domain "$IN_DOMAIN")
          [ -n "${IN_EIN// /}" ] && args+=(--ein "$IN_EIN")
          python3 scripts/charity_lane_lookup.py "${args[@]}" > "$RUNNER_TEMP/lookup.md"
          {
            echo "## 750: charity-lane lookup"
            echo
            cat "$RUNNER_TEMP/lookup.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/lookup.md"
          if [ -n "$IN_ISSUE" ]; then
            {
              echo "<!-- charity-lane:lookup -->"
              echo "**750 lookup** ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              echo
              cat "$RUNNER_TEMP/lookup.md"
            } > "$RUNNER_TEMP/comment.md"
            gh api "repos/$GITHUB_REPOSITORY/issues/$IN_ISSUE/comments" -X POST -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          fi
