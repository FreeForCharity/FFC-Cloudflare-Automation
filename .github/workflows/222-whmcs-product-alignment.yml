name: '222. WHMCS - Cloudflare Registrar Product Alignment [WHMCS+CF]'
run-name: 'WHMCS product alignment (pid ${{ inputs.product_id }}, dry_run=${{ inputs.dry_run }})'

# Aligns a WHMCS status-marker product (default pid 39 "Domain Registered in
# Cloudflare") onto the clients who own each domain in the FFC Cloudflare
# Registrar account. Read-only preview by default; a live run gates on whmcs-prod.
#
# Two jobs so each uses the identity/scope it is entitled to:
#   1. resolve-domains  - cloudflare-prod-read (kv-reader) pulls the authoritative
#                         registrar-domain list from the Cloudflare API.
#   2. align            - whmcs-prod (kv-writer) resolves each domain to its WHMCS
#                         client and, unless dry_run, places a $0 AddOrder for any
#                         client that does not already hold the product. Idempotent.
#
# WHMCS API calls route through the APIM gateway (its IP is allow-listed at WHMCS).

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'WHMCS product id to align (39 = Domain Registered in Cloudflare)'
        required: false
        type: string
        default: '39'
      dry_run:
        description: 'Preview only (place no orders)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  resolve-domains:
    runs-on: windows-latest
    environment: cloudflare-prod-read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: List Cloudflare registrar domains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./scripts/cloudflare-registrar-domains.ps1 -OutputFile artifacts/cloudflare/registrar_domains.json
          if ($LASTEXITCODE -ne 0) { throw "Cloudflare registrar list failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-registrar-domains
          path: artifacts/cloudflare/registrar_domains.json
          if-no-files-found: error
          retention-days: 7

  align:
    needs: resolve-domains
    runs-on: windows-latest
    environment: whmcs-prod
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-registrar-domains
          path: artifacts/cloudflare

      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          scope: write
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Align product onto registrar-domain clients
        shell: pwsh
        # `product_id` is a free-text dispatch input. Interpolated into this body
        # it was not an argument — it was source text pasted into the program
        # GitHub then runs, holding the WHMCS API credential the APPROVER spent on
        # `whmcs-prod`, in a job whose live mode places AddOrder writes (#1080). It
        # now arrives through step-level `env:` and the body reads `$env:`.
        #
        # The credential is named in no `env:` block here: the preceding
        # `whmcs-secrets-from-kv` step exports WHMCS_API_IDENTIFIER / _SECRET /
        # _APIM_SUBSCRIPTION_KEY through GITHUB_ENV, so a reader who checks this
        # step's own `env:` (ledger L213) and a `secrets.` grep of the file (#1141)
        # both score it as holding nothing. Run `python3
        # scripts/check-workflow-input-interpolation.py --reachability
        # 222-whmcs-product-alignment.yml` for the arrival path (#1188).
        #
        # The value sat in SINGLE quotes, where `$( )` does NOT expand — so the
        # payload every double-quoted lane used is inert here and reports this body
        # as harmless. What works is closing the literal and continuing the
        # EXPRESSION. Measured on pwsh 7.4.6 against the body as it shipped: the
        # decoy credential was written to a sentinel, the callee was still handed a
        # legal `ProductId=39`, and the step exited **0**.
        #
        # `dry_run` stays interpolated on purpose: it is `type: boolean`, so GitHub
        # generates the value from the declared option and it cannot carry a
        # payload.
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          IN_PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed (#1150, ledger L214), NOT the gated append 229 uses: a
          # blank `product_id` is not a documented path here, and both cheaper
          # remedies are actively wrong. `$params` is splatted onto a NATIVE
          # command, whose argument rendering drops an empty element (L254), and
          # the callee's own default is '39'. Measured on pwsh 7.4.6 with this
          # check removed, `IN_PRODUCT_ID` empty, 8 runs: FOUR outcomes — 3 bound
          # ProductId='39', 2 bound the next rendered argument
          # (`-ApiUrl:https://…`), 1 bound `-OutputFile:artifacts/…`, 2 never
          # reached the callee — 6 of them at exit 0. An UNSET mapping was correct
          # 8/8, so the hazard is the blank a dispatch form produces when someone
          # clears the box, not the one a broken `env:` block produces.
          #
          # Defaulting to the callee's '39' would be the worst of the three: on
          # THIS workflow it happens to be the intended marker, which is exactly
          # why it must not be relied on — its sibling 224 aligns pid 40, and the
          # same silent default there places the Cloudflare marker on
          # GitHub-Pages clients, live. `tests/workflow-logic/
          # test_222_224_product_alignment_wiring.py` measures both.
          if ([string]::IsNullOrWhiteSpace($env:IN_PRODUCT_ID)) {
            Write-Error 'product_id is blank. Refusing to run: an empty value is dropped from the splat and the callee would fall back to its own default product id.'
            exit 1
          }
          $params = @{
            DomainsJson      = 'artifacts/cloudflare/registrar_domains.json'
            ProductId        = $env:IN_PRODUCT_ID
            ApiUrl           = $env:WHMCS_API_URL
            OutputFile       = 'artifacts/whmcs/whmcs_product_alignment.json'
            WelcomeEmailJson = 'config/whmcs-cloudflare-domain-email.json'
          }
          if ('${{ inputs.dry_run }}' -eq 'false') { $params.Execute = $true }
          & pwsh -NoProfile -File ./scripts/whmcs-product-alignment.ps1 @params | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($LASTEXITCODE -ne 0) { throw "Product alignment failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v7
        with:
          name: whmcs-product-alignment
          path: artifacts/whmcs/whmcs_product_alignment.json
          if-no-files-found: error
          retention-days: 30
