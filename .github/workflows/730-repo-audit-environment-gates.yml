name: '730. Repo - Audit Environment Approval Gates [Repo]'
run-name: 'Audit environment approval gates'

# Read-only. Lists every GitHub Environment's required reviewers, wait timer, and deployment
# branch policy to the job summary (and the log). Answers "which environments gate a deployment
# behind a human approval?" — which the docs hedge on because environment protection rules can't
# be read from the agent sandbox proxy. Uses the built-in GITHUB_TOKEN (repo read is enough to
# read protection rules), so it needs no environment and no approval. Dispatch-only.

on:
  workflow_dispatch:
  # Also run once automatically whenever this file lands on main (so the audit can be produced
  # without a manual dispatch). Scoped to its own path so it doesn't run on unrelated pushes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/730-repo-audit-environment-gates.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit environment protection rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # `gh` writes its error body to STDOUT, so the previous form
          # (`gh api … 2>/dev/null | sort || true`) piped the error text into `names`
          # and the loop below iterated over an API error message as if those lines
          # were environment names (ledger L02 / #854 / #889). Two separate steps now:
          # capture with an explicit exit-code check, sort afterwards — no pipeline in
          # the capture at all, so `pipefail` has nothing to hide.
          api_get() {
            local out rc
            out=$(gh api "$@" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          {
            echo "## Environment approval gates — \`$REPO\`"
            echo ""
            echo "| Environment | Required reviewers | Wait timer (min) | Branch policy |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          readable=1
          names=""
          if raw_names=$(api_get "repos/$REPO/environments" --paginate --jq '.environments[].name'); then
            names=$(printf '%s\n' "$raw_names" | sort)
          else
            readable=0
          fi

          if [ "$readable" -eq 0 ]; then
            # "cannot read the environments" and "this repo has no environments" are
            # opposite findings. Collapsing them lets an unreadable audit render as a
            # clean bill of health for the gates it never saw.
            echo "| ⚠️ could not read the environment list — this audit measured nothing | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cannot read environments for $REPO — check the token's permissions. An unreadable environment list must never be reported as 'no gates'."
          elif [ -z "$names" ]; then
            echo "| (no environments defined on this repository) | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
          else
            while IFS= read -r e; do
              if [ -z "$e" ]; then continue; fi
              enc=$(jq -rn --arg s "$e" '$s|@uri')
              # Detect a failed fetch explicitly — never let an error render as "no reviewers / any",
              # which would misreport a gated environment as ungated.
              if json=$(api_get "repos/$REPO/environments/$enc"); then
                reviewers=$(printf '%s' "$json" | jq -r '[.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?.reviewer.login] | join(", ")')
                if [ -z "$reviewers" ]; then reviewers="—"; fi
                wait_min=$(printf '%s' "$json" | jq -r '([.protection_rules[]? | select(.type=="wait_timer") | .wait_timer] | first) // "—"')
                branch=$(printf '%s' "$json" | jq -r 'if .deployment_branch_policy == null then "any" elif .deployment_branch_policy.protected_branches then "protected only" else "custom list" end')
                echo "| $e | $reviewers | $wait_min | $branch |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| $e | ⚠️ failed to read protection rules | — | — |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done <<< "$names"
          fi

          {
            echo ""
            echo "_Read-only audit; no changes made._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "----- summary (also above) -----"
          cat "$GITHUB_STEP_SUMMARY"

          # Fail last, so the summary above is still published: an audit that could not
          # read its subject has to be red, or the fleet's gate posture looks verified
          # on the strength of a run that saw nothing.
          if [ "$readable" -eq 0 ]; then
            exit 1
          fi
