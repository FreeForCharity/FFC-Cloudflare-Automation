name: '701. Website - Provision (Issue Assigned) [CF+Repo]'
run-name:
  'Website provision: ${{ inputs.domain || github.event.client_payload.domain ||
  github.event.issue.title }} (dry_run=${{ inputs.dry_run || false }})'

on:
  issues:
    types: [assigned]

  # Cross-repo trigger from FFCadmin's trigger-provisioning.yml, sent after an
  # intake issue passes sponsoring-admin verification. client_payload carries:
  # charity_title, ffcadmin_issue, issue_url, sponsor, and domain (the
  # applicant's desired apex domain). See FFCadmin docs/migration-plan.md §1-2.
  # client_payload keys are read exactly like workflow_dispatch inputs (the
  # resolve step treats both as "manual"), so `domain` is required and any of
  # the optional charity/footer fields may be supplied under the same names.
  # An empty/missing domain fails validation with the normal admin prompt.
  repository_dispatch:
    types: [ffcadmin-website-provision]

  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry-run: resolve the request, check the zone, and rehearse every write without performing
          it. DNS enforcement, repo creation and the maintainer grant all run with their own DryRun
          switches, and the content commit and push are skipped. Default: true — set false only for
          a real run.
        required: false
        type: boolean
        default: true
      domain:
        description: 'Apex domain (example: example.org). This is the only required field.'
        required: true
        type: string
      charity_name:
        description:
          'Organization display name (optional; required only to apply the React template footer).'
        required: false
        type: string
      footer_email:
        description:
          'Public footer contact email (optional; required only to apply the React template footer).'
        required: false
        type: string
      footer_phone:
        description: 'Public US phone number (optional). 10 digits, or 11 digits starting with 1.'
        required: false
        type: string
      footer_address:
        description: 'Footer mailing address (optional; you can paste multi-line text).'
        required: false
        type: string
      footer_ein:
        description: 'EIN / Tax ID (optional).'
        required: false
        type: string
      irs_status:
        description: 'IRS status (optional; if 501(c)(3), provide GuideStar links as well).'
        required: false
        type: choice
        options:
          - 501(c)(3) (approved)
          - Not yet / pending (pre-501(c)(3))
      guidestar_profile_url:
        description:
          'Candid/GuideStar profile URL (optional; required if 501(c)(3); must start with https://).'
        required: false
        type: string
      guidestar_direct_profile_url:
        description:
          'Candid/GuideStar direct profile link (optional; required if 501(c)(3); must start with
          https://).'
        required: false
        type: string
      website_situation:
        description: 'Which common scenario matches? (optional)'
        required: false
        type: choice
        options:
          - 'New charity domain name and new charity website'
          - 'New charity domain name but existing charity site (Wix / Squarespace / etc)'
          - 'Existing domain name and existing website (WordPress / formal hosting)'
      current_website_url:
        description: 'Current website URL (optional; must start with https:// if provided).'
        required: false
        type: string
      domain_registrar:
        description:
          'Who holds the domain registration today (optional). Wix blocks nameserver delegation, so
          a Wix-registered domain must move to eNom before Cloudflare is reachable — see workflow
          123.'
        required: false
        type: choice
        options:
          - 'Unknown / not sure'
          - 'Already with Free For Charity (eNom or Cloudflare)'
          - 'Wix'
          - 'Squarespace'
          - 'GoDaddy'
          - 'Other / another registrar'
          - 'No domain yet'
      requester_github_username:
        description: 'GitHub username to add as maintainer (optional; defaults to the actor).'
        required: false
        type: string
      technical_poc_github_username:
        description: 'GitHub username to add as maintainer (optional).'
        required: false
        type: string
      social_links:
        description:
          "Social links (optional). One per line as 'platform: https://...'. Must use https://."
        required: false
        type: string
      leadership_lines:
        description:
          "Leadership lines (optional). One per line as 'Name | Title | LinkedIn URL'. LinkedIn URL
          must be https:// if provided."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read
  # Required for the Key Vault OIDC exchange (#844). Declared at workflow level so
  # the `repo`, `content` and reusable-`maintainers` jobs all inherit it.
  id-token: write

env:
  WEBSITE_TARGET_ORG: FreeForCharity
  WEBSITE_TEMPLATE_REPO: FreeForCharity/FFC_Single_Page_Template

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 701-website-provision
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.parse.outputs.skip }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      post_comments: ${{ steps.parse.outputs.post_comments }}
      dns_controlled: ${{ steps.parse.outputs.dns_controlled }}
      website_situation: ${{ steps.parse.outputs.website_situation }}
      current_website_url: ${{ steps.parse.outputs.current_website_url }}
      domain_registrar: ${{ steps.parse.outputs.domain_registrar }}
      requester_github_username: ${{ steps.parse.outputs.requester_github_username }}
      technical_poc_github_username: ${{ steps.parse.outputs.technical_poc_github_username }}
      maintainers_csv: ${{ steps.parse.outputs.maintainers_csv }}
      domain: ${{ steps.parse.outputs.domain }}
      charity_name: ${{ steps.parse.outputs.charity_name }}
      footer_email: ${{ steps.parse.outputs.footer_email }}
      footer_phone: ${{ steps.parse.outputs.footer_phone }}
      footer_address_json: ${{ steps.parse.outputs.footer_address_json }}
      footer_ein: ${{ steps.parse.outputs.footer_ein }}
      irs_status: ${{ steps.parse.outputs.irs_status }}
      guidestar_profile_url: ${{ steps.parse.outputs.guidestar_profile_url }}
      guidestar_direct_profile_url: ${{ steps.parse.outputs.guidestar_direct_profile_url }}
      footer_social_json: ${{ steps.parse.outputs.footer_social_json }}
      leadership_json: ${{ steps.parse.outputs.leadership_json }}
      repo_name: ${{ steps.parse.outputs.repo_name }}
      repo_full: ${{ steps.parse.outputs.repo_full }}
      template_repo: ${{ steps.parse.outputs.template_repo }}
      run_url: ${{ steps.parse.outputs.run_url }}
    steps:
      - name: Parse Website Request
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const isDispatch = context.eventName === 'repository_dispatch';
            const isManual = context.eventName === 'workflow_dispatch' || isDispatch;
            const manualInputs = isDispatch
              ? (context.payload.client_payload || {})
              : (context.payload.inputs || {});
            const issue = context.payload.issue || {};
            const body = isManual ? '' : (issue.body || '');
            const title = isManual ? '' : (issue.title || '');
            const requesterFromIssue = String(issue?.user?.login || '').trim();
            const labels = (issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name))
              .filter(Boolean);

            // Gate: only act on website requests.
            const isWebsiteRequest = isManual || title.startsWith('[WEBSITE REQUEST]') || labels.includes('website-request');
            if (!isWebsiteRequest) {
              core.notice('Not a website request issue; skipping.');
              core.setOutput('skip', 'true');
              core.setOutput('post_comments', 'false');
              return;
            }

            // Admin-minimal provisioning: an administrator can provision the repo
            // (from the FFC template) and enforce apex GitHub Pages DNS for a freshly
            // registered domain WITHOUT supplying full charity/footer details. This is
            // signalled by the `admin-provision` label (see the admin-only issue
            // template). In this mode validation mirrors manual dispatch: only the
            // domain is required and all charity/footer/leadership/social fields are
            // optional, so footer content patching is simply skipped.
            const adminMinimal = !isManual && labels.includes('admin-provision');
            const bestEffort = isManual || adminMinimal;

            const requesterGitHubUsername = (
              String(manualInputs.requester_github_username || '').trim().replace(/^@/, '') ||
              requesterFromIssue ||
              String(context.actor || '').trim()
            );

            // Idempotency: skip if already completed.
            const marker = '<!-- website-provision:completed -->';
            if (!isManual) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some(c => (c.body || '').includes(marker))) {
                core.notice('Provisioning already completed for this issue; skipping.');
                core.setOutput('skip', 'true');
                core.setOutput('post_comments', 'true');
                core.setOutput('issue_number', String(issue.number));
                return;
              }
            }

            function escapeRegExp(str) {
              return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function extractSection(heading) {
              const re = new RegExp(`###\\s+${escapeRegExp(heading)}\\s+([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const m = body.match(re);
              if (!m) return '';
              return String(m[1] || '').trim();
            }

            function normalizeInput(value) {
              const v = String(value || '').trim();
              if (!v) return '';
              // GitHub issue forms render unfilled optional fields as the
              // literal "_No response_" sentinel. Treat it (and a bare
              // "No response") as empty so it never flows downstream as a
              // real value — e.g. a collaborator login that 404s and fails
              // the provisioning run.
              if (/^_?no response_?$/i.test(v)) return '';
              return v;
            }

            function normalizeDomain(value) {
              let v = normalizeInput(value);
              if (!v) return '';
              v = v.replace(/^https?:\/\//i, '');
              v = v.replace(/\/$/, '');
              v = v.replace(/^www\./i, '');
              return v;
            }

            function parseMultiline(value) {
              const v = String(value || '').trim();
              if (!v) return [];
              return v
                .split(/\r?\n/)
                .map(s => String(s || '').trim())
                .filter(Boolean);
            }

            function buildAddress(parts) {
              const line1 = normalizeInput(parts.line1);
              const line2 = normalizeInput(parts.line2);
              const city = normalizeInput(parts.city);
              const state = normalizeInput(parts.state);
              const postal = normalizeInput(parts.postal);
              const country = normalizeInput(parts.country);

              if (!line1 && !line2 && !city && !state && !postal && !country) return '';

              const lines = [];
              if (line1) lines.push(line1);
              if (line2) lines.push(line2);

              const cityStatePostal = [city, state, postal].filter(Boolean).join(', ').replace(/,\s*,/g, ', ');
              if (cityStatePostal) lines.push(cityStatePostal);
              if (country) lines.push(country);

              return lines.join('\\n');
            }

            function buildUrlLine(key, url) {
              const u = normalizeInput(url);
              if (!u) return null;
              if (!/^https:\/\//i.test(u)) return null;
              return `${key}: ${u}`;
            }

            function validateOptionalUrl(label, url) {
              const u = normalizeInput(url);
              if (!u) return '';
              if (isNA(u)) {
                core.setFailed(`Invalid value: ${label} cannot be N/A.`);
                return null;
              }
              if (!/^https:\/\//i.test(u)) {
                core.setFailed(`Invalid value: ${label} must start with https://.`);
                return null;
              }
              return u;
            }

            function validateRequiredUrl(label, url) {
              const u = normalizeInput(url);
              if (isDisallowedValue(u)) {
                core.setFailed(`Invalid value for required field: ${label}. Please provide a real URL (not N/A).`);
                return null;
              }
              if (!/^https:\/\//i.test(u)) {
                core.setFailed(`Invalid value for required field: ${label}. URL must start with https://.`);
                return null;
              }
              return u;
            }

            // Primary (current) issue form fields
            // DNS + domain registration/transfer are handled in a separate ticket.
            // Keep dnsControlled for backward compatibility with older website request issues.
            let dnsControlled = false;

            let websiteSituation = '';
            let currentWebsiteUrl = '';
            let domainRegistrar = '';
            let technicalPocGitHubUsername = '';
            let domain = '';
            let charityName = '';
            let footerEmail = '';
            let footerPhone = '';
            let footerAddress = '';
            let footerEin = '';
            let irsStatus = '';
            let guideStarProfileUrl = '';
            let guideStarDirectProfileUrl = '';
            let footerSocialLinks = [];
            let leadershipLines = [];

            const isDisallowedValue = (value) => {
              if (value === undefined || value === null) return true;
              const trimmed = String(value).trim();
              if (!trimmed) return true;
              return /^n\/?a$/i.test(trimmed);
            };

            const isNA = (value) => /^n\/?a$/i.test(String(value || '').trim());

            const failIfNAProvided = (label, value) => {
              if (isNA(value)) {
                core.setFailed(`Invalid value: ${label} cannot be N/A.`);
                return true;
              }
              return false;
            };

            const hasUsZip = (value) => /\b\d{5}(?:-\d{4})?\b/.test(String(value || ''));

            const isHttpsUrl = (value) => /^https:\/\//i.test(String(value || '').trim());

            const phoneDigits = (value) => String(value || '').replace(/\D/g, '');
            const isValidUsPhone = (value) => {
              const d = phoneDigits(value);
              if (d.length === 10) return true;
              if (d.length === 11 && d.startsWith('1')) return true;
              return false;
            };

            if (isManual) {
              websiteSituation = normalizeInput(manualInputs.website_situation);
              currentWebsiteUrl = normalizeInput(manualInputs.current_website_url);
              domainRegistrar = normalizeInput(manualInputs.domain_registrar);
              technicalPocGitHubUsername = normalizeInput(manualInputs.technical_poc_github_username).replace(/^@/, '');

              domain = normalizeDomain(manualInputs.domain);
              charityName = normalizeInput(manualInputs.charity_name);
              footerEmail = normalizeInput(manualInputs.footer_email);
              footerPhone = normalizeInput(manualInputs.footer_phone);
              footerAddress = normalizeInput(manualInputs.footer_address);
              footerEin = normalizeInput(manualInputs.footer_ein);
              irsStatus = normalizeInput(manualInputs.irs_status);
              guideStarProfileUrl = normalizeInput(manualInputs.guidestar_profile_url);
              guideStarDirectProfileUrl = normalizeInput(manualInputs.guidestar_direct_profile_url);

              footerSocialLinks = parseMultiline(manualInputs.social_links);
              leadershipLines = parseMultiline(manualInputs.leadership_lines);
            } else {
              websiteSituation = normalizeInput(extractSection('Website Situation'));
              currentWebsiteUrl = normalizeInput(extractSection('Current Website URL (if any)'));
              domainRegistrar = normalizeInput(extractSection('Domain Registrar (who holds the domain today)'));
              technicalPocGitHubUsername = normalizeInput(extractSection('Technical POC GitHub Username'));
              technicalPocGitHubUsername = technicalPocGitHubUsername.replace(/^@/, '');

              domain = normalizeDomain(extractSection('Website Domain (no http://)'));
              charityName = normalizeInput(extractSection('Organization Name (as displayed)'));
              footerEmail = normalizeInput(extractSection('Footer Contact Email'));
              footerPhone = normalizeInput(extractSection('Footer Contact Phone'));

              const addressLine1 = normalizeInput(extractSection('Footer Mailing Address Line 1'));
              const addressCity = normalizeInput(extractSection('Footer Mailing City'));
              const addressState = normalizeInput(extractSection('Footer Mailing State/Province'));
              const addressPostal = normalizeInput(extractSection('Footer Mailing Postal Code'));

              // Only stamp the country when an address was actually provided, so
              // admin-minimal runs that omit the address don't end up with a
              // country-only string that fails the best-effort ZIP validation.
              const hasAnyAddress = !!(addressLine1 || addressCity || addressState || addressPostal);
              footerAddress = buildAddress({
                line1: addressLine1,
                line2: '',
                city: addressCity,
                state: addressState,
                postal: addressPostal,
                country: hasAnyAddress ? 'United States' : '',
              });

              footerEin = normalizeInput(extractSection('EIN / Tax ID'));

              irsStatus = normalizeInput(extractSection('IRS 501(c)(3) Status'));
              guideStarProfileUrl = normalizeInput(extractSection('Candid / GuideStar Profile URL'));
              guideStarDirectProfileUrl = normalizeInput(extractSection('Candid / GuideStar Direct Profile Link'));

              // Issue-based runs normally require all 4 social URLs; admin-minimal
              // runs treat them as optional (same as manual best-effort dispatch).
              const validateSocialUrl = bestEffort ? validateOptionalUrl : validateRequiredUrl;

              const facebookUrl = validateSocialUrl('Facebook URL', extractSection('Facebook URL'));
              if (facebookUrl === null) return;
              const xUrl = validateSocialUrl('X / Twitter URL', extractSection('X / Twitter URL'));
              if (xUrl === null) return;
              const linkedinUrl = validateSocialUrl('LinkedIn URL', extractSection('LinkedIn URL'));
              if (linkedinUrl === null) return;
              const githubUrl = validateSocialUrl('GitHub URL', extractSection('GitHub URL'));
              if (githubUrl === null) return;

              footerSocialLinks = [
                facebookUrl ? `facebook: ${facebookUrl}` : '',
                xUrl ? `x: ${xUrl}` : '',
                linkedinUrl ? `linkedin: ${linkedinUrl}` : '',
                githubUrl ? `github: ${githubUrl}` : '',
              ].filter(Boolean);

              // Leadership can be provided as:
              // 1) A single multiline block ("Board / Leadership")
              // 2) Role-specific board fields (current form)
              // 3) Numbered leader fields (older legacy form)
              const leadershipBlock = normalizeInput(extractSection('Board / Leadership'));
              if (leadershipBlock && !/^n\/?a$/i.test(leadershipBlock.trim())) {
                leadershipLines = leadershipBlock
                  .split(/\r?\n/)
                  .map(s => s.trim())
                  .filter(s => s && !/^n\/?a$/i.test(s));
              } else {
                const boardPresident = normalizeInput(extractSection('Board President'));
                const boardVicePresident = normalizeInput(extractSection('Board Vice President'));
                const boardSecretary = normalizeInput(extractSection('Board Secretary'));
                const boardTreasurer = normalizeInput(extractSection('Board Treasurer'));
                const boardMemberAtLarge = normalizeInput(extractSection('Board Member at Large'));

                const anyBoardFieldsProvided = !!(
                  boardPresident ||
                  boardVicePresident ||
                  boardSecretary ||
                  boardTreasurer ||
                  boardMemberAtLarge
                );

                const parseNameAndLinkedIn = (value) => {
                  const raw = String(value || '').trim();
                  if (!raw) return { name: '', linkedin: '' };

                  // Expected: "Name | https://..." (LinkedIn optional)
                  const parts = raw.split('|').map(p => String(p || '').trim());
                  const name = parts[0] || '';
                  const linkedin = parts.length >= 2 ? (parts[1] || '') : '';
                  return { name, linkedin };
                };

                leadershipLines = [];
                if (anyBoardFieldsProvided) {
                  for (const [role, raw] of [
                    ['President', boardPresident],
                    ['Vice President', boardVicePresident],
                    ['Secretary', boardSecretary],
                    ['Treasurer', boardTreasurer],
                    ['Member at Large', boardMemberAtLarge],
                  ]) {
                    if (!raw) continue;
                    const { name, linkedin } = parseNameAndLinkedIn(raw);
                    if (!name) continue;
                    leadershipLines.push(`${name} | ${role} | ${linkedin}`);
                  }
                } else {
                  for (let i = 1; i <= 6; i++) {
                    const name = normalizeInput(extractSection(`Leader ${i} Name`));
                    const title = normalizeInput(extractSection(`Leader ${i} Role/Title`));
                    const linkedin = normalizeInput(extractSection(`Leader ${i} LinkedIn URL`));

                    if (!name) continue;
                    if (!title) leadershipLines.push(`${name} | Board Member | ${linkedin}`);
                    else leadershipLines.push(`${name} | ${title} | ${linkedin}`);
                  }
                }
              }
            }

            const usingPrimaryForm = !!domain;

            // Backward-compat: previous website request form fields
            // If the new headings are not present, fall back to the older headings.
            if (!domain) {
              dnsControlled = true;
              domain = normalizeDomain(extractSection('Apex Domain'));
              charityName = normalizeInput(extractSection('Charity / Organization Name'));
              footerEmail = normalizeInput(extractSection('Public Contact Email'));
              footerPhone = normalizeInput(extractSection('Public Contact Phone (optional)'));
              footerAddress = normalizeInput(extractSection('Public Mailing Address (optional)'));
              footerEin = normalizeInput(extractSection('EIN / Tax ID (optional)'));

              const footerSocialLegacy = normalizeInput(extractSection('Social Links (optional)'));
              if (footerSocialLegacy) {
                footerSocialLinks = footerSocialLegacy
                  .split(/\r?\n/)
                  .map(s => s.trim())
                  .filter(Boolean);
              }

              const leadershipLegacy = normalizeInput(extractSection('Board / Leadership'));
              if (leadershipLegacy) {
                leadershipLines = leadershipLegacy
                  .split(/\r?\n/)
                  .map(s => s.trim())
                  .filter(Boolean);
              }
            }

            if (!domain) {
              core.setFailed('Missing required field: domain.');
              return;
            }

            // Enforce non-placeholder values for required fields.
            // We cannot prevent users from typing `N/A` into a required field in GitHub Issue Forms,
            // so we block the workflow if it happens.
            if (!bestEffort) {
              const requiredChecks = [
                ['domain', domain],
                ['Organization Name (as displayed)', charityName],
                ['Footer Contact Email', footerEmail],
                ['Footer Contact Phone', footerPhone],
                ['EIN / Tax ID', footerEin],
                ['Technical POC GitHub Username', technicalPocGitHubUsername],
              ];

              for (const [label, value] of requiredChecks) {
                if (isDisallowedValue(value)) {
                  core.setFailed(`Invalid value for required field: ${label}. Please provide a real value (not N/A).`);
                  return;
                }
              }
            } else {
              // Manual dispatch / admin-minimal: best-effort mode.
              // Domain is required; everything else is optional (but N/A is never allowed).
              if (isDisallowedValue(domain)) {
                core.setFailed('Invalid value for required field: domain. Please provide a real value (not N/A).');
                return;
              }
            }

            // Optional fields: blank is allowed, but N/A is not.
            if (failIfNAProvided('Current Website URL (if any)', currentWebsiteUrl)) return;
            if (failIfNAProvided('Organization Name (as displayed)', charityName)) return;
            if (failIfNAProvided('Footer Contact Email', footerEmail)) return;
            if (failIfNAProvided('Footer Contact Phone', footerPhone)) return;
            if (failIfNAProvided('EIN / Tax ID', footerEin)) return;
            if (failIfNAProvided('IRS 501(c)(3) Status', irsStatus)) return;
            if (failIfNAProvided('Candid / GuideStar Profile URL', guideStarProfileUrl)) return;
            if (failIfNAProvided('Candid / GuideStar Direct Profile Link', guideStarDirectProfileUrl)) return;
            if (failIfNAProvided('Technical POC GitHub Username', technicalPocGitHubUsername)) return;

            const is501c3 = /\b501\s*\(c\)\s*3\b/i.test(irsStatus);
            if (!bestEffort && isDisallowedValue(irsStatus)) {
              core.setFailed('Missing required field: IRS 501(c)(3) Status.');
              return;
            }

            // If org is a verified 501(c)(3), GuideStar/Candid links are required.
            if (is501c3) {
              if (isDisallowedValue(guideStarProfileUrl) || !isHttpsUrl(guideStarProfileUrl)) {
                core.setFailed('Candid / GuideStar Profile URL is required for 501(c)(3) and must start with https://.');
                return;
              }
              if (isDisallowedValue(guideStarDirectProfileUrl) || !isHttpsUrl(guideStarDirectProfileUrl)) {
                core.setFailed('Candid / GuideStar Direct Profile Link is required for 501(c)(3) and must start with https://.');
                return;
              }
            } else {
              // If provided anyway, enforce https.
              if (guideStarProfileUrl && !isHttpsUrl(guideStarProfileUrl)) {
                core.setFailed('Candid / GuideStar Profile URL must start with https://.');
                return;
              }
              if (guideStarDirectProfileUrl && !isHttpsUrl(guideStarDirectProfileUrl)) {
                core.setFailed('Candid / GuideStar Direct Profile Link must start with https://.');
                return;
              }
            }

            // Footer phone: must be a valid US phone number (10 digits, or 11 digits starting with 1).
            // Required for full issue-based runs; manual/admin-minimal runs validate only if provided.
            if (!bestEffort || !isDisallowedValue(footerPhone)) {
              if (!isValidUsPhone(footerPhone)) {
                core.setFailed('Footer Contact Phone must be a valid US phone number (10 digits, or 11 digits starting with 1).');
                return;
              }
            }

            // Optional current website URL: must be https:// if provided.
            if (currentWebsiteUrl && !isHttpsUrl(currentWebsiteUrl)) {
              core.setFailed('Current Website URL (if any) must start with https://.');
              return;
            }

            // Address requirement: must map to a real location (issue form).
            // Require Street/PO Box + City/State/ZIP and a valid US ZIP format.
            if (!bestEffort) {
              const line1 = normalizeInput(extractSection('Footer Mailing Address Line 1'));
              const city = normalizeInput(extractSection('Footer Mailing City'));
              const state = normalizeInput(extractSection('Footer Mailing State/Province'));
              const postal = normalizeInput(extractSection('Footer Mailing Postal Code'));

              for (const [label, value] of [
                ['Footer Mailing Address Line 1', line1],
                ['Footer Mailing City', city],
                ['Footer Mailing State/Province', state],
                ['Footer Mailing Postal Code', postal],
              ]) {
                if (isDisallowedValue(value)) {
                  core.setFailed(`Invalid value for required address field: ${label}. Please provide a real value (not N/A).`);
                  return;
                }
              }

              if (!hasUsZip(postal)) {
                core.setFailed('Footer Mailing Postal Code must be a valid US ZIP code (e.g., 85001 or 85001-1234).');
                return;
              }
            } else {
              // Manual dispatch uses a freeform address input.
              // If provided, require it to at least include a US ZIP.
              if (!isDisallowedValue(footerAddress)) {
                if (!hasUsZip(footerAddress)) {
                  core.setFailed('Footer address must include a valid US ZIP code (e.g., 85001 or 85001-1234).');
                  return;
                }
              }
            }

            // Leadership is displayed on the site. Require at least one leader line for full issue-based runs.
            if (!bestEffort) {
              if (!leadershipLines || leadershipLines.length === 0) {
                core.setFailed(
                  'Board / Leadership is required. Provide at least Board President, Board Secretary, and Board Treasurer (or fill out the legacy Board / Leadership block).',
                );
                return;
              }

              // Required leadership roles for primary website requests.
              // We require President, Secretary, and Treasurer (others optional).
              const requiredRolePatterns = [
                { role: 'President', re: /\bpresident\b/i },
                { role: 'Secretary', re: /\bsecretary\b/i },
                { role: 'Treasurer', re: /\btreasurer\b/i },
              ];

              const rolesFound = new Set();
              for (const line of leadershipLines || []) {
                const cleaned = String(line || '').trim().replace(/^[\*-]\s+/, '');
                if (!cleaned) continue;
                if (!cleaned.includes('|')) continue;
                const parts = cleaned.split('|').map(p => String(p || '').trim());
                if (parts.length < 2) continue;
                const role = parts[1] || '';
                for (const { role: requiredRole, re } of requiredRolePatterns) {
                  if (re.test(role)) rolesFound.add(requiredRole);
                }
              }

              const missingRoles = requiredRolePatterns
                .map(r => r.role)
                .filter(r => !rolesFound.has(r));
              if (missingRoles.length > 0) {
                core.setFailed(
                  `Missing required board roles: ${missingRoles.join(', ')}. Please fill out Board President, Board Secretary, and Board Treasurer (or include these roles in the legacy Board / Leadership block).`,
                );
                return;
              }
            }

            // Disallow N/A anywhere in leadership content (manual or issue).
            if (leadershipLines && leadershipLines.some(line => /\bn\/?a\b/i.test(line))) {
              core.setFailed(
                'Board / Leadership cannot include N/A. Use real values; leave optional fields blank where allowed (e.g., blank LinkedIn URL).',
              );
              return;
            }

            // Leadership LinkedIn URLs: if provided, must be https://
            if (leadershipLines && leadershipLines.length > 0) {
              for (const line of leadershipLines) {
                const cleaned = String(line || '').trim().replace(/^[\*-]\s+/, '');
                if (!cleaned) continue;

                // Only validate pipe-delimited formats where a LinkedIn URL field is present.
                if (!cleaned.includes('|')) continue;
                const parts = cleaned.split('|').map(p => String(p || '').trim());
                if (parts.length < 3) continue;

                const linkedinUrl = parts[parts.length - 1];
                if (!linkedinUrl) continue;
                if (!isHttpsUrl(linkedinUrl)) {
                  core.setFailed('Leadership LinkedIn URLs must start with https:// (leave blank if not available).');
                  return;
                }
              }
            }

            // Social URLs: full issue-based runs require all 4; manual/admin-minimal runs are best-effort.
            if (bestEffort) {
              for (const line of footerSocialLinks || []) {
                if (/\bn\/?a\b/i.test(line)) {
                  core.setFailed('Social links cannot include N/A. Provide a real URL or leave it blank.');
                  return;
                }

                const clean = String(line || '').trim().replace(/^[\*-]\s+/, '');
                const m = clean.match(/^(?<k>[A-Za-z ]+)\s*:\s*(?<v>\S+)$/);
                if (!m) continue;
                const v = String(m.groups?.v || '').trim();
                if (v && !/^https:\/\//i.test(v)) {
                  core.setFailed('Social links must use https:// URLs.');
                  return;
                }
              }
            }

            const repoName = `FFC-EX-${domain}`;
            const org = process.env.WEBSITE_TARGET_ORG || 'FreeForCharity';
            const repoFull = `${org}/${repoName}`;

            const templateRepo = process.env.WEBSITE_TEMPLATE_REPO || 'FreeForCharity/FFC_Single_Page_Template';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Maintainers to add: requester + technical POC, deduped and validated
            // against GitHub's login format. Emitted as a space-separated list for
            // the reusable "98. Repo - Add Collaborator" workflow, which re-validates
            // and adds each one best-effort.
            const loginRe = /^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$/;
            const maintainersCsv = [...new Set(
              [requesterGitHubUsername, technicalPocGitHubUsername]
                .map(s => String(s || '').trim().replace(/^@/, ''))
                .filter(s => loginRe.test(s))
            )].join(' ');

            core.setOutput('skip', 'false');
            core.setOutput('issue_number', isManual ? '' : String(issue.number));
            core.setOutput('post_comments', isManual ? 'false' : 'true');
            core.setOutput('dns_controlled', dnsControlled ? 'true' : 'false');
            core.setOutput('website_situation', websiteSituation);
            core.setOutput('current_website_url', currentWebsiteUrl);
            core.setOutput('domain_registrar', domainRegistrar);
            core.setOutput('requester_github_username', requesterGitHubUsername);
            core.setOutput('technical_poc_github_username', technicalPocGitHubUsername);
            core.setOutput('maintainers_csv', maintainersCsv);
            core.setOutput('domain', domain);
            core.setOutput('charity_name', charityName);
            core.setOutput('footer_email', footerEmail);
            core.setOutput('footer_phone', footerPhone);
            core.setOutput('footer_address_json', JSON.stringify(footerAddress));
            core.setOutput('footer_ein', footerEin);
            core.setOutput('irs_status', irsStatus);
            core.setOutput('guidestar_profile_url', guideStarProfileUrl);
            core.setOutput('guidestar_direct_profile_url', guideStarDirectProfileUrl);
            core.setOutput('footer_social_json', JSON.stringify(footerSocialLinks));
            core.setOutput('leadership_json', JSON.stringify(leadershipLines));
            core.setOutput('repo_name', repoName);
            core.setOutput('repo_full', repoFull);
            core.setOutput('template_repo', templateRepo);
            core.setOutput('run_url', runUrl);

  zone_check:
    runs-on: windows-latest
    environment: cloudflare-prod-read
    needs: [resolve]
    if: needs.resolve.outputs.skip != 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      zone_controlled: ${{ steps.check.outputs.zone_controlled }}
      zone_account: ${{ steps.check.outputs.zone_account }}
      zone_exists_ffc: ${{ steps.check.outputs.zone_exists_ffc }}
      zone_exists_cm: ${{ steps.check.outputs.zone_exists_cm }}
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC. zone_check
      # only does GETs (cloudflare-zone-get.ps1), so use scope: read.
      # continue-on-error preserves the original best-effort behavior: if OIDC/KV fails,
      # the next step's existing "missing tokens" fallback marks the zone as not controlled.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}
        continue-on-error: true

      - name: Cloudflare source-of-truth zone check
        id: check
        shell: pwsh
        # Issue-derived values reach the script through the environment, never
        # through `${{ }}` in `run:`. The runner substitutes an expression into
        # the script TEXT before pwsh parses it, so a value carrying a quote
        # closes the literal and everything after it is executed as code. This
        # workflow's trigger is `issues: [assigned]` on a PUBLIC repo, which
        # makes every parsed field attacker-authored. See ledger L28.
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          $domain = [string]$env:DOMAIN

          # Best-effort: if secrets are missing, treat as not controlled and continue.
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN_FFC) -or [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN_CM)) {
            Write-Host 'Cloudflare tokens missing; skipping zone check and treating domain as not controlled.' -ForegroundColor Yellow
            "zone_exists_ffc=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "zone_exists_cm=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "zone_controlled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "zone_account=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $ffc = (& pwsh -NoProfile -File .\scripts\cloudflare-zone-get.ps1 -Domain $domain -Account FFC) | ConvertFrom-Json
          $cm  = (& pwsh -NoProfile -File .\scripts\cloudflare-zone-get.ps1 -Domain $domain -Account CM)  | ConvertFrom-Json

          $existsFfc = [bool]$ffc.exists
          $existsCm  = [bool]$cm.exists
          $controlled = ($existsFfc -or $existsCm)

          $account = ''
          if ($existsFfc) { $account = 'FFC' }
          elseif ($existsCm) { $account = 'CM' }

          $toFlag = {
            param([string]$Name, [bool]$Value)
            $v = if ($Value) { 'true' } else { 'false' }
            "$Name=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          & $toFlag -Name 'zone_exists_ffc' -Value $existsFfc
          & $toFlag -Name 'zone_exists_cm' -Value $existsCm
          & $toFlag -Name 'zone_controlled' -Value $controlled

          "zone_account=$account" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  announce:
    runs-on: ubuntu-latest
    needs: [resolve, zone_check]
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.post_comments == 'true'
    steps:
      - name: Comment start
        uses: actions/github-script@v9
        env:
          # Pass values through the environment instead of inlining `${{ }}` into
          # the script body: a value containing a quote, newline or `${` would
          # otherwise break the JS source (SyntaxError) and is a script-injection
          # vector.
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          REPO_FULL: ${{ needs.resolve.outputs.repo_full }}
          TEMPLATE_REPO: ${{ needs.resolve.outputs.template_repo }}
          RUN_URL: ${{ needs.resolve.outputs.run_url }}
          ZONE_CONTROLLED: ${{ needs.zone_check.outputs.zone_controlled }}
          ZONE_ACCOUNT: ${{ needs.zone_check.outputs.zone_account }}
          WEBSITE_SITUATION: ${{ needs.resolve.outputs.website_situation }}
          REQUESTER: ${{ needs.resolve.outputs.requester_github_username }}
          TECHNICAL_POC: ${{ needs.resolve.outputs.technical_poc_github_username }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const domain = process.env.DOMAIN;
            const repoFull = process.env.REPO_FULL;
            const templateRepo = process.env.TEMPLATE_REPO;
            const runUrl = process.env.RUN_URL;
            const zoneControlled = process.env.ZONE_CONTROLLED === 'true';
            const zoneAccount = process.env.ZONE_ACCOUNT;
            const websiteSituation = process.env.WEBSITE_SITUATION;
            const requester = process.env.REQUESTER;
            const technicalPoc = process.env.TECHNICAL_POC;

            const steps = zoneControlled
              ? [
                  '1) Configure DNS for GitHub Pages (Cloudflare)',
                  '2) Create repo from template + enable Pages + set custom domain',
                  '3) Apply footer + leadership content',
                ]
              : [
                  '1) Create repo from template + enable Pages (no custom domain)',
                  '2) Apply footer + leadership content',
                ];

            const body = [
              `Provisioning started for **${domain}**`,
              '',
              `- Target repo: **${repoFull}**`,
              `- Template: **${templateRepo}**`,
              `- Run: ${runUrl}`,
              websiteSituation ? `- Website situation: **${websiteSituation}**` : null,
              requester ? `- Requester: @${requester}` : null,
              technicalPoc ? `- Technical POC: @${technicalPoc}` : null,
              `- Cloudflare source-of-truth: **${zoneControlled ? 'Controlled (will set custom domain)' : 'Not controlled (no custom domain)'}**${zoneAccount ? ` (account: ${zoneAccount})` : ''}`,
              '',
              'Steps:',
              ...steps,
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  # 111's `preview` half, for DNS (#983). The rehearsal is RELOCATED to the
  # ungated read lane, not deleted: this runs the identical
  # `Update-CloudflareDns.ps1 -EnforceStandard -GitHubPagesOnly` with `-DryRun`
  # forced on, plus the `-Audit` pass, and uploads the same plan artifact — so a
  # dry dispatch still produces the change plan a human reviews, without parking
  # on a reviewer gate or minting a write-scoped token.
  #
  # `scope: read` is sound because every write in that script sits behind
  # `if ($DryRun) { log; return }` — the dry path issues GETs only. `zone_check`
  # is NOT this job: it only asks whether the zone exists in FFC or CM and emits
  # four booleans; it never enumerates a record or computes the apex/www plan.
  #
  # Runs on live dispatches too (like 111's preview), so the plan is always in
  # the log next to what `dns` then applied.
  dns_preview:
    runs-on: windows-latest
    environment: cloudflare-prod-read
    needs: [resolve, zone_check]
    if: >-
      needs.resolve.outputs.skip != 'true' && needs.zone_check.outputs.zone_controlled == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Preview GitHub Pages DNS changes (apex + www)
        id: preview
        shell: pwsh
        # Issue-derived value — passed by environment, not interpolated into the
        # script text. See the note in zone_check and ledger L28.
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'
          $domain = [string]$env:DOMAIN

          $outDir = Join-Path $env:RUNNER_TEMP 'website-provision-dns-preview'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # -DryRun is hard-coded here: this job exists to rehearse, and it holds
          # a read-scoped token that could not perform a write in any case.
          $out = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -EnforceStandard -GitHubPagesOnly -DryRun *>&1
          # Capture IMMEDIATELY: $ErrorActionPreference = 'Stop' does not throw on
          # a native command's non-zero exit, so without this the step goes green
          # having uploaded an error transcript as if it were a change plan — a
          # rehearsal that silently fails is worse than no rehearsal, because the
          # artifact looks like a plan. The audit call below overwrites
          # $LASTEXITCODE, which is the other reason this cannot wait.
          $enforceExit = $LASTEXITCODE
          $outPath = Join-Path $outDir 'dns-enforce-preview.txt'
          $out | Out-File -FilePath $outPath -Encoding utf8

          # Best-effort and deliberately unchecked: the audit is context for the
          # reader, not the rehearsal's verdict.
          $audit = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -Audit -ErrorAction Continue *>&1
          $auditPath = Join-Path $outDir 'dns-audit-before.txt'
          $audit | Out-File -FilePath $auditPath -Encoding utf8

          "out_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # Fail AFTER both transcripts are written and out_dir is published, so
          # the upload step below still has something to attach for diagnosis.
          if ($enforceExit -ne 0) {
            throw "Update-CloudflareDns.ps1 (preview) failed with exit code $enforceExit - see the website-provision-dns-preview artifact."
          }

      - name: Upload DNS preview
        # always(): the transcript matters most when the preview FAILED. Guarded
        # on out_dir so a failure before the directory was published cannot turn
        # into a second, misleading "no files found" error.
        if: always() && steps.preview.outputs.out_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: website-provision-dns-preview
          path: ${{ steps.preview.outputs.out_dir }}/*.txt
          if-no-files-found: error

  dns:
    runs-on: windows-latest
    environment: cloudflare-prod-write
    needs: [resolve, zone_check, dns_preview]
    # 111's `apply` half. A dry run must not reach this job at all (#983):
    # `dry_run` used to be enforced only INSIDE the step below, so the job still
    # started, still parked the run on the `cloudflare-prod-write` reviewer
    # gate, and still minted a write-scoped Cloudflare token — before any step
    # decided to do nothing. The rehearsal is not lost by skipping it, because
    # `dns_preview` above performs it on the read lane.
    #
    # `!= true`, NOT 111's `== false`. Both are correct on the dispatch path,
    # and on 701's `issues` / `repository_dispatch` paths `inputs.dry_run` is
    # null, which casts to 0 — so `== false` is `0 == 0` → TRUE and the job runs
    # there either way. The reason to prefer `!= true` is the STRING case: a
    # value read as `github.event.inputs.dry_run`, or an input later retyped
    # from `boolean` to `choice`/`string`, yields the string "false", which
    # casts to NaN. `"false" == false` is then FALSE and the job would be
    # silently SKIPPED on a live run — a missed DNS repoint that reads as
    # success. `!= true` survives that (NaN != 1). See the Actions expression
    # casting table: Null → 0, false → 0, "false" → NaN.
    if: >-
      always() && inputs.dry_run != true && needs.resolve.outputs.skip != 'true' &&
      needs.zone_check.outputs.zone_controlled == 'true' && (needs.dns_preview.result == 'success'
      || needs.dns_preview.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Enforce GitHub Pages DNS (apex + www)
        id: enforce
        shell: pwsh
        # Issue-derived value — passed by environment, not interpolated into the
        # script text. See the note in zone_check and ledger L28.
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $domain = [string]$env:DOMAIN

          $outDir = Join-Path $env:RUNNER_TEMP 'website-provision-dns'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # -DryRun:$bool — PowerShell's switch-with-value form, so ONE call site
          # serves both modes and the dry path cannot drift from the live one.
          $dryRun = ([string]$env:DRY_RUN) -eq 'true'
          $out = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -EnforceStandard -GitHubPagesOnly -DryRun:$dryRun *>&1
          # Pre-existing hole, found while reviewing the preview job above (#985):
          # nothing checked this exit code, so a FAILED DNS repoint on a live
          # provisioning run reported success — the run went green, the artifact
          # held an error transcript, and the site never resolved. That is the
          # #918 / #934 shape ("the cutover reported OK"). `-ErrorActionPreference
          # Stop` does not cover a native command's exit code; only this does.
          # Captured immediately because the audit call below overwrites it.
          $enforceExit = $LASTEXITCODE
          $outPath = Join-Path $outDir 'dns-enforce.txt'
          $out | Out-File -FilePath $outPath -Encoding utf8

          # Best-effort and deliberately unchecked (note its -ErrorAction Continue):
          # the after-audit is context for the reader, not the enforcement verdict.
          $audit = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -Audit -ErrorAction Continue *>&1
          $auditPath = Join-Path $outDir 'dns-audit-after.txt'
          $audit | Out-File -FilePath $auditPath -Encoding utf8

          "out_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # Fail AFTER the transcripts are written and out_dir is published, so
          # the upload step still has the evidence to attach.
          if ($enforceExit -ne 0) {
            throw "Update-CloudflareDns.ps1 failed with exit code $enforceExit - see the website-provision-dns artifact."
          }

      - name: Upload DNS outputs
        # always(): the transcript matters most when the enforcement FAILED.
        # Guarded on out_dir so a failure before it was published cannot become a
        # second, misleading "no files found" error.
        if: always() && steps.enforce.outputs.out_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: website-provision-dns
          path: ${{ steps.enforce.outputs.out_dir }}/*.txt
          if-no-files-found: error

  repo:
    runs-on: windows-latest
    environment: github-prod
    needs: [resolve, zone_check, dns]
    if: >-
      always() && needs.resolve.outputs.skip != 'true' && (needs.dns.result == 'success' ||
      needs.dns.result == 'skipped')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Create repo from template + enable Pages
        shell: pwsh
        # Issue-derived values by environment, not `${{ }}` in `run:`. This step
        # holds the org-wide write PAT in $env:GH_TOKEN, so a quote in a parsed
        # field would have run attacker code next to that credential. Ledger L28.
        env:
          REPO_FULL: ${{ needs.resolve.outputs.repo_full }}
          REPO_NAME: ${{ needs.resolve.outputs.repo_name }}
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          CHARITY_NAME: ${{ needs.resolve.outputs.charity_name }}
          TEMPLATE_REPO: ${{ needs.resolve.outputs.template_repo }}
          ZONE_CONTROLLED: ${{ needs.zone_check.outputs.zone_controlled }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dryRun = ([string]$env:DRY_RUN) -eq 'true'
          $repoFull = [string]$env:REPO_FULL
          $repoName = [string]$env:REPO_NAME
          $domain = [string]$env:DOMAIN
          $charityName = [string]$env:CHARITY_NAME
          $templateRepo = [string]$env:TEMPLATE_REPO
          $zoneControlled = ([string]$env:ZONE_CONTROLLED) -eq 'true'

          if ([string]::IsNullOrWhiteSpace($charityName)) {
            $charityName = $domain
          }

          # Best-effort check: if repo already exists, skip creation.
          # NOTE: native commands (gh) do not throw on failure in PowerShell, so a
          # try/catch around `gh repo view` never detects a missing repo — it left
          # $exists always true and the step exiting with gh's failure code. Check
          # $LASTEXITCODE instead.
          gh repo view $repoFull --json nameWithOwner 1>$null 2>$null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            Write-Host "Repo already exists: $repoFull. Skipping creation." -ForegroundColor Yellow
            exit 0
          } else {
            $createParams = @{
              RepoName      = $repoName
              Organization  = [string]$env:WEBSITE_TARGET_ORG
              Description   = "Website for $charityName ($domain)"
              TemplateRepo  = $templateRepo
              Visibility    = 'public'
              EnableIssues  = $true
              EnablePages   = $true
            }

            if ($zoneControlled) {
              $createParams.CNAME = $domain
            } else {
              $createParams.PagesDomainType = 'github-default'
            }

            if ($dryRun) { $createParams.DryRun = $true }

            # Seed $LASTEXITCODE: in DryRun the script invokes no native command, so
            # $LASTEXITCODE keeps whatever it held (often $null) and the check below
            # throws "failed with exit code " on a run that actually succeeded. This
            # is the defect that made 720's dry run unusable.
            $LASTEXITCODE = 0
            ./scripts/Create-GitHubRepo.ps1 @createParams
            if ($LASTEXITCODE -ne 0) {
              throw "Create-GitHubRepo.ps1 failed with exit code $LASTEXITCODE"
            }
          }

  # Add the requester + technical POC as repo maintainers via the reusable
  # "98. Repo - Add Collaborator" workflow. soft_fail keeps this best-effort:
  # a bad/owner/non-existent login warns instead of failing provisioning.
  maintainers:
    needs: [resolve, repo]
    if: >-
      needs.resolve.outputs.skip != 'true' && needs.repo.result == 'success' &&
      needs.resolve.outputs.maintainers_csv != ''
    # A `uses:` job does not inherit a permissions block implicitly in a way that is
    # obvious to readers, and 729 now mints an OIDC token for Key Vault. Declared
    # explicitly so this call cannot silently lose id-token when 701's
    # workflow-level block is next edited (#844).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/729-repo-add-collaborator.yml
    with:
      repo: ${{ needs.resolve.outputs.repo_full }}
      username: ${{ needs.resolve.outputs.maintainers_csv }}
      permission: maintain
      soft_fail: true
      # 729 already accepts dry_run over workflow_call — forward it so a 701 dry
      # run cannot silently perform a real collaborator grant.
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  content:
    runs-on: windows-latest
    environment: github-prod
    needs: [resolve, zone_check, repo]
    if: needs.resolve.outputs.skip != 'true'
    # Best-effort by design: content patching is cosmetic polish on an already-provisioned
    # site. The inner try/catch covers the patch/commit/push, but earlier steps (clone,
    # gh auth setup-git) can still fail the job — continue-on-error ensures no content
    # failure ever overrides a successful repo/DNS provision or blocks finalize.
    continue-on-error: true
    outputs:
      content_status: ${{ steps.apply.outputs.content_status }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Apply footer + leadership content
        id: apply
        shell: pwsh
        # Every value below is parsed out of the issue body, and this step also
        # holds the org-wide write PAT in $env:GH_TOKEN. They reach the script
        # through the environment so that no attacker-authored byte is ever part
        # of the script TEXT the runner hands to pwsh. Ledger L28.
        #
        # The `*_JSON` fields were the least obvious of the set: `JSON.stringify`
        # escapes `"` but not `'`, and they were interpolated into SINGLE-quoted
        # literals — so a leadership line or address containing an apostrophe
        # closed the literal, which is both an injection and a plain correctness
        # bug for any charity whose name has one in it.
        env:
          REPO_FULL: ${{ needs.resolve.outputs.repo_full }}
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          CHARITY_NAME: ${{ needs.resolve.outputs.charity_name }}
          WEBSITE_SITUATION: ${{ needs.resolve.outputs.website_situation }}
          CURRENT_WEBSITE_URL: ${{ needs.resolve.outputs.current_website_url }}
          DOMAIN_REGISTRAR: ${{ needs.resolve.outputs.domain_registrar }}
          REQUESTER: ${{ needs.resolve.outputs.requester_github_username }}
          TECHNICAL_POC: ${{ needs.resolve.outputs.technical_poc_github_username }}
          ZONE_CONTROLLED: ${{ needs.zone_check.outputs.zone_controlled }}
          FOOTER_EMAIL: ${{ needs.resolve.outputs.footer_email }}
          FOOTER_PHONE: ${{ needs.resolve.outputs.footer_phone }}
          FOOTER_ADDRESS_JSON: ${{ needs.resolve.outputs.footer_address_json }}
          FOOTER_EIN: ${{ needs.resolve.outputs.footer_ein }}
          IRS_STATUS: ${{ needs.resolve.outputs.irs_status }}
          GUIDESTAR_PROFILE_URL: ${{ needs.resolve.outputs.guidestar_profile_url }}
          GUIDESTAR_DIRECT_PROFILE_URL: ${{ needs.resolve.outputs.guidestar_direct_profile_url }}
          FOOTER_SOCIAL_JSON: ${{ needs.resolve.outputs.footer_social_json }}
          LEADERSHIP_JSON: ${{ needs.resolve.outputs.leadership_json }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repoFull = [string]$env:REPO_FULL
          $domain = [string]$env:DOMAIN
          $charityName = [string]$env:CHARITY_NAME
          $websiteSituation = [string]$env:WEBSITE_SITUATION
          $currentWebsiteUrl = [string]$env:CURRENT_WEBSITE_URL
          $domainRegistrar = [string]$env:DOMAIN_REGISTRAR
          $requester = [string]$env:REQUESTER
          $technicalPoc = [string]$env:TECHNICAL_POC
          $zoneControlled = ([string]$env:ZONE_CONTROLLED) -eq 'true'

          $footerEmail = [string]$env:FOOTER_EMAIL
          $footerPhone = [string]$env:FOOTER_PHONE
          $footerAddress = [string]$env:FOOTER_ADDRESS_JSON | ConvertFrom-Json
          $footerEin = [string]$env:FOOTER_EIN

          $irsStatus = [string]$env:IRS_STATUS
          $guideStarProfileUrl = [string]$env:GUIDESTAR_PROFILE_URL
          $guideStarDirectProfileUrl = [string]$env:GUIDESTAR_DIRECT_PROFILE_URL

          $footerSocial = [string]$env:FOOTER_SOCIAL_JSON | ConvertFrom-Json
          $leadership = [string]$env:LEADERSHIP_JSON | ConvertFrom-Json

          $workDir = Join-Path $env:RUNNER_TEMP 'website-provision-repo'
          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir }
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null

          $cloneDir = Join-Path $workDir 'repo'
          gh repo clone $repoFull $cloneDir
          Set-Location $cloneDir

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # `gh repo clone` configures a plain https remote with no push
          # credentials, so a later `git push` prompts for a username and fails in
          # CI ("could not read Username for https://github.com"). Wire git to use
          # gh's token (GH_TOKEN) as the credential helper for github.com.
          gh auth setup-git --hostname github.com

          $content = [ordered]@{
            domain = $domain
            charityName = $charityName
            websiteSituation = $websiteSituation
            currentWebsiteUrl = $currentWebsiteUrl
            domainRegistrar = $domainRegistrar
            requesterGitHubUsername = $requester
            technicalPocGitHubUsername = $technicalPoc
            cloudflareZoneControlled = $zoneControlled
            footer = [ordered]@{
              email = $footerEmail
              phone = $footerPhone
              address = $footerAddress
              ein = $footerEin
              irsStatus = $irsStatus
              guideStarProfileUrl = $guideStarProfileUrl
              guideStarDirectProfileUrl = $guideStarDirectProfileUrl
              socialLinks = @($footerSocial)
            }
            leadership = @($leadership)
            generatedUtc = (Get-Date).ToUniversalTime().ToString('o')
          }

          $json = $content | ConvertTo-Json -Depth 8
          $json | Out-File -FilePath 'ffc-content.json' -Encoding utf8

          # Patch the actual React template files in the newly provisioned repo.
          function Test-SocialLinksPresent {
            param([string[]]$Links)
            if (-not $Links -or $Links.Count -eq 0) { return $false }
            $map = @{}
            foreach ($line in $Links) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $m = [regex]::Match($line.Trim(), '^(?<k>[A-Za-z ]+)\s*:\s*(?<v>https://\S+)$')
              if (-not $m.Success) { continue }
              $k = $m.Groups['k'].Value.Trim().ToLowerInvariant()
              $map[$k] = $m.Groups['v'].Value.Trim()
            }
            foreach ($k in @('facebook', 'x', 'linkedin', 'github')) {
              if (-not $map.ContainsKey($k)) { return $false }
            }
            return $true
          }

          $canApplyTemplate = (
            -not [string]::IsNullOrWhiteSpace($charityName) -and
            -not [string]::IsNullOrWhiteSpace($footerEmail) -and
            -not [string]::IsNullOrWhiteSpace($footerPhone) -and
            -not [string]::IsNullOrWhiteSpace($footerEin) -and
            -not [string]::IsNullOrWhiteSpace($footerAddress) -and
            ($leadership.Count -gt 0) -and
            (Test-SocialLinksPresent -Links @($footerSocial))
          )

          $is501c3 = $irsStatus -match '501\(c\)3|501\s*\(c\)\s*3'
          if ($is501c3) {
            $canApplyTemplate = $canApplyTemplate -and
              -not [string]::IsNullOrWhiteSpace($guideStarProfileUrl) -and
              -not [string]::IsNullOrWhiteSpace($guideStarDirectProfileUrl)
          }
          # Content patching is cosmetic polish applied AFTER the repo, Pages, and DNS are
          # already provisioned by earlier jobs. A failure here must NEVER mark the whole
          # provision as failed — that historically showed live, serving sites as red runs
          # and blocked the completion comment. Wrap it so any error is a warning, not a
          # job failure, and record the outcome for the finalize comment.
          $contentStatus = 'skipped'
          try {
            if ($canApplyTemplate) {
              $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/Apply-WebsiteReactTemplate.ps1'
              if (-not (Test-Path $scriptPath)) {
                throw "Customization script not found: $scriptPath"
              }

              & $scriptPath `
                -RepoPath $cloneDir `
                -Domain $domain `
                -CharityName $charityName `
                -FooterEmail $footerEmail `
                -FooterPhone $footerPhone `
                -FooterAddress $footerAddress `
                -FooterEin $footerEin `
                -GuideStarProfileUrl $guideStarProfileUrl `
                -GuideStarDirectProfileUrl $guideStarDirectProfileUrl `
                -FooterSocial @($footerSocial) `
                -LeadershipLines @($leadership)
              $contentStatus = 'applied'
            } else {
              # 'skipped' refers to the React template patch only. ffc-content.json
              # (provisioning metadata) was still written above and is committed below —
              # that is long-standing intended behavior, and the finalize comment says so.
              Write-Host 'Skipping React template patch: missing required footer/leadership inputs.' -ForegroundColor Yellow
              $contentStatus = 'skipped'
            }

            git add -A
            # git diff --cached --quiet: 0 = no changes, 1 = changes, other = fatal error.
            # Handle all three explicitly so a fatal diff error surfaces as a failure
            # instead of being mistaken for "there are changes to commit".
            git diff --cached --quiet
            $diffExit = $LASTEXITCODE
            if ($diffExit -eq 1) {
              if (([string]$env:DRY_RUN) -eq 'true') {
                # Everything above already ran — clone, footer/leadership rendering
                # and staging. Only the write is withheld, so the step is still
                # fully exercised.
                Write-Host '::notice::dry_run=true - content rendered and staged, not committed or pushed.'
                git --no-pager diff --cached --stat
              } else {
                git commit -m "chore: apply footer + leadership content" | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "git commit failed (exit $LASTEXITCODE)." }
                git push origin HEAD:main
                if ($LASTEXITCODE -ne 0) { throw "git push to origin main failed (exit $LASTEXITCODE)." }
              }
            } elseif ($diffExit -eq 0) {
              Write-Host "No content changes detected; skipping commit." -ForegroundColor Yellow
            } else {
              throw "git diff --cached failed (exit $diffExit)."
            }
          } catch {
            Write-Warning "Content patch/push failed (non-fatal; the site itself is already provisioned): $_"
            $contentStatus = 'failed'
          }

          "content_status=$contentStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  verify:
    runs-on: ubuntu-latest
    needs: [resolve, zone_check, dns, repo]
    # Only meaningful when the domain is in FFC Cloudflare (so DNS was pointed at GitHub
    # Pages). When the zone is not controlled, DNS is intentionally left alone and the
    # custom domain won't serve yet — nothing to verify.
    if: >-
      always() && needs.resolve.outputs.skip != 'true' && needs.repo.result == 'success' &&
      needs.zone_check.outputs.zone_controlled == 'true' && (needs.dns.result == 'success' ||
      needs.dns.result == 'skipped')
    outputs:
      served: ${{ steps.probe.outputs.served }}
      served_host: ${{ steps.probe.outputs.served_host }}
    steps:
      - name: Probe the live site on GitHub Pages
        id: probe
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
        shell: bash
        run: |
          set -uo pipefail
          served=false
          served_host=''
          # Retry to allow for DNS propagation / GitHub Pages cert issuance on a brand-new
          # custom domain. Non-fatal by design: a not-yet-serving result is reported as a
          # warning, never a hard failure (a slow cert must not turn a good provision red).
          for attempt in $(seq 1 12); do
            for host in "$DOMAIN" "www.$DOMAIN"; do
              # HEAD + follow redirects, then parse status and Server from the final response
              # headers. Uses only widely-available curl flags (-sSIL) rather than the newer
              # -w '%header{...}' write-out, which older runner curl builds may not support.
              # tr -d '\r' before parsing: header lines end in CR, and awk would otherwise
              # keep it in the status code ("200\r" != "200" — a false "not serving").
              headers=$(curl -sSIL --max-time 20 "https://$host" 2>/dev/null | tr -d '\r' || true)
              code=$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP/ { c = $2 } END { print c }')
              server=$(printf '%s\n' "$headers" | grep -i '^server:' | tail -n1 | sed -E 's/^[Ss]erver:[[:space:]]*//')
              echo "attempt $attempt: https://$host -> HTTP ${code:-000}, Server: ${server:-<none>}"
              if [ "${code:-}" = "200" ] && printf '%s' "$server" | grep -qi 'github'; then
                served=true
                served_host="$host"
                break
              fi
            done
            if [ "$served" = "true" ]; then break; fi
            sleep 30
          done
          {
            echo "served=$served"
            echo "served_host=$served_host"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Serving check — $DOMAIN"
            if [ "$served" = "true" ]; then
              echo "✅ Live on GitHub Pages at \`https://$served_host\` (HTTP 200, \`Server: GitHub.com\`)."
            else
              echo "⚠️ Not serving yet after 12 probe attempts (~6–14 min depending on curl timeouts). DNS/cert may still be propagating, or Pages is misconfigured — re-check in a few minutes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$served" != "true" ]; then
            echo "::warning::$DOMAIN did not serve on GitHub Pages within the retry window (may still be propagating)."
          fi

  finalize:
    runs-on: ubuntu-latest
    needs: [resolve, zone_check, dns, repo, maintainers, content, verify]
    # The site is "provisioned" once the repo (Pages) and DNS jobs succeed. Maintainer add,
    # content patch, and the serving probe are non-blocking — the comment reports their
    # status but never gates it, so a live site is never reported as a failed provision.
    if: >-
      always() && needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.post_comments ==
      'true' && (needs.dns.result == 'success' || needs.dns.result == 'skipped') &&
      needs.repo.result == 'success'
    steps:
      - name: Comment completion
        uses: actions/github-script@v9
        env:
          # See the note on the announce job: interpolate via env, not inline,
          # to avoid SyntaxError / script injection from user-derived values.
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          REPO_FULL: ${{ needs.resolve.outputs.repo_full }}
          RUN_URL: ${{ needs.resolve.outputs.run_url }}
          ZONE_CONTROLLED: ${{ needs.zone_check.outputs.zone_controlled }}
          SERVED: ${{ needs.verify.outputs.served }}
          SERVED_HOST: ${{ needs.verify.outputs.served_host }}
          CONTENT_STATUS: ${{ needs.content.outputs.content_status }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const domain = process.env.DOMAIN;
            const repoFull = process.env.REPO_FULL;
            const repoUrl = `${context.serverUrl}/${repoFull}`;
            const runUrl = process.env.RUN_URL;
            const zoneControlled = process.env.ZONE_CONTROLLED === 'true';
            // Empty means the job didn't run or died before writing its output —
            // distinct from an explicit true/false (or applied/skipped/failed) result.
            const servedRaw = process.env.SERVED || '';
            const served = servedRaw === 'true';
            // The probe accepts apex OR www; report the host that actually answered.
            const servedHost = process.env.SERVED_HOST || domain;
            const contentStatus = process.env.CONTENT_STATUS || 'unknown';

            const marker = '<!-- website-provision:completed -->';
            const dnsNote = zoneControlled
              ? '- DNS enforcement used the standard GitHub Pages-only enforcement (apex + www).'
              : '- DNS was NOT changed and GitHub Pages custom domain was NOT set (domain is not in FFC-controlled Cloudflare yet).';
            const servingNote = !zoneControlled
              ? '- Serving check skipped (DNS not pointed at GitHub Pages for this domain yet).'
              : served
                ? `- ✅ Verified live on GitHub Pages: https://${servedHost} returns HTTP 200 (\`Server: GitHub.com\`).`
                : servedRaw === 'false'
                  ? `- ⚠️ Not serving yet (checked https://${domain} and https://www.${domain}) — DNS/cert may still be propagating. Re-check in a few minutes; the repo and DNS are in place.`
                  : `- ❔ Serving check did not run or did not record a result — verify https://${domain} manually (see the run log).`;
            const contentNote =
              contentStatus === 'applied'
                ? '- Content (footer + leadership) was applied to the React template and recorded in `ffc-content.json`.'
                : contentStatus === 'failed'
                  ? '- ⚠️ Content patch step did not complete (non-blocking) — the site is provisioned; footer/leadership can be applied later by re-running or editing the repo.'
                  : contentStatus === 'skipped'
                    ? '- Content patch skipped (admin-minimal provision — no footer/leadership inputs provided); provisioning metadata (`ffc-content.json`) was still recorded in the repo.'
                    : '- ❔ Content step did not record a status (it may have been skipped or errored before reporting) — the site itself is provisioned.';
            const dnsManual = zoneControlled
              ? []
              : [
                  '',
                  'Next steps:',
                  '- Create a follow-up ticket to add/transfer the domain into FFC Cloudflare, then point DNS to GitHub Pages and set the Pages custom domain.',
                  '- GitHub custom domain docs (for reference):',
                  '  https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site',
                ];
            const body = [
              marker,
              `Provisioning completed for **${domain}**`,
              '',
              `- Repo: ${repoUrl}`,
              `- Run: ${runUrl}`,
              '',
              'Notes:',
              dnsNote,
              servingNote,
              contentNote,
              ...dnsManual,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
