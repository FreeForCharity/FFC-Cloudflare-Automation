name: '702. Domain - Deploy Static Clone to FFC-EX Repo'
run-name:
  "Clone+deploy ${{ inputs.domain }} -> ${{ inputs.ffc_ex_repo || format('FFC-EX-{0}',
  inputs.domain) }} (dry_run=${{ inputs.dry_run }})"

# Regenerates an FFC-EX site as a faithful static clone of the live WordPress
# site and opens a PR on the target FFC-EX repo. Pipeline (all proven locally):
#   clone-site-static.mjs (httrack) -> integrate-clone-into-nextjs.mjs ->
#   next build (output: 'export') so the Next.js app serves the exact clone.
# See docs/ffc-ex-static-clone-runbook.md.
#
# Auth: uses CBM_TOKEN (cross-repo PAT, same secret create-repo.yml uses) to
# check out the FFC-EX repo and push a branch + open a PR there. Non-destructive:
# it never pushes to the FFC-EX default branch, only opens a PR for review.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Live apex domain to clone (e.g. browncanyonranch.org)'
        required: true
        type: string
      dry_run:
        description: >-
          Dry-run: clone, integrate and BUILD the site, but do not commit, push or open a PR.
          Everything except the final write still runs, so the result is a real rehearsal rather
          than a smoke test. Default: true.
        required: false
        type: boolean
        default: true
      ffc_ex_repo:
        description: 'Target FFC-EX repo name (default: FFC-EX-<domain>)'
        required: false
        type: string
      depth:
        description: 'httrack mirror depth'
        required: false
        type: string
        default: '8'
      exclude:
        description: 'Comma-separated paths to exclude (e.g. /beta,/members)'
        required: false
        type: string
        default: ''
      build_check:
        description: 'Run `npm ci && npm run build` in the FFC-EX repo to verify the export'
        required: false
        type: boolean
        default: true
      force:
        description:
          'Re-clone even though the target already serves a live site (the PR this opens would
          supersede the existing migration). Leave false unless you are deliberately regenerating.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Required for the Key Vault OIDC exchange (#844).
  id-token: write

# Serialize per-domain so two clones of the same domain can't push branches / open PRs in parallel.
concurrency:
  group: ffc-ex-clone-deploy-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  # Reality check BEFORE the approval gate: verifies the target repo exists (resolving its
  # canonical casing — github.io paths are case-sensitive, so a wrong-case guess probes the
  # wrong URL) and refuses to re-clone a site that is already live unless force=true. Runs
  # ungated so a doomed or dangerous dispatch fails fast without consuming a human approval.
  # Added after the 2026-07-18 incident: a stale inventory led to a clone being dispatched
  # against FFC-EX-AllTypeTowing.com, a completed migration already cut over on its apex.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo_name: ${{ steps.verify.outputs.repo_name }}
    steps:
      - name: Verify target state (exists, not already live)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORG: FreeForCharity
          IN_DOMAIN: ${{ inputs.domain }}
          IN_REPO: ${{ inputs.ffc_ex_repo }}
          IN_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          name="${IN_REPO:-}"
          if [ -z "$name" ]; then name="FFC-EX-${IN_DOMAIN}"; fi
          name="${name##*/}"

          # --- repo must exist (resolve canonical casing via the API) -----------------
          set +e
          resp=$(gh api "repos/$TARGET_ORG/$name" 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if printf '%s' "$resp" | grep -q "HTTP 404"; then
              echo "::error::Target repo $TARGET_ORG/$name does not exist — or is private and not visible to this workflow's GITHUB_TOKEN (FFC-EX charity sites are public by policy, so for those 404 means absent). Create it first with workflow 720 (Repo - Create GitHub Repo), then re-dispatch this clone."
            else
              echo "::error::Preflight could not verify $TARGET_ORG/$name (transient API error?). Failing safe rather than guessing. Details: $resp"
            fi
            exit 1
          fi
          canonical=$(printf '%s' "$resp" | jq -r '.full_name // empty' 2>/dev/null || true)
          if [ -z "$canonical" ]; then
            echo "::error::Preflight got an unparseable response for $TARGET_ORG/$name. Failing safe."
            exit 1
          fi
          canonical_name="${canonical##*/}"

          # Archived repos are read-only: the gated job would fail at push/PR time after
          # consuming a human approval. No force override — no flag makes it writable.
          archived=$(printf '%s' "$resp" | jq -r '.archived // false' 2>/dev/null || true)
          if [ "$archived" = "true" ]; then
            echo "::error::$canonical is archived (read-only) — the clone would fail at push/PR time. Unarchive it in Settings (or pick the right target) before re-dispatching. force=true does not override this."
            echo "⛔ Refused: \`$canonical\` is archived (read-only)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # --- is the site already live? (canonical-case default URL + apex) ----------
          pages_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -L \
            "https://freeforcharity.github.io/${canonical_name}/" 2>/dev/null || echo "000")
          # tr -d '\r' first: HTTP header lines end in CR, and awk would otherwise keep it
          # in the captured status code ("200\r" != "200" — a false negative that would let
          # a live site through).
          apex_headers=$(curl -sSIL --max-time 20 "https://${IN_DOMAIN}/" 2>/dev/null | tr -d '\r' || true)
          apex_code=$(printf '%s\n' "$apex_headers" | awk 'toupper($1) ~ /^HTTP/ { c = $2 } END { print c }')
          # '|| true': a response with no Server header is a valid non-cutover outcome —
          # under set -e/pipefail the failing grep would otherwise kill the whole preflight.
          apex_server=$(printf '%s\n' "$apex_headers" | grep -i '^server:' | tail -n1 | sed -E 's/^[^:]*:[[:space:]]*//' || true)

          # Probe failures must not read as "not live" — that would fail open, exactly
          # like the org-list case. 000/empty means the probe itself failed (network/TLS),
          # not that the site is down; refuse unless force=true explicitly overrides.
          if [ "${IN_FORCE:-false}" != "true" ] && { [ "$pages_code" = "000" ] || [ -z "${apex_code:-}" ]; }; then
            echo "::error::Preflight live-site probes did not complete (default URL: HTTP $pages_code; apex: HTTP ${apex_code:-<none>}). Cannot verify whether $canonical already serves — failing safe. Re-dispatch with force=true only if you have verified the target state yourself."
            echo "⛔ Refused: live-site probes failed (network?) — could not verify target state." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cutover=false
          if [ "${apex_code:-}" = "200" ] && printf '%s' "$apex_server" | grep -qi 'github'; then
            cutover=true
          fi
          pages_live=false
          if [ "$pages_code" = "200" ]; then pages_live=true; fi


          {
            echo "## Clone preflight — ${IN_DOMAIN}"
            echo "- Target repo: \`$canonical\` (exists)"
            echo "- Default Pages URL: HTTP $pages_code"
            echo "- Apex: HTTP ${apex_code:-000}, Server: ${apex_server:-<none>}$([ "$cutover" = "true" ] && echo ' — **cut over to GitHub Pages**')"
          } >> "$GITHUB_STEP_SUMMARY"

          if { [ "$cutover" = "true" ] || [ "$pages_live" = "true" ]; } && [ "${IN_FORCE:-false}" != "true" ]; then
            echo "::error::$canonical already serves a live site (default URL HTTP $pages_code; apex ${apex_code:-000}/${apex_server:-none}). Re-cloning would supersede a completed migration. If that is deliberate, re-dispatch with force=true."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⛔ Refused: target already live. Re-dispatch with \`force=true\` only if regenerating deliberately." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # --- sibling scan: does the org already host ANOTHER repo for this domain? ---
          # An exact-name check is too strict: TechnologyMonastery.org (no FFC-EX prefix)
          # was the charity's real, active Next.js site while FFC-EX-technologymonastery.org
          # was empty. Match the FULL domain (case-insensitive) inside every org repo name —
          # full-domain matching keeps legitimate sibling domains apart (letsdanceactivities
          # .org vs .com do not match each other). The scan FAILS SAFE: an org-list API
          # error refuses rather than silently disabling the guard. force=true skips it.
          if [ "${IN_FORCE:-false}" != "true" ]; then
            set +e
            org_repos=$(gh api "orgs/$TARGET_ORG/repos?per_page=100" --paginate --jq '.[].name' 2>&1)
            list_rc=$?
            set -e
            if [ $list_rc -ne 0 ]; then
              echo "::error::Preflight could not list org repos for the sibling scan (transient API error?). Failing safe rather than guessing. Details: $org_repos"
              exit 1
            fi
            siblings=$(printf '%s\n' "$org_repos" | grep -iF -- "$IN_DOMAIN" | grep -ivx -- "$canonical_name" || true)
            if [ -n "$siblings" ]; then
              {
                echo "⛔ Refused: sibling org repo(s) match \`$IN_DOMAIN\` — one may be the real site:"
                while IFS= read -r s; do echo "- \`$s\`"; done <<< "$siblings"
                echo ""
                echo "Investigate, then re-dispatch with \`force=true\` if this clone is deliberate."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::The org already hosts other repo(s) matching $IN_DOMAIN: $(printf '%s' "$siblings" | tr '\n' ' '). One of them may be the charity's real site — investigate before cloning. If this clone is deliberate, re-dispatch with force=true."
              exit 1
            fi
          else
            echo "- force=true: sibling-domain scan skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "repo_name=$canonical_name" >> "$GITHUB_OUTPUT"

  clone-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    # CBM_TOKEN (cross-repo PAT) lives in the github-prod environment.
    environment: github-prod
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-ffc-copilot-mcp-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Check out automation repo (clone + integration scripts)
        uses: actions/checkout@v7.0.1
        with:
          path: automation

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install httrack
        run: sudo apt-get update && sudo apt-get install -y httrack

      - name: Install Playwright (runtime-asset sync + cutover gate)
        # This repo is intentionally dependency-free, so Playwright is installed
        # ad hoc for the two browser-driven stages rather than committed as a
        # dependency. Chromium only; --with-deps pulls the shared libraries the
        # runner image does not ship.
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Resolve target repo
        id: target
        shell: bash
        env:
          # `repo_name` is the `ffc_ex_repo` / `domain` dispatch input with its
          # canonical casing resolved, republished as a job output. Read through
          # `env:` it arrives as DATA; interpolated into the body below it would
          # be substituted as script TEXT, and `$( )` executes inside a
          # double-quoted bash assignment (#1241, #1233).
          IN_REPO_NAME: ${{ needs.preflight.outputs.repo_name }}
        run: |
          set -euo pipefail
          # Canonical casing resolved by the preflight job (github.io paths and display
          # are case-sensitive even though the git/API layer is not).
          #
          # Fail closed on empty: a blank value would publish `repo=` and every
          # later use would silently address `FreeForCharity/` — a checkout, a
          # push and a `gh pr create` against a repo name that is not there.
          if [ -z "${IN_REPO_NAME:-}" ]; then
            echo "::error::IN_REPO_NAME is empty — the preflight job published no repo_name. Refusing to continue with an unresolved target."
            exit 1
          fi
          echo "repo=$IN_REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "branch=clone/static-from-live-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Clone the live site (httrack)
        working-directory: automation
        run: |
          node scripts/clone-site-static.mjs \
            --domain "${{ inputs.domain }}" \
            --out "$RUNNER_TEMP/clone" \
            --depth "${{ inputs.depth }}" \
            ${{ inputs.exclude && format('--exclude {0}', inputs.exclude) || '' }}
          cat "$RUNNER_TEMP/clone/clone-report.json"

      - name: Mirror runtime-loaded assets
        working-directory: automation
        # httrack only fetches what it can see in markup. Elementor and friends
        # assemble content-hashed chunk URLs in JavaScript, so those are missing
        # from the mirror and every widget depending on them dies silently.
        # See #902.
        run: |
          node scripts/sync-runtime-assets.mjs \
            --domain "${{ inputs.domain }}" \
            --dir "$RUNNER_TEMP/clone/${{ inputs.domain }}"

      - name: Check out target FFC-EX repo
        uses: actions/checkout@v7.0.1
        with:
          repository: 'FreeForCharity/${{ steps.target.outputs.repo }}'
          # Set from Key Vault by the "Load the GitHub PAT" step above.
          token: ${{ env.GH_TOKEN }}
          path: ffc-ex
          fetch-depth: 0

      - name: Integrate clone into the Next.js app
        run: |
          node automation/scripts/integrate-clone-into-nextjs.mjs \
            --clone "$RUNNER_TEMP/clone/${{ inputs.domain }}" \
            --repo ffc-ex \
            --domain "${{ inputs.domain }}"

      - name: Verify Next.js static export builds
        if: ${{ inputs.build_check }}
        working-directory: ffc-ex
        # The FFC-EX fleet migrated to pnpm (7-day minimumReleaseAge, blocked
        # dependency scripts — see the fleet pnpm rollout PRs). Detect the
        # lockfile so this verification matches whichever shape the repo has;
        # corepack reads the exact pnpm version from packageManager.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile
            COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm run build
          else
            npm ci
            npm run build
          fi
          if [ -f out/index.html ]; then
            echo "out/index.html present"
          else
            echo "missing out/index.html"
            exit 1
          fi

      - name: Gate - clone must be self-contained
        if: ${{ inputs.build_check }}
        # Loads every exported page with all requests to the live host aborted.
        # Fails on a surviving legacy dependency OR a missing local asset - the
        # two classes clone-report.json cannot see. See #902.
        run: |
          node automation/scripts/verify-no-legacy.mjs \
            --domain "${{ inputs.domain }}" \
            --dir ffc-ex/out

      # Dry-run stops HERE, deliberately late: the clone, the integration and the
      # Next.js build have all already run, so a dry run exercises everything that
      # can realistically fail and only withholds the write.
      - name: Report what the write would do (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: ffc-ex
        shell: bash
        env:
          # Both arrive as DATA rather than as substituted script text: `repo`
          # carries the dispatch input one hop on, and `branch` is published by
          # the same carrying step. The sink below is a double-quoted `echo`,
          # where `$( )` executes (#1241).
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_REPO:-}" ] || [ -z "${TARGET_BRANCH:-}" ]; then
            echo "::error::TARGET_REPO / TARGET_BRANCH is empty — the 'Resolve target repo' step published nothing."
            exit 1
          fi
          branch="$TARGET_BRANCH"
          # Enumerate ONCE into a file rather than piping into `head`.
          # `git add -A --dry-run | head -200` under `pipefail` is a live bug on
          # any real clone: `head` closes the pipe at line 200, git dies of
          # SIGPIPE, the pipeline returns 141 and `set -e` kills this step —
          # after the clone, the integration and the Next.js build have all
          # already run. Reproduced in this exact shape (strict mode, big
          # producer, inside the redirected block): exit 141, block never
          # completes. A WordPress clone is thousands of paths, so the 200-line
          # cut is always reached. Reading the file with `sed` cannot SIGPIPE,
          # and the count now comes from the same snapshot as the listing
          # instead of a second full traversal that could disagree with it.
          changes="$RUNNER_TEMP/702-dry-run-changes.txt"
          git add -A --dry-run > "$changes"
          total=$(wc -l < "$changes")
          {
            echo "## 702 dry run — no commit, no push, no PR"
            echo ""
            echo "Would have committed to \`$branch\` on \`FreeForCharity/$TARGET_REPO\` and opened a draft PR."
            echo ""
            echo "### Files that would be committed"
            echo ""
            echo '```'
            sed -n '1,200p' "$changes"
            echo '```'
            echo ""
            echo "Total changed paths: $total"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::dry_run=true — clone and build completed, nothing was written to the target repo."

      - name: Commit and open PR on the FFC-EX repo
        if: ${{ !inputs.dry_run }}
        working-directory: ffc-ex
        shell: bash
        env:
          # Same reason as the dry-run step above: this is the WRITE path, on
          # `github-prod` with the Key Vault PAT already loaded, so a value
          # substituted into this body as text executes with that credential in
          # reach (#1241).
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_REPO:-}" ] || [ -z "${TARGET_BRANCH:-}" ]; then
            echo "::error::TARGET_REPO / TARGET_BRANCH is empty — the 'Resolve target repo' step published nothing."
            exit 1
          fi
          git config user.name 'ffc-clone-bot'
          git config user.email 'noreply@freeforcharity.org'
          branch="$TARGET_BRANCH"
          git checkout -b "$branch"
          git add -A
          # --no-verify: the cloned WordPress assets must not run through the
          # FFC-EX repo's husky/lint-staged pre-commit hooks (minified CSS/JS).
          git commit --no-verify \
            -m "Replace template scaffold with faithful static clone of live ${{ inputs.domain }}" \
            -m "Generated by automation workflow 27 (clone-site-static.mjs + integrate-clone-into-nextjs.mjs). The Next.js output:'export' build now serves the exact live WordPress visuals; template page routes moved to _disabled_template_routes/."
          git push -u origin "$branch"
          gh pr create --repo "FreeForCharity/$TARGET_REPO" \
            --base main --head "$branch" --draft \
            --title "Static clone of live ${{ inputs.domain }} (replaces template scaffold)" \
            --body "Automated faithful static clone of the live WordPress site, served via the existing Next.js \`output: 'export'\` build. See the automation repo's docs/ffc-ex-static-clone-runbook.md. Review the visual fidelity against the live site before merging/cutover."
