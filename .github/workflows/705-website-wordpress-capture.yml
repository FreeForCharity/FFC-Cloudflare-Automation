name: '705. Website - Capture WordPress Site (REST API + Scrape) [WP]'
run-name: 'WP capture ${{ inputs.domain }} (mode=${{ inputs.mode }})'

# Captures a live WordPress site from its own REST API plus a rendered-HTML
# scrape, and uploads the result as an artifact for the FFC-EX migration PR.
#
# Why this sits beside 702 rather than replacing it: 702 mirrors with httrack,
# which discovers pages by following links, so its page count is a property of
# the theme's navigation. 705 takes the inventory from /wp-json/wp/v2/pages —
# the CMS's own list, with an X-WP-Total to check it against — and then fetches
# the rendered markup for each of those URLs. That makes "did we get the whole
# site?" a question the run can answer and fail on, instead of one nobody can
# ask. See the header of scripts/capture-wordpress-api.mjs.
#
# A cPanel/FTP backup is deliberately not an input. It yields PHP, a database
# dump and a plugin tree — the inputs to a renderer that will not exist after
# the migration — rather than the rendered artifact being migrated.
#
# Read-only and ungated: it loads no credentials and writes nothing outside the
# run's own artifact. `mode=inspect` (the default) additionally makes no request
# beyond a handful of probes, so it is the safe first dispatch for any domain.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: >-
          Live apex domain that SERVES THE CONTENT (e.g. viewpointministriesinternational.org). No
          scheme, no www. This is the source site, not the FFC-EX repo's name — a charity's new
          short domain often differs from the one its site is actually on, and capturing the wrong
          one yields a clean, green artifact of the wrong website.
        required: true
        type: string
      mode:
        description: >-
          inspect = probe the REST API and report what a capture would get (read-only, seconds).
          capture = fetch every page and asset and upload the result as an artifact.
        required: false
        type: choice
        options: [inspect, capture]
        default: inspect
      max_items:
        description: 'Cap on items fetched per REST collection.'
        required: false
        type: string
        default: '500'
      delay_ms:
        description: >-
          Politeness delay between requests, in milliseconds. These are small shared-hosting
          origins; do not lower this without a reason.
        required: false
        type: string
        default: '250'
      include_posts:
        description: 'Also capture blog posts (not just pages).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize per domain so two runs cannot hammer one small origin at once.
  group: wp-capture-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture WordPress site
    runs-on: ubuntu-latest
    # A real charity site is not the 1-page case. viewpointministriesinternational.org
    # advertises 587 page URLs in its sitemap, and at the 250ms politeness delay
    # the page fetches alone are ~10 minutes before any asset is downloaded.
    # 30 minutes would abort a legitimate capture partway and leave a truncated
    # artifact that still looks like output.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Runs first and unconditionally: the pure logic (URL mapping, asset
      # classification, the rewrite pass, the verdict) is what decides whether
      # the capture is correct, and a live run that exercises broken logic
      # produces a confident, wrong artifact rather than an error.
      - name: Self-test the capture logic (offline)
        run: node scripts/capture-wordpress-api.mjs --self-test

      - name: Resolve inputs
        id: resolve
        # Inputs go through the environment rather than into the script body, so
        # a value carrying shell metacharacters cannot be executed.
        env:
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX: ${{ inputs.max_items }}
          INPUT_DELAY: ${{ inputs.delay_ms }}
          INPUT_POSTS: ${{ inputs.include_posts }}
        shell: bash
        run: |
          set -euo pipefail

          # `domain` is a required dispatch input, so an empty value here means
          # the input did not arrive rather than that a default is wanted. There
          # is no safe default: substituting some other charity's domain would
          # point a live capture at a site nobody asked about.
          domain="${INPUT_DOMAIN:-}"
          if [ -z "$domain" ]; then
            echo "::error::domain is empty — a required input did not reach this step. Refusing to guess a site to capture."
            exit 1
          fi
          # Reject anything that is not a bare hostname before it reaches the
          # script, so a pasted URL or a stray argument fails here with a clear
          # message rather than as a confusing DNS error 200 lines into a run.
          if ! printf '%s' "$domain" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
            echo "::error::domain must be a bare apex hostname (got '$domain'). No scheme, no www, no path."
            exit 1
          fi

          mode="${INPUT_MODE:-}"
          if [ -z "$mode" ]; then mode="inspect"; fi
          case "$mode" in
            inspect|capture) ;;
            *) echo "::error::mode must be 'inspect' or 'capture' (got '$mode')."; exit 1 ;;
          esac

          max="${INPUT_MAX:-}"
          if [ -z "$max" ]; then max="500"; fi
          delay="${INPUT_DELAY:-}"
          if [ -z "$delay" ]; then delay="250"; fi
          posts="${INPUT_POSTS:-}"
          if [ -z "$posts" ]; then posts="false"; fi

          {
            echo "domain=$domain"
            echo "mode=$mode"
            echo "max=$max"
            echo "delay=$delay"
            echo "posts=$posts"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: domain=$domain mode=$mode max=$max delay=$delay posts=$posts"

      # Always runs, in both modes. In capture mode it is the preflight: it says
      # what the REST API reports, which is the number the capture is then
      # checked against.
      - name: Inspect the live WordPress REST API
        id: inspect
        env:
          DOMAIN: ${{ steps.resolve.outputs.domain }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _capture
          set +e
          node scripts/capture-wordpress-api.mjs --domain "$DOMAIN" --inspect --json-out _capture/inspect.json
          rc=$?
          set -e
          echo "verdict_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ]; then
            echo "::warning::Inspect returned a non-ready verdict (exit $rc). See the job summary for which one."
          fi

      - name: Capture the site
        if: steps.resolve.outputs.mode == 'capture'
        env:
          DOMAIN: ${{ steps.resolve.outputs.domain }}
          MAX: ${{ steps.resolve.outputs.max }}
          DELAY: ${{ steps.resolve.outputs.delay }}
          POSTS: ${{ steps.resolve.outputs.posts }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--domain "$DOMAIN" --out _capture/site --max "$MAX" --delay "$DELAY")
          if [ "$POSTS" = "true" ]; then args+=(--include-posts); fi
          node scripts/capture-wordpress-api.mjs "${args[@]}"

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-capture-${{ steps.resolve.outputs.domain }}
          path: _capture/
          if-no-files-found: warn
          retention-days: 14
