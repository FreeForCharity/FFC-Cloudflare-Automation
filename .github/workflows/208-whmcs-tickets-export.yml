name: '208. WHMCS - Export Tickets (Report) [WHMCS]'
run-name: 'WHMCS Export Tickets'

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Filter by status (e.g. Open, Answered, Closed) - blank for all'
        required: false
        type: string
      output_file:
        description: 'Output CSV filename'
        required: false
        type: string
        default: 'artifacts/whmcs/whmcs_tickets.csv'

permissions:
  contents: read
  id-token: write

jobs:
  export_tickets:
    runs-on: windows-latest
    environment: whmcs-prod-read

    steps:
      - uses: actions/checkout@v7.0.1

      # WHMCS credential from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          scope: read
          azure-client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Export tickets (read-only)
        shell: pwsh
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          # #1080 lane 24. Both free-text dispatch inputs arrive as DATA in the
          # process environment instead of being substituted into this script's
          # TEXT. Measured on pwsh 7.4.6 against the body as it shipped, with a
          # decoy WHMCS credential in the environment and a stub callee:
          #
          #   output_file  the site read `$out = "<interpolation>"` — DOUBLE
          #                quoted, where `$( )` expands, so no quote breakout was
          #                needed at all. A value ending `$(Set-Content -Path
          #                SENTINEL.txt -Value $env:WHMCS_API_SECRET)` wrote the
          #                credential to a file, and because Set-Content emits
          #                nothing the path itself was unchanged: the callee bound
          #                `OutputFile=[artifacts/whmcs/whmcs_tickets.csv]`,
          #                byte-identical to the control, and the step exited 0.
          #   status       two sites on one line, both SINGLE quoted, so `$( )`
          #                is inert and the payload needed a breakout. `Open')) { };
          #                <payload>; $cliArgs += @('-Status','Open'); #` closed the
          #                call and the `if`, ran, re-supplied the legitimate
          #                -Status append, and commented out the rest of the line —
          #                which is where the SECOND occurrence sat. Same result:
          #                credential exfiltrated, callee bound `Status=[Open]`,
          #                exit 0.
          #
          # In both cases every observable in the run — arguments, exit code,
          # artifact — matches an ordinary export. This job enters
          # `whmcs-prod-read`, whose WHMCS API credential the
          # `whmcs-secrets-from-kv` step above exports through GITHUB_ENV, plus the
          # `az` CLI session it leaves on disk (#1188/#1208) — none of which is
          # visible in this step's own `env:` block, so an L213 read or a
          # `secrets.` grep scores this step as holding nothing.
          IN_OUTPUT_FILE: ${{ inputs.output_file }}
          IN_STATUS: ${{ inputs.status }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Fail closed, not default-fill (ledger L254), for the same reason 218
          # does: the `Upload CSV artifact` step below consumes the output_file
          # input a second time, directly, in its `path:`. That is an artifact
          # path rather than a script body, so #1080's guard correctly does not
          # judge it and this lane does not widen to cover it — but it makes this
          # step the junior of two consumers of one value. A default supplied only
          # here would write the CSV to the substituted path while the upload
          # still looked at the blank one, converting a clear failure into an
          # `if-no-files-found: error` two steps later that names neither cause.
          #
          # This guard is load-bearing, and the hole it closes PRE-DATES the move
          # to `env:` rather than being created by it (ledger L292, the QUOTED
          # case — the shipped site sat inside double quotes, so a blank was
          # already an argument that is present and empty). Measured on pwsh
          # 7.4.6 against BOTH bodies, guard stripped:
          #
          #   empty            rc 1 at `Split-Path -Parent` — loud in the shipped
          #                    body and in the fixed one alike, so the remedy
          #                    neither creates nor removes this case.
          #   all-whitespace   callee bound `OutputFile=[   ]` at rc **0**, in
          #                    both bodies. Silent and wrong: the export writes a
          #                    CSV to a whitespace-named file and the upload's
          #                    `path:` then looks for the same blank name.
          #
          # So `-not IsNullOrWhiteSpace` rather than `-ne ''` is what makes the
          # guard do anything at all here — the one case it catches is the one
          # case that was silent. Same measurement 601 recorded (#1213).
          if ([string]::IsNullOrWhiteSpace($env:IN_OUTPUT_FILE)) {
            throw "output_file is blank. It is consumed BOTH here and by the 'Upload CSV artifact' step's path:, so this step does not substitute a default — re-dispatch with a path, or omit the input to get its declared default."
          }

          # The other half of the same two-consumer coupling, and a different
          # hazard from the blank case above. Raised by Copilot on #1308.
          #
          # The upload step receives output_file RAW, and its `path:` is a
          # glob-capable SELECTOR (`@actions/glob`), not a filename. So the
          # junior consumer can be pointed at files the senior one never wrote —
          # and this job holds the WHMCS credential that does not appear in this
          # step's `env:` plus the `az` CLI session `whmcs-secrets-from-kv`
          # leaves on disk (#1188/#1208), so the prize is on the runner's
          # filesystem rather than in a variable.
          #
          # Not every payload self-blocks at the export. `*` and `?` are illegal
          # in a Windows filename, so those die here and the upload never runs
          # (it carries no `if:`, so it is `success()`-gated). `[` and `]` are
          # NOT illegal: they are legal Windows filename characters AND
          # character-class metacharacters to the globber. That is the shape
          # with no self-block — the export writes a literal `[m]sal…json` and
          # exits 0, and the upload's glob then matches a different, real file.
          # An absolute path or a `..` segment needs no glob at all.
          #
          # HONEST LIMIT: the payload's success turns on Windows filename
          # legality and PowerShell's `-Path` wildcard resolution, and this was
          # authored on a Linux worker while the job runs on `windows-latest`,
          # so it is NOT measured. This is the safer fix taken without that
          # measurement, per the security rule. The guard's own behaviour IS
          # measured, because it is pure string logic and platform-free.
          #
          # Which is also why the rooted test is an explicit regex rather than
          # [System.IO.Path]::IsPathRooted: that API is platform-DEPENDENT
          # (`C:\x` and `\x` are rooted on Windows, neither on Linux), so a test
          # running on ubuntu CI would assert something the Windows runner does
          # not do — a guard green on the only host that checks it and absent on
          # the only host that runs it.
          #
          # None of the three forms has a legitimate use here: the declared
          # default is a relative path under `artifacts/`, as in every sibling
          # 2xx export.
          if ($env:IN_OUTPUT_FILE -match '[*?\[\]]') {
            throw "output_file contains a glob metacharacter (one of * ? [ ]). It is passed unchanged to the 'Upload CSV artifact' step, whose path: is a glob selector, so a pattern can match files this export never wrote. Pass a plain relative path."
          }
          # `[A-Za-z]+:`, not `[A-Za-z]:` — a PSDrive qualifier is not limited to
          # a single-letter filesystem drive. Measured on pwsh 7.4.6:
          # `Temp:/x.csv` and `env:/x` both pass a single-letter test and are
          # resolved by the provider, so the narrow spelling admits a
          # workspace escape that looks nothing like `C:\`.
          if ($env:IN_OUTPUT_FILE -match '^([A-Za-z]+:|[\\/])') {
            throw "output_file must be a workspace-relative path; got an absolute, UNC, drive- or PSDrive-qualified path. The 'Upload CSV artifact' step uploads whatever its path: resolves to, so a path outside the workspace can put runner files into a downloadable artifact."
          }
          # `~` is PowerShell's home shorthand and is NOT caught by the test
          # above: it starts with neither a separator nor a qualifier. Raised by
          # Copilot on #1308 and measured here on pwsh 7.4.6 —
          # `GetUnresolvedProviderPathFromPSPath('~/.azure/x.csv')` returns
          # `/root/.azure/x.csv`, so the export writes clean outside the
          # workspace.
          #
          # This is the sharpest instance of the two-consumer point (ledger
          # L298) rather than a repeat of it: PowerShell expands `~` and
          # `@actions/glob` does not, so the two consumers do not merely apply
          # different grammars to the value — they disagree about WHICH FILE IT
          # NAMES. The export would overwrite a file in the user profile (the
          # `az` session lives there) while the upload looked for a literal `~`
          # directory under the workspace and failed at `if-no-files-found`,
          # which reads as a path typo two steps from the damage.
          if ($env:IN_OUTPUT_FILE -match '^~') {
            throw "output_file must not begin with '~': PowerShell expands it to the user profile, so this export would write outside the workspace, while the 'Upload CSV artifact' step's globber does not expand it — the two consumers would not even agree which file is meant."
          }
          if (($env:IN_OUTPUT_FILE -split '[\\/]') -contains '..') {
            throw "output_file must not contain a '..' segment: it escapes the workspace, and the 'Upload CSV artifact' step uploads whatever its path: resolves to."
          }

          $out = $env:IN_OUTPUT_FILE
          $dir = Split-Path -Parent $out
          if (-not [string]::IsNullOrWhiteSpace($dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $cliArgs = @('-OutputFile', $out)
          # `-not IsNullOrWhiteSpace`, not `-ne ''`: the latter is True for
          # whitespace, so a status of "   " would reach the callee as a blank
          # -Status filter (#1213). Matches the predicate `$dir` already uses
          # two lines above.
          #
          # The move to `env:` widens this predicate's domain from string to
          # string-or-null — an omitted input reaches the shipped body as the
          # empty string between two quotes, and reaches this one as `$null`.
          # `IsNullOrWhiteSpace` is true for both; `-ne ''` is true for `$null`,
          # which is why the spelling matters more after the move than before it.
          # Measured: blank, all-whitespace and unset all bind `Status=[]` at
          # rc 0, in the shipped body and this one alike.
          if (-not [string]::IsNullOrWhiteSpace($env:IN_STATUS)) { $cliArgs += @('-Status', $env:IN_STATUS) }
          & pwsh -NoProfile -File .\scripts\whmcs-tickets-export.ps1 @cliArgs
          if ($LASTEXITCODE -ne 0) { throw "Tickets export failed (exit $LASTEXITCODE)." }

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v7
        with:
          name: whmcs_tickets
          path: ${{ inputs.output_file }}
          if-no-files-found: error
