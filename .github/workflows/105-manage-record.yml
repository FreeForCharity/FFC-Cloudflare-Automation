name: '105. DNS - Manage Record (Manual / Issue Label) [CF]'
run-name:
  'Manage Record: ${{ inputs.domain }} (${{ inputs.record_type }} ${{ inputs.record_name }})'
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain Name (Zone)'
        required: true
        type: string
      dry_run:
        description: 'Dry Run (No changes)'
        type: boolean
        default: true
      record_type:
        description: 'Record Type'
        type: choice
        options:
          - TXT
          - A
          - CNAME
          - MX
        default: TXT
      record_name:
        description: 'Record Name (@ or subdomain)'
        type: string
        default: '@'
      record_content:
        description: 'Record Content'
        type: string
        default: 'v=spf1 include:spf.protection.outlook.com -all'
      record_action:
        description:
          "'set' creates or updates the record. 'remove' DELETES it - and needs record_content,
          which is matched on the record's logical value so a multi-segment TXT is found; without it
          the script would delete EVERY record of that type at that name."
        type: choice
        options:
          - set
          - remove
        default: set
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  actions: read

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 105-manage-record
  cancel-in-progress: false

jobs:
  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.parse.outputs.domain }}
      dry_run: ${{ steps.parse.outputs.dry_run }}
      source: ${{ steps.parse.outputs.source }}
      skip: ${{ steps.parse.outputs.skip }}
    steps:
      - name: Parse Input Source
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            let domain = '';
            let dry_run = 'true';
            let source = 'unknown';
            let skip = 'false';

            // CASE 1: Manual Trigger (workflow_dispatch)
            if (context.eventName === 'workflow_dispatch') {
              domain = context.payload.inputs.domain;
              dry_run = context.payload.inputs.dry_run;
              source = 'manual';
              console.log(`[Manual] Domain provided: ${domain}, DryRun: ${dry_run}`);
            } 

            // CASE 2: Issue Trigger
            else if (context.eventName === 'issues') {
              // Only proceed when an explicit label is applied.
              // GitHub Actions can't filter issue triggers by label name, so we gate here.
              const requiredLabel = 'run-dns-manage-record';
              const appliedLabel = context.payload.label?.name || '';
              if (appliedLabel !== requiredLabel) {
                core.notice(`Issue label '${appliedLabel}' does not match required label '${requiredLabel}'. Skipping.`);
                skip = 'true';
                core.setOutput('domain', '');
                core.setOutput('dry_run', dry_run);
                core.setOutput('source', 'issue');
                core.setOutput('skip', skip);
                return;
              }

              const body = context.payload.issue.body || '';
              source = 'issue';
              
              // Simple regex to find "Domain Name" followed by the user's input
              // Matches: "### Domain Name\n\nexample.org" or "Domain Name: example.org"
              const domainRegex = /### Domain Name\s+([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})/;
              const match = body.match(domainRegex);
              
              if (match && match[1]) {
                domain = match[1].trim();
                console.log(`[Issue] Extracted domain: ${domain}`);
              } else {
                console.log('[Issue] Could not find "### Domain Name" in issue body.');
              }
              
              // For safety, issue ops always default to DryRun until explicitly approved
              // You might change this logic later to check labels like "approved"
            }

            if (!domain) {
              core.setFailed('Could not determine Domain Name from input or issue body.');
              return;
            }

            core.setOutput('domain', domain);
            core.setOutput('dry_run', dry_run);
            core.setOutput('source', source);
            core.setOutput('skip', skip);

  validate-zone:
    needs: resolve-context
    runs-on: windows-latest # Using Windows runner for PowerShell script
    environment: cloudflare-prod-read
    if: needs.resolve-context.outputs.skip != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC. Read-only
      # operation (just -List), so use scope: read to load READ_ALL tokens.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Validate Zone in Cloudflare
        shell: pwsh
        # Same rule as "Manage DNS Record" below: user-supplied values by env,
        # never interpolated into the script body. The issue path constrains the
        # domain to [A-Za-z0-9.-], but the workflow_dispatch path does not.
        env:
          REC_DOMAIN: ${{ needs.resolve-context.outputs.domain }}
        run: |
          $Domain = [string]$env:REC_DOMAIN
          Write-Host "Checking if zone '$Domain' exists in Cloudflare..."

          .\Update-CloudflareDns.ps1 -Zone $Domain -List -ErrorAction SilentlyContinue

          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS: Zone '$Domain' found and accessible." -ForegroundColor Green
          } else {
            Write-Warning "FAILURE: Zone '$Domain' not found or token lacks permission."
            # We don't exit 1 here yet because 'Purchase New Domain' workflow might *expect* it to be missing.
          }

  add-test-record:
    needs: resolve-context
    runs-on: windows-latest
    environment: cloudflare-prod-write
    if:
      needs.resolve-context.outputs.skip != 'true' && needs.resolve-context.outputs.dry_run ==
      'false'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Manage DNS Record
        shell: pwsh
        # Untrusted/user-supplied values are passed via env (never interpolated directly into the
        # script body) so they cannot break out of the string and inject PowerShell.
        env:
          REC_DOMAIN: ${{ needs.resolve-context.outputs.domain }}
          REC_TYPE: ${{ github.event.inputs.record_type }}
          REC_NAME: ${{ github.event.inputs.record_name }}
          REC_CONTENT: ${{ github.event.inputs.record_content }}
          REC_ACTION: ${{ github.event.inputs.record_action }}
        run: |
          # Defaults applied here (not in the env expression) so each env line stays short and is
          # never folded across lines by the YAML formatter.
          $Domain  = $env:REC_DOMAIN
          $Type    = if ([string]::IsNullOrWhiteSpace($env:REC_TYPE)) { 'TXT' } else { $env:REC_TYPE }
          $Name    = if ([string]::IsNullOrWhiteSpace($env:REC_NAME)) { '@' } else { $env:REC_NAME }
          $Content = if ([string]::IsNullOrWhiteSpace($env:REC_CONTENT)) { 'v=spf1 include:spf.protection.outlook.com -all' } else { $env:REC_CONTENT }
          $Action  = if ([string]::IsNullOrWhiteSpace($env:REC_ACTION)) { 'set' } else { $env:REC_ACTION }

          # Each branch builds a COMPLETE parameter set under its OWN variable
          # name and makes its own call. Accumulating into one shared $params
          # would leave a union of -Ttl (Set set) and -Remove (Remove set) that
          # binds to neither, and scripts/check-pwsh-workflow-invocations.py
          # correctly refuses it: that guard merges a variable's shape across
          # every assignment in the body, so it cannot know a switch made the
          # branches exclusive. Distinct names give it one shape per call.
          #
          # Hashtable, not an array: splatting an array into an in-process
          # script call binds POSITIONALLY, so '-Zone' would arrive as a value.
          # That shipped once in 106 and is pinned by tests there and here.
          switch ($Action) {
            'set' {
              Write-Host "Managing $Type record for $Name in zone $Domain..."
              $setParams = @{
                Zone    = $Domain
                Name    = $Name
                Type    = $Type
                Content = $Content
                Ttl     = 1
              }
              & .\Update-CloudflareDns.ps1 @setParams
            }
            'remove' {
              # Content is REQUIRED to delete. Without it the script deletes
              # every record of this type at this name, which for a multi-value
              # type like TXT means taking out unrelated records -- SPF and
              # DMARC live at names that also carry other TXT.
              if ([string]::IsNullOrWhiteSpace($env:REC_CONTENT)) {
                throw "record_action=remove requires an explicit record_content. Refusing to delete every $Type record at '$Name'."
              }
              Write-Host "REMOVING $Type record for $Name in zone $Domain..."
              $removeParams = @{
                Zone    = $Domain
                Name    = $Name
                Type    = $Type
                Content = $Content
                Remove  = $true
              }
              & .\Update-CloudflareDns.ps1 @removeParams
            }
            default { throw "Unsupported record_action '$Action'" }
          }

          # #777: do NOT check $LASTEXITCODE here. An in-process .ps1 call only
          # sets it if the script itself runs a native command or calls exit —
          # after a successful run it is stale (from az in the KV action) and
          # falsely reported FAILURE on verified-successful writes. On failure
          # the script's own `exit 1` (in its catch) already fails this step,
          # so reaching this line means the operation succeeded.
          Write-Host "SUCCESS: DNS operation completed." -ForegroundColor Green

      - name: Post-Change Compliance Audit
        shell: pwsh
        # User-supplied value by env — see "Manage DNS Record" above.
        env:
          REC_DOMAIN: ${{ needs.resolve-context.outputs.domain }}
        run: |
          $Domain = [string]$env:REC_DOMAIN
          Write-Host "--- Running Compliance Audit ---"
          .\Update-CloudflareDns.ps1 -Zone $Domain -Audit -ErrorAction Continue
