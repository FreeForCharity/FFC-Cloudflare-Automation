name: '401. Zeffy - Campaigns Export [ZEFFY]'
run-name: 'Zeffy Campaigns Export'

# Read-only export of Zeffy campaigns/events (GET /api/v1/campaigns) via OIDC -> Key Vault.
# This endpoint returns NO personal data (forms/events only: title, target, volume, dates, URLs),
# so the uploaded artifact is inherently safe to keep on this public repo. Dispatch-only (no
# schedule) while we are testing the API. One workflow per endpoint.
#
# The `deliver` job additionally publishes a public, PII-free campaign list
# (docs/data/ffc-zeffy-campaigns.json — title/url/status only) as a reviewable
# data-update PR, so the fleet smoke engine can classify a detected donation
# surface as ffc-interim (FFC-owned campaign) vs charity-specific (#744). Mirrors
# the 502 export->deliver split (github-prod gate, CBM_TOKEN) and the 703
# same-repo peter-evans data-PR pattern.

on:
  workflow_dispatch:

# Least-privilege default for the whole workflow: the export job only needs to
# read the repo (checkout) and mint an OIDC token. The write/PR scopes needed to
# publish the data PR are granted narrowly to the gated `deliver` job below.
permissions:
  contents: read
  id-token: write

jobs:
  zeffy_campaigns_export:
    runs-on: windows-latest
    environment: zeffy-prod

    steps:
      - uses: actions/checkout@v7.0.1

      # Zeffy organization API key from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/zeffy-secrets-from-kv
        with:
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Export campaigns
        shell: pwsh
        env:
          # Pinned to the canonical Zeffy host. Not a workflow input so a dispatcher cannot point
          # the Bearer key at an arbitrary host on this public repo.
          ZEFFY_API_URL: 'https://api.zeffy.com'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/zeffy | Out-Null

          & pwsh -NoProfile -File .\scripts\zeffy-campaigns-export.ps1 -BaseUrl $env:ZEFFY_API_URL -OutputFile 'artifacts/zeffy/zeffy_campaigns.csv'
          if ($LASTEXITCODE -ne 0) { throw "Zeffy campaigns export failed (exit $LASTEXITCODE)." }

          $f = 'artifacts/zeffy/zeffy_campaigns.csv'
          if (-not (Test-Path $f)) { throw "Expected output file not found: $f" }

          $n = (Import-Csv $f | Measure-Object).Count
          "## Zeffy campaigns export (no PII)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- $f : $n row(s)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload campaigns CSV artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeffy_campaigns
          path: artifacts/zeffy/zeffy_campaigns.csv
          if-no-files-found: error
          retention-days: 7

  # Publish the public campaign list (title/url/status only) as a reviewable PR.
  # main is protected (changes via PR + merge queue only), so we open a data
  # update PR rather than pushing directly. Uses a real PAT (fetched from Key
  # Vault over OIDC — see #844) so the PR can trigger required checks; a PR opened
  # by GITHUB_TOKEN would not.
  deliver:
    needs: zeffy_campaigns_export
    runs-on: ubuntu-latest
    environment: github-prod
    # Only this gated job gets write + PR scopes (create-pull-request).
    # NOTE: a job-level `permissions:` block REPLACES the workflow-level one, so
    # `id-token: write` must be repeated here or the OIDC exchange below fails.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name wr-all-cbm-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Download campaigns CSV artifact
        uses: actions/download-artifact@v8
        with:
          name: zeffy_campaigns
          path: artifacts/zeffy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Generate public campaign list (title/url/status, no PII)
        run: |
          node scripts/zeffy-campaigns-to-public-json.js artifacts/zeffy/zeffy_campaigns.csv docs/data/ffc-zeffy-campaigns.json

      - name: Open data update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Set from Key Vault by the "Load the GitHub PAT" step above.
          token: ${{ env.GH_TOKEN }}
          add-paths: docs/data/ffc-zeffy-campaigns.json
          commit-message: 'chore(zeffy): refresh public campaign list (title/url/status)'
          branch: data/zeffy-campaigns-auto
          delete-branch: true
          title: 'chore(zeffy): refresh public Zeffy campaign list'
          body: |
            Automated refresh of `docs/data/ffc-zeffy-campaigns.json` from the
            401 Zeffy campaigns export (title/url/status only; no PII).

            Consumed by the fleet smoke engine to classify a detected donation
            surface as `ffc-interim` (FFC-owned campaign) vs charity-specific (#744).

            Generated by `.github/workflows/401-zeffy-campaigns-export.yml`.
