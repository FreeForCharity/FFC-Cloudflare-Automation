name: '736. Repo - Archive / Application Denied (Admin) [Repo]'
run-name: 'Archive ${{ inputs.repo }} (dry_run=${{ inputs.dry_run }})'

# Destructive-adjacent, so heavily guarded. This workflow ONLY archives a repository
# (`archived: true`) — it NEVER deletes one. Archiving is fully reversible (a maintainer can
# unarchive from Settings), which is the deliberate safety choice: the worst case is a repo
# that is temporarily read-only, not data loss.
#
# Five guards, all must pass for a live archive:
#   1. dispatch-only (never issue/label triggered — no accidental auto-archive)
#   2. dry_run defaults to true (preview only; you must pass dry_run=false)
#   3. typed confirmation: confirm_repo must exactly equal repo
#   4. org lock + hard denylist (refuses anything outside FreeForCharity, and always refuses
#      the automation repo, the website template, and the org-wide .github repo)
#   5. github-prod environment approval gate (a human reviewer must approve the deployment)

on:
  workflow_dispatch:
    inputs:
      repo:
        description:
          'Repository to archive — "name" or "owner/name" (e.g. FFC-EX-example.org); any owner
          prefix is stripped and the owner is forced to FreeForCharity.'
        required: true
        type: string
      reason:
        description:
          'Why (e.g. "charity application denied", "domain abandoned"). Recorded in the summary.'
        required: true
        type: string
      dry_run:
        description:
          'Preview only. Leave true to see what would happen; set false to actually archive.'
        required: true
        default: true
        type: boolean
      confirm_repo:
        description:
          'Type the exact repo name again to confirm a live archive (must match "repo"). Ignored on
          dry runs.'
        required: false
        type: string
      issue_number:
        description:
          'Optional issue number in THIS repo to close as "not planned" (e.g. the denied website
          request).'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read
  # Required for the OIDC exchange that fetches the PAT from Key Vault (#844).
  id-token: write

env:
  TARGET_ORG: FreeForCharity
  # Repos that must never be archived by this automation, whatever is typed.
  DENYLIST: 'FFC-Cloudflare-Automation FFC_Single_Page_Template .github'

jobs:
  # Reality check BEFORE the approval gate. Only applies to a live archive
  # (dry_run=false) — a dry run is itself the evidence this preflight later
  # requires, so it always passes through untouched. Added after the
  # 2026-07-18 incident: a dry_run=false archive of an ACTIVE repo (pushed 25
  # minutes earlier, Pages enabled, referenced by an open issue) reached the
  # gate because the only dry-run that day targeted a different, nonexistent
  # repo — nothing verified the live target matched what had been previewed.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify target state and matching dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORG: FreeForCharity
          IN_REPO: ${{ inputs.repo }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          THIS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Dry runs are the evidence a later live archive needs — they are
          # never blocked here (the archive job's own dry-run branch reports
          # the preview).
          if [ "${IN_DRY_RUN:-true}" != "false" ]; then
            echo "ℹ️ Dry run — preflight checks apply only to a live (dry_run=false) archive." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- normalize + validate the repo name (mirrors the archive job) ----------
          repo_raw="${IN_REPO:-}"
          name="${repo_raw##*/}"
          name="$(printf '%s' "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$name" ]; then echo '::error::repo is empty.'; exit 1; fi
          if ! printf '%s' "$name" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid repository name: $name"; exit 1
          fi
          full="$TARGET_ORG/$name"
          name_lc=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')

          # Case-insensitive: GitHub repo name lookups are case-insensitive
          # (ffc-cloudflare-automation resolves to FFC-Cloudflare-Automation),
          # so a case-variant input must not bypass the denylist.
          for deny in $DENYLIST; do
            deny_lc=$(printf '%s' "$deny" | tr '[:upper:]' '[:lower:]')
            if [ "$name_lc" = "$deny_lc" ]; then
              echo "::error::Refusing to archive protected repository '$name' (denylist)."
              exit 1
            fi
          done

          echo "## Archive preflight — $full" >> "$GITHUB_STEP_SUMMARY"

          # --- must exist, must not already be archived (fail fast, no wasted gate) --
          set +e
          meta=$(gh api "repos/$full" 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if printf '%s' "$meta" | grep -q "HTTP 404"; then
              echo "::error::Repository $full does not exist (or is private and not visible to this workflow's GITHUB_TOKEN) — nothing to archive."
              echo "⛔ Refused: \`$full\` not found." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Preflight could not verify $full (transient API error?). Failing safe rather than guessing. Details: $meta"
            fi
            exit 1
          fi
          name_field=$(printf '%s' "$meta" | jq -r '.name // empty' 2>/dev/null || true)
          if [ -z "$name_field" ]; then
            echo "::error::Preflight got an unparseable response for $full. Failing safe rather than guessing."
            exit 1
          fi
          already=$(printf '%s' "$meta" | jq -r '.archived // false' 2>/dev/null || echo false)
          if [ "$already" = "true" ]; then
            echo "::error::$full is already archived — a live archive would be a no-op."
            echo "⛔ Refused: \`$full\` is already archived." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          pushed=$(printf '%s' "$meta" | jq -r '.pushed_at // empty' 2>/dev/null || true)
          has_pages=$(printf '%s' "$meta" | jq -r '.has_pages // false' 2>/dev/null || echo false)

          # --- require a matching successful dry_run=true run within 48h -------------
          cutoff=$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          set +e
          runs=$(gh api "repos/$THIS_REPO/actions/workflows/736-repo-archive.yml/runs?status=success&per_page=30" 2>&1)
          runs_rc=$?
          set -e
          if [ $runs_rc -ne 0 ]; then
            echo "::error::Preflight could not list prior 736 runs to verify a matching dry-run (transient API error?). Failing safe. Details: $runs"
            exit 1
          fi
          found=0
          set +e
          titles=$(printf '%s' "$runs" | jq -r --arg cutoff "$cutoff" '.workflow_runs[] | select(.created_at >= $cutoff) | .display_title')
          titles_rc=$?
          set -e
          if [ $titles_rc -ne 0 ]; then
            echo "::error::Preflight could not parse the prior-runs API response for $THIS_REPO (unexpected payload shape?). Failing safe rather than guessing. Details: $runs"
            exit 1
          fi
          # Extract the exact repo token from the run-name format ("Archive
          # <repo> (dry_run=true)") and normalize it the same way the repo
          # input itself is normalized above, then compare for EQUALITY —
          # not substring containment, which would let a dry-run for
          # "FFC-EX-example.org.uk" satisfy a live archive of
          # "FFC-EX-example.org".
          while IFS= read -r title; do
            [ -z "$title" ] && continue
            run_repo=$(printf '%s' "$title" | sed -n -E 's/^Archive (.*) \(dry_run=true\)$/\1/p')
            [ -z "$run_repo" ] && continue
            run_name="${run_repo##*/}"
            run_name="$(printf '%s' "$run_name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            run_name_lc=$(printf '%s' "$run_name" | tr '[:upper:]' '[:lower:]')
            if [ "$run_name_lc" = "$name_lc" ]; then
              found=1
              break
            fi
          done <<< "$titles"
          if [ "$found" -ne 1 ]; then
            echo "::error::No successful dry_run=true run of 736 for '$name' found in the last 48h. Dispatch with dry_run=true first, review the preview, then re-dispatch with dry_run=false for the same repo."
            echo "⛔ Refused: no matching dry-run within 48h for \`$name\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Matching dry-run: found within the last 48h." >> "$GITHUB_STEP_SUMMARY"

          # --- advisory warnings: does this still look like a live/active repo? ------
          if [ -n "${pushed:-}" ]; then
            pushed_epoch=$(date -u -d "$pushed" +%s 2>/dev/null || echo 0)
            cutoff7_epoch=$(date -u -d '7 days ago' +%s)
            if [ "$pushed_epoch" -gt "$cutoff7_epoch" ]; then
              echo "::warning::$full was pushed to on $pushed (within the last 7 days) — verify it is really abandoned before archiving."
              echo "- ⚠️ Pushed within the last 7 days ($pushed)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$has_pages" = "true" ]; then
            echo "::warning::$full has GitHub Pages enabled — a live site may still depend on it."
            echo "- ⚠️ GitHub Pages is enabled." >> "$GITHUB_STEP_SUMMARY"
          fi

          set +e
          open_titles=$(gh issue list --repo "$THIS_REPO" --state open --search "$name" --json number,title --jq '.[] | "#\(.number) \(.title)"' 2>&1)
          list_rc=$?
          set -e
          if [ $list_rc -ne 0 ]; then
            echo "::warning::Preflight could not search open issues for '$name' (non-fatal, proceeding). Details: $open_titles"
          elif [ -n "$open_titles" ]; then
            echo "::warning::Open issue(s) in this repo reference '$name' — verify none of them depends on the target still existing."
            {
              echo "- ⚠️ Open issue(s) referencing \`$name\`:"
              while IFS= read -r t; do echo "  - $t"; done <<< "$open_titles"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "✅ Preflight passed — proceeding to the gated archive." >> "$GITHUB_STEP_SUMMARY"

  archive:
    runs-on: ubuntu-latest
    needs: preflight
    environment: github-prod
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Archive repository (guarded)
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_REASON: ${{ inputs.reason }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_CONFIRM: ${{ inputs.confirm_repo }}
          IN_ISSUE: ${{ inputs.issue_number }}
          THIS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # --- normalize + validate the repo name ------------------------------------
          repo_raw="${IN_REPO:-}"
          # Accept either "name" or "owner/name"; strip any owner and force our org.
          name="${repo_raw##*/}"
          # Trim leading/trailing whitespace ONLY — stripping internal whitespace could
          # silently retarget (e.g. "FFC-EX-foo bar" -> "FFC-EX-foobar"); the name regex
          # below rejects internal whitespace instead.
          name="$(printf '%s' "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$name" ]; then echo '::error::repo is empty.'; exit 1; fi
          if ! printf '%s' "$name" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid repository name: $name"; exit 1
          fi
          full="$TARGET_ORG/$name"

          # --- hard denylist ---------------------------------------------------------
          for deny in $DENYLIST; do
            if [ "$name" = "$deny" ]; then
              echo "::error::Refusing to archive protected repository '$name' (denylist)."
              exit 1
            fi
          done

          {
            echo "## Archive request"
            echo "- Target: \`$full\`"
            echo "- Reason: ${IN_REASON:-（none）}"
            echo "- Dry run: $IN_DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- existence + current state (read-only) ---------------------------------
          if ! meta=$(gh api "repos/$full" 2>/dev/null); then
            echo "| Result | \`$full\` not found (nothing to archive) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Repository $full does not exist or is not visible to the token."
            exit 0
          fi
          already=$(printf '%s' "$meta" | jq -r '.archived')
          visibility=$(printf '%s' "$meta" | jq -r '.visibility')
          pushed=$(printf '%s' "$meta" | jq -r '.pushed_at')
          echo "- Current state: archived=$already, visibility=$visibility, last push=$pushed" >> "$GITHUB_STEP_SUMMARY"

          if [ "$already" = "true" ]; then
            echo "✅ Already archived — no change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- dry run stops here ----------------------------------------------------
          if [ "$IN_DRY_RUN" != "false" ]; then
            echo "🔎 **Dry run** — would archive \`$full\` (set archived=true). No change made." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with dry_run=false and confirm_repo=$name to execute." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- typed confirmation for a live archive ---------------------------------
          # Normalize confirm_repo exactly like repo: strip any owner prefix, then trim
          # leading/trailing whitespace only. The repo input accepts "name" or
          # "owner/name", so pasting the same owner-qualified value into both fields is
          # unambiguous intent and must confirm. Internal whitespace still fails the
          # equality check against the regex-validated name.
          confirm="${IN_CONFIRM:-}"
          confirm="${confirm##*/}"
          confirm="$(printf '%s' "$confirm" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "$confirm" != "$name" ]; then
            echo "::error::confirm_repo ('$confirm') must exactly equal repo ('$name') for a live archive."
            exit 1
          fi

          # --- execute (reversible: archived=true, never delete) ---------------------
          gh api -X PATCH "repos/$full" -F archived=true >/dev/null
          echo "🗄️ Archived \`$full\` (repository is now read-only; unarchive from Settings to reverse)." >> "$GITHUB_STEP_SUMMARY"

          # --- optionally close a linked issue in THIS repo --------------------------
          if [ -n "${IN_ISSUE:-}" ]; then
            if printf '%s' "$IN_ISSUE" | grep -qE '^[0-9]+$'; then
              # Best-effort (the archive itself already succeeded), but report honestly:
              # only claim the issue was closed if the close actually succeeded.
              gh issue comment "$IN_ISSUE" --repo "$THIS_REPO" \
                --body "Archived \`$full\` — ${IN_REASON:-no reason given}. Repo is read-only (reversible). Closing as not planned." ||
                echo "::warning::Failed to comment on issue #$IN_ISSUE."
              if gh issue close "$IN_ISSUE" --repo "$THIS_REPO" --reason "not planned"; then
                echo "- Closed issue #$IN_ISSUE in $THIS_REPO." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- ⚠️ Could not close issue #$IN_ISSUE — close it manually." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::Failed to close issue #$IN_ISSUE."
              fi
            else
              echo "::warning::issue_number '$IN_ISSUE' is not numeric; skipped closing an issue."
            fi
          fi
