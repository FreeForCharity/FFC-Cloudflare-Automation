name: '722. Repo - CI Validate and Test [Repo]'

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this repo's own environment protection rules
      # (GET /repos/:owner/:repo/environments) — the scope workflow 730 uses for
      # the same endpoint. Read-only; nothing in this job deploys.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history: the large-blob guard below scans every commit a PR
          # introduces, not just its tip tree. ~26 MB / ~1300 commits, so the
          # extra fetch is negligible against the rest of this job.
          fetch-depth: 0

      # Runs on merge_group too, not just pull_request. This job is a required
      # check, and for a queued PR the merge group is where the required checks
      # are evaluated (a branch-level failure does not dequeue). A guard that
      # skipped on merge_group could therefore be satisfied without ever having
      # scanned, which is the same false clean the guard exists to prevent.
      # In a group batching several PRs the range covers all of them, so one
      # oversized branch fails the group -- correct: none of them should reach
      # main carrying the blob.
      - name: Guard against large blobs in any commit of the PR
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash scripts/check-large-blobs.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Validate workflow name prefixes (Actions UI order)
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(.github/workflows/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows"
            exit 1
          fi

          declare -A seen
          has_error=false

          for f in "${files[@]}"; do
            # Extract the *first* top-level name: line.
            # (We intentionally ignore job/step 'name:' occurrences deeper in the YAML.)
            first_name_line=$(head -n 20 "$f" | sed '1s/^\xEF\xBB\xBF//' | grep -m 1 -E '^name:\s*' || true)
            if [ -z "$first_name_line" ]; then
              echo "::error file=$f::Missing top-level workflow name (expected a 'name:' near top of file)."
              has_error=true
              continue
            fi

            # Expect a leading three-digit numeric prefix like "101." in the workflow name.
            prefix=$(printf '%s' "$first_name_line" | sed -nE "s/^name:\s*['\"]?([0-9]{3})\..*/\1/p")
            if [ -z "$prefix" ]; then
              echo "::error file=$f::Workflow name must start with a three-digit numeric prefix like '101.'. Got: $first_name_line"
              has_error=true
              continue
            fi

            if [[ -n "${seen[$prefix]:-}" ]]; then
              echo "::error::Duplicate workflow name prefix '$prefix' found in: ${seen[$prefix]} and $f"
              has_error=true
              continue
            fi

            seen[$prefix]="$f"
          done

          if [ "$has_error" = true ]; then
            exit 1
          fi

          echo "✓ Workflow name prefixes are present and unique (${#seen[@]} workflows)"

      - name: Validate workflow / safety-doc consistency
        shell: bash
        run: |
          # Rejects a BOM at the start of any workflow YAML and keeps the
          # per-workflow table in docs/workflow-safety-and-approvals.md in sync
          # with the actual workflow set (coverage + no stale rows).
          python3 scripts/check-workflow-doc-consistency.py

      - name: Validate workflow catalog is regenerated
        shell: bash
        run: |
          # docs/workflow-catalog.json + the README catalog section are generated
          # from the workflow files; fail if a workflow change wasn't accompanied
          # by a regeneration (python3 scripts/generate-workflow-catalog.py).
          #
          # The generator reads each workflow's `on:` block from the PARSED
          # document (#1084), so it needs PyYAML. Installed defensively for the
          # reason the working-directories step below states: the runner image
          # only happens to preinstall it, and an image that drops it would turn
          # this guard into an ImportError -- a red build that says nothing
          # about the catalog. This is now the first step in the job to need it.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/generate-workflow-catalog.py --check

      - name: Validate workflow cross-references resolve
        shell: bash
        run: |
          # Fails when a workflow (or a helper script) dispatches / depends on a
          # sibling workflow by a stale file name, or dispatches a workflow that
          # has no workflow_dispatch trigger. Guards the #630 failure class.
          python3 scripts/check-workflow-references.py

      - name: Validate federated-credential expected map
        shell: bash
        run: |
          # Self-check config/federated-credentials.json is well-formed (GUIDs,
          # env slugs, no dupes), AND that its environment list is exactly the
          # set of environments this repo's workflows perform an Azure OIDC
          # exchange under (#1081) — a lane nobody added to the map is invisible
          # to the audit, which is how all four broken OIDC lanes went
          # unreported. Both checks are offline: no Azure, no credential. The
          # live subject audit (--live) runs against Azure via the operator/#589
          # workflow. Guards the #625 subject-typo class.
          python3 scripts/check-federated-credential-subjects.py

      - name: Validate GitHub Pages IP sets are in sync
        shell: bash
        run: |
          # scripts/cloudflare-api-common.ps1 is the single source of truth for
          # the GitHub Pages apex IP sets + www target (#778). The Node preflight
          # (scripts/preflight-cutover.mjs) can't call the PowerShell lib, so it
          # mirrors those sets — this guard fails if the two ever drift.
          python3 scripts/check-github-pages-ip-consistency.py

      - name: Validate Cloudflare bulk scripts route through the shared library
        shell: bash
        run: |
          # #778 consolidated the Cloudflare REST plumbing + Pages IP set into
          # scripts/cloudflare-api-common.ps1 ("one Invoke-Cf across 112/119/120;
          # zero copies of the Pages IP list outside the lib"). This guard fails
          # if a bulk script re-grows private plumbing, pastes a Pages IP literal,
          # or stops dot-sourcing the library.
          python3 scripts/check-cloudflare-bulk-lib-consumption.py

      - name: Validate every PowerShell command call resolves
        shell: bash
        run: |
          # 221 called Remove-Html, a command defined nowhere in the repo (#929):
          # PowerShell resolves commands at runtime, PSScriptAnalyzer says nothing,
          # and the lane sat behind an approval gate so nobody saw it die. This
          # parses every .ps1 with the PowerShell parser and fails when a call
          # resolves neither to a known cmdlet nor to a function the file defines
          # or dot-sources. Guards the #930 class. Needs a PowerShell host and
          # fails closed without one — the pwsh steps below share that dependency.
          python3 scripts/check-powershell-command-resolution.py

      - name: Validate every pwsh invocation of a repo script can bind
        shell: bash
        run: |
          # #1050 refactored 106 to `$argsList = @('-Zone', $Domain, …)` +
          # `& .\Update-CloudflareDns.ps1 @argsList`. Array splatting binds
          # POSITIONALLY, so '-Zone' arrived as a VALUE — every job, every input
          # combination, discovered only after a human spent an approval on the
          # gate. Update-CloudflareDns.ps1 has 263 Pester cases; the ~20 places a
          # workflow decides how to CALL it had none. Where the target has a free
          # positional slot the same code binds the flag string and exits 0, so
          # this checks the SHAPE as well as binding the names against each
          # script's real param() block. Needs a PowerShell host, like the #930
          # guard above, and fails closed without one.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-pwsh-workflow-invocations.py

      - name: Validate no free-text dispatch input reaches a script body
        shell: bash
        run: |
          # GitHub substitutes an expression into the script TEXT before
          # bash/pwsh/JS parses it, so a workflow_dispatch input is source code,
          # not data. 720 had both halves live: the pwsh one assigned an
          # interpolated Description into a double-quoted literal and a $( ) in
          # the value ran; the bash half did the same (#1080). The usual
          # "you need write access to dispatch anyway" dismissal fails on a GATED
          # workflow: environment approval is a trust boundary between the
          # dispatcher and the approver, and interpolated input is code that runs
          # AFTER the approval holding a production credential the dispatcher
          # never had — invisible in the diff the approver reads, because it is
          # not in the repository at all. This freezes the 36 existing call sites
          # (21 on write lanes) and fails on a new one, on a stale freeze entry,
          # or on a workflow it cannot parse. Complements the untrusted-event
          # rule in tests/workflow-logic/test_no_untrusted_expression_in_run.py,
          # which deliberately scopes dispatch-only workflows out.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflow-input-interpolation.py

      - name: Validate no dispatch input reaches a script body via an output
        shell: bash
        run: |
          # The hop the check above cannot see, and the reason it cannot is the
          # remedy itself. That guard is defined over `inputs.X`; moving the
          # input into step-level `env:` is what fixes the first site AND what
          # deletes the reference it reads. The value then goes on being
          # republished to GITHUB_OUTPUT and substituted into script text one
          # hop later, so a burn-down lane can fix every site the first guard
          # names, delete its freeze entry, go green on every check here, and
          # leave a working injection under a production credential (#1233).
          # Measured on 102 with the remedy applied: the $( ) payload arrives at
          # the first step as inert data, is written VERBATIM to GITHUB_OUTPUT,
          # and EXECUTES at the downstream double-quoted site while the step
          # exits 0. Four of the five workflows frozen at the 2026-09-05
          # measurement were absent from the first guard's list entirely; the
          # #1241 burn-down has since closed 702 and 706, the two live ones, so
          # the freeze now pins three workflows of over-approximated hops. The
          # guard prints its own counts — do not read this comment as current.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflow-laundered-input-interpolation.py

      - name: Validate an env-mapped dispatch input fails closed when empty
        shell: bash
        run: |
          # The second half of the same remedy. Moving the input into `env:`
          # stops it being source code; it does NOT stop it being empty, and in
          # a NATIVE command an empty $env:X is not an empty argument — it is no
          # argument, so `-Domain $env:DOMAIN -KeyPath $k` becomes
          # `-Domain -KeyPath $k` and every later argument binds one position to
          # the left (ledger L214). #1146/#1148 fixed 17 call sites by hand;
          # nothing stopped the 18th, and every remaining #1080 burn-down
          # manufactures a fresh instance the moment it converts an
          # interpolation. This models the invocation form rather than matching
          # a spelling: `& .\x.ps1 -P $env:X` binds empty and shifts nothing, so
          # 225/226 are correct code and are not findings. Freezes the 24
          # existing references (17 on write lanes) and fails on a new one, on a
          # stale freeze entry, or on anything it cannot parse. Needs a
          # PowerShell host, like the guards above, and fails closed without one.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflow-empty-input-guard.py

      - name: Validate optional-input gates are not empty-string comparisons
        shell: bash
        run: |
          # The third half of the same remedy, and the one the other two are
          # blind to. `-ne ''` reads as "was this optional input supplied" and
          # is correct for exactly one of the three blank forms: it is TRUE for
          # whitespace and TRUE for an unset variable, so `client_id: "   "`
          # binds silently at exit 0 and reaches the callee inside a write
          # environment, after the approval (#1213).
          #
          # It is systemic rather than four nits because the #1080 burn-down
          # WIDENS it: rewriting an interpolated `inputs.x -ne ''` as
          # `$env:X -ne ''` (the literal spelling is left out here because
          # actionlint parses expressions inside a run: comment too)
          # moves the predicate's domain from string to string-or-null, so a
          # lane that does its own job perfectly still lands a gate that is
          # newly wrong in a case that did not previously exist. The
          # interpolation guard above has no notion of predicates and cannot
          # see it. The freeze is now EMPTY — 205, the last two sites, landed
          # with #1207 — so this fails on ANY empty-string gate anywhere in the
          # tree, and on a freeze entry naming a missing file. An entry here is
          # an explicit, reasoned exception, not the normal state.
          # Needs NO PowerShell host — it is a textual predicate check, so tool
          # absence cannot turn "could not run" into "everything passed".
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflow-empty-string-input-gate.py

      - name: Validate text-mode subprocess calls pin an encoding
        shell: bash
        run: |
          # Text-mode subprocess decodes with locale.getencoding(): UTF-8 on this
          # runner, cp1252 on a Windows host. 41 test modules and 2 scripts passed
          # text=True with no encoding=, so they were green here and died on a
          # maintainer's machine the moment a child emitted an emoji — and the
          # alert workflows open issues titled "🚨 Scheduled workflow failing".
          # Like #944 / ledger L35, this class can never turn CI red, so it is
          # checked against the SOURCE, where it is visible from every platform.
          python3 scripts/check-subprocess-encoding.py

      - name: Validate every working-directory exists
        shell: bash
        run: |
          # #858 shipped `working-directory: target-repo` into 702's dry-run
          # branch: the target repo is checked out at `path: ffc-ex`, and
          # `target` is the step id producing the repo NAME. Every dry run would
          # have died before the shell started. Valid YAML, silent actionlint,
          # every other guard green — and the path was gated, so it had never
          # run. Like #929/#945, a class CI can never turn red on, so it is read
          # out of the source: each working-directory: must be the workspace
          # root, a repository directory, an actions/checkout path, or made by
          # an earlier step. Fails closed on anything it cannot resolve.
          #
          # This is the first step in the job to need PyYAML, and the runner
          # image only happens to preinstall it — the workflow-logic step below
          # installs it defensively for exactly that reason. Repeat the install
          # here rather than depend on step order or on the image: without it,
          # an image that drops PyYAML turns this guard into an ImportError,
          # which is a red build that says nothing about working directories.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflow-working-directories.py

      - name: Setup Go (for actionlint)
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint" -color'

      - name: Setup Node (for Prettier)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Workflow logic tests (embedded scripts)
        shell: bash
        run: |
          # Unit-tests the logic INSIDE workflows (github-script/bash/pwsh
          # bodies) against fixtures — the structure checks earlier in this
          # job can't catch behavior bugs like the PUBLIC/public
          # visibility-enum regression. Runs after setup-node so the
          # github-script shim executes on the pinned LTS Node, not whatever
          # the runner image happens to preinstall.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 tests/workflow-logic/run_all.py

      - name: Check formatting (Prettier)
        run: |
          npx --yes prettier@3.8.1 --check . --ignore-unknown

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Write-Host "Validating PowerShell scripts..."
          $scripts = @(
            'Update-CloudflareDns.ps1',
            'Update-StagingDns.ps1',
            'Export-CloudflareDns.ps1'
          )
          $hasErrors = $false
          foreach ($script in $scripts) {
            if (Test-Path $script) {
              Write-Host "Checking $script..." -NoNewline
              try {
                $errors = $null
                [void][System.Management.Automation.Language.Parser]::ParseInput(
                  (Get-Content $script -Raw),
                  [ref]$null,
                  [ref]$errors
                )
                if ($errors -and $errors.Count -gt 0) {
                  $messages = $errors | ForEach-Object { $_.Message } | Where-Object { $_ } | Select-Object -Unique
                  throw "Syntax errors in '$script': $($messages -join '; ')"
                }
                Write-Host " OK" -ForegroundColor Green
              } catch {
                Write-Host " FAILED" -ForegroundColor Red
                Write-Error $_.Exception.Message
                $hasErrors = $true
              }
            } else {
              Write-Error "Script not found: $script"
              $hasErrors = $true
            }
          }
          if ($hasErrors) {
            exit 1
          }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer
          # 'ParseError' MUST be in this list. PSScriptAnalyzer reports a script that does not
          # parse with Severity 'ParseError' — NOT 'Error' — so filtering to @('Error','Warning')
          # discarded them silently. Invoke-Formatter (next step) also returns unparseable input
          # unchanged and raises nothing. Both gates therefore went green on a .ps1 that PowerShell
          # cannot even load, which is a strictly worse failure than any rule violation they do
          # catch. Verified live: a file containing `"at line $line: x"` (an unbraced variable
          # followed by ':', which PowerShell reads as a scope qualifier) passed the full CI suite.
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity @('ParseError','Error','Warning') | Where-Object { $_.ScriptPath -like '*.ps1' }
          $parseErrors = $results | Where-Object { $_.Severity -eq 'ParseError' }
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          $warnings = $results | Where-Object { $_.Severity -eq 'Warning' }

          # Reported before the others: a parse error makes every other finding in that file
          # unreliable, so it should be the first thing read in the log.
          if ($parseErrors) {
            Write-Host "PowerShell PARSE ERRORS (these scripts cannot run at all):" -ForegroundColor Red
            $parseErrors | Select-Object ScriptPath,Line,Message | Format-Table -AutoSize -Wrap | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($parseErrors.Count) parse error(s)."
          }

          if ($warnings) {
            Write-Host "PSScriptAnalyzer warnings:" -ForegroundColor Yellow
            $warnings | Select-Object RuleName,Severity,Message,Line | Format-Table -AutoSize | Out-String | Write-Host
          }

          if ($errors) {
            Write-Host "PSScriptAnalyzer errors:" -ForegroundColor Red
            $errors | Select-Object RuleName,Severity,Message,Line | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }

      - name: Check PowerShell formatting (Invoke-Formatter)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer

          $excludePattern = '([/\\]node_modules[/\\]|[/\\]\.git[/\\]|[/\\]\.venv[/\\])'
          $files = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | Where-Object { $_.FullName -notmatch $excludePattern }
          if (-not $files -or $files.Count -eq 0) {
            Write-Host "No .ps1 files found."
            exit 0
          }

          $changed = @()
          foreach ($file in $files) {
            $original = Get-Content -Path $file.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $original
            if ($formatted -ne $original) {
              $changed += $file.FullName
            }
          }

          if ($changed.Count -gt 0) {
            Write-Host "PowerShell formatting differs for:" -ForegroundColor Red
            $changed | ForEach-Object { Write-Host " - $_" }
            throw "Invoke-Formatter check failed. Run Invoke-Formatter locally to update files."
          }

      - name: Run PowerShell unit tests (Pester)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # BOTH directories. This ran only scripts/tests, so every .Tests.ps1 under tests/
          # was dead weight — present, passing locally, and never executed by any required
          # check. tests/whmcs-application-triage.Tests.ps1 had been in that state for its
          # whole life. A test that does not run is worse than a missing one: it reads as
          # coverage in review, so nobody writes the test that would have run.
          #
          # Discovered by directory rather than listed, so a new location cannot be silently
          # dropped again — and the count is printed so "0 files" is visible instead of
          # looking like a clean pass.
          $testDirs = @('scripts/tests', 'tests') | Where-Object { Test-Path $_ }

          if (-not $testDirs) {
            Write-Host 'No Pester test directories found; skipping.'
            exit 0
          }

          $testFiles = Get-ChildItem -Path $testDirs -Filter *.Tests.ps1 -Recurse -File
          Write-Host "Pester directories: $($testDirs -join ', ')"
          Write-Host "Pester files found: $($testFiles.Count)"
          $testFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }

          if ($testFiles.Count -eq 0) {
            throw 'Pester test directories exist but contain no *.Tests.ps1 files — refusing to report a pass on zero tests.'
          }

          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Invoke-Pester -Path $testDirs -Output Detailed -CI

      - name: Check for sensitive files
        run: |
          echo "Checking for accidentally committed sensitive files..."

          found_sensitive=false

          # Check for sensitive patterns
          sensitive_patterns=(
            "*.pem"
            "*.key"
            ".env"
            ".env.local"
          )

          for pattern in "${sensitive_patterns[@]}"; do
            if find . -name "$pattern" -not -path "./.git/*" | grep -q .; then
              echo "ERROR: Found sensitive files matching pattern: $pattern"
              find . -name "$pattern" -not -path "./.git/*"
              found_sensitive=true
            fi
          done

          if [ "$found_sensitive" = true ]; then
            echo "ERROR: Sensitive files found in repository!"
            exit 1
          fi
          echo "✓ No sensitive files found"

      - name: Verify README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "Error: README.md not found"
            exit 1
          fi
          echo "✓ README.md exists"

      - name: Validate environment protection matches the docs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Every "gated" / "ungated" claim in this repo was asserted against
          # itself: the workflow-logic suite compares a workflow's environment:
          # to the safety doc and the catalog — our files to our other files.
          # All three can agree perfectly and be wrong together, because the
          # protection rules live in Settings -> Environments and are in no
          # artifact here. Adding required_reviewers to github-prod-read would
          # turn every workflow on that lane into a gate-parker (#834) and leave
          # the whole suite green. This step is the only one that asks GitHub.
          #
          # Read-only: GET /repos/:owner/:repo/environments on our own repo,
          # which the ambient token covers — workflow 730 has been reading the
          # same endpoint with ${{ github.token }} and actions: read. It fails
          # closed on a missing token or an unreadable list, because "we could
          # not read the environments" must never render as "no gates" (#993).
          #
          # LAST ON PURPOSE. It is the only step here that depends on state
          # outside the tree, so it is the only one that can be red for a reason
          # no commit can fix (an unprovisioned lane, an admin toggling a gate).
          # Placed among the static checks it aborts the job early and masks
          # actionlint, prettier, the workflow-logic suite and the PowerShell
          # steps behind an external condition. Running it last means those all
          # report first and this one is additive.
          python3 scripts/check-environment-protection.py
