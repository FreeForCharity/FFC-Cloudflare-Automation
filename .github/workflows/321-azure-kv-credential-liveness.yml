name: '321. Azure - KV Credential Liveness + Expiry Monitor [MS+GH+CF]'
run-name: 'KV credential liveness + expiry monitor'

# Daily health check of the credentials in kv-ffc-admin-prod-cbm that back the
# automation lanes, on two independent signals:
#
#   1. EXPIRY/ENABLED for every secret, read from `az keyvault secret list`,
#      which returns attributes WITHOUT values. So write-scope credentials are
#      monitored without this workflow ever reading their material.
#   2. LIVENESS for the credentials that can verify themselves read-only — the
#      two GitHub PATs (GET /user) and the two Cloudflare tokens
#      (GET /zones). Probes cover `read-all-*` secrets ONLY; the
#      library refuses a `wr-all-*` target before anything is read.
#
# The Cloudflare probe deliberately does NOT use /user/tokens/verify: that
# endpoint does not apply to account-scoped tokens and rejects a working one,
# which made 321's first run (#877) report both live Cloudflare tokens as dead.
# Probe the call the lane actually makes.
#
# Why (#848): both `read-all-*` GitHub PATs in the vault were dead with
# 401 Bad credentials, for an unknown period, and nothing noticed because
# nothing consumed them yet. Expiry alone would not have caught it — a REVOKED
# token still carries a future expiry date — which is why liveness is a separate
# signal here and why a probe that cannot be evaluated is reported as
# unverifiable rather than passing (the #726/#855 lesson: never render an
# unreadable response as a green check).
#
# Secret values are never printed, never written to the artifact, and never sent
# anywhere except the probe host, which is re-validated against an allowlist in
# this file immediately before the request. Findings are upserted into one
# rolling issue that auto-closes when the vault is clean.
#
# Runs on google-prod-read because it federates the ffc-admin-kv-reader
# identity and has no approval gate (a monitor must not wait on a human, and a
# dedicated azure-prod-read environment would need a new federated credential).
# Under the per-secret RBAC migration (#848 part A) that identity needs
# `getSecret` on the four probed `read-all-*` secrets, plus list on the vault;
# without those grants the run reports UNVERIFIABLE, not green.
#
# Classification + report logic lives in scripts/kv-credential-liveness-lib.js
# (unit-tested under tests/workflow-logic/).

on:
  schedule:
    # Daily 09:24 UTC — a minute no other hub workflow uses. Was :23 until 506
    # (Fleet Telemetry Reachability, weekly Mon 07:23) landed on main and took
    # that slot; the collision guard below is what caught it on the merge.
    - cron: '24 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A half-finished sweep leaves the credentials it never reached unchecked, so
  # a later run must never cancel one in flight.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: google-prod-read
    steps:
      - name: Checkout (for the classification library)
        uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC, reader identity)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Gather expiry attributes + probe liveness (values never printed)
        id: gather
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vault = 'kv-ffc-admin-prod-cbm'

          # Only these hosts may ever receive a credential. Checked per request
          # against the URL the library supplies, so an edit that redirected a
          # probe elsewhere fails here instead of leaking the token.
          $allowedHosts = @('api.github.com', 'api.cloudflare.com')

          # --- 1. Expiry/enabled for every secret (attributes only, no values)
          $secrets = @()
          $listError = $null
          # stderr to a file, never `2>&1`: with $ErrorActionPreference = 'Stop'
          # a merged native stderr stream throws, and it would also let an az
          # warning land inside the JSON this parses.
          $listErrFile = "$env:RUNNER_TEMP/az-list-err.txt"
          $listJson = az keyvault secret list --vault-name $vault -o json 2>$listErrFile
          if ($LASTEXITCODE -ne 0) {
            $detail = ((Get-Content $listErrFile -Raw -ErrorAction SilentlyContinue) -replace '\s+', ' ').Trim()
            if ($detail.Length -gt 300) { $detail = $detail.Substring(0, 300) }
            $listError = "az keyvault secret list failed: $detail"
            Write-Host "::warning::$listError"
          } else {
            foreach ($s in ($listJson | ConvertFrom-Json)) {
              $name = if ($s.name) { $s.name } else { ($s.id -split '/')[-1] }
              $expires = if ($s.attributes.expires) {
                ([DateTimeOffset]$s.attributes.expires).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              } else { $null }
              $updated = if ($s.attributes.updated) {
                ([DateTimeOffset]$s.attributes.updated).ToUniversalTime().ToString('yyyy-MM-dd')
              } else { $null }
              $secrets += [pscustomobject]@{
                name = $name; enabled = [bool]$s.attributes.enabled
                expires = $expires; updated = $updated
              }
            }
            Write-Host "Listed $($secrets.Count) secret(s) in $vault."
          }

          # --- 2. Liveness probes. The registry (read-all-* only) and the URLs
          # come from the shipped library, so what is tested is what runs.
          $registry = node -e '
            const lib = require("./scripts/kv-credential-liveness-lib.js");
            const probes = lib.assertNoWriteScopeProbes(lib.PROBES);
            process.stdout.write(JSON.stringify(probes.map((p) => ({
              secret: p.secret, kind: p.kind, url: lib.PROBE_KINDS[p.kind].url,
              expiryHeader: lib.PROBE_KINDS[p.kind].expiryHeader || null,
              requireSuccessBody: Boolean(lib.PROBE_KINDS[p.kind].requireSuccessBody),
            }))));
          '
          if ($LASTEXITCODE -ne 0) { throw 'Probe registry rejected — refusing to read any secret.' }
          $targets = $registry | ConvertFrom-Json

          $probes = @()
          foreach ($t in $targets) {
            $result = [ordered]@{
              secret = $t.secret; kind = $t.kind; httpStatus = $null
              bodySuccess = $null; providerExpiry = $null; error = $null
            }

            $uri = [System.Uri]$t.url
            if ($uri.Scheme -ne 'https' -or $allowedHosts -notcontains $uri.Host) {
              # Never read the secret at all if its destination is not allowed.
              $result.error = "probe host not allowlisted: $($uri.Host)"
              Write-Host "::error::$($t.secret): $($result.error)"
              $probes += [pscustomobject]$result
              continue
            }

            # Presence is only knowable when the listing succeeded; without it,
            # probe anyway rather than reporting every credential as missing.
            if (-not $listError -and -not ($secrets.name -contains $t.secret)) {
              # analyze() reports this as `missing`; reading it would only fail.
              Write-Host "::warning::$($t.secret) is registered for probing but absent from $vault"
              $probes += [pscustomobject]$result
              continue
            }

            # stderr to a file, so an az warning can never land inside $value.
            $errFile = "$env:RUNNER_TEMP/az-err.txt"
            $value = az keyvault secret show --vault-name $vault --name $t.secret --query value -o tsv 2>$errFile
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
              $detail = (Get-Content $errFile -Raw -ErrorAction SilentlyContinue) -replace '\s+', ' '
              if ($detail.Length -gt 180) { $detail = $detail.Substring(0, 180) }
              $result.error = "key vault read failed: $($detail.Trim())"
              Write-Host "::warning::$($t.secret): key vault read failed"
              $probes += [pscustomobject]$result
              continue
            }
            # 227's lesson: a stored credential can carry a trailing newline.
            $value = $value.TrimEnd([char]13, [char]10)
            # Mask LINE BY LINE, never the whole value. `::add-mask::` is a
            # line-oriented workflow command, so masking a value that contains
            # an embedded newline registers only its FIRST line as a secret and
            # prints the remainder to the log in clear. Same rule the
            # *-secrets-from-kv actions follow.
            foreach ($line in ($value -split "`r?`n")) {
              if (-not [string]::IsNullOrWhiteSpace($line)) { Write-Host "::add-mask::$line" }
            }

            $headers = @{
              Authorization = "Bearer $value"
              'User-Agent'  = 'ffc-kv-credential-liveness'
            }
            if ($uri.Host -eq 'api.github.com') { $headers['Accept'] = 'application/vnd.github+json' }

            try {
              $resp = Invoke-WebRequest -Uri $t.url -Method GET -Headers $headers `
                -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 30
              $result.httpStatus = [int]$resp.StatusCode
              if ($t.expiryHeader -and $resp.Headers.ContainsKey($t.expiryHeader)) {
                $result.providerExpiry = ($resp.Headers[$t.expiryHeader] | Select-Object -First 1)
              }
              if ($t.requireSuccessBody -and $result.httpStatus -eq 200) {
                # Only the envelope's boolean is read out of the body — never
                # the zone list itself, which is data this monitor has no use
                # for. A body that will not parse leaves this $null, which the
                # library classifies as unverifiable rather than live.
                try {
                  $parsed = $resp.Content | ConvertFrom-Json
                  if ($null -ne $parsed.success) { $result.bodySuccess = [bool]$parsed.success }
                } catch {
                  $result.error = "probe body did not parse as JSON"
                }
              }
            } catch {
              $result.error = "probe request failed: $($_.Exception.Message -replace '\s+', ' ')"
            }
            $value = $null
            $headers = $null
            Write-Host "  $($t.secret) -> http=$($result.httpStatus) success=$($result.bodySuccess)"
            $probes += [pscustomobject]$result
          }

          $payload = [pscustomobject]@{
            vault = $vault; listError = $listError
            secrets = @($secrets); probes = @($probes)
          }
          $out = "$env:RUNNER_TEMP/kv-credential-health.json"
          $payload | ConvertTo-Json -Depth 5 | Set-Content $out -Encoding utf8
          "payload_file=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Analyze + upsert/close rolling issue
        uses: actions/github-script@v9
        env:
          PAYLOAD_FILE: ${{ steps.gather.outputs.payload_file }}
        with:
          script: |
            const fs = require('fs');
            const lib = require('./scripts/kv-credential-liveness-lib.js');

            const payload = JSON.parse(fs.readFileSync(process.env.PAYLOAD_FILE, 'utf8'));
            const nowIso = new Date().toISOString();
            const analysis = lib.analyze({
              secrets: payload.secrets || [],
              probes: payload.probes || [],
              listError: payload.listError || null,
              now: nowIso,
            });
            core.notice(lib.summary(analysis));

            const body = lib.renderBody(analysis, nowIso);
            fs.writeFileSync('kv-credential-health.json', JSON.stringify(analysis, null, 2));
            await core.summary.addRaw(body.replace(lib.MARKER, '')).write();

            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            // Skips pull requests, which this listing also returns — see the
            // library. Never hand-roll the marker match here: the close path
            // below can close whatever this selects (#980).
            const existing = lib.findRollingIssue(open);

            if (!analysis.hasFinding) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `✅ Recovered: every monitored Key Vault credential is live and none expires within ${lib.EXPIRY_WARN_DAYS} days (${lib.summary(analysis)}) ([run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})). Auto-closing.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.notice(`Closed rolling issue #${existing.number}`);
              } else {
                core.notice('Vault credentials healthy and no open rolling issue — nothing to do.');
              }
              return;
            }

            // Converge the labels on both paths, so a manually stripped label is
            // restored rather than only the body being refreshed.
            const labelColors = {
              security: 'b60205',
              'priority: high': 'd93f0b',
              'agentic-os': '5319e7',
            };
            for (const name of lib.ISSUE_LABELS) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: labelColors[name] || 'ededed',
                });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = already exists
              }
            }

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: existing.number,
                labels: lib.ISSUE_LABELS,
              });
              core.notice(`Updated rolling issue #${existing.number} — ${lib.summary(analysis)}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: lib.ISSUE_TITLE,
                labels: lib.ISSUE_LABELS,
                body,
              });
              core.notice(`Opened rolling issue #${created.data.number} — ${lib.summary(analysis)}`);
            }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kv-credential-health
          path: kv-credential-health.json
          retention-days: 90
          if-no-files-found: warn
