name: '737. Repo - Claim Sync [Repo]'
run-name: 'Claim sync: ${{ github.event_name }}'

# Mechanizes the AGENTS.md work-claiming protocol (available = `is:open
# -label:claimed`). Two independent triggers:
#
#   1. Event-driven label sync (pull_request): parse Closes/Fixes/Refs #N from
#      the PR body and add `claimed` to those open hub issues while the PR is
#      active; remove it when the last open linked PR closes/merges.
#   2. Daily sweep (schedule): reconcile this repo's `claimed` labels against
#      every open PR in the org. The pickup query in AGENTS.md is org-wide but
#      trigger 1 is repo-local, so a hub issue implemented by a PR in a template
#      or site repo read as unclaimed and invited a duplicate (#939). The sweep
#      claims those, releases a claim once the last open PR referencing the
#      issue — in any repo — is closed or merged, and still releases a stale
#      hand-labeled claim after 48h of inactivity. Cross-repo is READ-only here:
#      every write targets this repo's own issues, so the ambient token suffices.
#      (ffcadmin still needs its own sweep for ITS issues: cross-repo writes
#      require CBM_TOKEN, which lives only in the gated github-prod environment
#      — unusable for an ungated daily job.)
#
# Writes issues/labels only; no external API; ungated. The decision logic lives
# in scripts/claim-sync-lib.js (unit-tested in tests/workflow-logic/).

on:
  pull_request:
    types: [opened, reopened, edited, closed, converted_to_draft, ready_for_review]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sweep: report only; do not remove labels or comment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Per-PR for label sync; a single shared 'sweep' group for BOTH the scheduled
  # and dispatched sweeps so they serialize (never double-comment/double-remove
  # on the same issue). event_name is deliberately omitted from the sweep key.
  group: claim-sync-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  # --- Half 1: event-driven label sync (linked PR -> claimed) -----------------
  label-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Pin to the PR BASE (reviewed default-branch code), not the PR head, so
      # this issues:write job never executes claim-sync-lib.js as modified by the
      # PR under review. Post-merge the base always carries the lib; on the PR
      # that first introduces it the require is guarded below (bootstrap).
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Sync claimed label from linked PR
        uses: actions/github-script@v9
        env:
          PR_ACTION: ${{ github.event.action }}
        with:
          script: |
            const libPath = `${process.env.GITHUB_WORKSPACE}/scripts/claim-sync-lib.js`;
            let lib;
            try {
              lib = require(libPath);
            } catch (e) {
              core.info('claim-sync-lib.js not on the base ref yet (pre-merge bootstrap); skipping.');
              return;
            }
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = process.env.PR_ACTION;

            // Bounded pager: cap at maxPages so a busy repo can't turn one run
            // into hundreds of REST calls (AGENTS.md: bounded pagination only).
            const listOpen = async (method, params, maxPages = 5) => {
              const out = [];
              for (let page = 1; page <= maxPages; page++) {
                const { data } = await method({ ...params, per_page: 100, page });
                out.push(...data);
                if (data.length < 100) break;
              }
              return out;
            };
            // Repo-scoped extraction: a bare `#N` in THIS repo's PR means this
            // repo's issue #N, and a reference qualified with this repo counts
            // too. A reference qualified with any OTHER repo is not ours.
            const scope = { sourceRepo: `${owner}/${repo}`, targetRepo: `${owner}/${repo}` };
            const linked = lib.extractLinkedIssues(pr.body || '', scope).all;
            if (!linked.length) {
              core.info(`PR #${pr.number}: no linked issues; nothing to sync.`);
              return;
            }

            const hasLabel = (issue) =>
              (issue.labels || []).some((l) => (l.name || l) === lib.CLAIM_LABEL);

            if (action !== 'closed') {
              // PR active (opened/reopened/edited/ready_for_review/
              // converted_to_draft): ensure every linked OPEN issue is claimed.
              // (A reference REMOVED via `edited` is not un-claimed here; the
              // daily sweep eventually releases it once the issue has no open
              // linked PR AND is idle for the 48h expiry threshold.)
              for (const n of linked) {
                const { data: issue } = await github.rest.issues
                  .get({ owner, repo, issue_number: n })
                  .catch(() => ({ data: null }));
                if (!issue || issue.state !== 'open' || issue.pull_request) continue;
                if (hasLabel(issue)) continue;
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: n, labels: [lib.CLAIM_LABEL],
                });
                core.info(`Claimed #${n} (linked from PR #${pr.number}).`);
              }
              return;
            }

            // PR closed/merged: release each linked issue that no OTHER open PR
            // still claims.
            const openPrs = await listOpen(github.rest.pulls.list, { owner, repo, state: 'open' });
            for (const n of linked) {
              const { data: issue } = await github.rest.issues
                .get({ owner, repo, issue_number: n })
                .catch(() => ({ data: null }));
              if (!issue || issue.state !== 'open' || issue.pull_request) continue;
              if (!hasLabel(issue)) continue;
              const otherClaim = openPrs.some(
                (p) =>
                  p.number !== pr.number &&
                  lib.extractLinkedIssues(p.body || '', scope).all.includes(n),
              );
              if (otherClaim) continue;
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: n, name: lib.CLAIM_LABEL,
              }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: `🔓 Claim released — linked PR #${pr.number} ${pr.merged ? 'merged' : 'closed'} and no other open PR references this issue. Available again (\`is:open -label:claimed\`).`,
              });
              core.info(`Released #${n} (PR #${pr.number} closed).`);
            }

  # --- Half 2: daily sweep of expired claims (this repo) ----------------------
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Sync cross-repo claims and release finished or expired ones
        uses: actions/github-script@v9
        # Ambient GITHUB_TOKEN (issues: write) — hub-only. CBM_TOKEN is an
        # environment secret in gated github-prod, so it is EMPTY here on
        # schedule events (first scheduled fire 2026-07-20 failed on exactly
        # that); an ungated daily sweep cannot use it, and cross-repo mutation
        # of ffcadmin is therefore out of scope for this job.
        env:
          DRY_RUN:
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false'
            }}
        with:
          script: |
            const lib = require(`${process.env.GITHUB_WORKSPACE}/scripts/claim-sync-lib.js`);
            const dryRun = String(process.env.DRY_RUN) === 'true';
            const now = Date.now();

            // Bounded pager (see label-sync): cap pages so the daily sweep
            // can't spike the shared REST budget. `labels=claimed` already
            // keeps the issue result set tiny.
            const listOpen = async (method, params, maxPages = 5) => {
              const out = [];
              for (let page = 1; page <= maxPages; page++) {
                const { data } = await method({ ...params, per_page: 100, page });
                out.push(...data);
                if (data.length < 100) break;
              }
              return out;
            };

            // The ONLY repo this job writes to (ambient GITHUB_TOKEN). Spelled
            // out rather than derived so the write target is reviewable here.
            const hub = { owner: 'FreeForCharity', repo: 'FFC-Cloudflare-Automation' };
            const hubNwo = `${hub.owner}/${hub.repo}`;

            // --- every open PR that can claim a hub issue --------------------
            // Hub PRs come from pulls.list: authoritative and never subject to
            // search-index lag, so a PR opened minutes ago still holds its claim
            // even if the search below has not indexed it yet.
            const hubPrs = (await listOpen(github.rest.pulls.list, { ...hub, state: 'open' }))
              .map((p) => ({ nwo: hubNwo, number: p.number, body: p.body || '' }));

            // Everything else comes from ONE org-wide search per sweep (never one
            // per issue — AGENTS.md rate budget). The backlog is org-wide but the
            // mechanism maintaining `claimed` was repo-local, so a hub issue
            // implemented by a template/site-repo PR read as unclaimed and invited
            // a duplicate (#939). Reading public PR bodies needs no extra scope.
            const nwoOf = (item) => {
              const m = String(item.repository_url || '').match(/\/repos\/([^/]+\/[^/]+)$/);
              if (m) return m[1];
              const h = String(item.html_url || '').match(/github\.com\/([^/]+\/[^/]+)\/pull\//);
              return h ? h[1] : null;
            };
            let searchOk = true;
            const orgPrs = [];
            // The Search API serves at most SEARCH_CAP results for a query and
            // then stops, so a query whose population exceeds the cap can only
            // ever be read short — the truncation guard below fires and the
            // whole cross-repo pass degrades to a no-op. That is not a
            // hypothetical: the first live sweep after #941 measured 1,009 open
            // org PRs and skipped every run (#939). Authors that can never claim
            // a hub issue are therefore excluded from the query rather than
            // filtered after the fact: dependabot alone was 849 of those 1,009,
            // taking the population to ~160. Excluding a non-claiming author
            // loses no claim; widening this list is NOT the answer if the query
            // grows again — a per-repo pulls.list fan-out is (see the headroom
            // warning below).
            const SEARCH_CAP = 1000;
            const SEARCH_CAP_HEADROOM = 800;
            // One page size, three consumers (the loop bound, the request, the
            // last-page test). Spelling 100 three times is how the cap maths
            // silently drifts out of step with what is actually fetched.
            const SEARCH_PER_PAGE = 100;
            const NON_CLAIMING_AUTHORS = ['app/dependabot'];
            try {
              const q = [
                `org:${hub.owner}`, 'is:pr', 'is:open',
                ...NON_CLAIMING_AUTHORS.map((a) => `-author:${a}`),
              ].join(' ');
              let total = null;
              let fetched = 0;
              for (let page = 1; page <= Math.ceil(SEARCH_CAP / SEARCH_PER_PAGE); page++) {
                const { data } = await github.rest.search.issuesAndPullRequests({
                  q, per_page: SEARCH_PER_PAGE, page,
                });
                if (data.incomplete_results) throw new Error('incomplete_results');
                if (total === null) total = data.total_count;
                const items = data.items || [];
                fetched += items.length;
                for (const it of items) {
                  const nwo = nwoOf(it);
                  if (nwo) orgPrs.push({ nwo, number: it.number, body: it.body || '' });
                }
                if (items.length < SEARCH_PER_PAGE) break;
              }
              // Completeness, not just the flag: the Search API also caps a query
              // and stops paginating with incomplete_results FALSE. A short read
              // means "which PRs are open is unknown", which must never be allowed
              // to read as "no PR claims this issue" and release a live claim.
              if (!Number.isFinite(total) || fetched < total) {
                throw new Error(`truncated: ${fetched} of ${total} result(s)`);
              }
              // Announce the NEXT cap breach instead of discovering it as a
              // silently skipped pass. This read was complete, so the sweep is
              // healthy — but the fleet grows, and the failure mode it grows
              // into is invisible without this line.
              if (total >= SEARCH_CAP_HEADROOM) {
                core.warning(
                  `Org-wide PR search is at ${total} of the ${SEARCH_CAP}-result cap. Cross-repo ` +
                  'claim sync still ran, but it stops entirely at the cap: switch to a per-repo ' +
                  'pulls.list fan-out (#939) rather than excluding more authors.',
                );
              }
            } catch (e) {
              searchOk = false;
              core.warning(
                `Org-wide PR search unusable (${e.message}); cross-repo claim sync skipped this ` +
                'run. Hub PRs and the 48h expiry backstop still apply.',
              );
            }

            const openPrs = hubPrs.concat(
              searchOk ? orgPrs.filter((p) => p.nwo.toLowerCase() !== hubNwo.toLowerCase()) : [],
            );

            // hub issue number -> the open PRs (any repo) claiming it
            const claimants = new Map();
            for (const pr of openPrs) {
              for (const n of lib.extractLinkedIssues(pr.body, {
                sourceRepo: pr.nwo, targetRepo: hubNwo,
              }).all) {
                if (!claimants.has(n)) claimants.set(n, []);
                claimants.get(n).push(`${pr.nwo}#${pr.number}`);
              }
            }

            const claimedIssues = (await listOpen(github.rest.issues.listForRepo, {
              ...hub, state: 'open', labels: lib.CLAIM_LABEL,
            })).filter((i) => !i.pull_request);
            const alreadyClaimed = new Set(claimedIssues.map((i) => i.number));

            // --- claim: an open PR anywhere in the org names a hub issue -----
            // Runs whether or not the search worked. `claimants` is already
            // reduced to hub PRs when it did not, and those come from pulls.list
            // — authoritative either way. Skipping this on a transient search
            // failure would leave a hub issue unclaimed with an open hub PR
            // referencing it (e.g. a hand-removed label with no PR event to
            // re-add it), which is the defect this job exists to prevent.
            const claimed = [];
            for (const [n, refs] of claimants) {
              if (alreadyClaimed.has(n)) continue;
              const { data: issue } = await github.rest.issues
                .get({ ...hub, issue_number: n })
                .catch(() => ({ data: null }));
              if (!issue || issue.state !== 'open' || issue.pull_request) continue;
              if ((issue.labels || []).some((l) => (l.name || l) === lib.CLAIM_LABEL)) continue;
              claimed.push(`#${n} <- ${refs.join(', ')}`);
              if (dryRun) continue;
              await github.rest.issues.addLabels({
                ...hub, issue_number: n, labels: [lib.CLAIM_LABEL],
              });
              await github.rest.issues.createComment({
                ...hub, issue_number: n, body: lib.linkedClaimComment(refs.join(', ')),
              });
            }

            // --- release: no open PR anywhere still claims it ----------------
            const released = [];
            for (const issue of claimedIssues) {
              if (claimants.has(issue.number)) continue;
              const lastActivityMs = new Date(issue.updated_at).getTime();
              const decide = (claimedByLinkedPR) => lib.decideRelease({
                hasOpenLinkedPR: false, claimedByLinkedPR, lastActivityMs,
                nowMs: now, thresholdMs: lib.EXPIRY_MS,
              });
              // A cross-repo PR gives this job no `closed` event, so the marker
              // on the sweep's own claim comment is what separates a PR-derived
              // claim from a hand-written one. Read it only where it can change
              // the outcome:
              //   search usable + INSIDE the window -> a marker releases now
              //     (matching the same-repo path), while an unmarked CLAIM
              //     comment keeps its full 48h or two agents collide;
              //   search UNUSABLE + PAST the window -> a marker HOLDS. The open
              //     PR set is unknown, and a cross-repo PR that stays open
              //     longer than the expiry would otherwise lose its claim to
              //     the backstop on a transient search failure — releasing a
              //     live claim on silence, which is exactly what this job must
              //     never do.
              // The other two combinations cannot change the decision, so they
              // spend no REST call.
              const expired = decide(false);
              const provenanceMatters = searchOk ? !expired : expired;
              const claimedByLinkedPR = provenanceMatters
                ? lib.hasLinkedClaimMarker(
                    await listOpen(github.rest.issues.listComments, {
                      ...hub, issue_number: issue.number,
                    }, 3).catch(() => []),
                  )
                : false;
              if (!searchOk && claimedByLinkedPR) continue;
              if (!decide(claimedByLinkedPR)) continue;
              released.push(`${hub.repo}#${issue.number}`);
              if (dryRun) continue;
              await github.rest.issues.removeLabel({
                ...hub, issue_number: issue.number, name: lib.CLAIM_LABEL,
              }).catch(() => {});
              await github.rest.issues.createComment({
                ...hub, issue_number: issue.number,
                body: claimedByLinkedPR
                  ? `🔓 Claim released — the last open PR referencing this issue (in any ${hub.owner} repo) is closed or merged. Label \`${lib.CLAIM_LABEL}\` removed; available again (\`is:open -label:claimed\`).`
                  : `🔓 Claim expired — no open linked PR and no activity for 48h. Label \`${lib.CLAIM_LABEL}\` removed; available again (\`is:open -label:claimed\`).`,
              });
            }

            const lines = [
              ...claimed.map((c) => `- 🔒 claimed ${c}`),
              ...released.map((r) => `- 🔓 released ${r}`),
            ];
            core.summary
              .addHeading(`Claim sweep — ${claimed.length} claimed, ${released.length} released${dryRun ? ' (dry-run)' : ''}`)
              .addRaw(lines.length ? lines.join('\n') : 'No changes. Every claim matches an open PR or is inside the 48h window.')
              .write();
            console.log(`${dryRun ? 'Would apply' : 'Applied'} ${claimed.length} claim(s) and ${released.length} release(s).`);
