name: '102. Domain - Add to FFC Cloudflare + WHMCS Nameservers (Admin) [CF+WHMCS]'
run-name: 'Add Domain: ${{ inputs.domain }}'

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain name to add (e.g., example.org)'
        required: true
        type: string
        default: 'slopestohope.org'
      zone_type:
        description: 'Zone type'
        required: true
        type: choice
        options:
          - full
          - partial
        default: full
      jump_start:
        description:
          'Attempt to auto-import DNS records from existing nameservers (Cloudflare jump_start)'
        required: false
        type: boolean
        default: false
      enforce_dry_run:
        description: 'Dry run enforcement (preview only)'
        required: false
        type: boolean
        default: false
      dmarc_mgmt_debug:
        description: 'Debug: run DMARC Management API probe/attempts (noisy)'
        required: false
        type: boolean
        default: false
      update_whmcs_nameservers:
        description: 'Update WHMCS nameservers to FFC custom nameservers'
        required: false
        type: boolean
        default: true
      require_whmcs_domain:
        description: 'Fail fast if domain is not found in WHMCS'
        required: false
        type: boolean
        default: true
      issue_number:
        description: 'Optional: issue number to comment results back to'
        required: false
        type: number

permissions:
  contents: read
  issues: write

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 102-domain-add-ffc-cloudflare-and-whmcs
  cancel-in-progress: false

jobs:
  whmcs_preflight:
    runs-on: windows-latest
    environment: whmcs-prod
    permissions:
      contents: read
      id-token: write
    outputs:
      domain: ${{ steps.meta.outputs.domain }}
      found: ${{ steps.check.outputs.found }}
      domain_id: ${{ steps.check.outputs.domain_id }}

    steps:
      - uses: actions/checkout@v7.0.1

      # WHMCS credential from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      # `domain` is a free-text dispatch input. Interpolated into this body it was
      # not an argument — it was source text pasted into the program GitHub then
      # runs, in a step holding the WHMCS API credential the APPROVER spent
      # (#1080). The credential is named in no `env:` block in this file: the
      # preceding `whmcs-secrets-from-kv` step exports WHMCS_API_IDENTIFIER /
      # _SECRET / _APIM_SUBSCRIPTION_KEY through GITHUB_ENV, so a reader who checks
      # this step's own `env:` (ledger L213) and a `secrets.` grep of the file
      # (#1141) both score it as holding nothing. Run `python3
      # scripts/check-workflow-input-interpolation.py --reachability
      # 102-domain-add-ffc-cloudflare-and-whmcs.yml` for the arrival path (#1188).
      #
      # The injection point sat in DOUBLE quotes, where pwsh expands `$( )`.
      # Measured against the body as it shipped: `WHMCS_API_SECRET` was written to
      # a sentinel file, the step then emitted a wholly ordinary
      # `domain=example.org`, and it exited 0.
      - name: Metadata
        id: meta
        shell: pwsh
        env:
          IN_DOMAIN: ${{ inputs.domain }}
        run: |
          # Fail closed on an empty or unset mapping (#1150, ledger L214). `domain`
          # is `required: true`, but the dispatch API accepts an empty string for a
          # required input, and an unset mapping would make `.Trim()` throw on
          # $null with a message naming neither the input nor the cause.
          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN)) {
            Write-Output '::error::IN_DOMAIN is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain. Refusing to publish an empty domain to the job outputs.'
            exit 1
          }

          $d = $env:IN_DOMAIN.Trim().ToLowerInvariant().Trim('.')

          # Reject a line break before publishing (output injection). `.Trim()` strips
          # LEADING and TRAILING whitespace only — an INTERIOR CR/LF survives, and
          # `"domain=$d"` is the single-line `name=value` form, so one write becomes
          # several. Measured on this exact body with
          # IN_DOMAIN = "example.org\nns1=evil.ns.example\nfound=true": the file
          # received three `key=value` lines from one statement, at exit 0.
          #
          # That is this PR's own subject reached through a different channel — the
          # dispatcher's text becoming structured data a later job trusts — so it is
          # refused here rather than sanitized, for the same reason the rest of the
          # workflow refuses a blank: a domain with a line break in it is not a
          # domain, and guessing which half was meant is worse than stopping.
          if ($d -match '[\r\n]') {
            Write-Output '::error::IN_DOMAIN contains a line break. A multi-line value written to GITHUB_OUTPUT in the name=value form injects additional outputs that later jobs read as trusted. Refusing to publish it.'
            exit 1
          }

          "domain=$d" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # THE STEP OUTPUT IS THE SAME INPUT, ONE HOP LATER (#1080).
      # `steps.meta.outputs.domain` is `inputs.domain` with three string methods
      # applied to it, and none of them removes a `$( )`. Moving the input into
      # `env:` above stops it executing THERE and does nothing to stop it here —
      # measured: the remedied Metadata step wrote the payload verbatim into
      # GITHUB_OUTPUT, this body interpolated it into a double-quoted pwsh string,
      # the WHMCS secret was stolen, `-Domain` still bound the legitimate
      # `example.org`, and the step exited 0. Lowercasing is not a mitigation: the
      # job is `runs-on: windows-latest`, where `$env:` lookup is case-insensitive.
      #
      # So every hop of this value travels through `env:`, not only the hops the
      # guard can see. The guard tracks `inputs.X` and is blind to the laundering
      # by construction — filed as #1233, not left as this comment. Ledger L255.
      - name: Check domain exists in WHMCS (smoke test)
        id: check
        shell: pwsh
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          IN_DOMAIN_RESOLVED: ${{ steps.meta.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN_RESOLVED)) {
            Write-Output '::error::IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or the Metadata step published no domain. Refusing to call whmcs-domain-exists.ps1 with an empty -Domain.'
            exit 1
          }

          $domain = $env:IN_DOMAIN_RESOLVED

          $json = & pwsh -NoProfile -File .\scripts\whmcs-domain-exists.ps1 -Domain $domain
          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS preflight check failed (exit $LASTEXITCODE)."
          }

          $r = $json | ConvertFrom-Json -ErrorAction Stop
          $found = [bool]$r.found
          $domainId = [string]$r.domainId

          "found=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "domain_id=$domainId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if (-not $found -and ('${{ inputs.require_whmcs_domain }}' -eq 'true')) {
            throw "Domain '$domain' not found in WHMCS. Add it in WHMCS first (or rerun with require_whmcs_domain=false)."
          }

  cloudflare_preflight:
    runs-on: ubuntu-latest
    environment: cloudflare-prod-read
    needs: [whmcs_preflight]
    permissions:
      contents: read
      id-token: write
    outputs:
      domain: ${{ steps.meta.outputs.domain }}
      ns1: ${{ steps.meta.outputs.ns1 }}
      ns2: ${{ steps.meta.outputs.ns2 }}

    steps:
      - uses: actions/checkout@v7.0.1

      # Both the dispatch input and the upstream job output reach this body through
      # step-level `env:` (#1080). `$( )` runs inside double quotes in bash exactly
      # as it does in pwsh, so `d=$(echo "${{ inputs.domain }}" | …)` was a second
      # injection point in a second language, and the `needs.` fallback is the same
      # value one job later — see the note in `whmcs_preflight`.
      - name: Metadata
        id: meta
        shell: bash
        env:
          IN_DOMAIN: ${{ inputs.domain }}
          IN_DOMAIN_UPSTREAM: ${{ needs.whmcs_preflight.outputs.domain }}
          # Not dispatcher-controlled — see the note on IN_NS1 / IN_NS2 in
          # `whmcs_update_nameservers`. Mapped for consistency with the rest of the
          # file, so that "no expression reaches a script body here" is a property a
          # reader can check at a glance rather than a per-line judgement.
          IN_NS1: ${{ vars.FFC_CUSTOM_NAMESERVER_1 }}
          IN_NS2: ${{ vars.FFC_CUSTOM_NAMESERVER_2 }}
        run: |
          d="$IN_DOMAIN_UPSTREAM"
          if [ -z "$d" ]; then d=$(echo "$IN_DOMAIN" | tr '[:upper:]' '[:lower:]' | xargs); fi
          # Fail closed: neither source supplied a domain (#1150, ledger L214). Without
          # this the job publishes `domain=` and every consumer downstream calls its
          # script with an empty -Domain.
          if [ -z "$d" ]; then
            echo "::error::Neither IN_DOMAIN_UPSTREAM nor IN_DOMAIN carries a domain: a step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain."
            exit 1
          fi
          # Reject a line break before publishing (output injection). `xargs` collapses
          # interior whitespace but a CR can still ride through, and this step writes
          # `domain`, `ns1` and `ns2` to the same GITHUB_OUTPUT in the single-line
          # `name=value` form — so an injected line lands beside outputs a later job
          # trusts. Refused rather than sanitized: see the pwsh Metadata step.
          case "$d" in
            *[$'\r\n']*)
              echo "::error::The resolved domain contains a line break. A multi-line value written to GITHUB_OUTPUT in the name=value form injects additional outputs that later jobs read as trusted. Refusing to publish it."
              exit 1
              ;;
          esac
          echo "domain=$d" >> "$GITHUB_OUTPUT"

          # Custom account nameservers (preferred): set FFC_CUSTOM_NAMESERVER_1/2 as
          # REPOSITORY Variables, or as Variables on this job's own environment
          # (`cloudflare-prod-read`) — those are the only two scopes `vars.*` resolves
          # from here. There is no `cloudflare-prod` environment in this repo, only
          # `-read` and `-write`; a Variable set on that name resolves to the empty
          # string and the run silently takes the fallback below.
          # Fallback: use the known FFC custom nameservers.
          ns1="$IN_NS1"
          ns2="$IN_NS2"
          if [ -z "$ns1" ]; then ns1='ns1.freeforcharity.org'; fi
          if [ -z "$ns2" ]; then ns2='ns2.freeforcharity.org'; fi
          echo "ns1=$ns1" >> "$GITHUB_OUTPUT"
          echo "ns2=$ns2" >> "$GITHUB_OUTPUT"

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      # Read-only operation (just zone-get), so scope: read loads READ_ALL tokens.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: read
          azure-client-id: ${{ secrets.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.READ_ALL_FFC_AZURE_TENANT_ID }}

      # The resolved domain reaches this body through `env:` (#1080) — same hop as
      # in `whmcs_preflight`, with the read-scoped Cloudflare tokens in reach.
      - name: Check zone exists in Cloudflare (smoke test)
        shell: pwsh
        env:
          IN_DOMAIN_RESOLVED: ${{ steps.meta.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN_RESOLVED)) {
            Write-Output '::error::IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or the Metadata step published no domain. Refusing to call cloudflare-zone-get.ps1 with an empty -Domain.'
            exit 1
          }

          $domain = $env:IN_DOMAIN_RESOLVED

          $ffcJson = & pwsh -NoProfile -File scripts/cloudflare-zone-get.ps1 -Domain $domain -Account 'FFC'
          if ($LASTEXITCODE -ne 0) { throw "Cloudflare preflight (FFC) failed (exit $LASTEXITCODE)." }
          $ffc = $ffcJson | ConvertFrom-Json -ErrorAction Stop

          $cmJson = & pwsh -NoProfile -File scripts/cloudflare-zone-get.ps1 -Domain $domain -Account 'CM'
          if ($LASTEXITCODE -ne 0) { throw "Cloudflare preflight (CM) failed (exit $LASTEXITCODE)." }
          $cm = $cmJson | ConvertFrom-Json -ErrorAction Stop

          if ($cm.exists -and -not $ffc.exists) {
            throw "Zone '$domain' already exists in the CM Cloudflare account. Refusing to create a duplicate in FFC."
          }

          if ($ffc.exists) {
            Write-Host "[OK] Zone exists in FFC (zoneId=$($ffc.zoneId))." -ForegroundColor Green
          } else {
            Write-Host "[OK] Zone does not exist in FFC yet; will create." -ForegroundColor Yellow
          }

  cloudflare_zone_create:
    runs-on: ubuntu-latest
    environment: cloudflare-prod-write
    needs: [cloudflare_preflight]
    permissions:
      contents: read
      id-token: write
    outputs:
      domain: ${{ steps.meta.outputs.domain }}
      ns1: ${{ steps.meta.outputs.ns1 }}
      ns2: ${{ steps.meta.outputs.ns2 }}

    steps:
      - uses: actions/checkout@v7.0.1

      # Same pair of sources, same remedy as `cloudflare_preflight` (#1080) — but
      # this job is on `cloudflare-prod-write`, so the credential a payload here
      # would reach is the write-scoped Cloudflare token pair.
      - name: Metadata
        id: meta
        shell: bash
        env:
          IN_DOMAIN: ${{ inputs.domain }}
          IN_DOMAIN_UPSTREAM: ${{ needs.cloudflare_preflight.outputs.domain }}
          IN_NS1: ${{ needs.cloudflare_preflight.outputs.ns1 }}
          IN_NS2: ${{ needs.cloudflare_preflight.outputs.ns2 }}
        run: |
          d="$IN_DOMAIN_UPSTREAM"
          if [ -z "$d" ]; then d=$(echo "$IN_DOMAIN" | tr '[:upper:]' '[:lower:]' | xargs); fi
          if [ -z "$d" ]; then
            echo "::error::Neither IN_DOMAIN_UPSTREAM nor IN_DOMAIN carries a domain: a step-level env: mapping is missing or misnamed, or the dispatch supplied a blank domain."
            exit 1
          fi
          # Reject a line break before publishing (output injection). `xargs` collapses
          # interior whitespace but a CR can still ride through, and this step writes
          # `domain`, `ns1` and `ns2` to the same GITHUB_OUTPUT in the single-line
          # `name=value` form — so an injected line lands beside outputs a later job
          # trusts. Refused rather than sanitized: see the pwsh Metadata step.
          case "$d" in
            *[$'\r\n']*)
              echo "::error::The resolved domain contains a line break. A multi-line value written to GITHUB_OUTPUT in the name=value form injects additional outputs that later jobs read as trusted. Refusing to publish it."
              exit 1
              ;;
          esac
          echo "domain=$d" >> "$GITHUB_OUTPUT"

          # Nameservers as resolved by `cloudflare_preflight` and passed through this
          # job's `env:`. This job reads no Variable of its own: set
          # FFC_CUSTOM_NAMESERVER_1/2 where THAT job can see them (see its comment).
          # Fallback: use the known FFC custom nameservers.
          ns1="$IN_NS1"
          ns2="$IN_NS2"
          if [ -z "$ns1" ]; then ns1='ns1.freeforcharity.org'; fi
          if [ -z "$ns2" ]; then ns2='ns2.freeforcharity.org'; fi
          echo "ns1=$ns1" >> "$GITHUB_OUTPUT"
          echo "ns2=$ns2" >> "$GITHUB_OUTPUT"

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      # The resolved domain reaches this body through `env:` (#1080). `zone_type`
      # (choice) and `jump_start` (boolean) stay interpolated and are NOT findings:
      # GitHub generates both from the declared options, so neither can carry a
      # payload.
      - name: Create zone (FFC)
        shell: pwsh
        env:
          IN_DOMAIN_RESOLVED: ${{ steps.meta.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN_RESOLVED)) {
            Write-Output '::error::IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or the Metadata step published no domain. Refusing to call cloudflare-zone-create.ps1 with an empty -Domain.'
            exit 1
          }

          $domain = $env:IN_DOMAIN_RESOLVED

          if ('${{ inputs.jump_start }}' -eq 'true') {
            pwsh -NoProfile -File scripts/cloudflare-zone-create.ps1 `
              -Domain $domain `
              -Account 'FFC' `
              -ZoneType "${{ inputs.zone_type }}" `
              -JumpStart
          }
          else {
            pwsh -NoProfile -File scripts/cloudflare-zone-create.ps1 `
              -Domain $domain `
              -Account 'FFC' `
              -ZoneType "${{ inputs.zone_type }}"
          }

  cloudflare_enforce_standard:
    runs-on: windows-latest
    environment: cloudflare-prod-write
    needs: [cloudflare_zone_create]
    permissions:
      contents: read
      id-token: write
    outputs:
      issues_count: ${{ steps.summary.outputs.issues_count }}

    steps:
      - uses: actions/checkout@v7.0.1

      # F1 refactor: CF tokens from Key Vault at runtime via OIDC.
      - uses: ./.github/actions/cloudflare-tokens-from-kv
        with:
          scope: write
          azure-client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Enforce Cloudflare standard (GitHub Pages + Microsoft 365)
        id: enforce
        shell: pwsh
        env:
          FFC_CF_DMARCMGMT_DEBUG: ${{ inputs.dmarc_mgmt_debug && '1' || '0' }}
          # Third hop of the same dispatch value, now a JOB output rather than a
          # step output (#1080). This is the step that actually writes DNS on
          # `cloudflare-prod-write`, so it is the one where a payload would run
          # holding the write-scoped tokens `cloudflare-tokens-from-kv` loads
          # through GITHUB_ENV.
          IN_DOMAIN_RESOLVED: ${{ needs.cloudflare_zone_create.outputs.domain }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN_RESOLVED)) {
            Write-Output '::error::IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or cloudflare_zone_create published no domain. Refusing to run Update-CloudflareDns.ps1 with an empty -Zone.'
            exit 1
          }

          $domain = $env:IN_DOMAIN_RESOLVED

          $outDir = Join-Path $env:RUNNER_TEMP 'domain-add-cloudflare'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          if ('${{ inputs.enforce_dry_run }}' -eq 'true') {
            $out = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -EnforceStandard -DryRun *>&1
          } else {
            $out = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -EnforceStandard *>&1
          }

          $outPath = Join-Path $outDir 'cloudflare-enforce.txt'
          $out | Out-File -FilePath $outPath -Encoding utf8

          $audit = & pwsh -NoProfile -File .\Update-CloudflareDns.ps1 -Zone $domain -Audit -ErrorAction Continue *>&1
          $auditPath = Join-Path $outDir 'cloudflare-audit-after.txt'
          $audit | Out-File -FilePath $auditPath -Encoding utf8

          "out_dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Summarize Cloudflare post-audit
        id: summary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "${{ steps.enforce.outputs.out_dir }}"
          $auditLines = @(Get-Content -Path (Join-Path $dir 'cloudflare-audit-after.txt') -ErrorAction Stop)
          $issues = @($auditLines | Where-Object { $_ -match '^[[](?:MISSING|MISSING/PARTIAL|DIFFERS)[]]' })
          "issues_count=$($issues.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Cloudflare outputs
        uses: actions/upload-artifact@v7
        with:
          name: domain-add-cloudflare
          path: ${{ steps.enforce.outputs.out_dir }}/*.txt
          if-no-files-found: error

  whmcs_update_nameservers:
    runs-on: windows-latest
    environment: whmcs-prod
    needs: [whmcs_preflight, cloudflare_zone_create, cloudflare_enforce_standard]
    if: ${{ inputs.update_whmcs_nameservers }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      # WHMCS credential from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Update WHMCS nameservers to FFC custom nameservers
        shell: pwsh
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          # Fourth and last hop of the dispatch value (#1080), back under
          # `whmcs-prod` and beside the WHMCS credential again — this is the step
          # that CHANGES a production domain's nameservers.
          IN_DOMAIN_RESOLVED: ${{ needs.cloudflare_zone_create.outputs.domain }}
          # `ns1` / `ns2` derive from `vars.FFC_CUSTOM_NAMESERVER_*`, not from any
          # dispatch input, so they are outside #1080's threat model: setting a
          # repository/environment Variable needs the same write access as editing
          # this file, and the approver is not being shown one thing and given
          # another. They are moved anyway because they are interpolated into the
          # same pwsh body and the cost is a line each.
          IN_NS1: ${{ needs.cloudflare_zone_create.outputs.ns1 }}
          IN_NS2: ${{ needs.cloudflare_zone_create.outputs.ns2 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:IN_DOMAIN_RESOLVED)) {
            Write-Output '::error::IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or cloudflare_zone_create published no domain. Refusing to call whmcs-domain-nameservers-update.ps1 with an empty -Domain.'
            exit 1
          }

          $domain = $env:IN_DOMAIN_RESOLVED

          if ("${{ needs.whmcs_preflight.outputs.found }}" -ne 'true') {
            throw "WHMCS preflight indicates domain '$domain' is not present. Add it in WHMCS first (or rerun with update_whmcs_nameservers=false)."
          }

          if ([string]::IsNullOrWhiteSpace($env:IN_NS1) -or [string]::IsNullOrWhiteSpace($env:IN_NS2)) {
            Write-Output '::error::IN_NS1 or IN_NS2 is empty: a step-level env: mapping is missing or misnamed, or cloudflare_zone_create published no nameservers. Refusing to set an empty nameserver on a production domain.'
            exit 1
          }

          $ns1 = $env:IN_NS1
          $ns2 = $env:IN_NS2

          & pwsh -NoProfile -File .\scripts\whmcs-domain-nameservers-update.ps1 -Domain $domain -NameServer1 $ns1 -NameServer2 $ns2

          if ($LASTEXITCODE -ne 0) {
            throw "WHMCS nameserver update failed with exit code $LASTEXITCODE."
          }

  post_back:
    runs-on: ubuntu-latest
    needs: [cloudflare_zone_create, cloudflare_enforce_standard]
    if: ${{ inputs.issue_number != '' && inputs.issue_number != 0 }}

    steps:
      - name: Download Cloudflare artifacts
        uses: actions/download-artifact@v8
        with:
          name: domain-add-cloudflare
          path: artifacts/domain-add/cloudflare

      # A `github-script` `script:` block is substituted exactly like a `run:` body
      # — GitHub renders `${{ }}` into the JS SOURCE before node parses it — so
      # `'${{ … }}'` is a string literal only for as long as the value contains no
      # apostrophe. Same defect, third language, and the runtime is not a lesser
      # one: a payload would run inside the `github` client already authenticated
      # with a token carrying `issues: write`.
      #
      # `issue_number` is `type: number`, and that is NOT a constrained type.
      # GitHub validates `boolean` and `choice` only; a `number` input renders as a
      # free text box and is substituted verbatim, so it is exactly as injectable
      # as `domain`. `enforce_dry_run` (boolean) stays interpolated because it IS
      # constrained.
      - name: Comment results back to issue
        uses: actions/github-script@v9
        env:
          IN_ISSUE_NUMBER: ${{ inputs.issue_number }}
          IN_DOMAIN_RESOLVED: ${{ needs.cloudflare_zone_create.outputs.domain }}
        with:
          script: |
            const fs = require('fs');

            // Fail closed on a missing mapping (ledger L202/L220). The pwsh sites
            // get one refusal for free — an unset mapping is dropped and the binder
            // rejects the call by name. JS refuses nothing: an unmapped env var is
            // `undefined`, `Number(undefined)` is NaN, and createComment would post
            // to a nonsense issue number, or post a report naming no domain at all.
            // Every case has to be caught here in the body.
            const domain = process.env.IN_DOMAIN_RESOLVED;
            if (!domain || !domain.trim()) {
              core.setFailed('IN_DOMAIN_RESOLVED is empty: the step-level env: mapping is missing or misnamed, or cloudflare_zone_create published no domain.');
              return;
            }

            const issueNumber = Number(process.env.IN_ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(`IN_ISSUE_NUMBER is not a positive integer (got ${JSON.stringify(process.env.IN_ISSUE_NUMBER)}): the step-level env: mapping is missing or misnamed, or the dispatch supplied a non-numeric issue number.`);
              return;
            }

            const dryRun = String('${{ inputs.enforce_dry_run }}');
            const cfIssues = Number('${{ needs.cloudflare_enforce_standard.outputs.issues_count }}');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const enforce = fs.readFileSync('artifacts/domain-add/cloudflare/cloudflare-enforce.txt', 'utf8');
            const auditAfter = fs.readFileSync('artifacts/domain-add/cloudflare/cloudflare-audit-after.txt', 'utf8');

            const body = [
              `Domain add workflow results for **${domain}**`,
              '',
              `- Enforcement mode: **${dryRun === 'true' ? 'DRY RUN' : 'LIVE'}**`,
              `- Cloudflare post-audit issues: **${cfIssues}**`,
              `- Run: ${runUrl}`,
              '',
              '<details><summary>Cloudflare enforce output</summary>\n\n```\n' + enforce.trim() + '\n```\n</details>',
              '',
              '<details><summary>Cloudflare audit (after)</summary>\n\n```\n' + auditAfter.trim() + '\n```\n</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
