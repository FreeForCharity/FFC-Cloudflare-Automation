name: '802. Candid - Essentials Search [CANDID]'
run-name: 'Candid Essentials Search: ${{ inputs.search_terms }}'

# Read-only: searches Candid's nonprofit database (Essentials v4) by EIN, organization name, or
# keywords and reports name / EIN / location / transparency-seal level / profile URL. Used during
# charity onboarding to locate an applicant's Candid (GuideStar) profile and seal level. Key comes
# from Azure Key Vault at run time via OIDC (candid-keys-from-kv); see docs/candid-api-and-mcp.md.

on:
  workflow_dispatch:
    inputs:
      search_terms:
        description: 'Search terms: EIN, organization name, or keywords'
        required: true
        type: string
      size:
        description: 'Max results (1-25)'
        required: false
        type: string
        default: '10'
      output_file:
        description: 'Output JSON filename (raw API response)'
        required: false
        type: string
        default: 'artifacts/candid/essentials_search.json'

permissions:
  contents: read
  id-token: write

jobs:
  essentials_search:
    runs-on: windows-latest
    environment: candid-prod-read

    steps:
      - uses: actions/checkout@v7.0.1

      # Repository Variables, NOT environment secrets. `candid-prod-read` was
      # scaffolded expecting per-environment secret copies (docs step 3), which
      # nobody ever created — so this resolved to the empty string and the lane
      # could only ever fail its own preflight. The identifiers are non-secret
      # GUIDs held as repo Variables and resolve in every environment, so the
      # provisioning step is not needed at all (#912).
      - name: Validate required Azure OIDC identifiers
        shell: bash
        env:
          AZURE_KV_CLIENT_ID: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_KV_CLIENT_ID" ]; then
            echo "::error::repository Variable READ_ALL_FFC_AZURE_KV_CLIENT_ID is not set; see docs/candid-api-and-mcp.md";
            exit 1;
          fi
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::repository Variable READ_ALL_FFC_AZURE_TENANT_ID is not set; see docs/candid-api-and-mcp.md";
            exit 1;
          fi

      # Candid key from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/candid-keys-from-kv
        with:
          scope: read
          apis: essentials
          azure-client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}

      - name: Essentials search (read-only)
        id: search
        shell: pwsh
        env:
          INPUT_SEARCH_TERMS: ${{ inputs.search_terms }}
          INPUT_SIZE: ${{ inputs.size }}
          INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Fail closed on a missing mapping (ledger L202/L207/L214). `search_terms` is
          # `required: true`, so a real dispatch cannot produce an empty value here — a
          # deleted or misspelled `env:` mapping can, and `check-workflow-input-
          # interpolation.py` is honestly green when it does (nothing is interpolated
          # either way). A bare `$env:INPUT_SEARCH_TERMS` renders empty as NO ARGUMENT AT ALL, so
          # `-SearchTerms $env:INPUT_SEARCH_TERMS` would bind the next token instead and the step would
          # report a call-signature error — or, worse, exit 0 having run nothing, since
          # `$ErrorActionPreference = 'Stop'` does not propagate a native command's
          # failure. Emitted as `Write-Output '::error::…'` rather than `throw` so the
          # assertion is on the text, not on pwsh's error renderer (ledger L207).
          if ([string]::IsNullOrWhiteSpace($env:INPUT_SEARCH_TERMS)) {
            Write-Output '::error::INPUT_SEARCH_TERMS is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank value. Refusing to call candid-essentials-search.ps1 with an empty -SearchTerms.'
            exit 1
          }

          $size = 10
          if (-not [int]::TryParse($env:INPUT_SIZE, [ref]$size) -or $size -lt 1 -or $size -gt 25) {
            throw "Invalid size '$($env:INPUT_SIZE)': expected an integer 1-25."
          }

          # The output path is consumed TWICE: here, and RAW by the 'Upload JSON Artifact'
          # step's `path:`. A `path:` is an `@actions/glob` SELECTOR, not a
          # filename, so the second consumer has a different grammar from the
          # first (ledger L298) and a value legal for one can mean something else
          # to the other. #1422 found this lane scored finished with four of the
          # six conditions 201/202/203/208 ship; the three added below are the
          # ones that were missing, MEASURED on pwsh 7.4.6 against the combined
          # condition this block keeps:
          #
          #   ~/.azure/x.json                        IsPathRooted false, no
          #                                          colon -> PASSED
          #   artifacts/[m]sal_token_cache.json      -> PASSED
          #   a.json<LF>.azure/msal_token_cache.json -> PASSED
          #
          # (A newline payload that also carries a colon was refused, by the
          # colon test rather than by anything about the newline -- which is why
          # the measurement above uses a colon-free one.)
          $out = $env:INPUT_OUTPUT_FILE

          # FIRST, and the checks below depend on it. `actions/upload-artifact`
          # reads `path:` as a NEWLINE-DELIMITED LIST of patterns, so one input
          # carrying a newline is several patterns to that consumer while still
          # being one string here.
          if ($out -match '[\r\n]') {
            throw "output_file contains a carriage return or newline. The 'Upload JSON Artifact' step reads its path: as a newline-delimited list of patterns, so a newline here smuggles extra patterns past the checks below."
          }

          # `path:` is glob-capable, so the junior consumer can be pointed at
          # files this search never wrote. Not every payload self-blocks
          # first: `*` and `?` are illegal in a Windows filename, but `[` and `]`
          # are legal filename characters AND character-class metacharacters --
          # the run writes a literal `[m]sal...json` and exits 0, and the
          # upload's glob then matches a different, real file.
          #
          # The set stops at `* ? [ ]` deliberately. `@actions/glob@0.7.0` builds
          # its minimatch with `nobrace: true` and `noext: true`
          # (`lib/internal-pattern.js`), so `{a,b}` and `!(x)` reach the globber
          # as LITERAL TEXT and expand to nothing -- a guard rejecting them would
          # refuse legitimate paths while stating a hazard that does not exist
          # (#1380). If that dependency ever ships `nobrace: false` or
          # `noext: false`, re-measure and widen the set with it.
          if ($out -match '[*?\[\]]') {
            throw "output_file contains a glob metacharacter (one of * ? [ ]). It is passed unchanged to the 'Upload JSON Artifact' step, whose path: is a glob selector, so a pattern can match files this run never wrote. Pass a plain relative path such as artifacts/candid/essentials_search.json."
          }

          # The combined condition, kept as measured: `Contains(':')` catches a
          # drive AND a PSDrive qualifier (`Temp:/x`), and `IsPathRooted` is
          # correct for `\x` and `C:\x` on the `windows-latest` runner this job
          # declares. It is platform-DEPENDENT, which is why it is paired with
          # the colon test rather than relied on alone.
          if ([string]::IsNullOrWhiteSpace($out) -or $out.Contains(':') -or [System.IO.Path]::IsPathRooted($out) -or (($out -split '[\\/]') -contains '..')) {
            throw "Invalid output_file '$out': must be a relative path inside the workspace without '..'. It is also the 'Upload JSON Artifact' step's path:, so a path outside the workspace can put runner files into a downloadable artifact."
          }

          # `~` begins with neither a separator nor a qualifier, so neither the
          # colon test nor IsPathRooted catches it. PowerShell expands `~` and
          # `@actions/glob` does not, so the two consumers would not even agree
          # which file is meant -- and `~/.azure` is where the `az` session this
          # job's OIDC login leaves behind actually lives (#1188/#1208).
          if ($out -match '^~') {
            throw "output_file must not begin with '~': PowerShell expands it to the user profile, so this run would write outside the workspace, while the 'Upload JSON Artifact' step's globber does not expand it."
          }

          & pwsh -NoProfile -File .\scripts\candid-essentials-search.ps1 -SearchTerms $env:INPUT_SEARCH_TERMS -Size $size -OutputFile $out

          if ($LASTEXITCODE -ne 0) {
            throw "Essentials search script failed with exit code $LASTEXITCODE. See logs above."
          }
          if (-not (Test-Path $env:INPUT_OUTPUT_FILE)) {
            throw "Expected output file not found: $($env:INPUT_OUTPUT_FILE)"
          }

          "## Candid Essentials search" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Search terms: $($env:INPUT_SEARCH_TERMS)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Match table is printed in the job log (step 'Essentials search')." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Raw response artifact: candid_essentials_search" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Artifacts: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)/artifacts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v7
        with:
          name: candid_essentials_search
          path: ${{ inputs.output_file }}
          if-no-files-found: error
          retention-days: 30
