name: '723. Repo - CodeQL Security Analysis [Repo]'

on:
  # No `branches:` filter ON `pull_request:` -- the `push:` one below stays, and
  # is correct. Reason spelled out in 722-ci.yml (#1325): a `pull_request:`
  # `branches:` filter matches the BASE ref, so a PR stacked on a feature branch
  # got no CodeQL analysis at all while showing a green check list. `push:`
  # creates no pull-request check context either way, so restricting it to `main`
  # is right: post-merge runs belong on `main`.
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # Run at 6:00 AM UTC every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # If you want to specify custom queries, uncomment below:
          # queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'
