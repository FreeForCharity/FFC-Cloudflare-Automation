name: '205. WHMCS - Open Ticket (manual) [WHMCS]'
run-name: 'WHMCS Open Ticket (dry_run=${{ inputs.dry_run }})'

# Manually open a WHMCS support ticket (new request or break/fix logging).
# Defaults to dry-run (no ticket created).

on:
  workflow_dispatch:
    inputs:
      deptid:
        description: 'Department id (see config/whmcs-support-departments.json; FFC default = 1)'
        required: true
        type: string
        default: '1'
      subject:
        description: 'Ticket subject'
        required: true
        type: string
      message:
        description: 'Ticket message'
        required: true
        type: string
      client_email:
        description: 'Charity contact email (used if client id unknown)'
        required: false
        type: string
      client_id:
        description: 'WHMCS client id (preferred; links ticket to charity)'
        required: false
        type: string
      priority:
        description: 'Priority'
        required: false
        type: choice
        options: ['Low', 'Medium', 'High']
        default: 'Medium'
      dry_run:
        description: 'Preview only (no ticket created)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 205-whmcs-ticket-open
  cancel-in-progress: false

jobs:
  open_ticket:
    runs-on: windows-latest
    environment: whmcs-prod

    steps:
      - uses: actions/checkout@v7.0.1

      # WHMCS credential from Key Vault at runtime via OIDC (single source of truth).
      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Open ticket
        shell: pwsh
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          TICKET_DEPTID: ${{ inputs.deptid }}
          TICKET_SUBJECT: ${{ inputs.subject }}
          TICKET_MESSAGE: ${{ inputs.message }}
          TICKET_EMAIL: ${{ inputs.client_email }}
          TICKET_CLIENT_ID: ${{ inputs.client_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          # (#1080) The free-text dispatch inputs `deptid` and `client_id` now arrive
          # through step-level `env:` as DATA, never interpolated into this body as code.
          # Under `whmcs-prod` (a write environment) an interpolated input is dispatcher
          # text that runs AFTER the approval, beside the WHMCS API credential the
          # `whmcs-secrets-from-kv` step exports through GITHUB_ENV. `priority` (choice)
          # and `dry_run` (boolean) are the only remaining interpolations; GitHub
          # constrains both value sets, so neither can carry a payload.
          #
          # Fail closed on an empty or unset REQUIRED mapping (#1150, ledger L214).
          # `& pwsh -File ... @cliArgs` is a NATIVE command, and the two blanks differ
          # (measured): an UNSET `$env:TICKET_DEPTID` is $null and is DROPPED from the
          # splat, so `-DeptId` binds the NEXT token and every later parameter shifts one
          # position left; an EMPTY STRING is kept and binds silently as `-DeptId ''`,
          # reaching the callee with a blank id. `IsNullOrWhiteSpace` refuses both.
          # `deptid` is `required: true`. `client_id` / `client_email` are optional and
          # are only appended when non-blank, so they are gated rather than fatal — but by
          # the SAME `IsNullOrWhiteSpace` test, not by `-ne ''`. Measured, `-ne ''` is true
          # for BOTH an unset mapping ($null -ne '') and a whitespace-only dispatch value,
          # so it admits exactly the two blanks the required guards above refuse: an unset
          # mapping reaches the binder as a bare `-ClientId` with no value (it fails there,
          # loudly, but on arity rather than on a named cause), and `client_id: "   "`
          # reaches the callee as whitespace. `IsNullOrWhiteSpace` refuses all three blanks
          # and makes every emptiness test in this body one test.
          if ([string]::IsNullOrWhiteSpace($env:TICKET_DEPTID)) {
            Write-Output '::error::TICKET_DEPTID is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank department id. Refusing to call whmcs-ticket-open.ps1 with an empty -DeptId.'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TICKET_SUBJECT)) {
            Write-Output '::error::TICKET_SUBJECT is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank subject. Refusing to call whmcs-ticket-open.ps1 with an empty -Subject.'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TICKET_MESSAGE)) {
            Write-Output '::error::TICKET_MESSAGE is empty: the step-level env: mapping is missing or misnamed, or the dispatch supplied a blank message. Refusing to call whmcs-ticket-open.ps1 with an empty -Message.'
            exit 1
          }
          $cliArgs = @(
            '-DeptId', $env:TICKET_DEPTID,
            '-Subject', $env:TICKET_SUBJECT,
            '-Message', $env:TICKET_MESSAGE,
            '-Priority', '${{ inputs.priority }}'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:TICKET_CLIENT_ID)) { $cliArgs += @('-ClientId', $env:TICKET_CLIENT_ID) }
          elseif (-not [string]::IsNullOrWhiteSpace($env:TICKET_EMAIL)) { $cliArgs += @('-Email', $env:TICKET_EMAIL, '-Name', $env:TICKET_EMAIL) }
          if ('${{ inputs.dry_run }}' -ne 'false') { $cliArgs += '-DryRun' }

          & pwsh -NoProfile -File .\scripts\whmcs-ticket-open.ps1 @cliArgs
          if ($LASTEXITCODE -ne 0) { throw "Open ticket failed (exit $LASTEXITCODE)." }
