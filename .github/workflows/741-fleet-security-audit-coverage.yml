name: '741. Repo - Fleet Security Audit Coverage [Org]'
run-name: 'Fleet Security Audit Coverage'

# Weekly audit of whether each Node app in the FFC-EX fleet has dependency-
# vulnerability detection wired at all. A repo counts as covered only when it
# has BOTH `.github/workflows/security-audit.yml` and an `audit:high` script in
# package.json — the workflow without the script fails on every run, the script
# without the workflow never runs. Findings are upserted into a single rolling
# issue that auto-closes once the fleet is fully covered.
#
# Why (#838): 34 of the 44 Node FFC-EX repos had no detection of any kind, so a
# published advisory against a charity site was invisible until somebody swept
# by hand — and nothing was measuring that, which is why #822's scope was
# estimated at 13 repos when the real number was 38. This workflow re-derives
# the fleet from the org listing every run rather than trusting a count carried
# between sessions.
#
# Read-only: GITHUB_TOKEN reads public repo contents org-wide and lists the
# org's public repos; the only write is the rolling issue in THIS repo. No
# external API, no environment gate. It reports coverage only and never bumps a
# dependency — remediation belongs to #822. Classification/report logic lives in
# scripts/fleet-audit-coverage-lib.js (unit-tested under tests/workflow-logic/).

on:
  schedule:
    # Weekly, Monday 07:30 UTC — after 738's 07:00 fleet sweep so the two
    # org-wide readers don't contend for the same REST budget.
    - cron: '30 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  ORG: FreeForCharity
  AUDIT_WORKFLOW_PATH: .github/workflows/security-audit.yml
  PACKAGE_PATH: package.json

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (for the classification library)
        uses: actions/checkout@v7.0.1

      - name: Gather security-audit coverage across the fleet
        id: gather
        shell: bash
        run: |
          set -uo pipefail

          # Writes the raw file to $3 and echoes one of: OK; the sentinel ABSENT
          # when the file is missing (404); or ERROR:<msg> on any other fetch
          # failure (auth/rate-limit/transient). Callers switch on these three,
          # so a private or rate-limited repo is reported rather than silently
          # counted as uncovered.
          fetch_raw() {
            local repo="$1" path="$2" dest="$3" rc
            : > "$dest"
            gh api "repos/${repo}/contents/${path}" \
              -H "Accept: application/vnd.github.raw" > "$dest" 2>/tmp/err
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if grep -qi "Not Found" /tmp/err; then
                echo "ABSENT"
              else
                echo "ERROR:$(head -c 200 /tmp/err | tr '\n' ' ')"
              fi
              return 0
            fi
            echo "OK"
          }

          # Fleet = every non-archived FFC-EX-* repo. The FFC-IN-* repos are out
          # of scope here: all four already run an audit, and ffcadmin is pnpm
          # (pnpm-lock.yaml, no package-lock.json) so the npm-specific shape does
          # not transfer to it (#771, #838).
          mapfile -t repos < <(
            gh repo list "$ORG" --limit 1000 --no-archived \
              --json name --jq '.[].name' \
            | grep -E '^FFC-EX-' | sort -u
          )
          echo "Fleet size: ${#repos[@]}"
          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::Org listing returned no FFC-EX-* repos — refusing to report an empty fleet as covered"
            exit 1
          fi

          entries="/tmp/coverage.json"
          echo "[]" > "$entries"
          for repo in "${repos[@]}"; do
            [ -z "$repo" ] && continue
            full="${ORG}/${repo}"

            pkg_status=$(fetch_raw "$full" "$PACKAGE_PATH" /tmp/pkg.json)
            case "$pkg_status" in
              ERROR:*)
                jq --arg r "$full" --arg e "${pkg_status#ERROR:}" \
                  '. += [{"repo":$r,"error":$e}]' "$entries" > "$entries.tmp" && mv "$entries.tmp" "$entries"
                echo "::warning::$full package.json fetch failed: ${pkg_status#ERROR:}"
                continue
                ;;
              ABSENT)
                jq --arg r "$full" '. += [{"repo":$r,"hasPackageJson":false}]' \
                  "$entries" > "$entries.tmp" && mv "$entries.tmp" "$entries"
                echo "  $full -> no package.json (out of scope)"
                continue
                ;;
            esac

            wf_status=$(fetch_raw "$full" "$AUDIT_WORKFLOW_PATH" /tmp/audit.yml)
            case "$wf_status" in
              ERROR:*)
                jq --arg r "$full" --arg e "${wf_status#ERROR:}" \
                  '. += [{"repo":$r,"error":$e}]' "$entries" > "$entries.tmp" && mv "$entries.tmp" "$entries"
                echo "::warning::$full security-audit.yml fetch failed: ${wf_status#ERROR:}"
                continue
                ;;
              ABSENT)
                : > /tmp/audit.yml
                ;;
            esac

            has_wf=false
            [ "$wf_status" = "OK" ] && has_wf=true

            # Script presence and the cron are decided by the shipped library so
            # the parsing that ships is the parsing that is tested.
            read -r has_script cron < <(
              node -e '
                const fs = require("fs");
                const lib = require("./scripts/fleet-audit-coverage-lib.js");
                const pkg = fs.readFileSync(process.argv[1], "utf8");
                const wf = fs.readFileSync(process.argv[2], "utf8");
                const cron = lib.extractCron(wf);
                process.stdout.write(`${lib.hasAuditScript(pkg)} ${cron || "-"}\n`);
              ' /tmp/pkg.json /tmp/audit.yml
            )
            [ "$cron" = "-" ] && cron=""

            jq --arg r "$full" --argjson w "$has_wf" --argjson s "$has_script" --arg c "$cron" \
              '. += [{"repo":$r,"hasPackageJson":true,"hasWorkflow":$w,"hasScript":$s,"cron":(if $c=="" then null else $c end)}]' \
              "$entries" > "$entries.tmp" && mv "$entries.tmp" "$entries"
            echo "  $full -> workflow=$has_wf script=$has_script cron=${cron:-none}"
          done
          echo "entries_file=$entries" >> "$GITHUB_OUTPUT"

      - name: Analyze + upsert/close rolling issue
        uses: actions/github-script@v9
        env:
          ENTRIES_FILE: ${{ steps.gather.outputs.entries_file }}
        with:
          script: |
            const fs = require('fs');
            const lib = require('./scripts/fleet-audit-coverage-lib.js');

            const entries = JSON.parse(fs.readFileSync(process.env.ENTRIES_FILE, 'utf8'));
            const analysis = lib.analyze(entries);
            core.notice(
              `node=${analysis.nodeRepos} covered=${analysis.covered.length} ` +
                `partial=${analysis.partial.length} uncovered=${analysis.uncovered.length} ` +
                `notNode=${analysis.notNode.length} unreadable=${analysis.unreadable.length}`,
            );

            const { owner, repo } = context.repo;

            // Find the rolling issue by its marker (search independent of labels,
            // which may not exist on first run).
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.body && i.body.includes(lib.MARKER));

            if (!analysis.hasGap) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `✅ Recovered: every Node repo in the FFC-EX fleet now has security-audit coverage (${analysis.covered.length}/${analysis.nodeRepos}) ([run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})). Auto-closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
                });
                core.notice(`Closed rolling issue #${existing.number}`);
              } else {
                core.notice('Full coverage and no open rolling issue — nothing to do.');
              }
              return;
            }

            // Ensure the triage labels exist before applying them on either the
            // create OR update path — an upsert must converge the labels too, not
            // only the body (e.g. if a label was stripped manually).
            const labelColors = { security: 'b60205', 'priority: high': 'd93f0b', 'agentic-os': '5319e7' };
            for (const name of lib.ISSUE_LABELS) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color: labelColors[name] || 'ededed' });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = already exists
              }
            }

            const body = lib.renderBody(analysis, new Date().toISOString());
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              // Additive so any human-added labels survive; restores stripped triage labels.
              await github.rest.issues.addLabels({
                owner, repo, issue_number: existing.number, labels: lib.ISSUE_LABELS,
              });
              core.notice(
                `Updated rolling issue #${existing.number} ` +
                  `(${analysis.uncovered.length} uncovered, ${analysis.partial.length} partial)`,
              );
              return;
            }

            const created = await github.rest.issues.create({
              owner, repo, title: lib.ISSUE_TITLE, labels: lib.ISSUE_LABELS, body,
            });
            core.notice(
              `Opened rolling issue #${created.data.number} ` +
                `(${analysis.uncovered.length} uncovered, ${analysis.partial.length} partial)`,
            );
