name: '740. Repo - Scheduled Workflow Failure Alert (rolling issue) [GH]'
run-name:
  'Failure alert: ${{ github.event.workflow_run.name }} (${{ github.event.workflow_run.conclusion
  }})'

# Watches the scheduled NON-Google hub workflows (726 drift audit, 734 janitor, 738 smoke
# drift, and the other cron-driven monitors). On a bad conclusion it upserts ONE rolling
# alert issue; on the next success of the same workflow it closes that issue. 732 does the
# same job for the Google reporting workflows (501/502) — the two alerters are kept apart by
# distinct markers and labels so neither ever closes the other's issue.
#
# Ambient GITHUB_TOKEN only, no environment: — the alerter must never be blocked by the very
# gate it is watching. Reports `cancelled` as well as `failure`: a run cancelled before it
# reaches a runner (the 2026-07-24 726 incident) executes zero steps and is exactly the kind
# of silent breakage this workflow exists to surface.

on:
  workflow_run:
    workflows:
      - '703. Sites List - Generate (CSV + JSON) [GH]'
      - '723. Repo - CodeQL Security Analysis [Repo]'
      - '726. Repo - Rulesets + Settings Drift Audit [Org]'
      - '731. Repo - Actions Run Metrics (30d per-workflow stats) [GH]'
      - '733. Repo - Credential Rotation Reminders (quarterly) [GH]'
      - '734. Repo - Stale Waiting-Run Janitor [Repo]'
      - '735. Repo - Dependabot Affected Repos [Org]'
      - '737. Repo - Claim Sync [Repo]'
      - '738. Repo - Fleet Smoke Engine Drift Audit [Org]'
      - '739. Repo - Process Health Metrics Report [GH]'
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert or close rolling alert issue
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = '<!-- scheduled-workflow-failure-alert -->';
            const title = '🚨 Scheduled workflow failing';
            // Only the default branch matters: a red run on a feature branch is the PR
            // author's problem, not a fleet-wide alert.
            const defaultBranch = (context.payload.repository || {}).default_branch || 'main';
            if (run.head_branch && run.head_branch !== defaultBranch) {
              core.info(`Ignoring ${run.name} on branch ${run.head_branch} (not ${defaultBranch}).`);
              return;
            }
            // Conclusions that mean "nothing went wrong" — everything else (failure,
            // cancelled, timed_out, startup_failure, action_required) is reportable.
            const BENIGN = ['success', 'skipped', 'neutral'];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'agentic-os,bug', per_page: 50,
            });
            const existing = open.find(i => i.body && i.body.includes(marker));
            if (run.conclusion === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: `✅ Recovered: [${run.name} run](${run.html_url}) succeeded. Auto-closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }
            if (BENIGN.includes(run.conclusion)) return;
            const line = `- ${new Date().toISOString()} — **${run.name}** [run ${run.run_number}](${run.html_url}) → ${run.conclusion}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: line,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['agentic-os', 'bug'],
                body: `${marker}\nA scheduled hub workflow ended in a bad conclusion. This rolling issue auto-closes on the next green run of a watched workflow.\n\nA \`cancelled\` entry usually means the run never reached a runner (queue starvation or a stale gate), not that someone cancelled it by hand.\n\n${line}\n\n_Managed by 740. Repo - Scheduled Workflow Failure Alert._`,
              });
            }
