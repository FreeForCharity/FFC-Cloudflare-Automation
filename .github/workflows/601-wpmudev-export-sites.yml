name: '601. WPMUDEV - Export Sites/Domains (Read-only) [WPMUDEV]'

on:
  workflow_dispatch:
    inputs:
      output_file:
        description: 'CSV output filename'
        required: false
        default: 'wpmudev_domains.csv'

jobs:
  export:
    name: Export WPMUDEV sites/domains
    runs-on: ubuntu-latest
    environment: wpmudev-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run export
        shell: pwsh
        # `output_file` is a free-text dispatch input. Interpolated into this body
        # it was not an argument — it was source text pasted into the program
        # GitHub then runs, holding the WPMUDEV Hub API token under the gated
        # `wpmudev-prod` environment (#1080). It now arrives through step-level
        # `env:` and the body reads `$env:`.
        #
        # This is the LAST write-environment entry in the #1080 freeze. It is a
        # [W] by the guard's mechanical rule — `wpmudev-prod` does not end in
        # `-read` — while the workflow's own title says read-only. The rule is
        # right here anyway, and for the reason that matters: what the injected
        # body reaches is a live WPMUDEV Hub API token, whose scope is the Hub
        # account rather than this workflow's intent. The name is what is wrong,
        # not the classification; renaming an environment is a repo-admin change
        # and is deliberately NOT bundled into this lane.
        #
        # Unlike the GITHUB_ENV lanes, the credential IS named in this step's own
        # `env:`, so an L213 read and a `secrets.` grep (#1141) both find it —
        # this lane is the easy-to-see shape, which is why it outlived the ones
        # that needed #1188 to see at all.
        #
        # The value sat in SINGLE quotes, where `$( )` does NOT expand — so the
        # payload every double-quoted lane used is inert here and reports this
        # body as harmless. What works is closing the literal and continuing the
        # EXPRESSION. Measured on pwsh 7.4.6 against the body as it shipped: the
        # WPMUDEV token was written to a sentinel, the callee was still handed a
        # legal `OutputFile=[wpmudev_domains.csv]`, and the step exited **0**.
        env:
          WPMUDEV_API_TOKEN: ${{ secrets.FFC_WPMUDEV_GA_API_Token }}
          IN_OUTPUT_FILE: ${{ inputs.output_file }}
        run: |
          # Fail closed (#1213, ledger L214), placed BEFORE the diagnostics call
          # so a blank dispatch spends nothing. Measured on pwsh 7.4.6, 8 runs
          # each, and the two blank forms fail in OPPOSITE directions:
          #
          #   EMPTY  ('')   the empty string is PRESERVED as an argument, so the
          #                 callee bound `OutputFile=[]`, its own
          #                 'wpmudev_domains.csv' default never applied, its
          #                 write failed on an empty path — and the step still
          #                 exited 0, because this body never checks
          #                 $LASTEXITCODE after the native call. A silent no-op
          #                 export whose only trace is the summary line
          #                 `output file not found:` with nothing after it.
          #   UNSET  ($null) DROPPED from the argument list instead — the way
          #                 L254's blank splat element vanishes — so the exporter
          #                 reports `Missing an argument for parameter
          #                 'OutputFile'` and the body then dies at `Test-Path
          #                 $null`. Loud, 8/8. (L254 itself is about a SPLATTED
          #                 hashtable and does not reach this shape; the empty
          #                 case above is where the two part company.)
          #
          # So the dangerous blank is the quiet one, and it is the one a dispatch
          # form produces when someone clears the box. `IsNullOrWhiteSpace` covers
          # both it and the all-spaces case, which bound `OutputFile=[   ]` at
          # exit 0; a `-ne ''` gate would pass that straight through (#1213).
          if ([string]::IsNullOrWhiteSpace($env:IN_OUTPUT_FILE)) {
            Write-Error 'output_file is blank. Refusing to run: an empty value is passed to the exporter as an empty path, whose write then fails while the step still exits 0.'
            exit 1
          }

          # ...and it must name a FILE, not a pattern. This is a third question
          # about the same value, and neither the `env:` move nor `-LiteralPath`
          # answers it.
          #
          # `$env:` stops the value being parsed as CODE. It does NOT keep it
          # literal across a NATIVE-command hop, which is what the line below
          # `pwsh -NoProfile -File scripts/... -OutputFile $out` is: PowerShell
          # expands wildcards while rendering arguments for a native command.
          # Isolated on pwsh 7.4.6 with one unrelated `prior-run-inventory.csv`
          # present and `output_file=prior-*.csv`: the outer `$out` still reads
          # `prior-*.csv`, and the exporter is bound `prior-run-inventory.csv`.
          # Invoking the same script through `&` (no native hop) binds the glob
          # literally, which is how the hop was identified as the layer.
          #
          # So the first damage is a WRITE: the export retargets onto a
          # pre-existing file nobody named. The reported symptom — the value is
          # also handed to `actions/upload-artifact` as `path:`, which is
          # glob-capable by design (eight workflows here rely on that, e.g.
          # 209-whmcs-tickets-triage.yml `artifacts/whmcs/tickets_*.csv`) — is
          # the second-order effect, and that step is outside this body, so no
          # parameter choice here could reach it anyway. Ledger L276.
          #
          # A CONTROL CHARACTER is the fourth interpretation of the same value,
          # and it is not about paths at all: GitHub parses workflow commands per
          # LINE of a step's output, so a value carrying a newline can forge an
          # `::error::` / `::notice::` / `::add-mask::` line in this log. That
          # matters here more than in most repos, because the approver of a gated
          # run reads exactly this output to decide whether the run did what it
          # said.
          #
          # Rejecting it HERE is what makes the whole step safe rather than just
          # the refusal message below: the pre-existing summary line also echoes
          # `$out`, and a newline-bearing value carrying no other metacharacter
          # would reach that line untouched. A fix confined to the message the
          # review named would have left the class live one echo away. Raised by
          # Copilot on #1288, third round; the allowlist below subsumes it, since
          # no control character is in the permitted set.
          #
          # An ALLOWLIST, after four review rounds of adding one metacharacter
          # class at a time to a denylist (wildcards, then `..`, then control
          # characters, then rooted paths). The sequence is the argument: a
          # denylist over an untrusted value enumerates what the author happened
          # to think of, and each round found another thing nobody had. The
          # value is a workspace-relative CSV filename, so state that.
          #
          # It rejects a space and a non-ASCII name, which the denylist allowed.
          # That is a deliberate narrowing and the earlier reasoning for keeping
          # them ("those were never the hazard") was wrong in the way that
          # matters: it optimised for values nobody dispatches over a rule anyone
          # can check.
          #
          # TWO MEASURED DETAILS, both of which a plausible rewrite gets wrong:
          #
          #   `\A`/`\z`, NOT `^`/`$`. In .NET `$` also matches BEFORE a trailing
          #   newline, so the same class anchored as `^[A-Za-z0-9._-]+$` accepts
          #   "out.csv`n" — silently reopening the log-injection hole the third
          #   round closed. Measured on pwsh 7.4.6: the `^...$` form accepts it,
          #   the `\A...\z` form refuses it.
          #
          #   The `..` test STAYS. It is not subsumed: `..` is made only of
          #   characters the allowlist permits, so `../escaped.csv` matches the
          #   allowlist cleanly. Measured the same way.
          if ($env:IN_OUTPUT_FILE -notmatch '\A[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\z' -or $env:IN_OUTPUT_FILE -match '(\A|/)\.\.(/|\z)') {
            # The value is deliberately NOT echoed. It is already visible to
            # whoever dispatched the run, in the run's own inputs panel, so
            # echoing it adds nothing an operator needs — while PowerShell wraps
            # a long error message across lines, which could place attacker text
            # at the start of one even after control characters are rejected.
            Write-Error 'output_file must be a workspace-relative file name using only letters, digits, dot, underscore, hyphen and / as a separator, with no ".." segment. Refusing to run. The dispatched value is not echoed here on purpose; read it from this run''s inputs panel.'
            exit 1
          }

          Write-Host "::group::WPMUDEV Diagnostics"
          try {
            $base = 'https://wpmudev.com/api/hub/v1'
            $headers = @{ AUTHORIZATION = $env:WPMUDEV_API_TOKEN }
            $uri = "$base/account"
            Write-Host "GET $uri"
            Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -ErrorAction Stop | Out-Null
            Write-Host "Diagnostics: success"
          }
          catch {
            $statusCode = $null
            try {
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
            }
            catch {
            }

            if ($statusCode) {
              Write-Host "Diagnostics: request failed with HTTP $statusCode"
            }
            else {
              Write-Host "Diagnostics: request failed (no status code available)"
            }

            Write-Host "Diagnostics: $($_.Exception.Message)"
          }
          Write-Host "::endgroup::"

          $out = $env:IN_OUTPUT_FILE
          pwsh -NoProfile -File scripts/wpmudev-sites-export.ps1 -OutputFile $out

          Write-Host "::group::WPMUDEV Summary"
          # -LiteralPath, not -Path: `$out` is dispatcher-supplied text, and the
          # `-Path` parameter of both cmdlets is WILDCARD-AWARE, so `*`, `?` and
          # `[ ]` are matched as a pattern against the workspace rather than
          # taken as the filename. Moving the value into `env:` stops it being
          # parsed as CODE; it does not stop it being parsed as a GLOB, which is
          # a separate interpretation and needs its own opt-out.
          #
          # Measured on pwsh 7.4.6, export having written nothing, with one
          # unrelated `prior-run-inventory.csv` in the workspace:
          #   -Path        `prior-*.csv` -> Test-Path TRUE, Import-Csv returns
          #                that file's 2 rows, and the summary reports them as
          #                the export's own result. A clean, confident, wrong
          #                number for a run that exported nothing.
          #   -LiteralPath same input -> Test-Path FALSE, so the `else` branch
          #                correctly reports the file as missing.
          # A glob matching MANY files is not the hazard — `Import-Csv -Path`
          # refuses it outright (`ReportMultipleFilesNotSupported`). The
          # single-match glob is the one that reads an unintended file and says
          # nothing, which is why the fix is the parameter and not a count check.
          # Raised by Copilot on #1288; the plural framing was the wrong half,
          # the finding was right.
          if (Test-Path -LiteralPath $out) {
            $rows = Import-Csv -LiteralPath $out
            $domainCount = $rows.Count
            $multiSiteDomains = ($rows | Where-Object {
                $c = 0
                [int]::TryParse([string]$_.sitesCount, [ref]$c) -and $c -gt 1
              }).Count
            Write-Host "Summary: domains=$domainCount; domainsWithMultipleSites=$multiSiteDomains"
          }
          else {
            Write-Host "Summary: output file not found: $out"
          }
          Write-Host "::endgroup::"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wpmudev-domain-inventory
          path: ${{ inputs.output_file }}
