name: '224. WHMCS - GitHub Pages Product Alignment [WHMCS+GH]'
run-name:
  'WHMCS GitHub-Pages product alignment (pid ${{ inputs.product_id }}, dry_run=${{ inputs.dry_run
  }})'

# Aligns the pid-40 "Hosted by GitHub Pages" marker onto the WHMCS clients whose
# sites are hosted on GitHub Pages (one per FreeForCharity/FFC-EX-<domain> repo).
# Sibling of 222 (Cloudflare registrar -> pid 39): same alignment engine, different
# source list. dry-run is a drift report (#580); a live run assigns the product
# (#579). Read-only preview by default; a live run gates on whmcs-prod.
#
#   1. list-domains - GitHub API (ambient token) lists the FFC-EX domains.
#   2. align        - whmcs-prod resolves each domain to its client and, unless
#                     dry_run, places a $0 AddOrder for any client lacking pid 40.
#                     Idempotent per (client, domain). Domains with no WHMCS record
#                     are reported, never guessed. Routes via the APIM gateway.

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'WHMCS product id (40 = Hosted by GitHub Pages)'
        required: false
        type: string
        default: '40'
      dry_run:
        description: 'Preview only (place no orders) — this is the drift report'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  list-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: List GitHub Pages (FFC-EX) domains
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./scripts/github-pages-domains.ps1 -OutputFile artifacts/github/github_pages_domains.json
          if ($LASTEXITCODE -ne 0) { throw "GitHub Pages domain list failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v7
        with:
          name: github-pages-domains
          path: artifacts/github/github_pages_domains.json
          if-no-files-found: error
          retention-days: 7

  align:
    needs: list-domains
    runs-on: windows-latest
    environment: whmcs-prod
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: github-pages-domains
          path: artifacts/github

      - uses: ./.github/actions/whmcs-secrets-from-kv
        with:
          scope: write
          azure-client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          azure-tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}

      - name: Align product onto GitHub-Pages-site clients
        shell: pwsh
        # `product_id` is a free-text dispatch input. Interpolated into this body
        # it was not an argument — it was source text pasted into the program
        # GitHub then runs, holding the WHMCS API credential the APPROVER spent on
        # `whmcs-prod`, in a job whose live mode places AddOrder writes (#1080). It
        # now arrives through step-level `env:` and the body reads `$env:`.
        #
        # The credential is named in no `env:` block here: the preceding
        # `whmcs-secrets-from-kv` step exports WHMCS_API_IDENTIFIER / _SECRET /
        # _APIM_SUBSCRIPTION_KEY through GITHUB_ENV, so a reader who checks this
        # step's own `env:` (ledger L213) and a `secrets.` grep of the file (#1141)
        # both score it as holding nothing. Run `python3
        # scripts/check-workflow-input-interpolation.py --reachability
        # 224-whmcs-github-pages-product-alignment.yml` for the arrival path
        # (#1188).
        #
        # The value sat in SINGLE quotes, where `$( )` does NOT expand — so the
        # payload every double-quoted lane used is inert here and reports this body
        # as harmless. What works is closing the literal and continuing the
        # EXPRESSION. Measured on pwsh 7.4.6 against the body as it shipped: the
        # decoy credential was written to a sentinel, the callee was still handed a
        # legal `ProductId=39`, and the step exited **0**.
        #
        # `dry_run` stays interpolated on purpose: it is `type: boolean`, so GitHub
        # generates the value from the declared option and it cannot carry a
        # payload.
        env:
          WHMCS_API_URL: 'https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php'
          IN_PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Fail closed (#1150, ledger L214). This is the half of the twin pair
          # where the cheap remedies are visibly wrong, and it was measured on THIS
          # body rather than carried across from 222 (ledger L260). `$params` is
          # splatted onto a NATIVE command, whose argument rendering drops an empty
          # element (L254). With this check removed, `IN_PRODUCT_ID` empty, 8 runs
          # on pwsh 7.4.6: THREE outcomes, ALL at exit 0 — 3 bound
          # `ProductId=-ApiUrl:https://…`, 3 bound `-OutputFile:artifacts/…`, and 2
          # bound **'39'**, the callee's own default. An UNSET mapping was correct
          # 8/8.
          #
          # That '39' is the reason a default fill is not an option here: 39 is the
          # Cloudflare-registrar marker that sibling 222 places, and this workflow
          # aligns pid 40. A blank input would therefore place the WRONG product on
          # GitHub-Pages clients, live, under the credential the approver just
          # spent — silently, at exit 0, and only on some runs.
          if ([string]::IsNullOrWhiteSpace($env:IN_PRODUCT_ID)) {
            Write-Error 'product_id is blank. Refusing to run: an empty value is dropped from the splat and the callee would fall back to product id 39, which is 222''s marker rather than this workflow''s.'
            exit 1
          }
          $params = @{
            DomainsJson = 'artifacts/github/github_pages_domains.json'
            ProductId   = $env:IN_PRODUCT_ID
            ApiUrl      = $env:WHMCS_API_URL
            OutputFile  = 'artifacts/whmcs/whmcs_github_pages_alignment.json'
          }
          if ('${{ inputs.dry_run }}' -eq 'false') { $params.Execute = $true }
          & pwsh -NoProfile -File ./scripts/whmcs-product-alignment.ps1 @params | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($LASTEXITCODE -ne 0) { throw "Product alignment failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v7
        with:
          name: whmcs-github-pages-alignment
          path: artifacts/whmcs/whmcs_github_pages_alignment.json
          if-no-files-found: error
          retention-days: 30
