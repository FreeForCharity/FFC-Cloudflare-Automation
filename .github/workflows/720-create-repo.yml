name: '720. Repo - Create GitHub Repo [Repo]'

on:
  workflow_dispatch:
    inputs:
      RepoName:
        description: 'Name of the new repository (Format: FFC-EX-<domainname>)'
        required: true
        type: string
      Description:
        description: 'Description of the repository'
        required: false
        default: 'Created via automation'
        type: string
      TemplateRepo:
        description: 'Template repository to use'
        required: true
        default: 'FreeForCharity/FFC_Single_Page_Template'
        type: choice
        options:
          - FreeForCharity/FFC_Single_Page_Template
          - FreeForCharity/FFC-IN-Single_Page_Template_Jekell
          - FreeForCharity/FFC-IN-Footer_Only_Template
      Visibility:
        description: 'Visibility (private repos get NO tier-team grants — Option C policy)'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private
      EnableIssues:
        description: 'Enable Issues'
        required: false
        default: true
        type: boolean
      EnablePages:
        description: 'Enable GitHub Pages'
        required: false
        default: false
        type: boolean
      PagesDomainType:
        description: 'GitHub Pages domain configuration'
        required: false
        default: 'apex'
        type: choice
        options:
          - apex
          - staging
          - github-default
      CNAME:
        description: 'Custom Domain (CNAME) - Leave empty to auto-detect based on PagesDomainType'
        required: false
        type: string
      Force:
        description:
          'Create even though other org repos match this domain (preflight lists them). Leave false
          unless you have confirmed none of them is the real site for this domain.'
        required: false
        default: false
        type: boolean
      DryRun:
        description: 'Dry Run (Preview only)'
        required: false
        default: false
        type: boolean

jobs:
  # Reality check BEFORE the approval gate: refuse to proceed when the repository already
  # exists (in ANY casing — the API lookup is case-insensitive and returns the canonical
  # name). Runs ungated so a doomed create fails fast without consuming a human approval.
  # Added after the 2026-07-18 incident: four creates were dispatched (and approved) for
  # repos that already existed under the same or different casing.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify target name is free
        env:
          GH_TOKEN: ${{ github.token }}
          IN_REPO: ${{ inputs.RepoName }}
          IN_FORCE: ${{ inputs.Force }}
        shell: bash
        run: |
          set -euo pipefail

          repo="${IN_REPO:-}"
          owner="FreeForCharity"
          name="${repo##*/}"
          if printf '%s' "$repo" | grep -q '/'; then owner="${repo%%/*}"; fi

          set +e
          resp=$(gh api "repos/$owner/$name" 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            canonical=$(printf '%s' "$resp" | jq -r '.full_name // empty' 2>/dev/null || true)
            echo "::error::Repository already exists as ${canonical:-$owner/$name} — nothing to create. To regenerate its content, use workflow 702 (clone-deploy); to retire it, use 736 (archive)."
            {
              echo "## Create preflight — $owner/$name"
              echo "⛔ Refused: already exists as \`${canonical:-$owner/$name}\` (lookup is case-insensitive)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! printf '%s' "$resp" | grep -q "HTTP 404"; then
            echo "::error::Preflight could not verify $owner/$name (transient API error?). Failing safe rather than guessing. Details: $resp"
            exit 1
          fi

          # --- sibling scan: does the org already host ANOTHER repo for this domain? ---
          # Exact-name checks are too strict: TechnologyMonastery.org (no FFC-EX prefix)
          # was the charity's real site while the FFC-EX-prefixed name looked free. Derive
          # the domain by stripping ONLY the literal FFC-EX- prefix (hyphenated domains
          # like the-trendylittlegeek.com must survive intact) and match it (full domain,
          # case-insensitive) against every org repo name; full-domain matching keeps
          # legitimate sibling domains (.org vs .com) apart. The scan FAILS SAFE: an
          # org-list API error refuses rather than silently disabling the guard.
          if [ "${IN_FORCE:-false}" != "true" ]; then
            domain="$name"
            domain="${domain#FFC-EX-}"
            domain="${domain#ffc-ex-}"
            set +e
            org_repos=$(gh api "orgs/$owner/repos?per_page=100" --paginate --jq '.[].name' 2>&1)
            list_rc=$?
            set -e
            if [ $list_rc -ne 0 ]; then
              echo "::error::Preflight could not list org repos for the sibling scan (transient API error?). Failing safe rather than guessing. Details: $org_repos"
              exit 1
            fi
            siblings=$(printf '%s\n' "$org_repos" | grep -iF -- "$domain" | grep -ivx -- "$name" || true)
            if [ -n "$siblings" ]; then
              echo "::error::The org already hosts repo(s) matching $domain: $(printf '%s' "$siblings" | tr '\n' ' '). One of them may be the real site for this domain — investigate before creating a new one. If this create is deliberate, re-dispatch with Force=true."
              {
                echo "## Create preflight — $owner/$name"
                echo "⛔ Refused: sibling repo(s) match \`$domain\`:"
                while IFS= read -r s; do echo "- \`$s\`"; done <<< "$siblings"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "- Force=true: sibling-domain scan skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Caveat: GITHUB_TOKEN sees public repos (and this repo) only, and GitHub returns
          # 404 for private repos it cannot see — so a PRIVATE name collision passes this
          # check and fails loudly at the create step instead (post-gate). Acceptable:
          # FFC-EX charity sites are public by policy; the summary states the limit.
          echo "✅ $owner/$name is free — proceeding to the gated create. (Check covers repos visible to GITHUB_TOKEN; a private name collision would still fail at the create step.)" >> "$GITHUB_STEP_SUMMARY"

  create-repo:
    # Job-level block: the ungated preflight job keeps the repo default token.
    # `id-token: write` is required for the Key Vault OIDC exchange (#844).
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    needs: preflight
    environment: github-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Create Repository
        shell: pwsh
        # The three free-text inputs arrive as env vars, never interpolated into the
        # script body: an expression is substituted as raw TEXT before pwsh parses the
        # file, so `"${{ inputs.Description }}"` runs a `$( )` the dispatcher supplies —
        # after the github-prod approval, with the job's credential (#1080). A
        # `$env:X` read is a runtime value lookup and is not re-parsed as code.
        # The remaining inputs below stay interpolated on purpose: `choice` and
        # `boolean` values are generated by GitHub from the declared options, so the
        # dispatcher cannot put a payload in one.
        env:
          IN_REPO_NAME: ${{ inputs.RepoName }}
          IN_DESCRIPTION: ${{ inputs.Description }}
          IN_CNAME: ${{ inputs.CNAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $params = @{
              RepoName            = [string]$env:IN_REPO_NAME
              Description         = [string]$env:IN_DESCRIPTION
              TemplateRepo        = "${{ inputs.TemplateRepo }}"
              Visibility          = "${{ inputs.Visibility }}"
              EnableIssues        = [System.Convert]::ToBoolean("${{ inputs.EnableIssues }}")
              EnablePages         = [System.Convert]::ToBoolean("${{ inputs.EnablePages }}")
              PagesDomainType     = "${{ inputs.PagesDomainType }}"
              DryRun              = [System.Convert]::ToBoolean("${{ inputs.DryRun }}")
          }

          if (-not [string]::IsNullOrWhiteSpace($env:IN_CNAME)) {
              $params.Add("CNAME", [string]$env:IN_CNAME)
          }

          # Seed $LASTEXITCODE: in DryRun the script invokes no native command, so
          # $LASTEXITCODE keeps whatever it held (often $null) and the check below
          # throws "failed with exit code " on a run that actually succeeded —
          # observed live on run 30163114593, which reported [DRY RUN] success then
          # failed.
          $LASTEXITCODE = 0
          ./scripts/Create-GitHubRepo.ps1 @params
          if ($LASTEXITCODE -ne 0) {
            throw "Create-GitHubRepo.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Grant FFC-ORGWIDE-* tier teams default access (PUBLIC repos only)
        if: ${{ inputs.DryRun != true && inputs.Visibility == 'public' }}
        shell: pwsh
        # RepoName via env, not interpolation — see the Create Repository step above.
        env:
          IN_REPO_NAME: ${{ inputs.RepoName }}
        run: |
          # Auto-grant FFC-ORGWIDE-* tier teams on PUBLIC repos only.
          # Private repos start with zero team grants — by design (Option C
          # defensive isolation). Explicit team access on private repos must
          # be granted out-of-band by an Owner, ensuring conscious decision
          # about who can see sensitive internal/admin/payment data.
          # See: FFC-IN-Zeffy-Management, FFC-IN-ClarkeMoyerAdmin, etc.
          # RepoName may be owner-qualified ("owner/repo"). Tier teams exist
          # only in FreeForCharity, so parse and skip other owners outright.
          $repoInput = [string]$env:IN_REPO_NAME
          $owner = 'FreeForCharity'
          $repo = $repoInput
          if ($repoInput -like '*/*') {
            $owner, $repo = $repoInput -split '/', 2
          }
          if ($owner -ne 'FreeForCharity') {
            Write-Host "Target owner '$owner' is not FreeForCharity; tier teams do not apply. Skipping."
            exit 0
          }
          $teams = @(
            @{ slug = 'ffc-orgwide-admins';      permission = 'admin'    },
            @{ slug = 'ffc-orgwide-maintainers'; permission = 'maintain' },
            @{ slug = 'ffc-orgwide-writers';     permission = 'push'     },
            @{ slug = 'ffc-orgwide-triagers';    permission = 'triage'   },
            @{ slug = 'ffc-orgwide-readers';     permission = 'pull'     }
          )
          $fails = 0
          foreach ($t in $teams) {
            $slug = $t.slug
            $perm = $t.permission
            try {
              gh api -X PUT "orgs/FreeForCharity/teams/$slug/repos/FreeForCharity/$repo" -f "permission=$perm" | Out-Null
              if ($LASTEXITCODE -eq 0) {
                Write-Host "  [OK] $slug -> $perm on $repo"
              } else {
                Write-Host "  [WARN] $slug grant returned exit $LASTEXITCODE"
                $fails++
              }
            } catch {
              Write-Host "  [FAIL] $slug : $_"
              $fails++
            }
          }
          if ($fails -gt 0) {
            Write-Host "::warning::$fails team grants failed; drift-audit will catch on next run."
          }

      - name: Skip team grants for PRIVATE repo (Option C policy)
        if: ${{ inputs.DryRun != true && inputs.Visibility != 'public' }}
        shell: bash
        # Every value this body reads arrives as an env var — a `${{ }}` in a bash body
        # is substituted as raw text and runs the dispatcher's `$( )` (#1080). Visibility
        # is a constrained `choice` and safe either way; it moves too so the invariant
        # for this step is the simple one: no expressions in the script body at all.
        env:
          IN_REPO_NAME: ${{ inputs.RepoName }}
          IN_VISIBILITY: ${{ inputs.Visibility }}
        run: |
          echo "::notice::Repo is ${IN_VISIBILITY} — skipping FFC-ORGWIDE-* tier team grants."
          echo "::notice::Private repos require explicit team grants by an Owner. Manage at:"
          # RepoName may already be owner-qualified; only prefix the org when bare.
          repo_input="${IN_REPO_NAME}"
          case "$repo_input" in
            */*) full="$repo_input" ;;
            *)   full="FreeForCharity/$repo_input" ;;
          esac
          echo "::notice::  https://github.com/$full/settings/access"
