name: '754. Org - Team Membership [Org]'
run-name:
  '${{ inputs.action }} ${{ inputs.username }} on team ${{ inputs.team }} in ${{ inputs.org }}
  (dry_run=${{ inputs.dry_run }})'

# Lists the organization's teams, or adds / removes people on one team.
#
# Why this exists: FFC records a verified volunteer by membership of an org
# team (ffcadmin's `sponsoring-admins`, program plan section 8,
# docs/volunteer-site-builders.md), and until now only an org owner could
# change that by hand in the GitHub UI. With this a thread can add a new
# volunteer on Clarke's word, and he approves one github-prod gate.
#
# Team membership only. Nothing here touches repository permissions: 729 gives
# a volunteer `push` on their one charity repo, and 749 invites them to the org.
# Adding someone who is not yet an org member makes GitHub send them an org
# invitation, and their team membership stays `pending` until they accept.
#
# Two jobs, one script (`scripts/org-team-membership.sh`):
#   preflight  ungated, github-prod-read, READ PAT. Always runs. action=list
#              prints every team and its members; add/remove print the plan
#              (who would be added, who is already on the team or pending).
#   apply      github-prod (approval gate), WRITE PAT. Skipped entirely on a
#              dry run and for action=list, so neither parks on the gate nor
#              mints a writer credential (#983). Runs the identical file with
#              IN_DRY=false.
#
# `dry_run` defaults to TRUE. Dispatch once to read the plan, then again with
# dry_run=false and approve the gate.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list (read only), add, or remove.'
        required: true
        default: list
        type: choice
        options:
          - list
          - add
          - remove
      team:
        description: 'Team slug, e.g. sponsoring-admins (not needed for list).'
        required: false
        default: ''
        type: string
      username:
        description: 'GitHub username(s), space/comma separated (not needed for list).'
        required: false
        default: ''
        type: string
      role:
        description: 'Team role for add.'
        required: false
        default: member
        type: choice
        options:
          - member
          - maintainer
      create_team:
        description: 'On add, create the team if it does not exist (closed, no repository access).'
        required: false
        default: false
        type: boolean
      org:
        description: 'Organization login.'
        required: false
        default: FreeForCharity
        type: string
      dry_run:
        description: 'Dry run (plan only; nothing changes).'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  # Required for the OIDC exchange that fetches the PAT from Key Vault (#844).
  id-token: write

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 754-org-team-membership
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: github-prod-read
    steps:
      - name: Validate required Azure OIDC identifiers
        shell: bash
        run: |
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_KV_CLIENT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi
          if [ -z "${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}" ]; then
            echo "::error::READ_ALL_FFC_AZURE_TENANT_ID is not set. It is a repo-level Variable (non-secret GUID), read via vars.*, not an environment secret. See docs/azure-oidc-federated-credentials.md."; exit 1;
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.READ_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.READ_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The READ PAT (`read-all-cbm-ffc-copilot-mcp-github-pat`, the one 726/745
      # use) is enough to list teams, look up users and read current team membership. Key Vault
      # is the single source of truth for credentials (#844).
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name read-all-cbm-ffc-copilot-mcp-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat came back empty from Key Vault — check the reader identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102): a revoked-but-present PAT clears
          # the emptiness check and fails later inside a script naming the wrong
          # subsystem. Probe by status code only; the token never reaches output.
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE --
          # a PAT without org members write answers 200 here and 403 on the PUT --
          # so a green probe is not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::read-all-cbm-ffc-copilot-mcp-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      # IN_DRY is pinned to true here regardless of the dispatch: this job only
      # lists or plans. The live run is the `apply` job below.
      - name: List teams / plan team membership
        shell: bash
        env:
          IN_ORG: ${{ inputs.org }}
          IN_ACTION: ${{ inputs.action }}
          IN_TEAM: ${{ inputs.team }}
          IN_USER: ${{ inputs.username }}
          IN_ROLE: ${{ inputs.role }}
          IN_CREATE: ${{ inputs.create_team }}
          IN_DRY: 'true'
        run: bash scripts/org-team-membership.sh

  apply:
    needs: preflight
    # Job-level, not step-level (#983): a dry dispatch or a list must not park
    # on the github-prod gate or mint the writer PAT. The `preflight` job above
    # is the rehearsal, and it runs the same file.
    if: inputs.dry_run != true && inputs.action != 'list'
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The WRITE PAT, the same one 749 sends org invitations with. Team
      # membership needs organization members WRITE (fine-grained "Members:
      # write", classic `admin:org`). The script names that requirement on a
      # 403 so the remedy is not misread as a Key Vault problem.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name kv-ffc-admin-prod-cbm \
            --name wr-all-cbm-github-pat \
            --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE --
          # a PAT without org members write answers 200 here and 403 on the PUT --
          # so a green probe is not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Apply team membership
        shell: bash
        env:
          IN_ORG: ${{ inputs.org }}
          IN_ACTION: ${{ inputs.action }}
          IN_TEAM: ${{ inputs.team }}
          IN_USER: ${{ inputs.username }}
          IN_ROLE: ${{ inputs.role }}
          IN_CREATE: ${{ inputs.create_team }}
          IN_DRY: ${{ inputs.dry_run }}
        run: bash scripts/org-team-membership.sh
