name: '729. Repo - Add Collaborator [Repo]'
run-name:
  'Add collaborator ${{ inputs.username }} to ${{ inputs.repo }} (dry_run=${{ inputs.dry_run }})'

# Reusable workflow that adds (or updates) one or more GitHub users as
# collaborators on a repository at a chosen permission level.
#
# Two ways to use it:
#   1. Manually via the Actions tab (workflow_dispatch).
#   2. From another workflow via `uses:` (workflow_call) -- e.g. the website
#      provisioning workflow (15) calls this instead of inlining the gh api PUT.
#
# The privileged step runs with a PAT from Key Vault (environment: github-prod), so
# callers do not need `actions: write` themselves -- they only need to be able to
# create/assign issues or dispatch this workflow.

on:
  workflow_dispatch:
    inputs:
      repo:
        description:
          'Target repo: "owner/repo" or just "<name>" (defaults to the FreeForCharity org).'
        required: true
        type: string
      username:
        description: 'GitHub username to add (or a space/comma-separated list).'
        required: true
        type: string
      permission:
        description: 'Permission level to grant.'
        required: true
        default: maintain
        type: choice
        options:
          - pull
          - triage
          - push
          - maintain
          - admin
      dry_run:
        description: 'Dry run (preview only; no changes).'
        required: false
        default: false
        type: boolean
      soft_fail:
        description: 'Treat add failures as warnings (exit 0) instead of failing the run.'
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      repo:
        description:
          'Target repo: "owner/repo" or just "<name>" (defaults to the FreeForCharity org).'
        required: true
        type: string
      username:
        description: 'GitHub username to add (or a space/comma-separated list).'
        required: true
        type: string
      permission:
        description: 'Permission level to grant (pull|triage|push|maintain|admin).'
        required: false
        default: maintain
        type: string
      dry_run:
        description: 'Dry run (preview only; no changes).'
        required: false
        default: false
        type: boolean
      soft_fail:
        description:
          'Treat add failures as warnings (exit 0). Used by callers that add maintainers
          best-effort.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Required for the OIDC exchange that fetches the PAT from Key Vault (#844).
  #
  # CALLERS MUST GRANT THIS TOO. This workflow is reusable via `workflow_call`
  # (701 provisioning calls it). A reusable workflow cannot grant itself more than
  # the calling job holds, so a caller whose job omits `id-token: write` makes the
  # Azure login below fail at run time with an unhelpful
  # "unable to get ACTIONS_ID_TOKEN_REQUEST_URL". 701's `maintainers` job declares
  # it explicitly for this reason.
  id-token: write

# Serialize runs: a second dispatch queues behind the first instead of racing it.
concurrency:
  group: 729-repo-add-collaborator
  cancel-in-progress: false

jobs:
  add-collaborator:
    runs-on: ubuntu-latest
    environment: github-prod
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ vars.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ vars.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Key Vault is the single source of truth for credentials (#844). Rotation is
      # a new KV version — no GitHub change and no second copy that can drift.
      - name: Load the GitHub PAT from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show             --vault-name kv-ffc-admin-prod-cbm             --name wr-all-cbm-github-pat             --query value -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::wr-all-cbm-github-pat came back empty from Key Vault — check the writer identity's role on kv-ffc-admin-prod-cbm."
            exit 1
          fi
          echo "::add-mask::$token"
          # Liveness, not just presence (#1102). A revoked-but-present PAT clears the
          # emptiness check above and fails two to four steps later inside a script,
          # naming the wrong subsystem -- that is how 502's dead credential was read as
          # a Key Vault RBAC problem for nine days (#848). The two causes have different
          # remedies (role assignment vs remint), so both checks stay and their messages
          # stay distinguishable.
          #
          # Probe by status code only: the token goes into a request header and never
          # into output. `-o /dev/null` discards the body; `-D` keeps the RESPONSE
          # headers, which carry no credential and are what separates a throttled token
          # from a rejected one below.
          #
          # `|| true` is load-bearing, not defensive habit. The runner invokes this body
          # under `-e`, and `set -euo pipefail` above keeps it: without it a curl that
          # cannot reach the network aborts the assignment and the step dies before the
          # branch below ever runs, with no message of ours (L73). With it, curl's own
          # `000` reaches the check and fails closed.
          #
          # A 200 proves the token AUTHENTICATES. It proves nothing about SCOPE -- a
          # read-scoped PAT answers 200 here and 403 on a write -- so a green probe is
          # not a licence to assume the later write will work.
          hdrs="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user || true)"
          # GitHub answers a PRIMARY rate limit with 403 + `x-ratelimit-remaining: 0`
          # and a SECONDARY one with 403 + `retry-after`. Either way the credential is
          # LIVE, so it must not be handed the revoked wording below: prescribing a
          # remint for a throttled token is the same wrong-subsystem failure this guard
          # exists to remove. 321 draws the same line for Cloudflare, where a 403 on a
          # resource endpoint is authenticated-but-unauthorized and never "dead".
          remaining="$(awk 'tolower($1) == "x-ratelimit-remaining:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          retry_after="$(awk 'tolower($1) == "retry-after:" { gsub(/\r/, "", $2); print $2 }' "$hdrs" | tail -n 1)"
          rm -f "$hdrs"
          if [ "$code" = "403" ] && { [ "$remaining" = "0" ] || [ -n "$retry_after" ]; }; then
            echo "::error::wr-all-cbm-github-pat returned 403 from GET /user with x-ratelimit-remaining='$remaining' retry-after='$retry_after' -- that is a rate limit, not a credential fault. The token is live: do not remint it, re-run once the window resets."
            exit 1
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::wr-all-cbm-github-pat returned $code from GET /user: the token is revoked, expired, or its access was removed -- it is not missing, and it is not throttled (the rate-limit headers were checked first). Key Vault returned a value. Remedy is a new version of the secret in kv-ffc-admin-prod-cbm, not a role change."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::wr-all-cbm-github-pat could not be verified: GET /user answered $code (000 means the request never completed). Refusing to continue with an unverified credential rather than failing later inside a script."
            exit 1
          fi
          d="GHTOKEN_EOF_${RANDOM}${RANDOM}"
          {
            echo "GH_TOKEN<<${d}"
            echo "$token"
            echo "${d}"
          } >> "$GITHUB_ENV"

      - name: Add collaborator(s)
        shell: bash
        env:
          ORG_DEFAULT: FreeForCharity
          IN_REPO: ${{ inputs.repo }}
          IN_USER: ${{ inputs.username }}
          IN_PERM: ${{ inputs.permission }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_SOFT: ${{ inputs.soft_fail }}
        run: |
          set -uo pipefail

          # `gh` writes its error body to STDOUT, so `gh … 2>/dev/null || echo <default>`
          # yields the error text with the default appended rather than the default
          # (ledger L02 / #854 / #889). api_get — same shape as 726's — keeps stdout to
          # successful responses only: on failure it returns non-zero and puts the error
          # on stderr, so a caller can never report an error body as data.
          api_get() {
            local out rc
            out=$(gh api "$@" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              printf '%s\n' "$out" >&2
              return "$rc"
            fi
            printf '%s' "$out"
          }

          # Trim leading/trailing whitespace (incl. CR) from a value.
          trim() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }

          soft="$(trim "${IN_SOFT:-false}" | tr '[:upper:]' '[:lower:]')"
          dry="$(trim "${IN_DRY:-false}" | tr '[:upper:]' '[:lower:]')"

          # problem MSG: hard-fail (exit 1) unless soft mode, where it warns and returns.
          problem() {
            if [ "$soft" = "true" ]; then
              echo "::warning::$1"
              return 0
            fi
            echo "::error::$1"
            exit 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CBM_TOKEN secret is not set (environment: github-prod)."
            exit 1
          fi

          # Normalize the repo to owner/repo (accept a bare name or a full URL).
          repo="$(trim "$IN_REPO")"
          repo="${repo#https://github.com/}"
          repo="${repo%.git}"
          repo="${repo%/}"
          if [[ "$repo" != */* ]]; then
            repo="$ORG_DEFAULT/$repo"
          fi

          perm="$(trim "${IN_PERM:-maintain}")"
          case "$perm" in
            pull | triage | push | maintain | admin) ;;
            *)
              echo "::error::Invalid permission '$perm' (expected pull|triage|push|maintain|admin)."
              exit 1
              ;;
          esac

          # The repo must exist before we try to add anyone.
          if ! gh api "repos/$repo" >/dev/null 2>&1; then
            problem "Repository '$repo' was not found (or the token lacks access)."
            exit 0
          fi

          echo "Repo:        $repo"
          echo "Permission:  $perm"
          echo "Dry run:     $dry"

          # Split usernames on commas / whitespace / CR, then dedupe and process.
          users="$(printf '%s' "$IN_USER" | tr ',\r\n\t' '    ')"
          declare -A seen
          added=()
          skipped=()
          failed=()

          for raw in $users; do
            u="${raw#@}"
            [ -z "$u" ] && continue
            if [ -n "${seen[$u]:-}" ]; then continue; fi
            seen[$u]=1

            # Validate against GitHub's login format (alphanumeric, with
            # non-consecutive and non-trailing hyphens, max 39 chars).
            if ! printf '%s' "$u" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9]|-[A-Za-z0-9]){0,38}$'; then
              problem "Invalid GitHub username: '$u'."
              skipped+=("$u")
              continue
            fi
            if ! gh api "users/$u" >/dev/null 2>&1; then
              problem "GitHub user '$u' was not found."
              skipped+=("$u")
              continue
            fi

            if [ "$dry" = "true" ]; then
              echo "[DRY RUN] Would set $u = $perm on $repo"
              added+=("$u (dry-run)")
              continue
            fi

            # PUT either updates an existing member/collaborator in place (HTTP
            # 204, empty body) or, for an outside collaborator, creates an
            # invitation (HTTP 201, body is the invitation object with an `id`).
            # Capturing the body lets us distinguish the two: the /permission
            # endpoint reports the interim `read` for a pending invite, so relying
            # on it alone mislabels an invitation as a granted role.
            # Capture stderr so a failed PUT surfaces the underlying GitHub API
            # error instead of just a generic "Could not add" message.
            put_err="$(mktemp)"
            if resp="$(gh api -X PUT "repos/$repo/collaborators/$u" -f permission="$perm" 2>"$put_err")"; then
              rm -f "$put_err"
              invite_id="$(printf '%s' "$resp" | jq -r '.id // empty' 2>/dev/null || echo '')"
              if [ -n "$invite_id" ]; then
                echo "Invited $u to $repo as $perm (invitation #$invite_id); pending acceptance."
                added+=("$u (invited as $perm, pending)")
              else
                # The grant already succeeded; this read is only the confirmation of
                # the effective role. If it fails, say so and fall back to the
                # requested permission — the swallowed form reported the API's error
                # body as the role the user now holds.
                if ! role="$(api_get "repos/$repo/collaborators/$u/permission" --jq '.role_name // .permission')"; then
                  role="$perm"
                  echo "::warning::Added $u to $repo, but could not read back the effective role; reporting the requested '$perm'."
                fi
                echo "Added $u to $repo as $role."
                added+=("$u ($role)")
              fi
            else
              api_err="$(tr '\n' ' ' <"$put_err" 2>/dev/null)"
              rm -f "$put_err"
              problem "Could not add '$u' to $repo: ${api_err:-unknown error}"
              failed+=("$u")
            fi
          done

          {
            echo "### Add collaborator(s)"
            echo ""
            echo "- Repo: \`$repo\`"
            echo "- Requested permission: \`$perm\`"
            if [ "${#added[@]}" -gt 0 ]; then echo "- Added/invited: ${added[*]}"; fi
            if [ "${#skipped[@]}" -gt 0 ]; then echo "- Skipped: ${skipped[*]}"; fi
            if [ "${#failed[@]}" -gt 0 ]; then echo "- Failed: ${failed[*]}"; fi
          } >>"$GITHUB_STEP_SUMMARY"
