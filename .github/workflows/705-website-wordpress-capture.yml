name: '705. Website - Capture WordPress Site (REST API + Scrape) [WP]'
run-name: 'WP capture ${{ inputs.domain }} (mode=${{ inputs.mode }})'

# Captures a live WordPress site from its own REST API plus a rendered-HTML
# scrape, and uploads the result as an artifact for the FFC-EX migration PR.
#
# Why this sits beside 702 rather than replacing it: 702 mirrors with httrack,
# which discovers pages by following links, so its page count is a property of
# the theme's navigation. 705 takes the inventory from /wp-json/wp/v2/pages —
# the CMS's own list, with an X-WP-Total to check it against — and then fetches
# the rendered markup for each of those URLs. That makes "did we get the whole
# site?" a question the run can answer and fail on, instead of one nobody can
# ask. See the header of scripts/capture-wordpress-api.mjs.
#
# A cPanel/FTP backup is deliberately not an input. It yields PHP, a database
# dump and a plugin tree — the inputs to a renderer that will not exist after
# the migration — rather than the rendered artifact being migrated.
#
# Read-only and ungated: it loads no credentials and writes nothing outside the
# run's own artifact. `mode=inspect` (the default) additionally makes no request
# beyond a handful of probes, so it is the safe first dispatch for any domain.
#
# Two jobs, for one reason: the concurrency group that protects a small charity
# origin from two simultaneous crawls has to key on the NORMALISED domain, and
# a workflow-level `concurrency:` can only see the raw dispatch input. Keying on
# `inputs.domain` would let `VPMin.org` and `vpmin.org` — or `www.` and the apex
# — run at the same time against the same server, which is precisely what the
# group exists to prevent. `resolve` normalises and makes no network request;
# `capture` does every live request and carries the group.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: >-
          Live apex domain that SERVES THE CONTENT (e.g. viewpointministriesinternational.org). A
          bare hostname: no scheme and no path. Case is ignored, and a leading `www.` is accepted
          and stripped. This is the source site, not the FFC-EX repo's name — a charity's new short
          domain often differs from the one its site is actually on, and capturing the wrong one
          yields a clean, green artifact of the wrong website.
        required: true
        type: string
      mode:
        description: >-
          inspect = probe the REST API and report what a capture would get (read-only, seconds).
          capture = fetch every page and asset and upload the result as an artifact.
        required: false
        type: choice
        options: [inspect, capture]
        default: inspect
      max_items:
        description: 'Cap on items fetched per REST collection.'
        required: false
        type: string
        default: '500'
      delay_ms:
        description: >-
          Politeness delay between requests, in milliseconds. These are small shared-hosting
          origins; do not lower this without a reason.
        required: false
        type: string
        default: '250'
      include_posts:
        description: 'Also capture blog posts (not just pages).'
        required: false
        type: boolean
        default: false
      alias_domains:
        description: >-
          Comma-separated OTHER hostnames this same site emits its own asset URLs under. Assets on
          these are re-pointed at `domain` before fetching. Use when a site has been part-configured
          for a new short domain that does not serve its files yet — e.g. capturing
          viewpointministriesinternational.org with alias_domains=vpmin.org.
        required: false
        type: string
        default: ''

  # TEMPORARY (this branch only): runs the alias-corrected capture of the real
  # source site so the migration PR carries a passing artifact. Removed before
  # merge — the permanent trigger is the dispatch above.
  push:
    branches: ['claude/wordpress-migration-scraping-qpzewr']
    paths:
      - 'scripts/capture-wordpress-api.mjs'
      - '.github/workflows/705-website-wordpress-capture.yml'

permissions:
  contents: read

jobs:
  # Makes no network request, so it is safe to run outside the per-domain
  # concurrency group — which is the point: the group needs this job's output.
  resolve:
    name: Resolve and validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      domain: ${{ steps.resolve.outputs.domain }}
      mode: ${{ steps.resolve.outputs.mode }}
      max: ${{ steps.resolve.outputs.max }}
      delay: ${{ steps.resolve.outputs.delay }}
      posts: ${{ steps.resolve.outputs.posts }}
      aliases: ${{ steps.resolve.outputs.aliases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Gates the whole workflow: `capture` needs this job, so no live request
      # is made until the pure logic (URL mapping, asset classification, the
      # rewrite pass, path containment, the verdict) has been exercised. A run
      # against a real charity's site with broken logic produces a confident,
      # wrong artifact rather than an error.
      - name: Self-test the capture logic (offline)
        run: node scripts/capture-wordpress-api.mjs --self-test

      - name: Resolve inputs
        id: resolve
        # Inputs go through the environment rather than into the script body, so
        # a value carrying shell metacharacters cannot be executed.
        env:
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX: ${{ inputs.max_items }}
          INPUT_DELAY: ${{ inputs.delay_ms }}
          INPUT_POSTS: ${{ inputs.include_posts }}
          INPUT_ALIASES: ${{ inputs.alias_domains }}
          # TEMPORARY, removed with the push trigger above.
          EVIDENCE_DOMAIN: viewpointministriesinternational.org
          EVIDENCE_MODE: capture
          EVIDENCE_POSTS: 'true'
          EVIDENCE_ALIASES: vpmin.org
        shell: bash
        run: |
          set -euo pipefail

          # Hostnames are case-insensitive and the capture script lowercases
          # anyway, so normalise here rather than refusing a value that differs
          # from the canonical form only in case. The concurrency group on the
          # capture job keys on this output, so normalising here is also what
          # makes "serialize per domain" actually hold.
          domain="$(printf '%s' "${INPUT_DOMAIN:-}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$domain" ]; then domain="${EVIDENCE_DOMAIN:-}"; fi
          domain="${domain#www.}"

          # `domain` is a required dispatch input, so an empty value here means
          # the input did not arrive rather than that a default is wanted. There
          # is no safe default: substituting some other charity's domain would
          # point a live capture at a site nobody asked about.
          if [ -z "$domain" ]; then
            echo "::error::domain is empty — a required input did not reach this step. Refusing to guess a site to capture."
            exit 1
          fi
          # Reject anything that is not a bare hostname before it reaches the
          # script, so a pasted URL or a stray argument fails here with a clear
          # message rather than as a confusing DNS error 200 lines into a run.
          if ! printf '%s' "$domain" | grep -qE '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
            echo "::error::domain must be a bare hostname (got '$domain'). No scheme and no path; a leading 'www.' is accepted and stripped."
            exit 1
          fi

          mode="${INPUT_MODE:-}"
          if [ -z "$mode" ]; then mode="${EVIDENCE_MODE:-inspect}"; fi
          case "$mode" in
            inspect|capture) ;;
            *) echo "::error::mode must be 'inspect' or 'capture' (got '$mode')."; exit 1 ;;
          esac

          # Validated here, in the job that holds no concurrency slot, so a
          # typo fails in seconds instead of after queueing behind another
          # capture. Unvalidated these reach parseInt in the script, where NaN
          # is silently catastrophic rather than loud: a NaN timeout aborts
          # every request instantly and a NaN cap paginates zero times, both of
          # which read as findings about the site.
          max="${INPUT_MAX:-}"
          if [ -z "$max" ]; then max="500"; fi
          delay="${INPUT_DELAY:-}"
          if [ -z "$delay" ]; then delay="250"; fi
          if ! printf '%s' "$max" | grep -qE '^[0-9]+$' || [ "$max" -lt 1 ] || [ "$max" -gt 100000 ]; then
            echo "::error::max_items must be a whole number between 1 and 100000 (got '$max')."
            exit 1
          fi
          if ! printf '%s' "$delay" | grep -qE '^[0-9]+$' || [ "$delay" -gt 60000 ]; then
            echo "::error::delay_ms must be a whole number of milliseconds between 0 and 60000 (got '$delay'). These are small shared-hosting origins; 250 is the default for a reason."
            exit 1
          fi
          posts="${INPUT_POSTS:-}"
          if [ -z "$posts" ]; then posts="${EVIDENCE_POSTS:-false}"; fi

          aliases="$(printf '%s' "${INPUT_ALIASES:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$aliases" ]; then aliases="${EVIDENCE_ALIASES:-}"; fi
          if [ -n "$aliases" ] && ! printf '%s' "$aliases" | grep -qE '^[a-z0-9.,-]+$'; then
            echo "::error::alias_domains must be a comma-separated list of bare hostnames (got '$aliases')."
            exit 1
          fi

          {
            echo "domain=$domain"
            echo "mode=$mode"
            echo "max=$max"
            echo "delay=$delay"
            echo "posts=$posts"
            echo "aliases=$aliases"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: domain=$domain mode=$mode max=$max delay=$delay posts=$posts"

  capture:
    name: Capture WordPress site
    needs: resolve
    runs-on: ubuntu-latest
    # A real charity site is not the 1-page case. viewpointministriesinternational.org
    # advertises 587 page URLs in its sitemap, and at the 250ms politeness delay
    # the page fetches alone are ~10 minutes before any asset is downloaded.
    # 30 minutes would abort a legitimate capture partway and leave a truncated
    # artifact that still looks like output.
    timeout-minutes: 60
    concurrency:
      # Keyed on the NORMALISED domain, so two dispatches that differ only in
      # case or a `www.` prefix serialize instead of crawling the same origin
      # at once.
      group: wp-capture-${{ needs.resolve.outputs.domain }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Always runs, in both modes. In capture mode it is the preflight: it says
      # what the REST API reports, which is the number the capture is then
      # checked against.
      - name: Inspect the live WordPress REST API
        id: inspect
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _capture
          set +e
          node scripts/capture-wordpress-api.mjs --domain "$DOMAIN" --inspect --json-out _capture/inspect.json
          rc=$?
          set -e
          echo "verdict_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ]; then
            echo "::warning::Inspect returned a non-ready verdict (exit $rc). See the job summary for which one."
          fi

      - name: Capture the site
        if: needs.resolve.outputs.mode == 'capture'
        env:
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          MAX: ${{ needs.resolve.outputs.max }}
          DELAY: ${{ needs.resolve.outputs.delay }}
          POSTS: ${{ needs.resolve.outputs.posts }}
          ALIASES: ${{ needs.resolve.outputs.aliases }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--domain "$DOMAIN" --out _capture/site --max "$MAX" --delay "$DELAY")
          if [ "$POSTS" = "true" ]; then args+=(--include-posts); fi
          if [ -n "$ALIASES" ]; then args+=(--alias-domains "$ALIASES"); fi
          node scripts/capture-wordpress-api.mjs "${args[@]}"

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-capture-${{ needs.resolve.outputs.domain }}
          path: _capture/
          if-no-files-found: warn
          retention-days: 14
