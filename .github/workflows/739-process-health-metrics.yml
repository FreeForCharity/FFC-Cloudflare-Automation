name: '739. Repo - Process Health Metrics Report [GH]'
run-name: 'Process health metrics report'

# Weekly, read-only "monitor the monitors" report for the Agentic OS
# (process-assurance epic #752, issue #756). A REST sweep of THIS repo turns the
# backlog + data-pipeline signals into a metrics object and posts it as a new
# comment on the Conductor log (#719) — the comment thread is the visible trend
# history. Each comment embeds its metrics in a hidden data block; the next run
# reads the most recent block to render week-over-week deltas ("trends over
# absolute numbers"). The same JSON is uploaded as an artifact for later
# ffcadmin rendering (#723).
#
# Read-only: the ambient GITHUB_TOKEN reads issues + Actions runs and writes ONE
# comment on #719 in this repo. No external API, no environment gate, no push to
# `main`. Aggregation/trend/render logic lives in
# scripts/process-health-metrics-lib.js (unit-tested under tests/workflow-logic/).

on:
  schedule:
    # Weekly, Monday 06:00 UTC (ahead of the 738 drift audit at 07:00).
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: read
  # #900 reads open PRs and their head-SHA check runs to find the ones that are
  # green, clean and still in draft. Both are reads; nothing here writes a PR.
  pull-requests: read
  checks: read

env:
  # Data-pipeline workflows tracked for the success-rate metric, by file-number
  # prefix: 502 = daily GA + data-sync PR, 703 = fleet sites-list generate.
  # Extend as pipelines land (campaigns registry #746, fleet refresh).
  PIPELINE_NUMBERS: '502,703'
  LOG_ISSUE: '719'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the metrics library)
        uses: actions/checkout@v7.0.1

      - name: Gather, compute, and post the weekly report
        uses: actions/github-script@v9
        env:
          PIPELINE_NUMBERS: ${{ env.PIPELINE_NUMBERS }}
          LOG_ISSUE: ${{ env.LOG_ISSUE }}
        with:
          script: |
            const fs = require('fs');
            const lib = require('./scripts/process-health-metrics-lib.js');
            const { owner, repo } = context.repo;
            const nowMs = Date.now();
            const nowIso = new Date(nowMs).toISOString();
            const throughputCut = new Date(nowMs - lib.THROUGHPUT_WINDOW_DAYS * 86400e3);
            const pipelineCut = new Date(nowMs - lib.PIPELINE_WINDOW_DAYS * 86400e3);

            // Issues API returns PRs too; drop them everywhere.
            const isIssue = (i) => i && !i.pull_request;

            // Bounded manual pager (a labeled backlog should be small, but never
            // scan unboundedly): cap at MAX_ISSUE_PAGES so the weekly job stays
            // cheap even if a label ever balloons.
            const MAX_ISSUE_PAGES = 10;
            async function listIssuesBounded(params) {
              const out = [];
              for (let pg = 1; pg <= MAX_ISSUE_PAGES; pg++) {
                const { data } = await github.rest.issues.listForRepo({
                  ...params, per_page: 100, page: pg,
                });
                out.push(...data);
                if (data.length < 100) break;
              }
              return out;
            }

            // Open issues carrying a given label.
            async function openWithLabel(label) {
              const all = await listIssuesBounded({ owner, repo, state: 'open', labels: label });
              return all.filter(isIssue);
            }

            // Issues with a label closed within the throughput window. `since`
            // (updated_at) bounds the fetch; closed_at bounds the count.
            async function closedWithLabel(label) {
              const all = await listIssuesBounded({
                owner, repo, state: 'closed', labels: label, since: throughputCut.toISOString(),
              });
              return all.filter(
                (i) => isIssue(i) && i.closed_at && new Date(i.closed_at) >= throughputCut,
              );
            }

            const smokeOpen = await openWithLabel('smoke-failure');
            const smokeClosed = await closedWithLabel('smoke-failure');
            const claimedOpen = await openWithLabel('claimed');
            const agenticOpen = await openWithLabel('agentic-os');
            const agenticClosed = await closedWithLabel('agentic-os');
            // The band the Conductor routine actually means (#922) — a strict
            // subset of agentic-os: unclaimed, unblocked, one-PR-scoped, with
            // acceptance criteria. Reported alongside `open`, never instead of
            // it: `open` stays the honest size of the programme.
            const readyOpen = await openWithLabel('agent-ready');

            // "Green, clean, and stuck in draft" (#900). Every other signal in
            // this report reads healthier as finished work piles up unlanded, so
            // this is the one that has to notice. A PR qualifies only when it is
            // a DRAFT, mergeable_state is `clean`, and every required check on
            // its head SHA has concluded success — i.e. the draft flag is the
            // only thing left between it and `main`.
            //
            // Age runs from the last required check COMPLETING, not created_at:
            // a PR is only "waiting" from the moment it became landable.
            //
            // Uses check-runs, never the legacy commit-status API, which reads
            // `pending` forever on this repo (ledger L26).
            const REQUIRED_CHECKS = ['Validate Repository', 'Phantom Revert Guard'];
            const PARKED_MARKER = /<!--\s*parked:/i;
            const readyWaiting = [];
            const agenticPrs = (await listIssuesBounded({
              owner, repo, state: 'open', labels: 'agentic-os',
            })).filter((i) => i.pull_request);
            // `mergeable` / `mergeable_state` are computed ASYNCHRONOUSLY. The
            // first GET on a PR nothing has polled recently returns
            // `mergeable: null` / `mergeable_state: 'unknown'` and only kicks
            // off the background job; a second GET seconds later carries the
            // real value. A weekly workflow reads every PR cold, so `unknown`
            // is the NORMAL first answer here, not an edge case.
            //
            // Sampling it once and treating `!== 'clean'` as "not landable"
            // therefore drops exactly the PRs this metric exists to find, and
            // drops them into the healthy-looking direction: the count falls to
            // 0 and the trend column renders the disappearance as an
            // improvement. Measured 2026-08-11 against #1127 and #1039 — both
            // green, clean, waiting on a human for days — first GET `unknown`,
            // second GET `clean`, same objects, seconds apart.
            //
            // So resolve it rather than sample it, and when it will not resolve
            // say so: an unread PR must not be silently indistinguishable from
            // a landed one (the denominator rule, ledger L173).
            const MERGEABILITY_ATTEMPTS = 4;
            const MERGEABILITY_DELAY_MS = 3000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            async function getPrWithMergeability(number) {
              let last = null;
              for (let attempt = 1; attempt <= MERGEABILITY_ATTEMPTS; attempt++) {
                const { data } = await github.rest.pulls
                  .get({ owner, repo, pull_number: number })
                  .catch(() => ({ data: null }));
                // A transient GET failure is the SAME defect class this helper
                // exists to close: returning here would drop the PR with no
                // warning, and the drop lands in the flattering direction. It is
                // also the case most worth retrying — unlike `mergeable: false`,
                // nothing was answered. Keep the last body we actually got.
                if (data) {
                  last = data;
                  // `mergeable` is the resolution flag; `mergeable_state` still
                  // reads 'unknown' alongside a null `mergeable`. Either a true
                  // or a false decides it — only null means "not computed yet".
                  if (data.mergeable !== null) return data;
                }
                if (attempt < MERGEABILITY_ATTEMPTS) await sleep(MERGEABILITY_DELAY_MS);
              }
              core.warning(
                `#${number}: mergeability still unresolved after ${MERGEABILITY_ATTEMPTS} attempts ` +
                  `(mergeable_state='${last ? last.mergeable_state : 'no response'}'). Excluded ` +
                  `from the ready-but-unlanded count — that count is a floor, not a total.`,
              );
              return last;
            }

            for (const item of agenticPrs) {
              const pr = await getPrWithMergeability(item.number);
              if (!pr || !pr.draft || pr.mergeable_state !== 'clean') continue;
              const { data: checks } = await github.rest.checks
                .listForRef({ owner, repo, ref: pr.head.sha, per_page: 100 })
                .catch(() => ({ data: { check_runs: [] } }));
              const runs = checks.check_runs || [];
              // A re-run leaves SEVERAL check-runs with the same `name` on one
              // head SHA, and listForRef does not promise newest-first. Taking
              // the first match can therefore read an OLD success while the
              // current attempt is failing or still running — a green verdict
              // for a PR that is not green. Select the LATEST attempt per name,
              // ordered by started_at (set on in-progress runs too, unlike
              // completed_at) so an in-flight re-run wins over the stale pass
              // and fails the `conclusion === 'success'` test below.
              const latestByName = (n) =>
                runs
                  .filter((r) => r.name === n)
                  .reduce((best, r) => {
                    if (!best) return r;
                    const t = (x) => new Date(x.started_at || x.completed_at || 0).getTime();
                    return t(r) >= t(best) ? r : best;
                  }, null);
              const required = REQUIRED_CHECKS.map(latestByName);
              // Missing counts as not-green: an absent required check is exactly
              // the "presence mistaken for validity" shape the ledger is about.
              if (!required.every((r) => r && r.conclusion === 'success')) continue;
              const readySince = required
                .map((r) => new Date(r.completed_at || pr.updated_at).getTime())
                .reduce((a, b) => Math.max(a, b), 0);
              readyWaiting.push({
                number: pr.number,
                readySinceIso: new Date(readySince).toISOString(),
                parked:
                  PARKED_MARKER.test(pr.body || '') ||
                  (pr.labels || []).some((l) => (l.name || l) === 'parked'),
              });
            }

            // Data-pipeline runs in the pipeline window, matched by file-number
            // prefix on the run path (robust to display-name edits).
            const nums = (process.env.PIPELINE_NUMBERS || '')
              .split(',').map((s) => s.trim()).filter(Boolean);
            const matchesPipeline = (p) => {
              const base = (p || '').split('/').pop() || '';
              return nums.some((n) => base.startsWith(n + '-'));
            };
            // Bounded read (mirrors 731): filter to completed runs server-side
            // and cap total fetched so a busy week can't blow up this weekly job.
            const createdFilter = `>=${pipelineCut.toISOString()}`;
            const MAX_RUNS = 2000;
            const pipelineRuns = [];
            let runPage = 1;
            let runsFetched = 0;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, created: createdFilter, status: 'completed', per_page: 100, page: runPage,
              });
              for (const r of data.workflow_runs) {
                if (matchesPipeline(r.path) && r.conclusion) {
                  pipelineRuns.push({ name: r.name || r.path, conclusion: r.conclusion });
                }
              }
              runsFetched += data.workflow_runs.length;
              if (data.workflow_runs.length < 100 || runsFetched >= MAX_RUNS) break;
              runPage++;
            }

            // #719's comments, read ONCE and used twice: the trend baseline
            // (newest hidden data block) and the dead-conductor-run scan (#970).
            // #719 is the long-lived Conductor log, so we must NOT paginate its
            // full history. The listComments endpoint has no sort/direction, so
            // bound the read by a `since` window instead: this report runs weekly,
            // so both the prior baseline and any run that died since it are
            // always inside it. A lookback wide enough to absorb a few skipped
            // runs plus a hard page cap keeps the read bounded no matter how long
            // the log grows.
            //
            // Pages are ACCUMULATED, not processed one at a time: a run's START
            // and its END routinely land on different pages (run 61, 2026-07-31),
            // and pairing per page reports every boundary-split run as dead.
            const logIssue = Number(process.env.LOG_ISSUE);
            const BASELINE_LOOKBACK_DAYS = 28;
            const MAX_BASELINE_PAGES = 10;
            const since = new Date(nowMs - BASELINE_LOOKBACK_DAYS * 86400e3).toISOString();
            let logComments = null;
            // Whether the read above stopped because it ran out of comments or
            // because it ran out of PAGES. `since` returns oldest-first, so a
            // capped read is missing the NEWEST comments — exactly the ones the
            // liveness check (#1215) reads as proof the Conductor is running.
            // Reported as "not assessed" rather than as silence; a false alarm
            // about the supervisor is worse than the gap it would be filling.
            let logCommentsTruncated = false;
            try {
              const acc = [];
              for (let bp = 1; bp <= MAX_BASELINE_PAGES; bp++) {
                const { data } = await github.rest.issues.listComments({
                  owner, repo, issue_number: logIssue, since, per_page: 100, page: bp,
                });
                acc.push(...data);
                if (data.length < 100) break;
                // A full last page means the cap, not the end of the thread.
                if (bp === MAX_BASELINE_PAGES) logCommentsTruncated = true;
              }
              logComments = acc;
              if (logCommentsTruncated) {
                // A capped read invalidates EVERY log-derived computation, not
                // just liveness. The missing tail is the NEWEST comments, so:
                //   - a run whose START was collected and whose END was cut
                //     reads as DEAD — a false alarm about the supervisor, the
                //     direction this module treats as worst;
                //   - extractPreviousMetrics takes the last data block it can
                //     see, which is then a stale baseline rendering wrong deltas.
                // Both are confident wrong answers from a partial window, so the
                // whole read is discarded and the report degrades to "not
                // assessed" / "first report" — the same shape as the catch below.
                logComments = null;
                core.warning(
                  `#${logIssue} comment read hit the ${MAX_BASELINE_PAGES}-page cap; ` +
                    'discarding it — conductor liveness, the dead-run scan and the ' +
                    'trend baseline are all reported as not assessed rather than ' +
                    'computed from a window missing its newest comments.',
                );
              }
            } catch (e) {
              // Leave logComments null: computeMetrics then reports the dead-run
              // scan as `assessed: false` rather than a reassuring zero, and the
              // trend renders "first report". Missing the baseline is acceptable
              // degradation vs. an unbounded scan or a wedged weekly job.
              core.warning(`Could not read #${logIssue} comments: ${e.message}`);
            }
            // Comments come back oldest-first, so the last data block found wins.
            const previous = logComments ? lib.extractPreviousMetrics(logComments) : null;

            const metrics = lib.computeMetrics({
              nowIso,
              logComments,
              logCommentsTruncated,
              smokeOpen: smokeOpen.map((i) => ({ created_at: i.created_at })),
              smokeClosedRecent: smokeClosed.map((i) => ({
                created_at: i.created_at, closed_at: i.closed_at,
              })),
              claimedOpen: claimedOpen.map((i) => ({ created_at: i.created_at })),
              agenticOpen: agenticOpen.length,
              agenticClosedRecent: agenticClosed.length,
              readyOpen: readyOpen.length,
              readyWaiting,
              pipelineRuns,
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = lib.renderReport(metrics, previous, { runUrl });

            fs.writeFileSync('process-health-metrics.json', JSON.stringify(metrics, null, 2));

            await github.rest.issues.createComment({
              owner, repo, issue_number: logIssue, body,
            });
            core.summary
              .addHeading('Process health metrics (weekly)')
              .addRaw(
                `Open smoke failures: ${metrics.smokeFailures.open}; open claims: ` +
                  `${metrics.claims.open}; agentic-os backlog: ${metrics.agenticOs.open}; ` +
                  `ready queue: ${metrics.agenticOs.ready}; ` +
                  `ready-but-unlanded PRs: ${metrics.readyWaiting.count}; ` +
                  `dead conductor runs: ${
                    metrics.conductorRuns.assessed
                      ? `${metrics.conductorRuns.count} of ${metrics.conductorRuns.observed} seen`
                      : 'not assessed'
                  }; ` +
                  `data-pipeline success: ${metrics.dataPipeline.success}/${metrics.dataPipeline.runs}. ` +
                  `Posted to #${logIssue}.`,
              )
              .write();

      - uses: actions/upload-artifact@v7
        with:
          name: process-health-metrics
          path: process-health-metrics.json
          retention-days: 90
          if-no-files-found: error
